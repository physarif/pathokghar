<!-- Breadcrumbs -->
<nav class="px-4 md:px-6 py-2 text-sm flex items-center gap-1.5 flex-wrap border-t border-b border-gray-200 dark:border-gray-700">
    <a href="/" class="flex items-center gap-1 bc-link">
        <span class="font-bold text-gray-900 dark:text-gray-100">পাঠক</span><span class="text-gray-400 dark:text-gray-500">ঘর</span>
    </a>
    <span class="text-gray-300 dark:text-gray-600">›</span>
    <a href="/authors" class="text-red-500 dark:text-red-400 hover:text-red-600 dark:hover:text-red-300 transition-colors bc-link">লেখক</a>
    <span class="text-gray-300 dark:text-gray-600">›</span>
    <span class="text-gray-700 dark:text-gray-300 truncate max-w-[180px]">{{author_name}}</span>
</nav>

<div class="md:px-6 mb-6">
    <div class="bg-white dark:bg-[#2d2d2d] md:rounded-xl shadow-sm md:border border-b border-gray-200 dark:border-gray-700 p-5 md:p-6">
        <!-- Image floated left, name + description flow around it -->
        <div class="clearfix">
            <img src="{{author_img}}" alt="{{author_name}}" class="float-left mr-4 md:mr-7 mb-2 w-24 h-24 md:w-32 md:h-32 rounded-full object-cover border-4 border-gray-100 dark:border-gray-700 shadow-md">
            <h1 class="text-xl md:text-2xl font-bold text-gray-900 dark:text-gray-100 leading-snug mb-2">{{author_name}}</h1>
            <div id="author-desc-md" class="author-desc-md text-base text-gray-500 dark:text-gray-400 leading-6 text-justify"></div>
        </div>
    </div>
</div>

<div>
  <div style="padding:0.45rem 1rem;background:#c0392b;font-size:1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem;">
    <span style="color:#fff;font-weight:700;letter-spacing:0.01em;">লেখকের বইসমূহ</span>
    <span style="background:rgba(255,255,255,0.18);color:#fff;font-weight:600;font-size:0.78rem;padding:0.15rem 0.6rem;">{{author_book_count}} টি বই</span>
  </div>
</div>

<div style="padding:0 0 0.5rem;">
  <div id="author-books-grid" class="bc-list"></div>
  <script type="application/json" id="author-books-json">{{author_books_data}}</script>
</div>

<!-- ═══════════════════════════════════════════════════════════
     AUTHOR BOOK CARD — design এখানে পরিবর্তন করো
     ═══════════════════════════════════════════════════════════ -->
<style>
/* Breadcrumb tap underline */
.bc-link {
    position: relative;
    text-decoration: none;
}
.bc-link::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -2px;
    height: 2px;
    background: #ef4444;
    border-radius: 1px;
    transform: scaleX(0);
    transition: transform 0.15s ease;
}
.bc-link:active::after {
    transform: scaleX(1);
}

/* Book list */
.bc-list {
  display: flex;
  flex-direction: column;
  padding: 0;
  gap: 0.4rem;
}
@media (min-width: 768px) {
  .bc-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.4rem;
  }
}
.bc-card {
  display: flex;
  flex-direction: row;
  gap: 0.85rem;
  align-items: flex-start;
  text-decoration: none;
  padding: 0.75rem;
  transition: background 0.1s;
  background: #fff;
}
.dark .bc-card { background: #23232a; }
.bc-card:hover { background: #fef2f2; }
.dark .bc-card:hover { background: #2a2020; }
.bc-img-wrap {
  flex-shrink: 0;
  width: 5.5rem;
  aspect-ratio: 2/3;
  overflow: hidden;
  background: #e5e7eb;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
@media (min-width: 768px) { .bc-img-wrap { width: 6.5rem; } }
.dark .bc-img-wrap { background: #374151; }
.bc-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bc-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}
.bc-headline {
  font-size: 1rem;
  line-height: 1.4;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.bc-title { font-weight: 700; color: #c0392b; }
.dark .bc-title { color: #f87171; }
.bc-sep { color: #9ca3af; font-weight: 400; }
.bc-author { font-weight: 500; color: #6b7280; }
.dark .bc-author { color: #9ca3af; }
.bc-desc {
  margin-top: 0.3rem;
  font-size: 0.92rem;
  color: #4b5563;
  line-height: 1.6;
  text-align: justify;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.dark .bc-desc { color: #9ca3af; }
</style>

<!-- Markdown styles for author description -->
<style>
.author-desc-md p { margin-bottom: 0.5rem; }
.author-desc-md p:last-child { margin-bottom: 0; }
.author-desc-md strong { font-weight: 600; color: inherit; }
.author-desc-md em { font-style: italic; }
.author-desc-md a { color: #6366f1; text-decoration: underline; }
.author-desc-md a:hover { color: #4f46e5; }
.author-desc-md ul { list-style: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
.author-desc-md ol { list-style: decimal; padding-left: 1.25rem; margin-bottom: 0.5rem; }
.author-desc-md li { margin-bottom: 0.2rem; }
.author-desc-md h1,.author-desc-md h2,.author-desc-md h3 { font-weight: 700; margin-bottom: 0.4rem; color: inherit; }
.author-desc-md h1 { font-size: 1.1rem; }
.author-desc-md h2 { font-size: 1rem; }
.author-desc-md h3 { font-size: 0.95rem; }
.author-desc-md blockquote { border-left: 3px solid #d1d5db; padding-left: 0.75rem; color: #9ca3af; margin: 0.5rem 0; font-style: italic; }
.dark .author-desc-md blockquote { border-left-color: #4b5563; color: #6b7280; }
.author-desc-md code { background: #f3f4f6; border-radius: 3px; padding: 0.1rem 0.3rem; font-size: 0.85rem; font-family: monospace; }
.dark .author-desc-md code { background: #374151; }
.author-desc-md pre { background: #f3f4f6; border-radius: 6px; padding: 0.75rem; overflow-x: auto; margin: 0.5rem 0; }
.dark .author-desc-md pre { background: #1f2937; }
.author-desc-md pre code { background: none; padding: 0; }
.author-desc-md hr { border: none; border-top: 1px solid #e5e7eb; margin: 0.75rem 0; }
.dark .author-desc-md hr { border-top-color: #374151; }
</style>

<!-- marked.js for markdown rendering -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
(function () {
    // ── Description markdown render ──
    var rawDesc = `{{author_desc}}`;
    marked.setOptions({ breaks: true, gfm: true });
    var descEl = document.getElementById('author-desc-md');
    if (descEl) descEl.innerHTML = marked.parse(rawDesc);

    // ── Book grid render ──
    var books = JSON.parse(document.getElementById('author-books-json').textContent);
    var grid  = document.getElementById('author-books-grid');
    if (grid && books.length) {
        grid.innerHTML = books.map(function(book) {
            return '<a href="/books/' + book.slug + '.html" class="bc-card">'
                + '<div class="bc-img-wrap">'
                + '<img src="' + book.cover + '" alt="' + book.title + '" class="bc-img" loading="lazy">'
                + '</div>'
                + '<div class="bc-body">'
                + '<p class="bc-headline"><span class="bc-title">' + book.title + '</span><span class="bc-sep"> – </span><span class="bc-author">' + (book.author_name || '') + '</span></p>'
                + (book.desc ? '<p class="bc-desc">' + book.desc + '</p>' : '')
                + '</div>'
                + '</a>';
        }).join('');
    }
})();
</script>
