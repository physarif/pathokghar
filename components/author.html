<div class="author-page-wrap">

<!-- Structured data: Google-কে লেখক সম্পর্কে স্পষ্ট তথ্য দেয় -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Person",
    "name": {{author_name_json}},
    "image": {{author_img_json}},
    "description": {{author_desc_json}},
    "url": {{author_url_json}}
}
</script>

<div class="author-hero-wrap">
    <div class="author-hero-card">
        <img src="{{author_img}}" alt="{{author_name}}" class="author-hero-avatar">
        <div class="author-hero-body">
            <h1 class="author-hero-name">{{author_name}}</h1>
            <hr class="author-hero-rule">
            <!-- build time-এই markdown থেকে HTML — crawler-এর জন্য প্রথম
                 লোডেই লেখক পরিচিতি পাওয়া যায়, JS-এর উপর নির্ভরতা নেই -->
            <div class="author-desc-md">{{author_desc_html}}</div>
        </div>
    </div>
</div>

<div style="padding:0 0.5rem 0.5rem;">
  <!-- বইয়ের লিস্ট build time-এই HTML হিসেবে বসানো — এই পেজের মূল/keyword-rich
       content, তাই client-side JS-এর বদলে সরাসরি markup-এ থাকা জরুরি -->
  <div id="author-books-grid" class="bc-list">{{author_books_html}}</div>
</div>

</div><!-- /md:px-8 lg:px-16 -->

<!-- ═══════════════════════════════════════════════════════════
     AUTHOR PROFILE HERO — design এখানে পরিবর্তন করো
     ═══════════════════════════════════════════════════════════ -->
<style>
.author-page-wrap { padding-top: 1rem; }
@media (min-width: 768px) { .author-page-wrap { padding-top: 1.5rem; padding-left: 2rem; padding-right: 2rem; } }
@media (min-width: 1024px) { .author-page-wrap { padding-left: 4rem; padding-right: 4rem; } }
@media (min-width: 768px) { .author-hero-wrap { padding: 0 1.5rem; } }
.author-hero-wrap {
    margin-bottom: 0.9rem;
}
.author-hero-card {
    display: block;
    background: #FFFFFF;
    border-radius: 5px;
    padding: 1.25rem;
    box-shadow: 0 2px 14px rgba(0,0,0,0.06);
    margin: 0 0.5rem;
}
.author-hero-card::after {
    content: "";
    display: block;
    clear: both;
}
@media (min-width: 768px) {
    .author-hero-card { margin: 0; }
}
.author-hero-avatar {
    float: left;
    width: 84px;
    height: 84px;
    margin-right: 1.1rem;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #E5E5E5;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
}
@media (min-width: 768px) {
    .author-hero-avatar { width: 104px; height: 104px; }
}
.author-hero-body {
    min-width: 0;
}
.author-hero-name {
    font-family: 'Noto Serif Bengali', serif;
    font-size: 1.2rem;
    font-weight: 800;
    color: #f3f4f6;
    line-height: 1.4;
    margin: 0;
}
@media (min-width: 768px) {
    .author-hero-name { font-size: 1.4rem; }
}
.author-hero-rule {
    border: none;
    border-top: 1px dashed #E5E5E5;
    margin: 0.5rem 0;
}
</style>

<!-- ═══════════════════════════════════════════════════════════
     AUTHOR BOOK CARD — design এখানে পরিবর্তন করো
     ═══════════════════════════════════════════════════════════ -->
<style>
/* Breadcrumb tap underline */
.bc-link {
    position: relative;
    text-decoration: none;
}
.bc-link::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -2px;
    height: 2px;
    background: #E5E5E5;
    border-radius: 1px;
    transform: scaleX(0);
    transition: transform 0.15s ease;
}
.bc-link:active::after {
    transform: scaleX(1);
}
</style>

{{book_card_styles}}

<style>
.author-desc-md {
    font-size: 1rem;
    color: #9ca3af;
    line-height: 1.5rem;
    text-align: justify;
}
.author-desc-md p { margin-bottom: 0.5rem; }
.author-desc-md p:last-child { margin-bottom: 0; }
.author-desc-md strong { font-weight: 600; color: inherit; }
.author-desc-md em { font-style: italic; }
.author-desc-md a { color: #C72A23; text-decoration: underline; }
.author-desc-md a:hover { color: #C72A23; }
.author-desc-md ul { list-style: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
.author-desc-md ol { list-style: decimal; padding-left: 1.25rem; margin-bottom: 0.5rem; }
.author-desc-md li { margin-bottom: 0.2rem; }
.author-desc-md h1,.author-desc-md h2,.author-desc-md h3 { font-weight: 700; margin-bottom: 0.4rem; color: inherit; }
.author-desc-md h1 { font-size: 1.1rem; }
.author-desc-md h2 { font-size: 1rem; }
.author-desc-md h3 { font-size: 0.95rem; }
.author-desc-md blockquote { border-left: 3px solid #4b5563; padding-left: 0.75rem; color: #6b7280; margin: 0.5rem 0; font-style: italic; }
.author-desc-md code { background: #374151; border-radius: 3px; padding: 0.1rem 0.3rem; font-size: 0.85rem; font-family: monospace; }
.author-desc-md pre { background: #1f2937; border-radius: 6px; padding: 0.75rem; overflow-x: auto; margin: 0.5rem 0; }
.author-desc-md pre code { background: none; padding: 0; }
.author-desc-md hr { border: none; border-top: 1px solid #374151; margin: 0.75rem 0; }
</style>
