<div class="px-4 md:px-6 mb-6">
    <div class="bg-white dark:bg-[#2d2d2d] rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-5 md:p-6">
        <div class="flex flex-col md:flex-row gap-5 md:gap-7 items-center md:items-start">
            <div class="shrink-0">
                <img src="{{author_img}}" alt="{{author_name}}" class="w-28 h-28 md:w-32 md:h-32 rounded-full object-cover border-4 border-gray-100 dark:border-gray-700 shadow-md">
            </div>
            <div class="flex-1 text-center md:text-left">
                <h1 class="text-xl md:text-2xl font-bold text-gray-900 dark:text-gray-100 mb-1">{{author_name}}</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-3 leading-relaxed">{{author_desc}}</p>
            </div>
        </div>
    </div>
</div>

<div class="px-4 md:px-6">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold text-gray-800 dark:text-gray-100">লেখকের বইসমূহ</h2>
        <span class="text-xs text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-700 px-2.5 py-1 rounded-full">মোট {{author_book_count}}</span>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
        {{author_books_grid}}
    </div>
</div
