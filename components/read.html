<!-- components/read.html — layout.html এর {{content}} এ inject হবে -->

<style>
    /* ── Progress bar ── */
    #read-progress-bar {
        position: fixed;
        top: 0; left: 0;
        height: 2px;
        width: 0%;
        background: #0056b3;
        z-index: 1000;
        transition: width 0.1s linear;
    }

    /* ── Book content typography ── */
    #book-content h1 {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 1.25rem;
        line-height: 1.35;
        color: inherit;
    }
    #book-content h2 {
        font-size: 1.05rem;
        font-weight: 700;
        margin-top: 2rem;
        margin-bottom: 0.75rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(128,128,128,0.2);
    }
    #book-content p {
        margin-bottom: 1.1rem;
        line-height: 2;
    }
    #book-content img {
        max-width: 100%;
        border-radius: 0.5rem;
        margin: 1rem auto;
        display: block;
    }

    /* ── Font size variants ── */
    #book-content.fs-sm p { font-size: 0.875rem; }
    #book-content.fs-md p { font-size: 1rem; }
    #book-content.fs-lg p { font-size: 1.125rem; }
    #book-content.fs-xl p { font-size: 1.25rem; }

    /* ── TOC active ── */
    .toc-link.active {
        color: #0056b3;
        font-weight: 600;
        background: rgba(0,86,179,0.1);
        border-radius: 0.375rem;
    }

    /* ══════════════════════════════
       MOBILE reader chrome
    ══════════════════════════════ */
    @media (max-width: 767px) {

        /* Reading background themes */
        body.theme-dark  #mobile-reader-bg { background: #1c1c1e; }
        body.theme-sepia #mobile-reader-bg { background: #f5efe6; }
        body.theme-light #mobile-reader-bg { background: #ffffff; }

        body.theme-dark  #book-content { color: #e0e0e0; }
        body.theme-sepia #book-content { color: #3b2f20; }
        body.theme-light #book-content { color: #1a1a1a; }

        body.theme-dark  #book-content h2 { border-top-color: #333; }
        body.theme-sepia #book-content h2 { border-top-color: #d9ccc0; }

        /* Fixed top bar */
        #mobile-topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 52px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 10px;
            transition: transform 0.28s ease, background 0.3s;
        }
        #mobile-topbar.hide { transform: translateY(-100%); }

        body.theme-dark  #mobile-topbar { background: #111113; border-bottom: 1px solid #2a2a2e; }
        body.theme-sepia #mobile-topbar { background: #ede5d8; border-bottom: 1px solid #d4c8b8; }
        body.theme-light #mobile-topbar { background: #fff;    border-bottom: 1px solid #e5e7eb; }

        /* Fixed bottom toolbar */
        #mobile-toolbar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 200;
            padding: 0 0 env(safe-area-inset-bottom);
            transition: transform 0.28s ease, background 0.3s;
        }
        #mobile-toolbar.hide { transform: translateY(100%); }

        body.theme-dark  #mobile-toolbar { background: #111113; border-top: 1px solid #2a2a2e; }
        body.theme-sepia #mobile-toolbar { background: #ede5d8; border-top: 1px solid #d4c8b8; }
        body.theme-light #mobile-toolbar { background: #fff;    border-top: 1px solid #e5e7eb; }

        /* Theme color pickers row */
        #theme-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 8px 18px 6px;
            border-bottom: 1px solid rgba(128,128,128,0.15);
        }
        .theme-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: border-color 0.15s;
        }
        .theme-btn.active { border-color: #0056b3; }
        .theme-btn i { font-size: 14px; display: none; }
        .theme-btn.active i { display: block; }

        body.theme-dark  #mobile-topbar i   { color: #ccc; }
        body.theme-sepia #mobile-topbar i   { color: #5a4535; }
        body.theme-light #mobile-topbar i   { color: #444; }

        body.theme-dark  #mobile-topbar .title-text { color: #e8e8e8; }
        body.theme-sepia #mobile-topbar .title-text { color: #3b2f20; }
        body.theme-light #mobile-topbar .title-text { color: #111; }

        /* main content padding */
        #read-main-content {
            padding-top: 52px;
            padding-bottom: 160px;
        }
        #mobile-reader-bg {
            min-height: 100vh;
            transition: background 0.3s;
        }
    }

    /* ══════════════════════════════
       DESKTOP TOC sidebar — fixed, no jitter
    ══════════════════════════════ */
    @media (min-width: 1024px) {
        #toc-sidebar {
            position: fixed;
            top: 3.5rem; right: 0;
            width: 14rem;
            height: calc(100vh - 3.5rem);
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #toc-sidebar::-webkit-scrollbar { display: none; }
        #read-layout { padding-right: 15.5rem; }
    }
    #toc-controls-bar {
        position: sticky; top: 0; z-index: 10;
    }

    /* ── MOBILE: right TOC drawer ── */
    #mobile-toc-drawer {
        position: fixed;
        top: 0; right: 0; bottom: 0;
        width: 78vw; max-width: 300px;
        z-index: 500;
        display: flex; flex-direction: column;
        transform: translateX(110%);
        transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    #mobile-toc-drawer.open { transform: translateX(0); }

    #mobile-toc-overlay {
        position: fixed; inset: 0;
        z-index: 499;
        background: rgba(0,0,0,0.5);
        opacity: 0; pointer-events: none;
        transition: opacity 0.3s ease;
    }
    #mobile-toc-overlay.open { opacity: 1; pointer-events: auto; }

    body.theme-dark  #mobile-toc-drawer { background: #1c1c1e; border-left: 1px solid #2a2a2e; }
    body.theme-sepia #mobile-toc-drawer { background: #f5efe6; border-left: 1px solid #d4c8b8; }
    body.theme-light #mobile-toc-drawer { background: #fff;    border-left: 1px solid #e5e7eb; }

    html { scroll-behavior: smooth; }
</style>

<!-- Progress bar -->
<div id="read-progress-bar"></div>

<!-- ══════════════════════════════════════════
     MOBILE ONLY chrome (hidden on md+)
══════════════════════════════════════════ -->

<!-- Top bar -->
<div id="mobile-topbar" class="md:hidden">
    <a href="/books/{{book_slug}}.html"
       class="w-9 h-9 flex items-center justify-center rounded-full shrink-0">
        <i class="fas fa-chevron-left text-base"></i>
    </a>
    <div class="flex-1 min-w-0 px-1">
        <p class="title-text text-sm font-semibold truncate leading-tight">{{book_title}}</p>
        <p class="text-[10px] text-gray-400" id="topbar-pct">০%</p>
    </div>
    <button id="mob-toc-btn-top" class="w-9 h-9 flex items-center justify-center rounded-full" aria-label="সূচিপত্র">
        <i class="fas fa-list-ul text-sm"></i>
    </button>
</div>

<!-- Bottom toolbar -->
<div id="mobile-toolbar" class="md:hidden">
    <!-- Theme color row -->
    <div id="theme-row">
        <button class="theme-btn active" data-theme="light" style="background:#ffffff; box-shadow:0 0 0 1px #ddd;">
            <i class="fas fa-check" style="color:#0056b3;"></i>
        </button>
        <button class="theme-btn" data-theme="sepia" style="background:#f5efe6; box-shadow:0 0 0 1px #d4c8b8;">
            <i class="fas fa-check" style="color:#0056b3;"></i>
        </button>
        <button class="theme-btn" data-theme="dark" style="background:#1c1c1e; box-shadow:0 0 0 1px #444;">
            <i class="fas fa-check" style="color:#6aabff;"></i>
        </button>
    </div>

</div>

<!-- ── MOBILE: right TOC drawer + overlay ── -->
<div id="mobile-toc-overlay" class="md:hidden"></div>
<div id="mobile-toc-drawer" class="md:hidden">
    <div class="flex items-center justify-between px-4 pt-12 pb-3 border-b border-gray-200 dark:border-gray-700 shrink-0">
        <p class="text-sm font-semibold" style="color:inherit;">সূচিপত্র</p>
        <button id="mobile-toc-close"
            class="w-7 h-7 rounded-full flex items-center justify-center"
            style="background:rgba(128,128,128,0.15);">
            <i class="fas fa-times text-xs"></i>
        </button>
    </div>
    <a href="/books/{{book_slug}}.html"
       class="flex items-center gap-2 px-4 py-3 text-xs border-b border-gray-100 dark:border-gray-800 shrink-0"
       style="color:#0056b3;">
        <i class="fas fa-arrow-left text-[10px]"></i> বইয়ের তথ্য
    </a>
    <nav id="toc-nav-mobile"
        class="flex flex-col px-2 py-3 gap-0.5 text-[13px] overflow-y-auto flex-1"
        style="scrollbar-width:none;">
    </nav>
</div>

<!-- ══════════════════════════════════════════
     Main layout wrapper
══════════════════════════════════════════ -->
<div id="mobile-reader-bg" class="md:block">
<div class="flex gap-0 min-h-[calc(100vh-3.5rem)] w-full" id="read-layout">

    <!-- Reading column -->
    <div class="flex-1 min-w-0">
        <div id="read-main-content" class="px-5 md:px-10 lg:px-16 py-7 max-w-2xl">
            <div id="book-content" class="fs-md text-gray-800 dark:text-gray-200">
                {{book_content}}
            </div>

            <!-- Bottom nav -->
            <div class="mt-12 pt-6 border-t border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <a href="/books/{{book_slug}}.html"
                   class="flex items-center gap-2 text-sm text-gray-500 hover:text-[#0056b3] transition">
                    <i class="fas fa-arrow-left text-xs"></i> বইয়ের তথ্য
                </a>
                <a href="/download/{{book_slug}}.html"
                   class="flex items-center gap-2 text-sm bg-[#0056b3] hover:bg-[#004494] text-white px-4 py-2 rounded-lg transition">
                    <i class="fas fa-download text-xs"></i> ডাউনলোড করুন
                </a>
            </div>
        </div>
    </div>

    <!-- Desktop TOC sidebar -->
    <aside id="toc-sidebar"
        class="hidden lg:flex flex-col w-56 shrink-0 border-l border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1b] overflow-y-auto">
        <div id="toc-controls-bar"
            class="bg-white dark:bg-[#1a1a1b] border-b border-gray-200 dark:border-gray-700 px-3 py-2.5 flex flex-col gap-2 shrink-0">
            <a href="/books/{{book_slug}}.html"
               class="flex items-center gap-1.5 text-[11px] text-gray-500 hover:text-[#0056b3] transition">
                <i class="fas fa-arrow-left text-[10px]"></i> বইয়ের তথ্য
            </a>
            <div class="flex items-center gap-1.5">
                <button id="font-decrease"
                    class="flex-1 py-1 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-[11px] font-bold transition text-gray-700 dark:text-gray-200">A−</button>
                <button id="font-increase"
                    class="flex-1 py-1 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-[11px] font-bold transition text-gray-700 dark:text-gray-200">A+</button>
                <span id="progress-pct"
                    class="text-[10px] text-gray-400 tabular-nums shrink-0 w-7 text-right">০%</span>
            </div>
        </div>
        <div class="px-4 pt-3 pb-1.5 shrink-0">
            <p class="text-[11px] uppercase font-semibold text-gray-400 tracking-wider">সূচিপত্র</p>
        </div>
        <nav id="toc-nav-desktop" class="flex flex-col px-2 pb-6 gap-0.5 text-[12px]">
        </nav>
    </aside>
</div>
</div>

<script>
(function () {
    const bookContent  = document.getElementById('book-content');
    const progressBar  = document.getElementById('read-progress-bar');
    const progressPct  = document.getElementById('progress-pct');
    const topbarPct    = document.getElementById('topbar-pct');
    const tocDesktop   = document.getElementById('toc-nav-desktop');
    const tocMobile    = document.getElementById('toc-nav-mobile');
    const mobileTopbar = document.getElementById('mobile-topbar');
    const mobileToolbar= document.getElementById('mobile-toolbar');
    const readerBg     = document.getElementById('mobile-reader-bg');
    const fontPopup    = document.getElementById('font-popup');
    const fontLabel    = document.getElementById('font-label');

    const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    function toBN(n) {
        return Math.round(n).toString().split('').map(c => bn[c] || c).join('');
    }

    // ── Default theme ──
    let currentTheme = localStorage.getItem('pg-theme') || 'light';
    applyTheme(currentTheme);

    function applyTheme(t) {
        ['light','sepia','dark'].forEach(th => document.body.classList.remove('theme-'+th));
        document.body.classList.add('theme-'+t);
        currentTheme = t;
        localStorage.setItem('pg-theme', t);
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.theme === t);
        });
        // font popup bg
        const bgMap = { light:'#fff', sepia:'#f5efe6', dark:'#1c1c1e' };
        const bdMap = { light:'#e5e7eb', sepia:'#d4c8b8', dark:'#2a2a2e' };
        const clMap = { light:'#111', sepia:'#3b2f20', dark:'#e0e0e0' };
        if (fontPopup) {
            fontPopup.style.background = bgMap[t];
            fontPopup.style.borderColor = bdMap[t];
            fontPopup.style.color = clMap[t];
        }
    }

    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
    });

    // ── Hide-on-scroll ──
    let lastScrollY = window.scrollY;
    let ticking = false;

    window.addEventListener('scroll', () => {
        if (!ticking) {
            requestAnimationFrame(() => {
                const currentY = window.scrollY;
                const delta    = currentY - lastScrollY;
                const docH     = document.documentElement.scrollHeight - window.innerHeight;
                const pct      = docH > 0 ? (currentY / docH) * 100 : 0;

                if (delta > 6 && currentY > 80) {
                    mobileTopbar?.classList.add('hide');
                    mobileToolbar?.classList.add('hide');
                } else if (delta < -6) {
                    mobileTopbar?.classList.remove('hide');
                    mobileToolbar?.classList.remove('hide');
                }

                lastScrollY = currentY;
                progressBar.style.width = pct + '%';
                if (progressPct) progressPct.textContent = toBN(pct) + '%';
                if (topbarPct)   topbarPct.textContent   = toBN(pct) + '%';
                ticking = false;
            });
            ticking = true;
        }
    }, { passive: true });

    // ── Build TOC ──
    const headings = bookContent.querySelectorAll('h1, h2');

    function buildToc(nav, isMobile) {
        headings.forEach((h, i) => {
            h.id = h.id || ('sec-' + i);
            const a = document.createElement('a');
            a.href = '#' + h.id;
            a.textContent = h.textContent;
            a.dataset.idx = i;
            a.className = 'toc-link block px-3 py-1.5 rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors ' +
                (h.tagName === 'H1'
                    ? 'font-semibold text-[13px] text-gray-800 dark:text-gray-100'
                    : 'pl-5 text-[11px]');
            if (isMobile) a.addEventListener('click', closeTocDrawer);
            nav.appendChild(a);
        });
    }
    buildToc(tocDesktop, false);
    buildToc(tocMobile, true);

    // ── TOC active ──
    const allTocLinks = document.querySelectorAll('.toc-link');
    window.addEventListener('scroll', () => {
        let current = 0;
        headings.forEach((h, i) => {
            if (window.scrollY >= h.offsetTop - 120) current = i;
        });
        allTocLinks.forEach(a => {
            a.classList.toggle('active', parseInt(a.dataset.idx) === current);
        });
    }, { passive: true });

    // ── Font size ──
    const fontSizes = ['fs-sm', 'fs-md', 'fs-lg', 'fs-xl'];
    let currentSize = parseInt(localStorage.getItem('pg-font-size') || '1');
    bookContent.classList.add(fontSizes[currentSize]);
    if (fontLabel) fontLabel.textContent = currentSize + 1;

    function changeFont(delta) {
        const next = Math.max(0, Math.min(fontSizes.length - 1, currentSize + delta));
        if (next === currentSize) return;
        bookContent.classList.replace(fontSizes[currentSize], fontSizes[next]);
        currentSize = next;
        localStorage.setItem('pg-font-size', currentSize);
        if (fontLabel) fontLabel.textContent = currentSize + 1;
    }

    document.getElementById('font-increase')?.addEventListener('click', () => changeFont(1));
    document.getElementById('font-decrease')?.addEventListener('click', () => changeFont(-1));
    document.getElementById('m-font-increase')?.addEventListener('click', () => changeFont(1));
    document.getElementById('m-font-decrease')?.addEventListener('click', () => changeFont(-1));

    // Font popup toggle
    document.getElementById('mob-font-btn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        fontPopup?.classList.toggle('hidden');
    });
    document.addEventListener('click', () => fontPopup?.classList.add('hidden'));
    fontPopup?.addEventListener('click', e => e.stopPropagation());

    // ── Mobile right TOC drawer ──
    const tocDrawer  = document.getElementById('mobile-toc-drawer');
    const tocOverlay = document.getElementById('mobile-toc-overlay');

    function openTocDrawer() {
        tocDrawer.classList.add('open');
        tocOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function closeTocDrawer() {
        tocDrawer.classList.remove('open');
        tocOverlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    document.getElementById('mob-toc-btn')?.addEventListener('click', openTocDrawer);
    document.getElementById('mob-toc-btn-top')?.addEventListener('click', openTocDrawer);
    document.getElementById('mobile-toc-close')?.addEventListener('click', closeTocDrawer);
    tocOverlay?.addEventListener('click', closeTocDrawer);

    // swipe right to close
    let touchStartX = 0;
    tocDrawer?.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    tocDrawer?.addEventListener('touchend', e => {
        if (e.changedTouches[0].clientX - touchStartX > 60) closeTocDrawer();
    }, { passive: true });
})();
</script>
