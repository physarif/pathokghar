<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{book_title}} - পড়ুন - পাঠক ঘর</title>
    <meta name="description" content="{{book_description}}">
    <meta property="og:title" content="{{book_title}} - পড়ুন - পাঠক ঘর">
    <meta property="og:description" content="{{book_description}}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#fff5f5',
                            100: '#fde8e6',
                            500: '#c0392b',
                            600: '#a93226'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* ── Book read header hero ── */
    .book-read-header {
        margin-bottom: 1.5rem;
    }
    .book-read-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.65rem;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 1.4rem 1.25rem 1.2rem;
        box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .dark .book-read-box {
        background: #2a2a2b;
        border-color: #3a3a3b;
    }
    .book-read-cover {
        width: 100px;
        height: 136px;
        border-radius: 8px;
        flex-shrink: 0;
        box-shadow: 0 6px 20px rgba(0,0,0,0.18);
        object-fit: cover;
        background: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    .book-read-cover svg { opacity: 0.35; }
    .book-read-title-link {
        text-decoration: none;
        display: block;
    }
    .book-read-title-link:hover .book-read-title { text-decoration: underline; text-underline-offset: 3px; }
    .book-read-title-link:active .book-read-title { opacity: 0.7; }
    .book-read-title {
        font-family: 'Noto Serif Bengali', serif;
        font-size: 1.15rem;
        font-weight: 700;
        color: #1a1a1b;
        line-height: 1.4;
        margin: 0;
        transition: opacity 0.15s;
    }
    .dark .book-read-title { color: #f3f4f6; }
    .book-read-author-link {
        text-decoration: none;
        display: inline-block;
    }
    .book-read-author-link:hover .book-read-author { text-decoration: underline; text-underline-offset: 3px; }
    .book-read-author-link:active .book-read-author { opacity: 0.6; }
    .book-read-author {
        font-family: 'Noto Serif Bengali', serif;
        font-size: 0.82rem;
        font-weight: 600;
        color: #c0392b;
        margin: 0;
        transition: opacity 0.15s;
    }
</style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#1a1a1b] dark:text-gray-200 flex flex-col min-h-screen">

<style>
    /* ── Progress bar ── */
    #read-progress-bar {
        position: fixed;
        top: 0; left: 0;
        height: 2px;
        width: 0%;
        background: #c0392b;
        z-index: 1000;
        transition: width 0.1s linear;
    }

    /* ── Book content typography ── */
    #book-content h1 {
        font-size: 1.4rem;
        font-weight: 800;
        margin-top: 2rem;
        margin-bottom: 0.5rem;
        line-height: 1.35;
        text-align: center;
        color: inherit;
    }
    #book-content h1::after {
        content: '';
        display: block;
        width: 3rem;
        height: 2px;
        background: #c0392b;
        margin: 0.5rem auto 1rem;
        border-radius: 2px;
    }
    #book-content h2 {
        font-size: 1.05rem;
        font-weight: 700;
        margin-top: 2rem;
        margin-bottom: 0.75rem;
        text-align: center;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid rgba(128,128,128,0.2);
    }
    #book-content p {
        margin-bottom: 1.1rem;
        line-height: 2;
        word-break: break-word;
        overflow-wrap: break-word;
    }
    #book-content a {
        color: #c0392b;
        word-break: break-all;
        overflow-wrap: anywhere;
        text-decoration: underline;
    }
    /* External link icon */
    #book-content a[href^="http"]::after,
    #book-content a[href^="https"]::after {
        content: ' ↗';
        font-size: 0.75em;
        opacity: 0.7;
    }
    #book-content img {
        max-width: 100%;
        border-radius: 0.5rem;
        margin: 1.25rem auto;
        display: block;
        box-shadow: 0 4px 16px rgba(0,0,0,0.10);
    }
    /* ── Blockquote ── */
    #book-content blockquote {
        border-left: 3px solid #c0392b;
        margin: 1.5rem 0;
        padding: 0.75rem 1rem;
        background: rgba(192,57,43,0.05);
        border-radius: 0 6px 6px 0;
        font-style: italic;
        color: #555;
    }
    .dark #book-content blockquote {
        background: rgba(192,57,43,0.08);
        color: #bbb;
    }
    /* ── HR stylish divider ── */
    #book-content hr {
        border: none;
        text-align: center;
        margin: 2rem 0;
        color: #9ca3af;
        font-size: 1rem;
        letter-spacing: 0.5rem;
    }
    #book-content hr::before {
        content: '✦ ✦ ✦';
    }
    /* ── Table ── */
    #book-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
        font-size: 0.875rem;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }
    #book-content th {
        background: #c0392b;
        color: #fff;
        padding: 0.6rem 0.85rem;
        text-align: left;
        font-weight: 600;
    }
    #book-content td {
        padding: 0.55rem 0.85rem;
        border-bottom: 1px solid #e5e7eb;
    }
    #book-content tr:nth-child(even) td { background: rgba(0,0,0,0.025); }
    #book-content tr:last-child td { border-bottom: none; }
    .dark #book-content td { border-color: #3a3a3b; }
    .dark #book-content tr:nth-child(even) td { background: rgba(255,255,255,0.03); }
    /* ── Text selection ── */
    #book-content ::selection {
        background: rgba(192,57,43,0.25);
        color: inherit;
    }
    /* ── Smooth scroll offset ── */
    #book-content h1, #book-content h2 {
        scroll-margin-top: 1.5rem;
    }

    /* ── TOC active ── */
    .toc-link.active {
        color: #c0392b;
        font-weight: 600;
        background: rgba(192,57,43,0.1);
        border-radius: 0.375rem;
    }

    /* ══════════════════════════════
       MOBILE reader chrome
    ══════════════════════════════ */
    @media (max-width: 767px) {

        /* Reading background themes */
        body.theme-dark  #mobile-reader-bg { background: #1c1c1e; }
        body.theme-sepia #mobile-reader-bg { background: #f5efe6; }
        body.theme-light #mobile-reader-bg { background: #ffffff; }

        #mobile-reader-bg {
            min-height: 100vh;
            transition: background 0.3s;
        }
    }

    #toc-controls-bar { position: sticky; top: 0; z-index: 10; }

    /* ── TOC unit (toggle + drawer together) ── */
    #toc-unit {
        position: fixed;
        top: 0;
        right: 0;
        height: 100vh;
        z-index: 500;
        display: flex;
        align-items: flex-start;
        padding-top: 33vh;
        pointer-events: none;
    }

    /* Toggle tab */
    #toc-toggle-btn {
        width: 28px;
        height: 90px;
        flex-shrink: 0;
        align-self: center;
        background: #c0392b;
        border: none;
        border-radius: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: -2px 0 8px rgba(0,0,0,0.15);
        padding: 10px 0;
        pointer-events: auto;
        transition: height 0.3s cubic-bezier(0.4,0,0.2,1),
                    border-radius 0.3s cubic-bezier(0.4,0,0.2,1),
                    align-self 0.1s;
    }
    #toc-unit.open {
        align-items: stretch;
    }
    #toc-unit.open #toc-toggle-btn {
        height: 100%;
        align-self: stretch;
        border-radius: 0;
        pointer-events: auto;
    }
    #toc-toggle-btn:active { background: #a93226; }
    #toc-toggle-btn.scrolling { opacity: 0.5; }
    #toc-toggle-btn { transition: opacity 0.3s ease; }
    #toc-toggle-btn .toc-toggle-label {
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        writing-mode: vertical-rl;
        text-orientation: mixed;
        transform: rotate(180deg);
        font-family: 'Noto Serif Bengali', serif;
        line-height: 1;
    }

    /* Drawer panel */
    #mobile-toc-drawer {
        width: 0;
        max-width: 200px;
        height: 100%;
        display: flex; flex-direction: column;
        background: #fafafa;
        border-radius: 0;
        box-shadow: -4px 4px 24px rgba(0,0,0,0.15);
        overflow: hidden;
        transition: width 0.3s cubic-bezier(0.4,0,0.2,1);
        pointer-events: auto;
    }
    #toc-unit.open #mobile-toc-drawer {
        width: 54vw;
    }


    #mobile-toc-overlay {
        position: fixed; inset: 0;
        z-index: 499;
        background: rgba(0,0,0,0.25);
        opacity: 0; pointer-events: none;
        transition: opacity 0.3s ease;

    }
    #mobile-toc-overlay.open { opacity: 1; pointer-events: auto; }

    /* Header */
    #toc-drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 20px 12px;
    }
    #toc-drawer-header .drawer-title {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #c0392b;
    }
    #mobile-toc-close {
        width: 28px; height: 28px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        border: none; cursor: pointer;
        background: rgba(0,0,0,0.06);
        color: #888;
        transition: background 0.15s;
    }
    #mobile-toc-close:active { background: rgba(0,0,0,0.12); }

    /* TOC nav */
    #toc-nav-mobile {
        flex: 1;
        overflow-y: auto;
        padding: 4px 8px 24px;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    #toc-nav-mobile::-webkit-scrollbar { display: none; }

    #toc-nav-mobile .toc-link {
        display: block;
        padding: 10px 6px;
        font-size: 0.8125rem;
        line-height: 1.45;
        text-decoration: none;
        color: #444;
        border-bottom: 1px solid #ececec;
        transition: color 0.15s;
    }
    #toc-nav-mobile .toc-link:last-child { border-bottom: none; }

    #toc-nav-mobile .toc-link.h2-link {
        padding-left: 14px;
        font-size: 0.78rem;
        color: #666;
    }
    #toc-nav-mobile .toc-link.active { color: #c0392b; }


    /* ── TOC book info (title – author) ── */
    #toc-book-info {
        padding: 14px 12px 10px;
        border-bottom: 1px solid #e5e7eb;
        flex-shrink: 0;
    }
    #toc-book-info {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    #toc-book-title-link {
        font-family: 'Noto Serif Bengali', serif;
        font-size: 0.875rem;
        font-weight: 400;
        color: #1a1a1b;
        text-decoration: none;
    }
    #toc-book-title-link:hover { text-decoration: underline; text-underline-offset: 3px; }
    #toc-book-sep {
        font-size: 0.875rem;
        color: #9ca3af;
    }
    #toc-book-author-link {
        font-family: 'Noto Serif Bengali', serif;
        font-size: 0.875rem;
        font-weight: 400;
        color: #c0392b;
        text-decoration: none;
    }
    #toc-book-author-link:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* ── Estimated time badge ── */
    #est-time-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: #6b7280;
    }

    /* ── Breadcrumb dark mode ── */
    .dark #read-breadcrumb a[href="/"] { color: #9ca3af; }
    .dark #read-breadcrumb a[href*="/books/"] { color: #e5e7eb; }
    .dark #read-breadcrumb li > span { color: #4b5563; }

    html { scroll-behavior: smooth; }
    /* ── Hide browser scrollbar (page level) ── */
    html { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar { display: none; }

</style>

<!-- Progress bar -->
<div id="read-progress-bar"></div>

<!-- ══════════════════════════════════════════
     MOBILE ONLY chrome (hidden on md+)
══════════════════════════════════════════ -->

<!-- TOC unit: toggle + drawer together -->
<div id="toc-unit">
    <button id="toc-toggle-btn" aria-label="সূচিপত্র">
        <span class="toc-toggle-label">সূচিপত্র</span>
    </button>
    <div id="mobile-toc-drawer">

        <nav id="toc-nav-mobile"></nav>
    </div>
</div>
<div id="mobile-toc-overlay"></div>


<!-- ══════════════════════════════════════════
     Main layout wrapper
══════════════════════════════════════════ -->
<div id="mobile-reader-bg" class="md:block">
<div class="flex gap-0 min-h-screen w-full" id="read-layout">

    <!-- Reading column -->
    <div class="flex-1 min-w-0">
        <div id="read-main-content" class="px-5 md:px-10 py-7 max-w-2xl">

            <!-- Breadcrumb -->
            <nav id="read-breadcrumb" aria-label="breadcrumb" style="margin-bottom:1.1rem;">
                <ol style="display:flex;align-items:center;flex-wrap:wrap;gap:0 2px;list-style:none;margin:0;padding:0;font-size:0.875rem;line-height:1.5;">
                    <li>
                        <a href="/" style="color:#6b7280;text-decoration:none;transition:color .15s;" onmouseover="this.style.color='#c0392b'" onmouseout="this.style.color='#6b7280'">পাঠক ঘর</a>
                    </li>
                    <li style="color:#d1d5db;padding:0 5px;">›</li>
                    <li style="display:inline-flex;align-items:center;gap:5px;max-width:65vw;overflow:hidden;">
                        <a href="/books/{{book_slug}}.html" style="font-family:'Noto Serif Bengali',serif;font-weight:600;color:#1a1a1b;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw;transition:color .15s;" onmouseover="this.style.color='#c0392b'" onmouseout="this.style.color='#1a1a1b'">{{book_title}}</a>
                        <span style="color:#9ca3af;">–</span>
                        <a href="/author/{{book_author_slug}}.html" style="color:#c0392b;font-family:'Noto Serif Bengali',serif;font-weight:500;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw;transition:opacity .15s;" onmouseover="this.style.opacity='.7'" onmouseout="this.style.opacity='1'">{{book_author}}</a>
                    </li>
                </ol>
            </nav>

            <div id="book-content" class="text-gray-800 dark:text-gray-200">
                {{book_content}}
            </div>

        </div>
    </div>

        <!-- TOC nav for mobile -->
        <nav id="toc-nav-desktop" class="hidden"></nav>
</div>
</div>

<script>
(function () {
    const bookContent  = document.getElementById('book-content');
    const progressBar  = document.getElementById('read-progress-bar');
    const progressPct  = document.getElementById('progress-pct');
    const tocDesktop   = document.getElementById('toc-nav-desktop');
    const tocMobile    = document.getElementById('toc-nav-mobile');
    const progressRing = document.getElementById('progress-ring-circle');

    const tocUnit      = document.getElementById('toc-unit');
    const tocToggleBtn = document.getElementById('toc-toggle-btn');
    const tocOverlay   = document.getElementById('mobile-toc-overlay');

    const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    function toBN(n) {
        return Math.round(n).toString().split('').map(c => bn[c] || c).join('');
    }


    // ── Toggle opacity on scroll ──
    let scrollTimer;
    window.addEventListener('scroll', () => {
        if (tocToggleBtn && !tocUnit.classList.contains('open')) {
            tocToggleBtn.classList.add('scrolling');
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => tocToggleBtn.classList.remove('scrolling'), 800);
        }
    }, { passive: true });

    // ── Progress bar on scroll ──
    window.addEventListener('scroll', () => {
        const docH = document.documentElement.scrollHeight - window.innerHeight;
        const pct  = docH > 0 ? (window.scrollY / docH) * 100 : 0;
        progressBar.style.width = pct + '%';
        if (progressPct) progressPct.textContent = toBN(pct) + '%';
        if (progressRing) progressRing.style.strokeDashoffset = 87.96 * (1 - pct / 100);
    }, { passive: true });

    // ── Build TOC ──
    const headings = Array.from(bookContent.querySelectorAll('h1, h2'))
        .filter(h => h.textContent.trim() !== '');


    function buildToc(nav, isMobile) {
        headings.forEach((h, i) => {
            h.id = h.id || ('sec-' + i);
            const a = document.createElement('a');
            a.href = '#' + h.id;
            a.textContent = h.textContent.trim();
            a.dataset.idx = i;
            const isH1 = h.tagName === 'H1';
            if (isMobile) {
                a.className = 'toc-link ' + (isH1 ? 'h1-link' : 'h2-link');
                a.addEventListener('click', closeTocDrawer);
            } else {
                a.className = 'toc-link block px-3 py-1.5 rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors ' +
                    (isH1 ? 'font-semibold text-[13px] text-gray-800 dark:text-gray-100' : 'pl-5 text-[11px]');
            }
            nav.appendChild(a);
        });
    }
    buildToc(tocDesktop, false);
    buildToc(tocMobile, true);

    // ── TOC active ──
    const allTocLinks = document.querySelectorAll('.toc-link');
    window.addEventListener('scroll', () => {
        let current = 0;
        headings.forEach((h, i) => {
            if (window.scrollY >= h.offsetTop - 120) current = i;
        });
        allTocLinks.forEach(a => {
            a.classList.toggle('active', parseInt(a.dataset.idx) === current);
        });
    }, { passive: true });


    let touchStartX = 0;

    function openTocDrawer() {
        tocUnit.classList.add('open');
        tocOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function closeTocDrawer() {
        tocUnit.classList.remove('open');
        tocOverlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    document.getElementById('toc-toggle-btn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        tocUnit.classList.contains('open') ? closeTocDrawer() : openTocDrawer();
    });
    tocOverlay?.addEventListener('click', closeTocDrawer);
})();
</script>

</body>
</html>
