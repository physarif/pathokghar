<!-- components/read.html — layout.html এর {{content}} এ inject হবে -->

<style>
    /* ── Progress bar ── */
    #read-progress-bar {
        position: fixed;
        top: 0; left: 0;
        height: 3px;
        width: 0%;
        background: linear-gradient(90deg, #0056b3, #3b82f6);
        z-index: 1000;
        transition: width 0.1s linear;
    }

    /* ── Book content typography ── */
    #book-content h1 {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 1.25rem;
        line-height: 1.35;
        color: inherit;
    }
    #book-content h2 {
        font-size: 1.05rem;
        font-weight: 700;
        margin-top: 2rem;
        margin-bottom: 0.75rem;
        padding-top: 1rem;
        border-top: 1px solid #e5e7eb;
    }
    .dark #book-content h2 { border-top-color: #374151; }
    #book-content p {
        margin-bottom: 1rem;
        line-height: 1.95;
    }
    #book-content img {
        max-width: 100%;
        border-radius: 0.5rem;
        margin: 1rem auto;
        display: block;
    }

    /* ── Font size variants ── */
    #book-content.fs-sm p { font-size: 0.875rem; }
    #book-content.fs-md p { font-size: 1rem; }
    #book-content.fs-lg p { font-size: 1.125rem; }
    #book-content.fs-xl p { font-size: 1.25rem; }

    /* ── TOC active ── */
    .toc-link.active {
        color: #0056b3;
        font-weight: 600;
        background: #e1f0ff;
        border-radius: 0.375rem;
    }
    .dark .toc-link.active {
        background: #1e3a5f;
        color: #60a5fa;
    }

    /* ── Desktop TOC sidebar ── */
    #toc-sidebar {
        top: 3.5rem;
        max-height: calc(100vh - 3.5rem);
    }
    #toc-controls-bar {
        position: sticky;
        top: 0;
        z-index: 10;
    }

    /* ── MOBILE: top bar hide/show ── */
    #mobile-topbar {
        position: fixed;
        top: 3.5rem; /* below layout header */
        left: 0; right: 0;
        z-index: 80;
        transform: translateY(0);
        transition: transform 0.28s ease;
    }
    #mobile-topbar.hide {
        transform: translateY(-100%);
    }

    /* ── MOBILE: bottom bar hide/show ── */
    #mobile-bottombar {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 80;
        transform: translateY(0);
        transition: transform 0.28s ease;
    }
    #mobile-bottombar.hide {
        transform: translateY(100%);
    }

    /* ── MOBILE: left TOC drawer ── */
    #mobile-toc-drawer {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 78vw;
        max-width: 300px;
        z-index: 300;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
        display: flex;
        flex-direction: column;
    }
    #mobile-toc-drawer.open {
        transform: translateX(0);
    }
    #mobile-toc-overlay {
        position: fixed;
        inset: 0;
        z-index: 299;
        background: rgba(0,0,0,0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }
    #mobile-toc-overlay.open {
        opacity: 1;
        pointer-events: auto;
    }

    /* ── MOBILE: settings bottom sheet ── */
    #mobile-settings-sheet {
        position: fixed;
        inset: 0;
        z-index: 300;
        pointer-events: none;
    }
    #mobile-settings-sheet.open {
        pointer-events: auto;
    }
    #mobile-settings-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.45);
        opacity: 0;
        transition: opacity 0.25s ease;
    }
    #mobile-settings-sheet.open #mobile-settings-overlay {
        opacity: 1;
    }
    #mobile-settings-panel {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        border-radius: 1.25rem 1.25rem 0 0;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    #mobile-settings-sheet.open #mobile-settings-panel {
        transform: translateY(0);
    }

    /* mobile content padding — space for fixed top+bottom bars */
    @media (max-width: 767px) {
        #read-main-content {
            padding-top: 3.25rem; /* topbar height */
            padding-bottom: 4rem;  /* bottombar height */
        }
    }

    html { scroll-behavior: smooth; }
</style>

<!-- Progress bar -->
<div id="read-progress-bar"></div>

<!-- ════════════════════════════════════════════
     MOBILE: Fixed top bar (hide on scroll down)
     ════════════════════════════════════════════ -->
<div id="mobile-topbar"
    class="md:hidden bg-white/95 dark:bg-[#1a1a1b]/95 backdrop-blur border-b border-gray-200 dark:border-gray-700">
    <div class="flex items-center gap-2 px-3 py-2.5">
        <!-- TOC toggle — left drawer -->
        <button id="mobile-toc-btn"
            class="w-8 h-8 flex items-center justify-center rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 shrink-0"
            aria-label="সূচিপত্র">
            <i class="fas fa-bars text-sm"></i>
        </button>
        <!-- Title -->
        <span class="flex-1 text-sm font-semibold truncate text-gray-800 dark:text-gray-100 px-1">{{book_title}}</span>
        <!-- Settings -->
        <button id="mobile-settings-btn"
            class="w-8 h-8 flex items-center justify-center rounded-xl bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 shrink-0"
            aria-label="সেটিংস">
            <i class="fas fa-sliders-h text-sm"></i>
        </button>
    </div>
</div>

<!-- ════════════════════════════════════════════
     MOBILE: Fixed bottom bar (hide on scroll down)
     ════════════════════════════════════════════ -->
<div id="mobile-bottombar"
    class="md:hidden bg-white/95 dark:bg-[#1a1a1b]/95 backdrop-blur border-t border-gray-200 dark:border-gray-700 px-4 py-2.5">
    <div class="flex items-center gap-3">
        <!-- progress pill -->
        <div class="flex-1 h-1.5 rounded-full bg-gray-200 dark:bg-gray-700 overflow-hidden">
            <div id="mobile-progress-fill" class="h-full rounded-full bg-[#0056b3] transition-all duration-200" style="width:0%"></div>
        </div>
        <span id="mobile-progress-pct" class="text-[11px] tabular-nums text-gray-400 dark:text-gray-500 shrink-0 w-7 text-right">০%</span>
        <!-- font controls -->
        <button id="m-font-decrease"
            class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 text-xs font-bold text-gray-600 dark:text-gray-300 flex items-center justify-center">A−</button>
        <button id="m-font-increase"
            class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 text-xs font-bold text-gray-600 dark:text-gray-300 flex items-center justify-center">A+</button>
    </div>
</div>

<!-- ════════════════════════════════════════════
     MOBILE: Left TOC drawer + overlay
     ════════════════════════════════════════════ -->
<div id="mobile-toc-overlay"></div>
<div id="mobile-toc-drawer"
    class="md:hidden bg-white dark:bg-[#1a1a1b] shadow-xl">
    <!-- Drawer header -->
    <div class="flex items-center justify-between px-4 pt-12 pb-3 border-b border-gray-200 dark:border-gray-700 shrink-0">
        <p class="text-sm font-semibold text-gray-800 dark:text-gray-100">সূচিপত্র</p>
        <button id="mobile-toc-close"
            class="w-7 h-7 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-500 dark:text-gray-400"
            aria-label="বন্ধ">
            <i class="fas fa-times text-xs"></i>
        </button>
    </div>
    <!-- Back to book info -->
    <a href="/books/{{book_slug}}.html"
       class="flex items-center gap-2 px-4 py-3 text-xs text-gray-500 dark:text-gray-400 hover:text-[#0056b3] dark:hover:text-blue-400 border-b border-gray-100 dark:border-gray-800 transition">
        <i class="fas fa-arrow-left text-[10px]"></i> বইয়ের তথ্য
    </a>
    <!-- TOC nav -->
    <nav id="toc-nav-mobile"
        class="flex flex-col px-2 py-3 gap-0.5 text-[13px] overflow-y-auto flex-1">
        <!-- JS generates -->
    </nav>
</div>

<!-- ════════════════════════════════════════════
     MOBILE: Settings bottom sheet
     ════════════════════════════════════════════ -->
<div id="mobile-settings-sheet" class="md:hidden">
    <div id="mobile-settings-overlay"></div>
    <div id="mobile-settings-panel"
        class="bg-white dark:bg-[#2d2d2d]">
        <div class="w-10 h-1 bg-gray-200 dark:bg-gray-600 rounded-full mx-auto"></div>
        <p class="text-sm font-semibold text-gray-700 dark:text-gray-200">পড়ার সেটিংস</p>
        <div class="flex items-center gap-3">
            <span class="text-xs text-gray-500 dark:text-gray-400 w-20">ফন্ট সাইজ</span>
            <button id="ms-font-decrease"
                class="flex-1 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-sm font-bold text-gray-700 dark:text-gray-200">A−</button>
            <button id="ms-font-increase"
                class="flex-1 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-sm font-bold text-gray-700 dark:text-gray-200">A+</button>
        </div>
        <button id="close-settings-btn"
            class="w-full py-2.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-sm text-gray-600 dark:text-gray-300">
            বন্ধ করুন
        </button>
    </div>
</div>

<!-- ════════════════════════════════════════════
     Main layout: reading column + desktop TOC
     ════════════════════════════════════════════ -->
<div class="flex gap-0 min-h-[calc(100vh-3.5rem)] w-full">

    <!-- Reading column -->
    <div class="flex-1 min-w-0">
        <div id="read-main-content" class="px-5 md:px-10 lg:px-16 py-7 max-w-2xl">
            <div id="book-content" class="fs-md text-gray-800 dark:text-gray-200">
                {{book_content}}
            </div>

            <!-- Bottom nav -->
            <div class="mt-12 pt-6 border-t border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <a href="/books/{{book_slug}}.html"
                   class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 hover:text-[#0056b3] dark:hover:text-blue-400 transition">
                    <i class="fas fa-arrow-left text-xs"></i> বইয়ের তথ্য
                </a>
                <a href="/download/{{book_slug}}.html"
                   class="flex items-center gap-2 text-sm bg-[#0056b3] hover:bg-[#004494] text-white px-4 py-2 rounded-lg transition">
                    <i class="fas fa-download text-xs"></i> ডাউনলোড করুন
                </a>
            </div>
        </div>
    </div>

    <!-- Desktop TOC sidebar -->
    <aside id="toc-sidebar"
        class="hidden lg:flex flex-col w-56 shrink-0 sticky self-start border-l border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1b] overflow-y-auto">

        <div id="toc-controls-bar"
            class="bg-white dark:bg-[#1a1a1b] border-b border-gray-200 dark:border-gray-700 px-3 py-2.5 flex flex-col gap-2 shrink-0">
            <a href="/books/{{book_slug}}.html"
               class="flex items-center gap-1.5 text-[11px] text-gray-500 dark:text-gray-400 hover:text-[#0056b3] dark:hover:text-blue-400 transition">
                <i class="fas fa-arrow-left text-[10px]"></i> বইয়ের তথ্য
            </a>
            <div class="flex items-center gap-1.5">
                <button id="font-decrease"
                    class="flex-1 py-1 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-[11px] font-bold transition text-gray-700 dark:text-gray-200">A−</button>
                <button id="font-increase"
                    class="flex-1 py-1 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-[11px] font-bold transition text-gray-700 dark:text-gray-200">A+</button>
                <span id="progress-pct"
                    class="text-[10px] text-gray-400 dark:text-gray-500 tabular-nums shrink-0 w-7 text-right">০%</span>
            </div>
        </div>

        <div class="px-4 pt-3 pb-1.5 shrink-0">
            <p class="text-[11px] uppercase font-semibold text-gray-400 dark:text-gray-500 tracking-wider">সূচিপত্র</p>
        </div>

        <nav id="toc-nav-desktop" class="flex flex-col px-2 pb-6 gap-0.5 text-[12px]">
            <!-- JS generate -->
        </nav>
    </aside>
</div>

<script>
(function () {
    const bookContent = document.getElementById('book-content');
    const progressBar = document.getElementById('read-progress-bar');
    const progressPct = document.getElementById('progress-pct');
    const mobileFill  = document.getElementById('mobile-progress-fill');
    const mobilePct   = document.getElementById('mobile-progress-pct');
    const tocDesktop  = document.getElementById('toc-nav-desktop');
    const tocMobile   = document.getElementById('toc-nav-mobile');

    const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    function toBN(n) {
        return Math.round(n).toString().split('').map(c => bn[c] || c).join('');
    }

    // ── Hide-on-scroll logic ──
    const mobileTopbar    = document.getElementById('mobile-topbar');
    const mobileBottombar = document.getElementById('mobile-bottombar');
    let lastScrollY = window.scrollY;
    let ticking = false;

    window.addEventListener('scroll', () => {
        if (!ticking) {
            requestAnimationFrame(() => {
                const currentY = window.scrollY;
                const delta    = currentY - lastScrollY;

                // hide when scrolling down (delta > 5), show when scrolling up (delta < -5)
                if (delta > 5 && currentY > 60) {
                    mobileTopbar?.classList.add('hide');
                    mobileBottombar?.classList.add('hide');
                } else if (delta < -5) {
                    mobileTopbar?.classList.remove('hide');
                    mobileBottombar?.classList.remove('hide');
                }
                lastScrollY = currentY;

                // progress
                const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                const pct = docHeight > 0 ? (currentY / docHeight) * 100 : 0;
                progressBar.style.width = pct + '%';
                if (progressPct) progressPct.textContent = toBN(pct) + '%';
                if (mobileFill)  mobileFill.style.width = pct + '%';
                if (mobilePct)   mobilePct.textContent  = toBN(pct) + '%';

                ticking = false;
            });
            ticking = true;
        }
    }, { passive: true });

    // ── Build TOC ──
    const headings = bookContent.querySelectorAll('h1, h2');

    function buildToc(nav, isMobile) {
        headings.forEach((h, i) => {
            h.id = h.id || ('sec-' + i);
            const a = document.createElement('a');
            a.href = '#' + h.id;
            a.textContent = h.textContent;
            a.dataset.idx = i;
            a.className = 'toc-link block px-3 py-1.5 rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors ' +
                (h.tagName === 'H1'
                    ? 'font-semibold text-[13px] text-gray-800 dark:text-gray-100'
                    : 'pl-5 text-[11px]');
            if (isMobile) {
                a.addEventListener('click', () => closeTocDrawer());
            }
            nav.appendChild(a);
        });
    }
    buildToc(tocDesktop, false);
    buildToc(tocMobile, true);

    // ── TOC active highlight ──
    const allTocLinks = document.querySelectorAll('.toc-link');
    window.addEventListener('scroll', () => {
        let current = 0;
        headings.forEach((h, i) => {
            if (window.scrollY >= h.offsetTop - 120) current = i;
        });
        allTocLinks.forEach(a => {
            a.classList.toggle('active', parseInt(a.dataset.idx) === current);
        });
    }, { passive: true });

    // ── Font size ──
    const fontSizes = ['fs-sm', 'fs-md', 'fs-lg', 'fs-xl'];
    let currentSize = parseInt(localStorage.getItem('pg-font-size') || '1');
    bookContent.classList.add(fontSizes[currentSize]);

    function changeFont(delta) {
        const next = Math.max(0, Math.min(fontSizes.length - 1, currentSize + delta));
        if (next === currentSize) return;
        bookContent.classList.replace(fontSizes[currentSize], fontSizes[next]);
        currentSize = next;
        localStorage.setItem('pg-font-size', currentSize);
    }

    document.getElementById('font-increase')?.addEventListener('click',    () => changeFont(1));
    document.getElementById('font-decrease')?.addEventListener('click',    () => changeFont(-1));
    document.getElementById('m-font-increase')?.addEventListener('click',  () => changeFont(1));
    document.getElementById('m-font-decrease')?.addEventListener('click',  () => changeFont(-1));
    document.getElementById('ms-font-increase')?.addEventListener('click', () => changeFont(1));
    document.getElementById('ms-font-decrease')?.addEventListener('click', () => changeFont(-1));

    // ── Mobile left TOC drawer ──
    const tocDrawer  = document.getElementById('mobile-toc-drawer');
    const tocOverlay = document.getElementById('mobile-toc-overlay');

    function openTocDrawer() {
        tocDrawer.classList.add('open');
        tocOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function closeTocDrawer() {
        tocDrawer.classList.remove('open');
        tocOverlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    document.getElementById('mobile-toc-btn')?.addEventListener('click', openTocDrawer);
    document.getElementById('mobile-toc-close')?.addEventListener('click', closeTocDrawer);
    tocOverlay?.addEventListener('click', closeTocDrawer);

    // swipe left to close drawer
    let touchStartX = 0;
    tocDrawer?.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    tocDrawer?.addEventListener('touchend', e => {
        if (touchStartX - e.changedTouches[0].clientX > 60) closeTocDrawer();
    }, { passive: true });

    // ── Mobile settings sheet ──
    const settingsSheet   = document.getElementById('mobile-settings-sheet');
    const settingsOverlay = document.getElementById('mobile-settings-overlay');

    function openSettingsSheet()  { settingsSheet.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeSettingsSheet() { settingsSheet.classList.remove('open'); document.body.style.overflow = ''; }

    document.getElementById('mobile-settings-btn')?.addEventListener('click', openSettingsSheet);
    document.getElementById('close-settings-btn')?.addEventListener('click', closeSettingsSheet);
    settingsOverlay?.addEventListener('click', closeSettingsSheet);
})();
</script>
