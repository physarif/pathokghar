<!-- components/read.html — layout.html এর {{content}} এ inject হবে -->

<style>
    /* Reading progress bar */
    #read-progress-bar {
        position: fixed;
        top: 0; left: 0;
        height: 3px;
        width: 0%;
        background: linear-gradient(90deg, #0056b3, #3b82f6);
        z-index: 999;
        transition: width 0.1s linear;
    }

    /* Book content typography */
    #book-content h1 {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 1.25rem;
        line-height: 1.35;
        color: inherit;
    }
    #book-content h2 {
        font-size: 1.05rem;
        font-weight: 700;
        margin-top: 2rem;
        margin-bottom: 0.75rem;
        padding-top: 1rem;
        border-top: 1px solid #e5e7eb;
    }
    .dark #book-content h2 { border-top-color: #374151; }
    #book-content p {
        margin-bottom: 1rem;
        line-height: 1.95;
    }
    #book-content img {
        max-width: 100%;
        border-radius: 0.5rem;
        margin: 1rem auto;
        display: block;
    }

    /* Font size variants */
    #book-content.fs-sm p { font-size: 0.875rem; }
    #book-content.fs-md p { font-size: 1rem; }
    #book-content.fs-lg p { font-size: 1.125rem; }
    #book-content.fs-xl p { font-size: 1.25rem; }

    /* TOC active */
    .toc-link.active {
        color: #0056b3;
        font-weight: 600;
        background: #e1f0ff;
        border-radius: 0.375rem;
    }
    .dark .toc-link.active {
        background: #1e3a5f;
        color: #60a5fa;
    }

    /* TOC sidebar sticky */
    #toc-sidebar {
        top: 3.5rem; /* layout header height */
        max-height: calc(100vh - 3.5rem);
    }

    /* Smooth scroll */
    html { scroll-behavior: smooth; }
</style>

<!-- Progress bar (always fixed top) -->
<div id="read-progress-bar"></div>

<!-- ── Outer wrapper: reading area + TOC sidebar ── -->
<div class="flex gap-0 min-h-[calc(100vh-3.5rem)] w-full">

    <!-- ── MAIN reading column ── -->
    <div class="flex-1 min-w-0">

        <!-- Mobile top bar (book title + settings toggle) -->
        <div class="md:hidden flex items-center gap-2 px-4 py-3 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1b] sticky top-14 z-40">
            <a href="/books/{{book_slug}}.html"
               class="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition shrink-0">
                <i class="fas fa-arrow-left text-sm text-gray-600 dark:text-gray-300"></i>
            </a>
            <span class="flex-1 text-sm font-semibold truncate text-gray-800 dark:text-gray-100">{{book_title}}</span>
            <button id="mobile-settings-btn"
                class="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition shrink-0 text-gray-600 dark:text-gray-300">
                <i class="fas fa-sliders-h text-sm"></i>
            </button>
            <button id="mobile-toc-btn"
                class="p-1.5 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition shrink-0 text-gray-600 dark:text-gray-300">
                <i class="fas fa-list text-sm"></i>
            </button>
        </div>

        <!-- Desktop top bar -->
        <div class="hidden md:flex items-center gap-3 px-6 py-3 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1b] sticky top-14 z-40">
            <a href="/books/{{book_slug}}.html"
               class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 hover:text-[#0056b3] dark:hover:text-blue-400 transition shrink-0">
                <i class="fas fa-arrow-left text-xs"></i> বইয়ের তথ্য
            </a>
            <span class="text-gray-300 dark:text-gray-600">|</span>
            <span class="text-sm font-semibold text-gray-800 dark:text-gray-100 truncate flex-1">{{book_title}}</span>

            <!-- Font size controls -->
            <div class="flex items-center gap-1 shrink-0">
                <button id="font-decrease"
                    class="px-2.5 py-1 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-xs font-bold transition text-gray-700 dark:text-gray-200">A−</button>
                <button id="font-increase"
                    class="px-2.5 py-1 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-xs font-bold transition text-gray-700 dark:text-gray-200">A+</button>
            </div>

            <!-- Reading progress % -->
            <span id="progress-pct" class="text-xs text-gray-400 dark:text-gray-500 shrink-0 tabular-nums">০%</span>
        </div>

        <!-- Book content -->
        <div class="px-5 md:px-10 lg:px-16 py-7 max-w-2xl">
            <div id="book-content" class="fs-md text-gray-800 dark:text-gray-200">
                {{book_content}}
            </div>

            <!-- Bottom nav -->
            <div class="mt-12 pt-6 border-t border-gray-200 dark:border-gray-700 flex items-center justify-between">
                <a href="/books/{{book_slug}}.html"
                   class="flex items-center gap-2 text-sm text-gray-500 dark:text-gray-400 hover:text-[#0056b3] dark:hover:text-blue-400 transition">
                    <i class="fas fa-arrow-left text-xs"></i> বইয়ের তথ্য
                </a>
                <a href="/download/{{book_slug}}.html"
                   class="flex items-center gap-2 text-sm bg-[#0056b3] hover:bg-[#004494] text-white px-4 py-2 rounded-lg transition">
                    <i class="fas fa-download text-xs"></i> ডাউনলোড করুন
                </a>
            </div>
        </div>
    </div>

    <!-- ── RIGHT: TOC sidebar (desktop only) ── -->
    <aside id="toc-sidebar"
        class="hidden lg:flex flex-col w-56 shrink-0 sticky self-start border-l border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1a1a1b] overflow-y-auto">

        <!-- Header -->
        <div class="px-4 pt-4 pb-2 shrink-0">
            <p class="text-[11px] uppercase font-semibold text-gray-400 dark:text-gray-500 tracking-wider">সূচিপত্র</p>
        </div>

        <!-- TOC links -->
        <nav id="toc-nav-desktop" class="flex flex-col px-2 pb-6 gap-0.5 text-[12px]">
            <!-- JS generate -->
        </nav>
    </aside>
</div>

<!-- ── MOBILE: Settings bottom sheet ── -->
<div id="mobile-settings-sheet"
    class="md:hidden fixed inset-0 z-[200] hidden">
    <div id="mobile-settings-overlay" class="absolute inset-0 bg-black/50"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-white dark:bg-[#2d2d2d] rounded-t-2xl p-5 flex flex-col gap-4">
        <div class="w-10 h-1 bg-gray-200 dark:bg-gray-600 rounded-full mx-auto mb-1"></div>
        <p class="text-sm font-semibold text-gray-700 dark:text-gray-200">পড়ার সেটিংস</p>
        <!-- Font size -->
        <div class="flex items-center gap-3">
            <span class="text-xs text-gray-500 dark:text-gray-400 w-20">ফন্ট সাইজ</span>
            <button id="m-font-decrease"
                class="flex-1 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-sm font-bold transition text-gray-700 dark:text-gray-200">A−</button>
            <button id="m-font-increase"
                class="flex-1 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-sm font-bold transition text-gray-700 dark:text-gray-200">A+</button>
        </div>
        <button id="close-settings-btn"
            class="w-full py-2.5 rounded-lg bg-gray-100 dark:bg-gray-700 text-sm text-gray-600 dark:text-gray-300 hover:bg-gray-200 transition">
            বন্ধ করুন
        </button>
    </div>
</div>

<!-- ── MOBILE: TOC bottom sheet ── -->
<div id="mobile-toc-sheet"
    class="md:hidden fixed inset-0 z-[200] hidden">
    <div id="mobile-toc-overlay" class="absolute inset-0 bg-black/50"></div>
    <div class="absolute bottom-0 left-0 right-0 bg-white dark:bg-[#2d2d2d] rounded-t-2xl max-h-[70vh] flex flex-col">
        <div class="px-5 pt-4 pb-3 border-b border-gray-100 dark:border-gray-700 shrink-0">
            <div class="w-10 h-1 bg-gray-200 dark:bg-gray-600 rounded-full mx-auto mb-3"></div>
            <p class="text-sm font-semibold text-gray-700 dark:text-gray-200">সূচিপত্র</p>
        </div>
        <nav id="toc-nav-mobile" class="flex flex-col px-3 py-3 gap-0.5 text-[13px] overflow-y-auto">
            <!-- JS generate -->
        </nav>
    </div>
</div>

<script>
(function () {
    const bookContent  = document.getElementById('book-content');
    const progressBar  = document.getElementById('read-progress-bar');
    const progressPct  = document.getElementById('progress-pct');
    const tocDesktop   = document.getElementById('toc-nav-desktop');
    const tocMobile    = document.getElementById('toc-nav-mobile');

    // ── Reading progress ──
    window.addEventListener('scroll', () => {
        const scrollTop  = window.scrollY;
        const docHeight  = document.documentElement.scrollHeight - window.innerHeight;
        const pct        = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        progressBar.style.width = pct + '%';
        if (progressPct) {
            // Convert to Bengali digits
            const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const num = Math.round(pct).toString().split('').map(c => bn[c] || c).join('');
            progressPct.textContent = num + '%';
        }
    });

    // ── Build TOC ──
    const headings = bookContent.querySelectorAll('h1, h2');

    function buildToc(nav, isMobile) {
        headings.forEach((h, i) => {
            h.id = h.id || ('sec-' + i);
            const a = document.createElement('a');
            a.href = '#' + h.id;
            a.textContent = h.textContent;
            a.dataset.idx = i;
            a.className = 'toc-link block px-3 py-1.5 rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors ' +
                (h.tagName === 'H1'
                    ? 'font-semibold text-[13px] text-gray-800 dark:text-gray-100'
                    : 'pl-5 text-[11px]');
            if (isMobile) {
                a.addEventListener('click', () => closeTocSheet());
            }
            nav.appendChild(a);
        });
    }
    buildToc(tocDesktop, false);
    buildToc(tocMobile, true);

    // ── TOC active highlight ──
    const allTocLinks = document.querySelectorAll('.toc-link');
    window.addEventListener('scroll', () => {
        let current = 0;
        headings.forEach((h, i) => {
            if (window.scrollY >= h.offsetTop - 120) current = i;
        });
        allTocLinks.forEach(a => {
            a.classList.toggle('active', parseInt(a.dataset.idx) === current);
        });
    }, { passive: true });

    // ── Font size ──
    const fontSizes  = ['fs-sm', 'fs-md', 'fs-lg', 'fs-xl'];
    let currentSize  = parseInt(localStorage.getItem('pg-font-size') || '1');
    bookContent.classList.add(fontSizes[currentSize]);

    function changeFont(delta) {
        const next = Math.max(0, Math.min(fontSizes.length - 1, currentSize + delta));
        if (next === currentSize) return;
        bookContent.classList.replace(fontSizes[currentSize], fontSizes[next]);
        currentSize = next;
        localStorage.setItem('pg-font-size', currentSize);
    }

    document.getElementById('font-increase')?.addEventListener('click', () => changeFont(1));
    document.getElementById('font-decrease')?.addEventListener('click', () => changeFont(-1));
    document.getElementById('m-font-increase')?.addEventListener('click', () => changeFont(1));
    document.getElementById('m-font-decrease')?.addEventListener('click', () => changeFont(-1));

    // ── Mobile settings sheet ──
    const settingsSheet   = document.getElementById('mobile-settings-sheet');
    const settingsOverlay = document.getElementById('mobile-settings-overlay');

    function openSettingsSheet()  { settingsSheet.classList.remove('hidden'); }
    function closeSettingsSheet() { settingsSheet.classList.add('hidden'); }

    document.getElementById('mobile-settings-btn')?.addEventListener('click', openSettingsSheet);
    document.getElementById('close-settings-btn')?.addEventListener('click', closeSettingsSheet);
    settingsOverlay?.addEventListener('click', closeSettingsSheet);

    // ── Mobile TOC sheet ──
    const tocSheet   = document.getElementById('mobile-toc-sheet');
    const tocOverlay = document.getElementById('mobile-toc-overlay');

    function openTocSheet()  { tocSheet.classList.remove('hidden'); }
    function closeTocSheet() { tocSheet.classList.add('hidden'); }

    document.getElementById('mobile-toc-btn')?.addEventListener('click', openTocSheet);
    tocOverlay?.addEventListener('click', closeTocSheet);
})();
</script>
