<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{book_title}} - পড়ুন - পাঠক ঘর</title>
    <meta name="description" content="{{book_description}}">
    <meta property="og:title" content="{{book_title}} - পড়ুন - পাঠক ঘর">
    <meta property="og:description" content="{{book_description}}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&display=swap">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#fff5f5',
                            100: '#fde8e6',
                            500: '#c0392b',
                            600: '#a93226'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#1a1a1b] dark:text-gray-200 flex flex-col min-h-screen">

<style>
    /* ── Progress bar ── */
    #read-progress-bar {
        position: fixed;
        top: 0; left: 0;
        height: 2px;
        width: 0%;
        background: #c0392b;
        z-index: 1000;
        transition: width 0.1s linear;
    }

    /* ── Book content typography ── */
    #book-content h1 {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 1.25rem;
        line-height: 1.35;
        color: inherit;
    }
    #book-content h2 {
        font-size: 1.05rem;
        font-weight: 700;
        margin-top: 2rem;
        margin-bottom: 0.75rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(128,128,128,0.2);
    }
    #book-content p {
        margin-bottom: 1.1rem;
        line-height: 2;
    }
    #book-content img {
        max-width: 100%;
        border-radius: 0.5rem;
        margin: 1rem auto;
        display: block;
    }

    /* ── Font size variants ── */
    #book-content.fs-sm p { font-size: 0.875rem; }
    #book-content.fs-md p { font-size: 1rem; }
    #book-content.fs-lg p { font-size: 1.125rem; }
    #book-content.fs-xl p { font-size: 1.25rem; }

    /* ── TOC active ── */
    .toc-link.active {
        color: #c0392b;
        font-weight: 600;
        background: rgba(192,57,43,0.1);
        border-radius: 0.375rem;
    }

    /* ══════════════════════════════
       MOBILE reader chrome
    ══════════════════════════════ */
    @media (max-width: 767px) {

        /* Reading background themes */
        body.theme-dark  #mobile-reader-bg { background: #1c1c1e; }
        body.theme-sepia #mobile-reader-bg { background: #f5efe6; }
        body.theme-light #mobile-reader-bg { background: #ffffff; }

        /* book-content theme handled globally below */

        /* Fixed top bar */
        #mobile-topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 52px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 10px;
            padding-top: env(safe-area-inset-top);
            transition: transform 0.28s ease, background 0.3s;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            background: #ffffff;
        }
        #mobile-topbar.hide { transform: translateY(-100%); }

            
        .theme-btn.active { border-color: #c0392b; }
        .theme-btn i { font-size: 14px; display: none; }
        .theme-btn.active i { display: block; }

        body.theme-dark  #mobile-topbar i   { color: #ccc; }
        body.theme-sepia #mobile-topbar i   { color: #5a4535; }
        body.theme-light #mobile-topbar i   { color: #444; }

        body.theme-dark  #mobile-topbar .title-text { color: #e8e8e8; }
        body.theme-sepia #mobile-topbar .title-text { color: #3b2f20; }
        body.theme-light #mobile-topbar .title-text { color: #111; }

        /* main content padding */
        #read-main-content {
            padding-top: calc(52px + env(safe-area-inset-top) + 16px);
            padding-bottom: 32px;
        }
        #mobile-reader-bg {
            min-height: 100vh;
            transition: background 0.3s;
        }
    }

    /* ══════════════════════════════
       DESKTOP LEFT sidebar — book info
    ══════════════════════════════ */
    @media (min-width: 1024px) {
        #desktop-left-sidebar {
            position: fixed;
            top: 0; left: 0;
            width: 15rem;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(128,128,128,0.15);
            background: inherit;
            z-index: 50;
            overflow: hidden;
        }

        /* ══════════════════════════════
           DESKTOP RIGHT sidebar — controls + TOC
        ══════════════════════════════ */
        #toc-sidebar {
            position: fixed;
            top: 0; right: 0;
            width: 14rem;
            height: 100vh;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #toc-sidebar::-webkit-scrollbar { display: none; }

        /* push main content between both sidebars */
        #read-layout {
            padding-left: 15rem;
            padding-right: 14rem;
        }
    }
    #toc-controls-bar {
        position: sticky; top: 0; z-index: 10;
    }

    /* ── MOBILE: right TOC drawer ── */
    #mobile-toc-drawer {
        position: fixed;
        top: 0; right: 0; bottom: 0;
        width: 82vw; max-width: 320px;
        z-index: 500;
        display: flex; flex-direction: column;
        transform: translateX(105%);
        transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
        border-radius: 0;
    }
    #mobile-toc-drawer.open { transform: translateX(0); }

    #mobile-toc-overlay {
        position: fixed; inset: 0;
        z-index: 499;
        background: rgba(0,0,0,0.35);
        opacity: 0; pointer-events: none;
        transition: opacity 0.32s ease;
    }
    #mobile-toc-overlay.open { opacity: 1; pointer-events: auto; }

    /* Drawer theme colors */
    body.theme-dark  #mobile-toc-drawer { background: #18181a; border-left: 1px solid #2c2c30; }
    body.theme-sepia #mobile-toc-drawer { background: #f5efe6; border-left: 1px solid #d9ccbe; }
    body.theme-light #mobile-toc-drawer { background: #fafafa; border-left: 1px solid #e8eaed; }

    /* Drawer header */
    #toc-drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        height: 56px;
        shrink: 0;
        border-bottom-width: 1px;
        border-bottom-style: solid;
    }
    body.theme-dark  #toc-drawer-header { border-bottom-color: #2c2c30; }
    body.theme-sepia #toc-drawer-header { border-bottom-color: #d9ccbe; }
    body.theme-light #toc-drawer-header { border-bottom-color: #e8eaed; }

    #toc-drawer-header .drawer-title {
        font-size: 0.8125rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
    }
    body.theme-dark  #toc-drawer-header .drawer-title { color: #9ca3af; }
    body.theme-sepia #toc-drawer-header .drawer-title { color: #8a7060; }
    body.theme-light #toc-drawer-header .drawer-title { color: #9ca3af; }

    #mobile-toc-close {
        width: 32px; height: 32px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        border: none; cursor: pointer;
        transition: background 0.15s;
    }
    body.theme-dark  #mobile-toc-close { background: rgba(255,255,255,0.08); color: #aaa; }
    body.theme-sepia #mobile-toc-close { background: rgba(0,0,0,0.07);       color: #6b5443; }
    body.theme-light #mobile-toc-close { background: rgba(0,0,0,0.06);       color: #555; }

    /* Back to book link */
    #toc-drawer-back {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        font-size: 0.75rem;
        font-weight: 500;
        border-bottom-width: 1px;
        border-bottom-style: solid;
        text-decoration: none;
        transition: opacity 0.15s;
    }
    #toc-drawer-back:active { opacity: 0.6; }
    body.theme-dark  #toc-drawer-back { color: #5b9cf6; border-bottom-color: #2c2c30; }
    body.theme-sepia #toc-drawer-back { color: #c0392b; border-bottom-color: #d9ccbe; }
    body.theme-light #toc-drawer-back { color: #c0392b; border-bottom-color: #e8eaed; }

    /* TOC nav items */
    #toc-nav-mobile {
        flex: 1;
        overflow-y: auto;
        padding: 8px 10px 24px;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    #toc-nav-mobile::-webkit-scrollbar { display: none; }

    #toc-nav-mobile .toc-link {
        display: block;
        padding: 9px 12px;
        border-radius: 8px;
        font-size: 0.8125rem;
        line-height: 1.4;
        text-decoration: none;
        transition: background 0.15s, color 0.15s;
        margin-bottom: 1px;
    }
    #toc-nav-mobile .toc-link.h1-link {
        font-size: 0.875rem;
        font-weight: 600;
        margin-top: 4px;
    }
    #toc-nav-mobile .toc-link.h2-link {
        padding-left: 24px;
        font-size: 0.8rem;
        font-weight: 400;
    }

    body.theme-dark  #toc-nav-mobile .toc-link         { color: #9ca3af; }
    body.theme-dark  #toc-nav-mobile .toc-link.h1-link { color: #d1d5db; }
    body.theme-dark  #toc-nav-mobile .toc-link:hover   { background: rgba(255,255,255,0.06); color: #e5e7eb; }
    body.theme-dark  #toc-nav-mobile .toc-link.active  { background: rgba(91,156,246,0.15); color: #5b9cf6; }

    body.theme-sepia #toc-nav-mobile .toc-link         { color: #7a6355; }
    body.theme-sepia #toc-nav-mobile .toc-link.h1-link { color: #3b2f20; }
    body.theme-sepia #toc-nav-mobile .toc-link:hover   { background: rgba(0,0,0,0.05); color: #3b2f20; }
    body.theme-sepia #toc-nav-mobile .toc-link.active  { background: rgba(192,57,43,0.1); color: #c0392b; }

    body.theme-light #toc-nav-mobile .toc-link         { color: #6b7280; }
    body.theme-light #toc-nav-mobile .toc-link.h1-link { color: #111827; }
    body.theme-light #toc-nav-mobile .toc-link:hover   { background: rgba(0,0,0,0.04); color: #111827; }
    body.theme-light #toc-nav-mobile .toc-link.active  { background: rgba(192,57,43,0.08); color: #c0392b; }


    /* ── Line spacing variants ── */
    #book-content.ls-compact p  { line-height: 1.6; }
    #book-content.ls-normal p   { line-height: 2; }
    #book-content.ls-relaxed p  { line-height: 2.4; }

    /* ── Font family variants ── */
    #book-content.ff-sans    { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #book-content.ff-serif   { font-family: 'Noto Serif Bengali', 'Noto Serif', Georgia, serif; }
    #book-content.ff-system  { font-family: system-ui, -apple-system, sans-serif; }

    /* ── Reading width variants ── */
    #read-main-content.rw-narrow { max-width: 36rem; }
    #read-main-content.rw-medium { max-width: 42rem; }
    #read-main-content.rw-wide   { max-width: 56rem; }

    /* ── Estimated time badge ── */
    #est-time-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: #6b7280;
    }

    /* ══════════════════════════════
       MOBILE bottom customization bar
    ══════════════════════════════ */
    @media (max-width: 767px) {
        #mobile-bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 190;
            padding-bottom: env(safe-area-inset-bottom);
            transition: transform 0.28s ease, background 0.3s;
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
            background: #ffffff;
        }
        #mobile-bottom-bar.hide { transform: translateY(100%); }

        /* tabs row */
        #mob-cust-tabs {
            display: flex;
            border-top-width: 1px;
            border-top-style: solid;
            height: 48px;
        }
        .mob-tab-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            font-size: 9px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: transparent;
            transition: color 0.15s;
        }
        .mob-tab-btn i { font-size: 13px; }
        .mob-tab-btn.active { color: #c0392b; }

        /* panel */
        #mob-cust-panel {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.32s cubic-bezier(0.4,0,0.2,1);
        }
        #mob-cust-panel.open { max-height: 320px; }

        .mob-panel-section {
            display: none;
            padding: 12px 16px 4px;
        }
        .mob-panel-section.active { display: block; }

        /* theme buttons mobile */
        #mob-cust-panel .theme-btn {
            height: 32px;
            border-radius: 10px;
            border-width: 2px;
            font-size: 11px;
            font-weight: 500;
            padding: 0 10px;
            flex: none;
        }

        /* ls/ff/rw buttons mobile */
        #mob-cust-panel .ls-btn,
        #mob-cust-panel .rw-btn {
            flex: 1;
            height: 36px;
            border-radius: 10px;
            border-width: 2px;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        #mob-cust-panel .ff-btn {
            width: 100%;
            height: 36px;
            border-radius: 10px;
            border-width: 2px;
            font-size: 12px;
            text-align: left;
            padding: 0 12px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        /* theme colors for bottom bar */
                            body.theme-dark  #mob-cust-panel .ls-btn,
        body.theme-dark  #mob-cust-panel .rw-btn,
        body.theme-dark  #mob-cust-panel .ff-btn { background: #1e1e20; color: #ccc; border-color: #333; }

                            body.theme-sepia #mob-cust-panel .ls-btn,
        body.theme-sepia #mob-cust-panel .rw-btn,
        body.theme-sepia #mob-cust-panel .ff-btn { background: #f5efe6; color: #5a4535; border-color: #d4c8b8; }

                            body.theme-light #mob-cust-panel .ls-btn,
        body.theme-light #mob-cust-panel .rw-btn,
        body.theme-light #mob-cust-panel .ff-btn { background: #f9fafb; color: #374151; border-color: #e5e7eb; }

        /* bottom bar visible — push content up */
        #read-main-content {
            padding-bottom: calc(48px + env(safe-area-inset-bottom) + 16px);
        }
    }

    /* ── Text alignment variants ── */
    #book-content.ta-justify p { text-align: justify; }
    #book-content.ta-center  p { text-align: center; }
    #book-content.ta-default p { text-align: left; }

    /* ── New theme variants ── */
    body.theme-black  #mobile-reader-bg,
    body.theme-black  #read-main-content { background: #000000; }
    body.theme-black  #book-content { color: #d0d0d0; }
    body.theme-black  #book-content h1,
    body.theme-black  #book-content h2 { color: #e8e8e8; }
    body.theme-black  #book-content h2 { border-top-color: #222; }

    body.theme-green  #mobile-reader-bg,
    body.theme-green  #read-main-content { background: #0d1f0f; }
    body.theme-green  #book-content { color: #b8d4ba; }
    body.theme-green  #book-content h1,
    body.theme-green  #book-content h2 { color: #d4e8d4; }
    body.theme-green  #book-content h2 { border-top-color: #1a3a1c; }
    body.theme-green  .mob-tab-btn { color: #4a7a4c; }
    body.theme-green  .mob-tab-btn.active { color: #6fcf72; }

    body.theme-blue   #mobile-reader-bg,
    body.theme-blue   #read-main-content { background: #0d1b2e; }
    body.theme-blue   #book-content { color: #b8ccdf; }
    body.theme-blue   #book-content h1,
    body.theme-blue   #book-content h2 { color: #d0e4f4; }
    body.theme-blue   #book-content h2 { border-top-color: #1a2f4a; }
    body.theme-light  #mobile-topbar { background: #ffffff; border-bottom-color: #e5e7eb; }
    body.theme-light  #mobile-bottom-bar { background: #ffffff; }
    body.theme-sepia  #mobile-topbar { background: #f5efe6; border-bottom-color: #d9ccbe; }
    body.theme-sepia  #mobile-bottom-bar { background: #f5efe6; }
    body.theme-dark   #mobile-topbar { background: #1c1c1e; border-bottom-color: #2c2c30; }
    body.theme-dark   #mobile-bottom-bar { background: #1c1c1e; }
    body.theme-blue   #mobile-topbar { background: #0a1520; border-bottom-color: #1a2f4a; }
    body.theme-blue   #mobile-bottom-bar { background: #0a1520; }
    body.theme-blue   #mob-cust-tabs { border-top-color: #1a2f4a; }
    body.theme-blue   #mob-cust-panel { background: #0a1520; border-top-color: #1a2f4a; }
    body.theme-blue   .mob-tab-btn { color: #3a5a7a; }
    body.theme-blue   .mob-tab-btn.active { color: #5b9cf6; }
    body.theme-blue   #mob-cust-panel .ls-btn,
    body.theme-blue   #mob-cust-panel .rw-btn,
    body.theme-blue   #mob-cust-panel .ff-btn { background: #0d1b2e; color: #7aaac8; border-color: #1a2f4a; }
    body.theme-blue   #desktop-left-sidebar,
    body.theme-blue   #toc-sidebar { background: #0a1520 !important; border-color: #1a2f4a !important; }

    body.theme-gray   #mobile-reader-bg,
    body.theme-gray   #read-main-content { background: #2a2a2e; }
    body.theme-gray   #book-content { color: #c8c8cc; }
    body.theme-gray   #book-content h1,
    body.theme-gray   #book-content h2 { color: #e0e0e4; }
    body.theme-gray   #book-content h2 { border-top-color: #3a3a3e; }
    body.theme-gray   #mobile-topbar { background: #222226; border-bottom-color: #3a3a3e; }
    body.theme-gray   #mobile-bottom-bar { background: #222226; }
    body.theme-gray   #mob-cust-tabs { border-top-color: #3a3a3e; }
    body.theme-gray   #mob-cust-panel { background: #222226; border-top-color: #3a3a3e; }
    body.theme-gray   .mob-tab-btn { color: #666; }
    body.theme-gray   .mob-tab-btn.active { color: #5b9cf6; }
    body.theme-gray   #mob-cust-panel .ls-btn,
    body.theme-gray   #mob-cust-panel .rw-btn,
    body.theme-gray   #mob-cust-panel .ff-btn { background: #2a2a2e; color: #aaa; border-color: #3a3a3e; }
    body.theme-gray   #desktop-left-sidebar,
    body.theme-gray   #toc-sidebar { background: #222226 !important; border-color: #3a3a3e !important; }

    /* ── Active theme button indicator ── */
    .theme-btn { position: relative; overflow: hidden; }
    .theme-btn.active { border-color: #c0392b !important; }

    /* ── Active theme button: filled ring ── */
    .theme-btn { transition: box-shadow 0.15s, border-color 0.15s; }
    .theme-btn.active { border-color: #c0392b !important; box-shadow: inset 0 0 0 2px #c0392b; }
    html { scroll-behavior: smooth; }
    /* ── Hide browser scrollbar (page level) ── */
    html { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar { display: none; }

    /* ══ Global theme rules (mobile + desktop) ══ */
    body.theme-dark  #mobile-reader-bg,
    body.theme-dark  #read-main-content { background: #1c1c1e; }
    body.theme-sepia #mobile-reader-bg,
    body.theme-sepia #read-main-content { background: #f5efe6; }
    body.theme-light #mobile-reader-bg,
    body.theme-light #read-main-content { background: #ffffff; }

    body.theme-dark  #book-content { color: #e0e0e0; }
    body.theme-sepia #book-content { color: #3b2f20; }
    body.theme-light #book-content { color: #1a1a1a; }

    body.theme-dark  #book-content h1,
    body.theme-dark  #book-content h2 { color: #f0f0f0; }
    body.theme-sepia #book-content h1,
    body.theme-sepia #book-content h2 { color: #2a1f14; }
    body.theme-light #book-content h1,
    body.theme-light #book-content h2 { color: #111111; }

    body.theme-dark  #book-content h2 { border-top-color: #333; }
    body.theme-sepia #book-content h2 { border-top-color: #d9ccc0; }
    body.theme-light #book-content h2 { border-top-color: rgba(128,128,128,0.2); }

    /* sidebars follow theme too */

    body.theme-dark  #desktop-left-sidebar *,
    body.theme-dark  #toc-sidebar * { --tw-text-opacity: 1; }

    /* progress bar color stays brand */
    body.theme-sepia #read-progress-bar { background: #8b5e3c; }

    /* ══ Desktop left sidebar theme colors ══ */


    /* Active theme button */
    .theme-btn.active { border-color: #c0392b !important; box-shadow: 0 0 0 1px #c0392b; }

    /* Hide main content bottom back-link on desktop since left sidebar has it */
    @media (min-width: 1024px) {
        #desktop-bottom-backnav { display: none; }
    }

</style>

<!-- Progress bar -->
<div id="read-progress-bar"></div>

<!-- ══════════════════════════════════════════
     MOBILE ONLY chrome (hidden on md+)
══════════════════════════════════════════ -->

<!-- Top bar -->
<div id="mobile-topbar" class="md:hidden">
    <a href="/books/{{book_slug}}.html"
       class="w-9 h-9 flex items-center justify-center rounded-full shrink-0">
        <i class="fas fa-chevron-left text-base"></i>
    </a>
    <div class="flex-1 min-w-0 px-1">

<script>
(function () {
    const bookContent  = document.getElementById('book-content');
    const progressBar  = document.getElementById('read-progress-bar');
    const progressPct  = document.getElementById('progress-pct');
    const tocDesktop   = document.getElementById('toc-nav-desktop');
    const tocMobile    = document.getElementById('toc-nav-mobile');
    const tocLeft      = document.getElementById('toc-nav-left');
    const progressRing = document.getElementById('progress-ring-circle');
    const mobileTopbar  = document.getElementById('mobile-topbar');
    const mobileBottomBar = document.getElementById('mobile-bottom-bar');
    const fontPopup    = document.getElementById('font-popup');
    const fontLabel    = document.getElementById('font-label');

    const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    function toBN(n) {
        return Math.round(n).toString().split('').map(c => bn[c] || c).join('');
    }

    // ── Default theme ──
    let currentTheme = localStorage.getItem('pg-theme') || 'light';
    applyTheme(currentTheme);

    function applyTheme(t) {
        ['light','sepia','dark'].forEach(th => document.body.classList.remove('theme-'+th));
        document.body.classList.add('theme-'+t);
        currentTheme = t;
        localStorage.setItem('pg-theme', t);

        // sync Tailwind dark: variants with theme
        if (t === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.theme === t);
        });
        const bgMap = { light:'#fff', sepia:'#f5efe6', dark:'#1c1c1e' };
        const bdMap = { light:'#e5e7eb', sepia:'#d4c8b8', dark:'#2a2a2e' };
        const clMap = { light:'#111', sepia:'#3b2f20', dark:'#e0e0e0' };
        if (fontPopup) {
            fontPopup.style.background = bgMap[t];
            fontPopup.style.borderColor = bdMap[t];
            fontPopup.style.color = clMap[t];
        }
    }

    // Wire ALL theme buttons including desktop right sidebar
    document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
    });

    // ── Hide-on-scroll ──
    let lastScrollY = window.scrollY;
    let ticking = false;

    window.addEventListener('scroll', () => {
        if (!ticking) {
            requestAnimationFrame(() => {
                const currentY = window.scrollY;
                const delta    = currentY - lastScrollY;
                const docH     = document.documentElement.scrollHeight - window.innerHeight;
                const pct      = docH > 0 ? (currentY / docH) * 100 : 0;

                if (delta > 6 && currentY > 80) {
                    mobileTopbar?.classList.add('hide');
                    mobileBottomBar?.classList.add('hide');
                } else if (delta < -6) {
                    mobileTopbar?.classList.remove('hide');
                    mobileBottomBar?.classList.remove('hide');
                }

                lastScrollY = currentY;
                progressBar.style.width = pct + '%';
                if (progressPct) progressPct.textContent = toBN(pct) + '%';
                // animate ring (circumference 87.96)
                if (progressRing) progressRing.style.strokeDashoffset = 87.96 * (1 - pct / 100);
                ticking = false;
            });
            ticking = true;
        }
    }, { passive: true });

    // ── Build TOC ──
    const headings = bookContent.querySelectorAll('h1, h2');

    function buildToc(nav, isMobile) {
        headings.forEach((h, i) => {
            h.id = h.id || ('sec-' + i);
            const a = document.createElement('a');
            a.href = '#' + h.id;
            a.textContent = h.textContent;
            a.dataset.idx = i;
            const isH1 = h.tagName === 'H1';
            if (isMobile) {
                a.className = 'toc-link ' + (isH1 ? 'h1-link' : 'h2-link');
                a.addEventListener('click', closeTocDrawer);
            } else {
                a.className = 'toc-link block px-3 py-1.5 rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors ' +
                    (isH1 ? 'font-semibold text-[13px] text-gray-800 dark:text-gray-100' : 'pl-5 text-[11px]');
            }
            nav.appendChild(a);
        });
    }
    buildToc(tocDesktop, false);
    buildToc(tocMobile, true);
    if (tocLeft) buildToc(tocLeft, false);

    // ── TOC active ──
    const allTocLinks = document.querySelectorAll('.toc-link');
    window.addEventListener('scroll', () => {
        let current = 0;
        headings.forEach((h, i) => {
            if (window.scrollY >= h.offsetTop - 120) current = i;
        });
        allTocLinks.forEach(a => {
            a.classList.toggle('active', parseInt(a.dataset.idx) === current);
        });
    }, { passive: true });

    // ── Font size ──
    const fontSizes = ['fs-sm', 'fs-md', 'fs-lg', 'fs-xl'];
    let currentSize = parseInt(localStorage.getItem('pg-font-size') || '1');
    bookContent.classList.add(fontSizes[currentSize]);
    if (fontLabel) fontLabel.textContent = currentSize + 1;
    updateFontDots(currentSize);

    function updateFontDots(size) {
        for (let i = 0; i < 4; i++) {
            ['font-dot-', 'm-font-dot-'].forEach(prefix => {
                const dot = document.getElementById(prefix + i);
                if (dot) dot.style.background = i <= size ? '#c0392b' : '';
            });
        }
    }

    function changeFont(delta) {
        const next = Math.max(0, Math.min(fontSizes.length - 1, currentSize + delta));
        if (next === currentSize) return;
        bookContent.classList.replace(fontSizes[currentSize], fontSizes[next]);
        currentSize = next;
        localStorage.setItem('pg-font-size', currentSize);
        if (fontLabel) fontLabel.textContent = currentSize + 1;
        updateFontDots(currentSize);
    }

    document.getElementById('font-increase')?.addEventListener('click', () => changeFont(1));
    document.getElementById('font-decrease')?.addEventListener('click', () => changeFont(-1));
    document.getElementById('m-font-increase')?.addEventListener('click', () => changeFont(1));
    document.getElementById('m-font-decrease')?.addEventListener('click', () => changeFont(-1));

    document.getElementById('mob-font-btn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        fontPopup?.classList.toggle('hidden');
    });
    document.addEventListener('click', () => fontPopup?.classList.add('hidden'));
    fontPopup?.addEventListener('click', e => e.stopPropagation());

    // ── Mobile right TOC drawer ──
    const tocDrawer  = document.getElementById('mobile-toc-drawer');
    const tocOverlay = document.getElementById('mobile-toc-overlay');

    function openTocDrawer() {
        tocDrawer.classList.add('open');
        tocOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function closeTocDrawer() {
        tocDrawer.classList.remove('open');
        tocOverlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    document.getElementById('mob-toc-btn')?.addEventListener('click', openTocDrawer);
    document.getElementById('mob-toc-btn-top')?.addEventListener('click', openTocDrawer);
    document.getElementById('mobile-toc-close')?.addEventListener('click', closeTocDrawer);
    tocOverlay?.addEventListener('click', closeTocDrawer);


    // ── Line spacing ──
    const lsClasses = ['ls-compact', 'ls-normal', 'ls-relaxed'];
    let currentLS = localStorage.getItem('pg-ls') || 'ls-normal';
    bookContent.classList.add(currentLS);

    function applyLS(ls) {
        lsClasses.forEach(c => bookContent.classList.remove(c));
        bookContent.classList.add(ls);
        currentLS = ls;
        localStorage.setItem('pg-ls', ls);
        document.querySelectorAll('.ls-btn').forEach(b => {
            b.classList.toggle('border-[#c0392b]', b.dataset.ls === ls);
            b.classList.toggle('border-gray-200', b.dataset.ls !== ls);
            b.classList.toggle('dark:border-gray-700', b.dataset.ls !== ls);
        });
    }
    applyLS(currentLS);
    document.querySelectorAll('.ls-btn').forEach(b => {
        b.addEventListener('click', () => applyLS(b.dataset.ls));
    });

    // ── Font family ──
    const ffClasses = ['ff-sans', 'ff-serif', 'ff-system'];
    let currentFF = localStorage.getItem('pg-ff') || 'ff-sans';
    bookContent.classList.add(currentFF);

    function applyFF(ff) {
        ffClasses.forEach(c => bookContent.classList.remove(c));
        bookContent.classList.add(ff);
        currentFF = ff;
        localStorage.setItem('pg-ff', ff);
        document.querySelectorAll('.ff-btn').forEach(b => {
            b.classList.toggle('border-[#c0392b]', b.dataset.ff === ff);
            b.classList.toggle('border-gray-200', b.dataset.ff !== ff);
            b.classList.toggle('dark:border-gray-700', b.dataset.ff !== ff);
        });
    }
    applyFF(currentFF);
    document.querySelectorAll('.ff-btn').forEach(b => {
        b.addEventListener('click', () => applyFF(b.dataset.ff));
    });

    // ── Reading width ──
    const mainContent = document.getElementById('read-main-content');
    const rwClasses   = ['rw-narrow', 'rw-medium', 'rw-wide'];
    let currentRW = localStorage.getItem('pg-rw') || 'rw-medium';

    function applyRW(rw) {
        rwClasses.forEach(c => mainContent?.classList.remove(c));
        mainContent?.classList.add(rw);
        currentRW = rw;
        localStorage.setItem('pg-rw', rw);
        document.querySelectorAll('.rw-btn').forEach(b => {
            b.classList.toggle('border-[#c0392b]', b.dataset.rw === rw);
            b.classList.toggle('border-gray-200', b.dataset.rw !== rw);
            b.classList.toggle('dark:border-gray-700', b.dataset.rw !== rw);
        });
    }
    // remove existing max-w-2xl from classList and apply saved width
    mainContent?.classList.remove('max-w-2xl');
    applyRW(currentRW);
    document.querySelectorAll('.rw-btn').forEach(b => {
        b.addEventListener('click', () => applyRW(b.dataset.rw));
    });


    // ── Mobile bottom customization bar ──
    const mobPanel    = document.getElementById('mob-cust-panel');
    let activeTab     = null;

    document.querySelectorAll('.mob-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const panelId = btn.dataset.panel;
            const isActive = btn.classList.contains('active');

            // deactivate all
            document.querySelectorAll('.mob-tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.mob-panel-section').forEach(s => s.classList.remove('active'));

            if (isActive) {
                // toggle off
                mobPanel.classList.remove('open');
                activeTab = null;
            } else {
                // open this panel
                btn.classList.add('active');
                document.getElementById(panelId)?.classList.add('active');
                mobPanel.classList.add('open');
                activeTab = panelId;
            }
        });
    });

    // sync mobile ff-btn active state
    function syncMobileFF(ff) {
        document.querySelectorAll('#mob-cust-panel .ff-btn').forEach(b => {
            b.style.borderColor = b.dataset.ff === ff ? '#c0392b' : '';
        });
    }
    document.querySelectorAll('#mob-cust-panel .ff-btn').forEach(b => {
        b.addEventListener('click', () => { applyFF(b.dataset.ff); syncMobileFF(b.dataset.ff); });
    });

    // sync mobile ls-btn active state
    function syncMobileLS(ls) {
        document.querySelectorAll('#mob-cust-panel .ls-btn').forEach(b => {
            b.style.borderColor = b.dataset.ls === ls ? '#c0392b' : '';
        });
    }
    document.querySelectorAll('#mob-cust-panel .ls-btn').forEach(b => {
        b.addEventListener('click', () => { applyLS(b.dataset.ls); syncMobileLS(b.dataset.ls); });
    });

    // sync mobile rw-btn active state
    function syncMobileRW(rw) {
        document.querySelectorAll('#mob-cust-panel .rw-btn').forEach(b => {
            b.style.borderColor = b.dataset.rw === rw ? '#c0392b' : '';
        });
    }
    document.querySelectorAll('#mob-cust-panel .rw-btn').forEach(b => {
        b.addEventListener('click', () => { applyRW(b.dataset.rw); syncMobileRW(b.dataset.rw); });
    });

    // init active states on mobile
    syncMobileFF(currentFF);
    syncMobileLS(currentLS);
    syncMobileRW(currentRW);


    // ── Text alignment ──
    const taClasses = ['ta-default', 'ta-center', 'ta-justify'];
    let currentTA = localStorage.getItem('pg-ta') || 'ta-default';

    function applyTA(ta) {
        taClasses.forEach(c => bookContent.classList.remove(c));
        bookContent.classList.add(ta);
        currentTA = ta;
        localStorage.setItem('pg-ta', ta);
        document.querySelectorAll('.ta-btn').forEach(b => {
            b.style.borderColor = b.dataset.ta === ta ? '#c0392b' : '';
        });
    }
    applyTA(currentTA);
    document.querySelectorAll('.ta-btn').forEach(b => {
        b.addEventListener('click', () => applyTA(b.dataset.ta));
    });


    let touchStartX = 0;
    tocDrawer?.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    tocDrawer?.addEventListener('touchend', e => {
        if (e.changedTouches[0].clientX - touchStartX > 60) closeTocDrawer();
    }, { passive: true });
})();
</script>

</body>
</html>
