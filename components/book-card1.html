<!-- components/book-card1.html — সব পেজে (index, books, author, category, search)
     ব্যবহৃত common book-card design। generate_pages.js এই ফাইলটা একবার লোড করে
     প্রতিটা টেমপ্লেটের {{book_card_styles}} placeholder-এ বসিয়ে দেয়।
     ডিজাইন পরিবর্তন করতে চাইলে শুধু এই ফাইলটা এডিট করলেই সব জায়গায় reflect হবে।
     ডিজাইন: Compact single-line variant — night-mode-only পাঠক ঘর palette
     (#121218 page bg, #26262c card surface)। Category pill-এর রঙ
     generate_pages.js এর categoryAccent()/search.html এর সমতুল্য JS দিয়ে
     category name হ্যাশ করে বসানো হয় (inline style="color:...;background:...")। -->
<style>
  /* List container */
  .bc-list {
    display: flex;
    flex-direction: column;
    padding: 0;
    gap: 0.6rem;
  }
  @media (min-width: 768px) {
    .bc-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      padding: 0;
    }
  }

  /* Book card — compact single-line row */
  .bc-card {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    text-decoration: none;
    background: #26262c;
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
    transition: background 0.15s;
  }
  .bc-card:hover { background: #302f36; }

  /* Cover — small square thumbnail, full cover always visible (contain,
     never cropped) */
  .bc-img-wrap {
    position: relative;
    flex-shrink: 0;
    width: 2.7rem;
    height: 2.7rem;
    border-radius: 6px;
    overflow: hidden;
    background: #374151;
  }
  @media (min-width: 768px) { .bc-img-wrap { width: 3rem; height: 3rem; } }

  .bc-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Middle — title + author, one line each */
  .bc-body {
    flex: 1;
    min-width: 0;
  }

  .bc-headline {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bc-title {
    font-weight: 700;
    color: #F1F1F1;
  }
  .bc-card:hover .bc-title { text-decoration: none; }

  .bc-author {
    margin: 0.1rem 0 0;
    font-size: 0.76rem;
    color: #9A9A9A;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Category — trailing chip, right side. Colored via inline style
     (color/background) computed per-category by the render helper. */
  .bc-pill {
    flex-shrink: 0;
    display: inline-block;
    font-size: 0.66rem;
    font-weight: 700;
    padding: 0.25rem 0.55rem;
    border-radius: 999px;
    max-width: 6rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
</style>

<!--
  Book card HTML template (reference — generate_pages.js এ ব্যবহার হয়):
  <a href="/book/{{book_slug}}.html" class="bc-card">
    <div class="bc-img-wrap">
      <img src="{{book_cover}}" alt="{{book_title}}" class="bc-img" loading="lazy">
    </div>
    <div class="bc-body">
      <p class="bc-headline"><span class="bc-title">{{book_title}}</span></p>
      {{book_author_html}}
    </div>
    {{book_pill_html}}
  </a>
-->
