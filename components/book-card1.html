<!-- components/book-card1.html — সব পেজে (index, books, author, category, search)
     ব্যবহৃত common book-card design। generate_pages.js এই ফাইলটা একবার লোড করে
     প্রতিটা টেমপ্লেটের {{book_card_styles}} placeholder-এ বসিয়ে দেয়।
     ডিজাইন পরিবর্তন করতে চাইলে শুধু এই ফাইলটা এডিট করলেই সব জায়গায় reflect হবে।
     ডিজাইন: Editorial variant — night-mode-only পাঠক ঘর palette (#121218 page bg,
     #333439 card surface, night-mode gray accent)। -->
<style>
  /* List container */
  .bc-list {
    display: flex;
    flex-direction: column;
    padding: 0;
    gap: 0.7rem;
  }
  @media (min-width: 768px) {
    .bc-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
      padding: 0;
    }
  }

  /* Book card */
  .bc-card {
    display: flex;
    flex-direction: row;
    gap: 1rem;
    align-items: flex-start;
    text-decoration: none;
    padding: 1rem 1.1rem;
    transition: background 0.15s, border-color 0.15s;
    background: #333439;
    border-radius: 5px;
  }
  .bc-card:hover { background: #3d3e44; }

  /* Cover — left side, fixed size 2:3 ratio */
  .bc-img-wrap {
    flex-shrink: 0;
    width: 4.5rem;
    aspect-ratio: 2/3;
    overflow: hidden;
    background: #374151;
    border-radius: 6px;
  }
  @media (min-width: 768px) { .bc-img-wrap { width: 5.5rem; } }

  .bc-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Right side text */
  .bc-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding-top: 0.1rem;
  }

  /* Category pill — top */
  .bc-pill {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 600;
    color: #D0D0D0;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 0.18rem 0.6rem;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 0.5rem;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Headline: title */
  .bc-headline {
    font-size: 1.05rem;
    line-height: 1.4;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .bc-title {
    font-weight: 700;
    color: #F1F1F1;
  }
  .bc-card:hover .bc-title { text-decoration: none; }

  /* Author — below title */
  .bc-author {
    font-size: 0.82rem;
    color: #9A9A9A;
    margin: 0.3rem 0 0;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>

<!--
  Book card HTML template (reference — generate_pages.js এ ব্যবহার হয়):
  <a href="/book/{{book_slug}}.html" class="bc-card">
    <div class="bc-img-wrap">
      <img src="{{book_cover}}" alt="{{book_title}}" class="bc-img" loading="lazy">
    </div>
    <div class="bc-body">
      {{book_pill_html}}
      <p class="bc-headline"><span class="bc-title">{{book_title}}</span></p>
      {{book_author_html}}
    </div>
  </a>
-->
