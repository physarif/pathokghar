<!-- components/book-card1.html — সব পেজে (index, books, author, category, search)
     ব্যবহৃত common book-card design। generate_pages.js এই ফাইলটা একবার লোড করে
     প্রতিটা টেমপ্লেটের {{book_card_styles}} placeholder-এ বসিয়ে দেয়।
     ডিজাইন পরিবর্তন করতে চাইলে শুধু এই ফাইলটা এডিট করলেই সব জায়গায় reflect হবে। -->
<style>
  /* List container */
  .bc-list {
    display: flex;
    flex-direction: column;
    padding: 0;
    gap: 0.6rem;
  }
  @media (min-width: 768px) {
    .bc-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      padding: 0;
    }
  }

  /* Book card */
  .bc-card {
    display: flex;
    flex-direction: row;
    gap: 0.85rem;
    align-items: flex-start;
    text-decoration: none;
    padding: 0.85rem;
    transition: background 0.15s;
    background: #fff;
    border-radius: 5px;
    border: 1px solid #d1d5db;
  }
  .dark .bc-card { background: #23232a; border-color: #3f3f46; }
  .bc-card:first-child { padding-top: 0.85rem; }
  .bc-card:last-child { padding-bottom: 0.85rem; }
  .bc-card:hover { background: #fef2f2; }
  .dark .bc-card:hover { background: #2a2020; }

  /* Cover — left side, fixed size 2:3 ratio */
  .bc-img-wrap {
    flex-shrink: 0;
    width: 5rem;
    aspect-ratio: 2/3;
    overflow: hidden;
    background: #e5e7eb;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  @media (min-width: 768px) { .bc-img-wrap { width: 6rem; } }
  .dark .bc-img-wrap { background: #374151; }

  .bc-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Right side text */
  .bc-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  /* Headline: শুধু title */
  .bc-headline {
    font-size: 1.08rem;
    line-height: 1.4;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .bc-title {
    font-weight: 700;
    color: #c0392b;
  }
  .dark .bc-title { color: #f87171; }
  .bc-card:hover .bc-title { text-decoration: none; }
  .dark .bc-card:hover .bc-title { text-decoration: none; }

  .bc-meta {
    font-size: 0.8rem;
    color: #9ca3af;
    font-weight: 600;
    margin: 0.15rem 0 0;
  }
  .dark .bc-meta { color: #6b7280; }

  /* Description */
  .bc-desc {
    margin-top: 0.35rem;
    font-size: 0.9rem;
    color: #4b5563;
    line-height: 1.55;
    text-align: justify;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .dark .bc-desc { color: #9ca3af; }
</style>

<!--
  Book card HTML template (reference — generate_pages.js এ ব্যবহার হয়):
  <a href="/book/{{book_slug}}.html" class="bc-card">
    <div class="bc-img-wrap">
      <img src="{{book_cover}}" alt="{{book_title}}" class="bc-img" loading="lazy">
    </div>
    <div class="bc-body">
      <p class="bc-headline"><span class="bc-title">{{book_title}}</span></p>
      {{book_meta_html}}
      <p class="bc-desc">{{book_desc}}</p>
    </div>
  </a>
-->
