<!-- components/download.html — layout.html এর {{content}} এ inject হবে -->

<style>
    @keyframes jump {
        0%   { transform: scale(1); }
        40%  { transform: scale(1.18); }
        70%  { transform: scale(0.92); }
        100% { transform: scale(1); }
    }
    .jump { animation: jump 0.4s ease; }

    #countdown-ring {
        stroke-dasharray: 113;
        stroke-dashoffset: 113;
        transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dl-cover-shadow {
        box-shadow: 0 8px 32px rgba(0,86,179,0.18), 0 2px 8px rgba(0,0,0,0.10);
    }

    .step-fade {
        animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .pulse-ring {
        animation: pulse-ring 1.5s ease infinite;
    }
    @keyframes pulse-ring {
        0%   { box-shadow: 0 0 0 0 rgba(0,86,179,0.25); }
        70%  { box-shadow: 0 0 0 12px rgba(0,86,179,0); }
        100% { box-shadow: 0 0 0 0 rgba(0,86,179,0); }
    }
</style>

<div class="max-w-lg mx-auto py-2">

    <!-- Book hero card -->
    <div class="bg-white dark:bg-[#2d2d2d] rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden mb-4">

        <!-- Cover + gradient top band -->
        <div class="relative flex justify-center pt-8 pb-6 bg-gradient-to-b from-blue-50 to-white dark:from-[#1e2d42] dark:to-[#2d2d2d]">
            <img src="{{book_cover}}"
                 alt="{{book_title}}"
                 class="dl-cover-shadow w-36 rounded-lg object-cover aspect-[2/3]">
        </div>

        <!-- Meta -->
        <div class="px-5 pb-5 text-center">
            <h1 class="text-lg font-bold text-gray-900 dark:text-gray-100 leading-snug mb-1">{{book_title}}</h1>
            <p class="text-sm text-[#0056b3] dark:text-blue-400 mb-3">{{book_author}}</p>

            <!-- Badges row -->
            <div class="flex items-center justify-center flex-wrap gap-2">
                <span class="text-xs bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-full border border-blue-100 dark:border-blue-800">
                    {{book_category}}
                </span>
                <span id="file-type" class="text-xs bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-300 px-3 py-1 rounded-full border border-gray-200 dark:border-gray-600">
                    ePub
                </span>
                <span id="file-size" class="text-xs text-gray-400 dark:text-gray-500"></span>
            </div>
        </div>
    </div>

    <!-- Download action card -->
    <div class="bg-white dark:bg-[#2d2d2d] rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm p-6">

        <!-- STEP 1: Get link -->
        <div id="step-1" class="step-fade">
            <div class="flex flex-col items-center gap-4">
                <div class="w-14 h-14 rounded-full bg-blue-50 dark:bg-blue-900/20 flex items-center justify-center pulse-ring">
                    <i class="fas fa-download text-[#0056b3] dark:text-blue-400 text-xl"></i>
                </div>
                <div class="text-center">
                    <p class="text-sm font-semibold text-gray-800 dark:text-gray-100 mb-0.5">বইটি ডাউনলোড করুন</p>
                    <p class="text-xs text-gray-400 dark:text-gray-500">বিনামূল্যে — কোনো অ্যাকাউন্ট ছাড়াই</p>
                </div>
                <button id="get-link-btn"
                    class="w-full bg-[#0056b3] hover:bg-[#004494] active:scale-95 text-white font-semibold py-3 rounded-lg transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                    <i class="fas fa-link text-sm"></i>
                    ডাউনলোড লিংক পান
                </button>
            </div>
        </div>

        <!-- STEP 2: Countdown -->
        <div id="step-2" class="hidden step-fade">
            <div class="flex flex-col items-center gap-5">
                <p class="text-xs text-gray-500 dark:text-gray-400">কয়েক সেকেন্ড অপেক্ষা করুন...</p>

                <!-- Ad slot -->
                <div class="w-full h-20 bg-gray-50 dark:bg-gray-800 rounded-lg flex items-center justify-center border border-dashed border-gray-200 dark:border-gray-700">
                    <span class="text-xs text-gray-300 dark:text-gray-600">বিজ্ঞাপন</span>
                </div>

                <!-- Ring countdown -->
                <div id="countdown-wrapper" class="relative w-16 h-16">
                    <svg class="w-16 h-16 -rotate-90" viewBox="0 0 40 40">
                        <circle cx="20" cy="20" r="18" fill="none" stroke="#e5e7eb" stroke-width="3"/>
                        <circle id="countdown-ring" cx="20" cy="20" r="18" fill="none"
                            stroke="#0056b3" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                    <span id="countdown-text" class="absolute inset-0 flex items-center justify-center text-lg font-bold text-[#0056b3] dark:text-blue-400">5</span>
                </div>
                <p class="text-xs text-gray-400">লিংক তৈরি হচ্ছে...</p>
            </div>
        </div>

        <!-- STEP 3: Download ready -->
        <div id="step-3" class="hidden step-fade">
            <div class="flex flex-col items-center gap-4">
                <div class="w-14 h-14 rounded-full bg-green-50 dark:bg-green-900/20 flex items-center justify-center">
                    <i class="fas fa-check text-green-500 text-xl"></i>
                </div>
                <div class="text-center">
                    <p class="text-sm font-semibold text-gray-800 dark:text-gray-100 mb-0.5">লিংক প্রস্তুত!</p>
                    <p class="text-xs text-gray-400 dark:text-gray-500">নিচের বাটনে ক্লিক করে ডাউনলোড করুন</p>
                </div>
                <a id="download-btn" href="#"
                    class="w-full bg-green-500 hover:bg-green-600 active:scale-95 text-white font-semibold py-3 rounded-lg transition-all flex items-center justify-center gap-2 text-sm shadow-sm">
                    <i class="fas fa-download text-sm"></i>
                    ডাউনলোড করুন
                </a>

                <!-- Restart link -->
                <button id="restart-btn" class="text-xs text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors underline underline-offset-2">
                    আবার চেষ্টা করুন
                </button>
            </div>
        </div>

    </div>

    <!-- Info strip -->
    <div class="mt-4 flex items-center justify-center gap-5 text-xs text-gray-400 dark:text-gray-600">
        <span class="flex items-center gap-1.5"><i class="fas fa-shield-alt text-[10px]"></i> নিরাপদ লিংক</span>
        <span class="flex items-center gap-1.5"><i class="fas fa-bolt text-[10px]"></i> দ্রুত ডাউনলোড</span>
        <span class="flex items-center gap-1.5"><i class="fas fa-ban text-[10px]"></i> কোনো রেজিস্ট্রেশন নেই</span>
    </div>

</div>

<script>
(function () {
    const DOWNLOAD_URL = '{{book_download_url}}';
    const COUNTDOWN_SECONDS = 5;
    const circumference = 2 * Math.PI * 18; // ≈ 113

    // File info detect
    async function detectFileInfo(url) {
        try {
            const res = await fetch(url, { method: 'HEAD' });
            const size = res.headers.get('content-length');
            const type = res.headers.get('content-type') || '';
            if (size) document.getElementById('file-size').textContent = (size / (1024 * 1024)).toFixed(1) + ' MB';
            if (type.includes('epub')) document.getElementById('file-type').textContent = 'ePub';
            else if (type.includes('pdf')) document.getElementById('file-type').textContent = 'PDF';
        } catch (e) {}
    }
    detectFileInfo(DOWNLOAD_URL);

    // Step helpers
    function showStep(n) {
        [1, 2, 3].forEach(i => {
            const el = document.getElementById('step-' + i);
            if (i === n) { el.classList.remove('hidden'); el.classList.add('step-fade'); }
            else el.classList.add('hidden');
        });
    }

    // Get link button
    document.getElementById('get-link-btn').addEventListener('click', () => {
        showStep(2);

        const ring = document.getElementById('countdown-ring');
        const wrapper = document.getElementById('countdown-wrapper');
        let remaining = COUNTDOWN_SECONDS;
        ring.style.strokeDashoffset = circumference;

        function tick() {
            wrapper.classList.add('jump');
            setTimeout(() => wrapper.classList.remove('jump'), 400);
        }
        tick();

        const interval = setInterval(() => {
            remaining--;
            document.getElementById('countdown-text').textContent = remaining;
            ring.style.strokeDashoffset = circumference * (remaining / COUNTDOWN_SECONDS);
            tick();

            if (remaining <= 0) {
                clearInterval(interval);
                showStep(3);
                document.getElementById('download-btn').href = DOWNLOAD_URL;
            }
        }, 1000);
    });

    // Restart
    document.getElementById('restart-btn').addEventListener('click', () => showStep(1));
})();
</script>
