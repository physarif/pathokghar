<!-- components/download.html — layout.html এর {{content}} এ inject হবে -->

<style>
    .progress-bar-fill {
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #45464c, #3b82f6);
        transition: width 0.85s cubic-bezier(0.4, 0, 0.2, 1);
        width: 100%;
    }

    .step-fade {
        animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .pulse-ring {
        animation: pulse-ring 1.5s ease infinite;
    }
    @keyframes pulse-ring {
        0%   { box-shadow: 0 0 0 0 rgba(69,70,76,0.35); }
        70%  { box-shadow: 0 0 0 12px rgba(69,70,76,0); }
        100% { box-shadow: 0 0 0 0 rgba(69,70,76,0); }
    }

    /* ── Book Info Card (book.html hero card থেকে) ── */
    .dl-hero-card {
        display: flex;
        align-items: flex-start;
        gap: 1.1rem;
        text-align: left;
        background: #333439;
        border-radius: 5px;
        padding: 1.25rem;
        box-shadow: 0 2px 14px rgba(0,0,0,0.06);
        margin-bottom: 1rem;
    }
    .dl-hero-cover {
        width: 100px;
        height: 148px;
        border-radius: 4px;
        object-fit: cover;
        background: #e5e7eb;
        flex-shrink: 0;
        box-shadow: 0 10px 22px rgba(0,0,0,0.18);
    }
    .dl-hero-body {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-width: 0;
    }
    .dl-hero-category {
        display: inline-block;
        width: fit-content;
        font-family: 'Noto Serif Bengali', serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #d1d5db;
        background: #45464c;
        padding: 0.28rem 0.85rem;
        border-radius: 6px;
        text-decoration: none;
        transition: background 0.15s, color 0.15s;
    }
    .dl-hero-category:hover { background: #55565c; color: #fff; }
    .dl-hero-title {
        font-family: 'Noto Serif Bengali', serif;
        font-size: 1.1rem;
        font-weight: 800;
        color: #f3f4f6;
        line-height: 1.4;
        margin: 0;
    }
    .dl-hero-author {
        font-family: 'Noto Serif Bengali', serif;
        font-size: 0.85rem;
        font-weight: 600;
        color: #9ca3af;
        text-decoration: none;
        transition: color 0.15s;
    }
    .dl-hero-author:hover { color: #d1d5db; text-decoration: underline; text-underline-offset: 3px; }
    .dl-hero-rule {
        border: none;
        border-top: 1px dashed #45464c;
        margin: 0.25rem 0;
    }
    .dl-hero-actions {
        display: flex;
        gap: 0.6rem;
        margin-top: 0.15rem;
    }
    .dl-hero-link {
        display: inline-flex;
        align-items: center;
        font-size: 0.8rem;
        font-weight: 700;
        text-decoration: none;
        padding: 0.45rem 1rem;
        border-radius: 8px;
        transition: background 0.15s, color 0.15s, transform 0.1s;
    }
    .dl-hero-link:active { transform: scale(0.96); }
    .dl-hero-link-solid { background: #45464c; color: #fff; }
    .dl-hero-link-solid:hover { background: #55565c; }
    .dl-hero-link-outline { background: transparent; color: #d1d5db; border: 1.5px solid #55565c; padding: 0.375rem 0.95rem; }
    .dl-hero-link-outline:hover { background: rgba(255,255,255,0.08); }

    /* ── Download page layout / step cards ── */
    .dl-page { max-width: 32rem; margin: 0 auto; padding: 1rem 0.75rem; }
    @media (min-width: 768px) { .dl-page { padding: 1.5rem; } }
    .dl-card {
        background: #333439;
        border-radius: 5px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        padding: 1.5rem;
    }
    .dl-step1-inner { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .dl-icon-circle {
        width: 3.5rem; height: 3.5rem;
        border-radius: 50%;
        background: #45464c;
        display: flex; align-items: center; justify-content: center;
        color: #9ca3af;
        font-size: 1.25rem;
    }
    .dl-step1-text { text-align: center; }
    .dl-step1-title { font-size: 0.875rem; font-weight: 600; color: #f3f4f6; margin: 0 0 0.125rem; }
    .dl-step1-sub { font-size: 0.75rem; color: #6b7280; margin: 0; }
    .dl-get-link-btn {
        width: 100%;
        background: #45464c;
        color: #fff;
        font-weight: 600;
        padding: 0.75rem;
        border: none;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        transition: background 0.15s, transform 0.1s;
        cursor: pointer;
    }
    .dl-get-link-btn:hover { background: #55565c; }
    .dl-get-link-btn:active { transform: scale(0.95); }

    /* একক লিংক না থাকলে countdown শেষে EPUB/MOBI/PDF — ৩টা আলাদা ডাউনলোড লিংক */
    .dl-format-btns { width: 100%; display: flex; flex-direction: column; gap: 0.6rem; }
    .dl-format-link { }

    .dl-step2-inner { display: flex; flex-direction: column; gap: 1.25rem; }
    .dl-waiting-text { font-size: 0.75rem; color: #9ca3af; text-align: center; margin: 0; }

    .dl-progress-wrap { display: flex; flex-direction: column; gap: 0.5rem; }
    .dl-progress-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: #6b7280; }
    .dl-progress-track { width: 100%; height: 0.5rem; background: #374151; border-radius: 9999px; overflow: hidden; }

    .dl-download-btn {
        width: 100%;
        background: #22c55e;
        color: #fff;
        font-weight: 600;
        padding: 0.75rem;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        text-decoration: none;
        display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        transition: background 0.15s, transform 0.1s;
    }
    .dl-download-btn:hover { background: #16a34a; }
    .dl-download-btn:active { transform: scale(0.95); }
    .dl-restart-btn {
        background: none; border: none; cursor: pointer;
        font-size: 0.75rem; color: #9ca3af;
        text-decoration: underline; text-underline-offset: 2px;
        transition: color 0.15s;
    }
    .dl-restart-btn:hover { color: #d1d5db; }

    .dl-info-strip { margin-top: 1rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: #4b5563; }
    .dl-info-item { display: flex; align-items: center; gap: 0.375rem; }
    .dl-info-item i { font-size: 0.625rem; }
</style>

<!-- ─── Download page (single layout) ─── -->
<div class="dl-page">

    <!-- Book Info Card: breadcrumb-এর বদলে book.html-এর মতো hero card,
         এখানে "পড়ুন" ও "বিবরণ" — দুটোই বই পেজে নিয়ে যায় -->
    <div class="dl-hero-card">
        <img src="{{book_cover}}" alt="{{book_title}} বই এর কভার" width="100" height="148" class="dl-hero-cover">
        <div class="dl-hero-body">
            <span class="dl-hero-category">{{book_category}}</span>
            <p class="dl-hero-title">{{book_title}}</p>
            <span class="dl-hero-author">{{book_author}}</span>
            <hr class="dl-hero-rule">
            <div class="dl-hero-actions">
                <a href="/read/{{book_slug}}.html" class="dl-hero-link dl-hero-link-solid">পড়ুন</a>
                <a href="/book/{{book_slug}}.html" class="dl-hero-link dl-hero-link-outline">বিবরণ</a>
            </div>
        </div>
    </div>

    <!-- Download action card -->
    <div class="dl-card">
        <div id="m-step-1" class="step-fade">
            <div class="dl-step1-inner">
                <div class="dl-icon-circle pulse-ring">
                    <i class="fas fa-download"></i>
                </div>
                <div class="dl-step1-text">
                    <p class="dl-step1-title">বইটি ডাউনলোড করুন</p>
                    <p class="dl-step1-sub">বিনামূল্যে — কোনো সাবস্ক্রিপশন ছাড়াই</p>
                </div>
                <!-- "ডাউনলোড লিংক পান" — ক্লিক করার পরই countdown শেষে
                     আসল ডাউনলোড লিংক(গুলো) দেখা যাবে -->
                <button id="m-get-link-btn" class="dl-get-link-btn">
                    ডাউনলোড লিংক পান
                </button>
            </div>
        </div>
        <div id="m-step-2" class="hidden step-fade">
            <div class="dl-step2-inner">
                <p id="m-waiting-text" class="dl-waiting-text">কয়েক সেকেন্ড অপেক্ষা করুন...</p>
                <!-- Progress bar -->
                <div id="m-progress-wrap" class="dl-progress-wrap">
                    <div class="dl-progress-row">
                        <span id="m-progress-label">লিংক তৈরি হচ্ছে...</span>
                        <span id="m-countdown-wrap" class="progress-seconds"><span id="m-countdown-text">5</span>s</span>
                    </div>
                    <div class="dl-progress-track">
                        <div id="m-progress-fill" class="progress-bar-fill"></div>
                    </div>
                </div>

                <!-- countdown শেষে: book_download_url থাকলে একক ডাউনলোড বাটন -->
                <a id="m-download-btn" href="#" class="hidden dl-download-btn step-fade">
                    <i class="fas fa-download"></i> ডাউনলোড করুন
                </a>

                <!-- countdown শেষে: book_download_url না থাকলে EPUB/PDF — ২টা আলাদা লিংক -->
                <div id="m-format-links" class="hidden dl-format-btns step-fade">
                    <a id="m-format-link-epub" href="#" class="dl-download-btn dl-format-link" target="_blank" rel="noopener">
                        <i class="fas fa-tablet-alt"></i> EPUB ডাউনলোড
                    </a>
                    <a id="m-format-link-pdf" href="#" class="dl-download-btn dl-format-link" target="_blank" rel="noopener">
                        <i class="fas fa-file-pdf"></i> PDF ডাউনলোড
                    </a>
                </div>

                <button id="m-restart-btn" class="hidden dl-restart-btn">
                    আবার চেষ্টা করুন
                </button>
            </div>
        </div>
    </div>

    <!-- Info strip -->
    <div class="dl-info-strip">
        <span class="dl-info-item"><i class="fas fa-shield-alt"></i> নিরাপদ</span>
        <span class="dl-info-item"><i class="fas fa-bolt"></i> দ্রুত</span>
        <span class="dl-info-item"><i class="fas fa-ban"></i> অবাধ</span>
    </div>
</div>



<script>
(function () {
    const DOWNLOAD_URL = '{{book_download_url}}';
    const BOOK_SLUG     = '{{book_slug}}';
    const COUNTDOWN_SECONDS = 5;

    // book_download_url না থাকলে ebooks.pathokghar.com থেকে ফরম্যাট অনুযায়ী লিংক তৈরি।
    // (নোট: টেমপ্লেট লিটারেল/backtick ব্যবহার করা হচ্ছে না — render() ফাংশন
    // ডলার চিহ্ন ডাবল করে ফেলে, তাতে ইন্টারপোলেশন সিনট্যাক্স ভেঙে যায়। তাই স্ট্রিং concat।)
    const EBOOKS_BASE = 'https://dl.pathokghar.com/ebooks/';
    const FORMAT_URLS = {
        EPUB: EBOOKS_BASE + 'epub/' + BOOK_SLUG + '.epub',
        PDF:  EBOOKS_BASE + 'pdf/' + BOOK_SLUG + '.pdf',
    };

    // Generic countdown runner — শেষে book_download_url থাকলে একক ডাউনলোড বাটন,
    // না থাকলে EPUB/MOBI/PDF — ৩টা লিংক দেখাবে
    function startCountdown(prefix) {
        const fill    = document.getElementById(prefix + 'progress-fill');
        const text    = document.getElementById(prefix + 'countdown-text');
        let remaining = COUNTDOWN_SECONDS;

        // Start full, shrink to 0
        fill.style.width = '100%';

        // First tick after 1 frame so transition plays
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                fill.style.width = ((remaining - 1) / COUNTDOWN_SECONDS * 100) + '%';
            });
        });

        const interval = setInterval(() => {
            remaining--;
            text.textContent = remaining;
            fill.style.width = (remaining / COUNTDOWN_SECONDS * 100) + '%';

            if (remaining <= 0) {
                clearInterval(interval);
                // progress wrap + waiting text fade out, তারপর ডাউনলোড লিংক(গুলো) দেখাও
                const progressWrap  = document.getElementById(prefix + 'progress-wrap');
                const waitingText   = document.getElementById(prefix + 'waiting-text');
                const dlBtn         = document.getElementById(prefix + 'download-btn');
                const formatLinks   = document.getElementById(prefix + 'format-links');
                const restartBtn    = document.getElementById(prefix + 'restart-btn');

                // fade out
                if (progressWrap) { progressWrap.style.transition = 'opacity 0.3s'; progressWrap.style.opacity = '0'; }
                if (waitingText)  { waitingText.style.transition  = 'opacity 0.3s'; waitingText.style.opacity  = '0'; }

                setTimeout(() => {
                    if (progressWrap) progressWrap.style.display = 'none';
                    if (waitingText)  waitingText.style.display  = 'none';
                    if (restartBtn)   restartBtn.style.display   = 'none';

                    if (DOWNLOAD_URL) {
                        // একটামাত্র ডাউনলোড লিংক
                        if (dlBtn) {
                            dlBtn.href = DOWNLOAD_URL;
                            dlBtn.classList.remove('hidden');
                            dlBtn.classList.add('step-fade');
                        }
                    } else if (formatLinks) {
                        // EPUB/MOBI/PDF — ৩টা আলাদা লিংক
                        const epub = document.getElementById(prefix + 'format-link-epub');
                        const pdf  = document.getElementById(prefix + 'format-link-pdf');
                        if (epub) epub.href = FORMAT_URLS.EPUB;
                        if (pdf)  pdf.href  = FORMAT_URLS.PDF;
                        formatLinks.classList.remove('hidden');
                        formatLinks.classList.add('step-fade');
                    }
                }, 300);
            }
        }, 1000);
    }

    function showStep(prefix, n) {
        // FIX: step-3 নেই, শুধু 1 ও 2 toggle করা হচ্ছে
        [1, 2].forEach(i => {
            const el = document.getElementById(prefix + 'step-' + i);
            if (!el) return;
            if (i === n) { el.classList.remove('hidden'); el.classList.add('step-fade'); }
            else el.classList.add('hidden');
        });
    }

    // "ডাউনলোড লিংক পান" ক্লিক করার পরই countdown শুরু হয়ে শেষে আসল লিংক(গুলো) দেখা যায়
    const mGetLinkBtn = document.getElementById('m-get-link-btn');
    if (mGetLinkBtn) mGetLinkBtn.addEventListener('click', () => { showStep('m-', 2); startCountdown('m-'); });

    const mRestart = document.getElementById('m-restart-btn');
    if (mRestart) mRestart.addEventListener('click', () => showStep('m-', 1));

    // প্রথমবার কোনো ডাউনলোড লিংকে ক্লিক করলে শুধু external ad লিংক নতুন ট্যাবে খুলবে।
    // ads থেকে ফিরে আবার ক্লিক করলে আসল ডাউনলোড শুরু হবে।
    const AD_URL = 'https://www.effectivecpmnetwork.com/xy4y06gcc0?key=0a786fa6fae9cb37d984706635ad88c3';
    let adOpened = false;
    function gateWithAd(el) {
        if (!el) return;
        el.addEventListener('click', (e) => {
            if (!adOpened) {
                e.preventDefault();
                adOpened = true;
                window.open(AD_URL, '_blank');
            }
        });
    }
    gateWithAd(document.getElementById('m-download-btn'));
    gateWithAd(document.getElementById('m-format-link-epub'));
    gateWithAd(document.getElementById('m-format-link-pdf'));
})();
</script>
