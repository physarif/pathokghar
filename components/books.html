<!-- components/books.html — pagination page (/books/{page}/) content + সব styling এখানে -->
<style>
  /* Section */
  .book-section { padding: 0.75rem 0.5rem; margin-bottom: 0.5rem; }
  @media (min-width: 768px) { .book-section { margin-left: 0.5rem; margin-right: 0.5rem; padding: 0.75rem 0.4rem; } }

  /* Section header */
  .bc-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
    padding: 0 1rem;
  }
  @media (min-width: 768px) { .bc-section-header { padding: 0 1.5rem; } }

  /* Title + extending line */
  .bc-section-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #1f2937;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    width: 100%;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  .bc-section-title::after {
    content: '';
    flex: 1;
    height: 2px;
    background: #c0392b;
    border-radius: 1px;
  }
  .dark .bc-section-title { color: #f3f4f6; }
  .dark .bc-section-title::after { background: #f87171; }

  /* "সব দেখুন" pill button */
  .bc-section-link {
    font-size: 0.72rem;
    font-weight: 600;
    color: #fff;
    background: #7a3b1e;
    text-decoration: none;
    padding: 0.3rem 0.75rem;
    border-radius: 0.25rem;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .bc-section-link:hover { background: #5c2b14; }
  .dark .bc-section-link { background: #92400e; }
  .dark .bc-section-link:hover { background: #78350f; }

  /* Pagination */
  .bc-pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.35rem;
    padding: 0.6rem 1rem 0.2rem;
    flex-wrap: wrap;
  }
  .bc-page-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.1rem;
    height: 2.1rem;
    padding: 0 0.5rem;
    border-radius: 0.3rem;
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    color: #374151;
    background: #f3f4f6;
    transition: background 0.15s, color 0.15s;
  }
  .bc-page-btn:hover { background: #e5e7eb; color: #111827; }
  .bc-page-btn.active { background: #c0392b; color: #fff; pointer-events: none; }
  .bc-page-nav {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0 0.75rem;
    height: 2.1rem;
    border-radius: 0.3rem;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    background: #c0392b;
    transition: background 0.15s;
  }
  .bc-page-nav:hover { background: #991b1b; }
  .dark .bc-page-btn { background: #1f2937; color: #d1d5db; }
  .dark .bc-page-btn:hover { background: #374151; color: #f9fafb; }
  .dark .bc-page-btn.active { background: #f87171; color: #111827; }
  .dark .bc-page-nav { background: #f87171; color: #111827; }
  .dark .bc-page-nav:hover { background: #ef4444; }

  /* সর্বশেষ বই — title with accented progress-style underline */
  .bc-latest-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.1rem;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 1rem;
    letter-spacing: 0.01em;
  }
  .bc-latest-title i { color: #c0392b; font-size: 1rem; }
  .bc-latest-title .bc-page-num { color: #c0392b; }
  .dark .bc-latest-title .bc-page-num { color: #f87171; }
  .bc-latest-title::after {
    content: '';
    flex: 1;
    height: 6px;
    border-radius: 1px;
    background: linear-gradient(to right, #e5e7eb 0%, #c0392b 100%);
  }
  .dark .bc-latest-title { color: #f3f4f6; }
  .dark .bc-latest-title::after {
    background: linear-gradient(to right, #374151 0%, #f87171 100%);
  }

  /* পেজ কনটেন্ট wrapper */
  .page-content {
    flex: 1 1 auto;
    min-width: 0;
    padding: 1rem 0;
    overflow: hidden;
    min-height: calc(100vh - 3.5rem);
  }
  @media (min-width: 768px) { .page-content { padding: 1.5rem 2rem; } }
  @media (min-width: 1024px) { .page-content { padding-left: 4rem; padding-right: 4rem; } }
</style>

{{book_card_styles}}

<main class="page-content">

  <!-- সর্বশেষ বই -->
  <section class="book-section">
    <div class="bc-latest-title">
      <i class="fa-solid fa-clock-rotate-left"></i> সর্বশেষ বই<span class="bc-page-num">({{current_page_bn}})</span>
    </div>
    <div class="bc-list">{{latest_books}}</div>
  </section>

  <div id="bc-pagination"></div>
  <script>
    (function() {
      const current = parseInt('{{current_page}}', 10);
      const total = parseInt('{{total_pages}}', 10);
      if (!current || !total || total <= 1) return;
      const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
      const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
      const el = document.getElementById('bc-pagination');
      let html = '<div class="bc-pagination">';
      if (current > 1) {
        const prev = current === 2 ? '/' : '/books/' + (current - 1) + '/';
        html += '<a href="' + prev + '" class="bc-page-nav"><i class="fas fa-chevron-left" style="font-size:0.75rem;"></i> পূর্ববর্তী</a>';
      }
      for (let i = 1; i <= total; i++) {
        const href = i === 1 ? '/' : '/books/' + i + '/';
        if (i === current) html += '<span class="bc-page-btn active">' + toBn(i) + '</span>';
        else html += '<a href="' + href + '" class="bc-page-btn">' + toBn(i) + '</a>';
      }
      if (current < total) {
        html += '<a href="/books/' + (current + 1) + '/" class="bc-page-nav">পরবর্তী <i class="fas fa-chevron-right" style="font-size:0.75rem;"></i></a>';
      }
      html += '</div>';
      el.innerHTML = html;
    })();
  </script>
