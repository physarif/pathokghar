<!-- components/index.html — homepage content + সব styling এখানে -->
<style>
  /* Section */
  .book-section { padding: 0.75rem 0; margin-bottom: 0.5rem; }
  @media (min-width: 768px) { .book-section { margin-left: 0.5rem; margin-right: 0.5rem; } }

  /* Section header */
  .bc-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
    padding: 0 1rem;
  }
  @media (min-width: 768px) { .bc-section-header { padding: 0 1.5rem; } }

  /* Title with red left border */
  .bc-section-title {
    font-size: 1rem;
    font-weight: 700;
    color: #1f2937;
    padding-left: 0.6rem;
    border-left: 3.5px solid #c0392b;
    display: inline-block;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  .dark .bc-section-title { color: #f3f4f6; }

  /* "সব দেখুন" pill button */
  .bc-section-link {
    font-size: 0.72rem;
    font-weight: 600;
    color: #fff;
    background: #7a3b1e;
    text-decoration: none;
    padding: 0.3rem 0.75rem;
    border-radius: 0.25rem;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .bc-section-link:hover { background: #5c2b14; }
  .dark .bc-section-link { background: #92400e; }
  .dark .bc-section-link:hover { background: #78350f; }

  /* List container */
  .bc-list {
    display: flex;
    flex-direction: column;
    padding: 0 1rem;
  }
  @media (min-width: 768px) { .bc-list { padding: 0 1.5rem; } }

  /* Separator line between cards */
  .bc-card + .bc-card {
    border-top: 1px solid #e5e7eb;
  }
  .dark .bc-card + .bc-card {
    border-top-color: #374151;
  }

  /* Book card — horizontal list style */
  .bc-card {
    display: flex;
    flex-direction: row;
    gap: 0.85rem;
    align-items: flex-start;
    text-decoration: none;
    padding: 0.75rem 0;
    transition: background 0.1s;
  }
  .bc-card:hover { background: transparent; }

  /* Cover — left side, fixed size 2:3 ratio */
  .bc-img-wrap {
    flex-shrink: 0;
    width: 5.5rem;
    aspect-ratio: 2/3;
    border-radius: 0.25rem;
    overflow: hidden;
    background: #e5e7eb;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  @media (min-width: 768px) { .bc-img-wrap { width: 6.5rem; } }
  .dark .bc-img-wrap { background: #374151; }

  .bc-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.2s;
  }
  .bc-card:hover .bc-img { transform: scale(1.04); }

  /* Right side text */
  .bc-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  /* Headline: title – author একই লাইনে, একই size */
  .bc-headline {
    font-size: 1rem;
    line-height: 1.4;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .bc-title {
    font-weight: 700;
    color: #c0392b;
  }
  .dark .bc-title { color: #f87171; }
  .bc-card:hover .bc-title { color: #991b1b; }
  .dark .bc-card:hover .bc-title { color: #fca5a5; }

  .bc-sep {
    color: #9ca3af;
    font-weight: 400;
  }
  .bc-author {
    font-weight: 500;
    color: #6b7280;
  }
  .dark .bc-author { color: #9ca3af; }

  /* Description — 3 lines */
  .bc-desc {
    margin-top: 0.3rem;
    font-size: 0.85rem;
    color: #4b5563;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .dark .bc-desc { color: #9ca3af; }
</style>

<!--
  Book card template (reference — generate_pages.js এ ব্যবহার হয়):
  <a href="books/{{book_slug}}.html" class="bc-card">
    <div class="bc-img-wrap">
      <img src="{{book_cover}}" alt="{{book_title}}" class="bc-img" loading="lazy">
    </div>
    <div class="bc-body">
      <p class="bc-headline"><span class="bc-title">{{book_title}}</span><span class="bc-sep"> – </span><span class="bc-author">{{book_author}}</span></p>
      <p class="bc-desc">{{book_desc}}</p>
    </div>
  </a>
-->

<main class="flex-1 py-4 md:py-6 md:px-8 lg:px-16 min-h-[calc(100vh-3.5rem)] min-w-0 overflow-hidden">

  <!-- সর্বশেষ বই -->
  <section class="book-section">
    <div class="bc-section-header">
      <h2 class="bc-section-title">সর্বশেষ বই</h2>
    </div>
    <div class="bc-list">{{latest_books}}</div>
  </section>

</main>
