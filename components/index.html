<!-- components/index.html — homepage content + সব styling এখানে -->
<style>
  /* Section */
  .book-section { padding: 0.75rem 0.5rem; margin-bottom: 0.5rem; }
  @media (min-width: 768px) { .book-section { margin-left: 0.5rem; margin-right: 0.5rem; padding: 0.75rem 0.4rem; } }

  /* Section header */
  .bc-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
    padding: 0 1rem;
  }
  @media (min-width: 768px) { .bc-section-header { padding: 0 1.5rem; } }

  /* Title + extending line */
  .bc-section-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #1f2937;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    width: 100%;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  .bc-section-title::after {
    content: '';
    flex: 1;
    height: 2px;
    background: #c0392b;
    border-radius: 1px;
  }
  .dark .bc-section-title { color: #f3f4f6; }
  .dark .bc-section-title::after { background: #f87171; }

  /* "সব দেখুন" pill button */
  .bc-section-link {
    font-size: 0.72rem;
    font-weight: 600;
    color: #fff;
    background: #7a3b1e;
    text-decoration: none;
    padding: 0.3rem 0.75rem;
    border-radius: 0.25rem;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .bc-section-link:hover { background: #5c2b14; }
  .dark .bc-section-link { background: #92400e; }
  .dark .bc-section-link:hover { background: #78350f; }

  /* Pagination */
  .bc-pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.35rem;
    padding: 0.6rem 1rem 0.2rem;
    flex-wrap: wrap;
  }
  .bc-page-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.1rem;
    height: 2.1rem;
    padding: 0 0.5rem;
    border-radius: 0.3rem;
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    color: #374151;
    background: #f3f4f6;
    transition: background 0.15s, color 0.15s;
  }
  .bc-page-btn:hover { background: #e5e7eb; color: #111827; }
  .bc-page-btn.active { background: #c0392b; color: #fff; pointer-events: none; }
  .bc-page-nav {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0 0.75rem;
    height: 2.1rem;
    border-radius: 0.3rem;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    background: #c0392b;
    transition: background 0.15s;
  }
  .bc-page-nav:hover { background: #991b1b; }
  .dark .bc-page-btn { background: #1f2937; color: #d1d5db; }
  .dark .bc-page-btn:hover { background: #374151; color: #f9fafb; }
  .dark .bc-page-btn.active { background: #f87171; color: #111827; }
  .dark .bc-page-nav { background: #f87171; color: #111827; }
  .dark .bc-page-nav:hover { background: #ef4444; }
</style>

{{book_card_styles}}

<main class="flex-1 py-4 md:py-6 md:px-8 lg:px-16 min-h-[calc(100vh-3.5rem)] min-w-0 overflow-hidden">

  <!-- সর্বশেষ বই -->
  <section class="book-section">
    <div style="padding:0.45rem 1rem;background:#c0392b;font-size:1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem;border-radius:5px;">
      <span style="color:#fff;font-weight:700;letter-spacing:0.01em;"><i class="fa-solid fa-clock-rotate-left"></i> সর্বশেষ বই</span>
      <span style="background:rgba(255,255,255,0.18);color:#fff;font-weight:600;font-size:0.78rem;padding:0.15rem 0.6rem;">{{total_books_bn}} টি বই</span>
    </div>
    <div class="bc-list">{{latest_books}}</div>
  </section>

  <div id="bc-load-more-wrap" style="text-align:center;padding:1rem 0;"></div>
  <script>
    (function() {
      const total = parseInt('{{total_pages}}', 10);
      let current = parseInt('{{current_page}}', 10);
      if (!current || !total || total <= 1) return;

      const wrap = document.getElementById('bc-load-more-wrap');
      const bcList = document.querySelector('.book-section .bc-list');
      let loading = false;
      let observer = null;

      function renderLoading() {
        wrap.innerHTML = '<span style="display:inline-flex;align-items:center;gap:0.5rem;color:#c0392b;font-weight:600;font-size:0.95rem;"><i class="fa-solid fa-spinner fa-spin"></i> লোড হচ্ছে...</span>';
      }

      function renderRetry() {
        wrap.innerHTML = '<button id="bc-retry-btn" type="button" style="display:inline-flex;align-items:center;gap:0.5rem;background:#c0392b;color:#fff;font-weight:600;font-size:0.95rem;padding:0.6rem 1.5rem;border:none;border-radius:5px;cursor:pointer;">আবার চেষ্টা করুন <i class="fa-solid fa-rotate-right"></i></button>';
        document.getElementById('bc-retry-btn').addEventListener('click', loadNextPage);
      }

      function loadNextPage() {
        if (loading || current >= total) return;
        loading = true;
        renderLoading();

        const nextPage = current + 1;
        const url = '/books/' + nextPage + '/';

        fetch(url)
          .then(function(res) {
            if (!res.ok) throw new Error('load failed');
            return res.text();
          })
          .then(function(html) {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const nextList = doc.querySelector('.book-section .bc-list');
            if (nextList) {
              bcList.insertAdjacentHTML('beforeend', nextList.innerHTML);
            }
            current = nextPage;
            loading = false;
            if (current >= total) {
              wrap.innerHTML = '';
              if (observer) observer.disconnect();
            } else {
              wrap.innerHTML = '';
            }
          })
          .catch(function() {
            loading = false;
            renderRetry();
          });
      }

      if ('IntersectionObserver' in window) {
        observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) loadNextPage();
          });
        }, { rootMargin: '400px 0px' });
        observer.observe(wrap);
      } else {
        window.addEventListener('scroll', function() {
          if (loading || current >= total) return;
          const rect = wrap.getBoundingClientRect();
          if (rect.top < window.innerHeight + 400) loadNextPage();
        });
      }
    })();
  </script>
