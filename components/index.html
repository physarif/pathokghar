<!-- components/index.html — homepage content + সব styling এখানে -->
<style>
  /* Section */
  .book-section { padding: 1.5rem 0; margin-bottom: 0.5rem; }

  .bc-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    padding: 0 1rem;
  }
  @media (min-width: 768px) { .bc-section-header { padding: 0 1.5rem; } }

  .bc-section-title { font-size: 0.875rem; font-weight: 700; color: #1f2937; }
  .dark .bc-section-title { color: #f3f4f6; }

  .bc-section-link { font-size: 0.75rem; color: #2563eb; text-decoration: none; }
  .dark .bc-section-link { color: #60a5fa; }
  .bc-section-link:hover { text-decoration: underline; }

  /* Scroll container */
  .bc-scroll {
    display: flex;
    gap: 0.75rem;
    overflow-x: auto;
    padding: 0 1rem 0.75rem;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  @media (min-width: 768px) { .bc-scroll { padding: 0 1.5rem 0.75rem; } }
  .bc-scroll::-webkit-scrollbar { display: none; }

  /* Book card */
  .bc-card {
    flex-shrink: 0;
    width: 5.5rem;
    display: flex;
    flex-direction: column;
    text-decoration: none;
  }
  @media (min-width: 768px) { .bc-card { width: 6.5rem; } }

  /* Cover — 2:3 (standard book ratio) */
  .bc-img-wrap {
    width: 100%;
    aspect-ratio: 2/3;
    border-radius: 0.5rem;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    background: #e5e7eb;
  }
  .dark .bc-img-wrap { background: #374151; }

  .bc-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Title — Author নিচে */
  .bc-meta {
    margin-top: 0.35rem;
    padding: 0.3rem 0.35rem 0.35rem;
    font-size: 0.65rem;
    line-height: 1.35;
    color: #374151;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    background: #fff;
    border-radius: 0.35rem;
  }
  .dark .bc-meta {
    color: #d1d5db;
    background: #1f2937;
  }

  .bc-meta-title { font-weight: 700; }

  .bc-meta-sep {
    font-weight: 400;
    color: #6b7280;
  }
  .dark .bc-meta-sep { color: #9ca3af; }

  .bc-meta-author {
    font-weight: 400;
    color: #6b7280;
  }
  .dark .bc-meta-author { color: #9ca3af; }

</style>

<main class="flex-1 py-4 md:py-6 min-h-[calc(100vh-3.5rem)] min-w-0 overflow-hidden">

  <!-- সর্বশেষ বই -->
  <section class="book-section">
    <div class="bc-section-header">
      <h2 class="bc-section-title">সর্বশেষ বই</h2>
      <a href="new.html" class="bc-section-link">সব দেখুন →</a>
    </div>
    <div class="bc-scroll">{{latest_books}}</div>
  </section>

  <!-- Category sections -->
  {{category_sections}}

</main>

<script>
  const lightBgs = ['#eff6ff','#f5f3ff','#f0fdf4','#fffbeb','#fff1f2','#ecfeff'];
  const darkBgs  = ['#1e2a3a','#1e1a2e','#1a2e1e','#2e2a1a','#2e1a1e','#1a2a2e'];

  const isDark = () => document.documentElement.classList.contains('dark');

  function applyBgs() {
    document.querySelectorAll('.book-section').forEach((s, i) => {
      s.style.backgroundColor = isDark() ? darkBgs[i % darkBgs.length] : lightBgs[i % lightBgs.length];
    });
  }

  applyBgs();
  new MutationObserver(applyBgs).observe(document.documentElement, { attributeFilter: ['class'] });
</script>
