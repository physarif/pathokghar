<!-- components/index.html — homepage content + সব styling এখানে -->
<style>
  /* Section */
  .book-section { padding: 0.75rem 0; margin-bottom: 0.5rem; }
  @media (min-width: 768px) { .book-section { margin-left: 0.5rem; margin-right: 0.5rem; } }

  /* Section header */
  .bc-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
    padding: 0 1rem;
  }
  @media (min-width: 768px) { .bc-section-header { padding: 0 1.5rem; } }

  /* Title with green bottom border — ছবির মতো */
  .bc-section-title {
    font-size: 1rem;
    font-weight: 700;
    color: #1f2937;
    padding-bottom: 0.3rem;
    border-bottom: 2.5px solid #16a34a;
    display: inline-block;
    letter-spacing: 0.02em;
  }
  .dark .bc-section-title { color: #f3f4f6; }

  /* "সব দেখুন" pill button */
  .bc-section-link {
    font-size: 0.72rem;
    font-weight: 600;
    color: #fff;
    background: #7a3b1e;
    text-decoration: none;
    padding: 0.3rem 0.75rem;
    border-radius: 0.25rem;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .bc-section-link:hover { background: #5c2b14; }
  .dark .bc-section-link { background: #92400e; }
  .dark .bc-section-link:hover { background: #78350f; }

  /* List container */
  .bc-list {
    display: flex;
    flex-direction: column;
    padding: 0 1rem;
  }
  @media (min-width: 768px) { .bc-list { padding: 0 1.5rem; } }

  /* Separator line between cards */
  .bc-card + .bc-card {
    border-top: 1px solid #e5e7eb;
  }
  .dark .bc-card + .bc-card {
    border-top-color: #374151;
  }

  /* Book card — horizontal list style */
  .bc-card {
    display: flex;
    flex-direction: row;
    gap: 0.85rem;
    align-items: flex-start;
    text-decoration: none;
    padding: 0.75rem 0;
    transition: background 0.1s;
  }
  .bc-card:hover { background: transparent; }

  /* Cover — left side, fixed size 2:3 ratio */
  .bc-img-wrap {
    flex-shrink: 0;
    width: 4.2rem;
    aspect-ratio: 2/3;
    border-radius: 0.25rem;
    overflow: hidden;
    background: #e5e7eb;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  @media (min-width: 768px) { .bc-img-wrap { width: 5rem; } }
  .dark .bc-img-wrap { background: #374151; }

  .bc-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.2s;
  }
  .bc-card:hover .bc-img { transform: scale(1.04); }

  /* Right side text */
  .bc-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  /* Title */
  .bc-meta {
    font-size: 0.88rem;
    font-weight: 700;
    line-height: 1.35;
    color: #16a34a;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .dark .bc-meta { color: #4ade80; }
  .bc-card:hover .bc-meta { color: #15803d; }
  .dark .bc-card:hover .bc-meta { color: #86efac; }

  /* Author */
  .bc-author {
    font-size: 0.72rem;
    color: #6b7280;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dark .bc-author { color: #9ca3af; }

  /* Description — 3 lines */
  .bc-desc {
    margin-top: 0.25rem;
    font-size: 0.73rem;
    color: #4b5563;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .dark .bc-desc { color: #9ca3af; }
</style>

<main class="flex-1 py-4 md:py-6 md:px-8 lg:px-16 min-h-[calc(100vh-3.5rem)] min-w-0 overflow-hidden">

  <!-- সর্বশেষ বই -->
  <section class="book-section">
    <div class="bc-section-header">
      <h2 class="bc-section-title">MOST VIEW BOOKS</h2>
      <a href="new.html" class="bc-section-link">সব দেখুন</a>
    </div>
    <div class="bc-list">{{latest_books}}</div>
  </section>

</main>
