<!-- components/index.html — homepage content + সব styling এখানে -->
<style>
  /* Section */
  .book-section { padding: 0.75rem 0.5rem; margin-bottom: 0.5rem; }
  @media (min-width: 768px) { .book-section { margin-left: 0.5rem; margin-right: 0.5rem; padding: 0.75rem 0.4rem; } }

  /* Section header */
  .bc-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
    padding: 0 1rem;
  }
  @media (min-width: 768px) { .bc-section-header { padding: 0 1.5rem; } }

  /* Title + extending line */
  .bc-section-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #f3f4f6;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    width: 100%;
    letter-spacing: 0.02em;
    line-height: 1.2;
  }
  .bc-section-title::after {
    content: '';
    flex: 1;
    height: 2px;
    background: #9ca3af;
    border-radius: 1px;
  }

  /* "সব দেখুন" pill button */
  .bc-section-link {
    font-size: 0.72rem;
    font-weight: 600;
    color: #fff;
    background: #45464c;
    text-decoration: none;
    padding: 0.3rem 0.75rem;
    border-radius: 0.25rem;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .bc-section-link:hover { background: #55565c; }

  /* Pagination */
  .bc-pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.3rem;
    padding: 0.6rem 0.5rem 0.2rem;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .bc-page-numbers {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    flex-wrap: nowrap;
    overflow: hidden;
  }
  .bc-page-btn, .bc-page-nav, .bc-page-dots { flex-shrink: 0; }
  .bc-page-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.4rem;
    height: 2.4rem;
    padding: 0 0.5rem;
    border-radius: 0.3rem;
    font-size: 0.95rem;
    font-weight: 500;
    text-decoration: none;
    color: #d1d5db;
    background: #333439;
    border: 1px solid #333439;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .bc-page-btn:hover { background: #3d3e44; color: #f9fafb; }
  .bc-page-btn.active { background: #45464c; border-color: #f9fafb; color: #f9fafb; pointer-events: none; }
  .bc-page-dots {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 1.4rem;
    height: 2.4rem;
    color: #6b7280;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .bc-page-nav {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.4rem;
    height: 2.4rem;
    padding: 0 0.5rem;
    border-radius: 0.3rem;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    color: #f9fafb;
    background: #45464c;
    border: 1px solid #45464c;
    transition: background 0.15s;
  }
  .bc-page-nav:hover { background: #55565c; }
  .bc-page-nav.disabled { background: #333439; border-color: #333439; color: #6b7280; pointer-events: none; cursor: default; }

  /* সর্বশেষ বই — title with accented progress-style underline */
  .bc-latest-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1.1rem;
    font-weight: 700;
    color: #f5f5f5;
    margin-bottom: 1rem;
    letter-spacing: 0.01em;
  }
  .bc-latest-title i { color: #45464c; font-size: 1rem; }
  .bc-latest-title::after {
    content: '';
    flex: 1;
    height: 6px;
    border-radius: 1px;
    background: linear-gradient(to right, #f5f5f5 0%, #6b7280 100%);
  }

  /* পেজ কনটেন্ট wrapper */
  .page-content {
    flex: 1 1 auto;
    min-width: 0;
    padding: 0.5rem 0;
    overflow: hidden;
    min-height: calc(100vh - 3.5rem);
  }
  @media (min-width: 768px) { .page-content { padding: 1.5rem 2rem; } }
  @media (min-width: 1024px) { .page-content { padding-left: 4rem; padding-right: 4rem; } }
</style>

{{book_card_styles}}

<main class="page-content">

  <!-- সর্বশেষ বই -->
  <section class="book-section">
    <div class="bc-list">{{latest_books}}</div>
  </section>

  <div id="bc-pagination"></div>
  <script>
    (function() {
      const current = parseInt('{{current_page}}', 10);
      const total = parseInt('{{total_pages}}', 10);
      if (!current || !total || total <= 1) return;
      const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
      const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
      const el = document.getElementById('bc-pagination');

      function getFrontCount() {
        const w = window.innerWidth;
        if (w < 360) return 2;
        if (w < 420) return 3;
        return 4;
      }

      function buildList() {
        const frontCount = Math.min(getFrontCount(), total - 1);
        const front = [];
        for (let i = 1; i <= frontCount; i++) front.push(i);
        if (frontCount >= total - 1) {
          const result = front.slice();
          for (let i = frontCount + 1; i <= total; i++) result.push(i);
          return result;
        }
        return front.concat(['...', total]);
      }

      function render() {
        const list = buildList();
        let html = '<div class="bc-pagination">';
        if (current > 1) {
          const prev = current === 2 ? '/' : '/books/' + (current - 1) + '/';
          html += '<a href="' + prev + '" class="bc-page-nav" aria-label="পূর্ববর্তী"><i class="fas fa-chevron-left"></i></a>';
        } else {
          html += '<span class="bc-page-nav disabled" aria-label="পূর্ববর্তী"><i class="fas fa-chevron-left"></i></span>';
        }
        html += '<div class="bc-page-numbers">';
        list.forEach(function(i) {
          if (i === '...') { html += '<span class="bc-page-dots">···</span>'; return; }
          const href = i === 1 ? '/' : '/books/' + i + '/';
          if (i === current) html += '<span class="bc-page-btn active">' + toBn(i) + '</span>';
          else html += '<a href="' + href + '" class="bc-page-btn">' + toBn(i) + '</a>';
        });
        html += '</div>';
        if (current < total) {
          html += '<a href="/books/' + (current + 1) + '/" class="bc-page-nav" aria-label="পরবর্তী"><i class="fas fa-chevron-right"></i></a>';
        } else {
          html += '<span class="bc-page-nav disabled" aria-label="পরবর্তী"><i class="fas fa-chevron-right"></i></span>';
        }
        html += '</div>';
        el.innerHTML = html;
      }

      render();
      let resizeTimer;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 150);
      });
    })();
  </script>
