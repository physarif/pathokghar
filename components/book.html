<!-- templates/book.html — শুধু content, layout.html এ inject হবে -->
<main class="flex-1 p-4 md:p-6 min-h-[calc(100vh-3.5rem)]">
    <div class="max-w-3xl mx-auto">

        <!-- Book Info Card -->
        <div class="bg-white dark:bg-[#2d2d2d] rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
            <!-- Mobile: cover full-width gradient top -->
            <div class="flex justify-center py-8 bg-red-50 dark:bg-[#2d1a0e] md:hidden">
                <img src="{{book_cover}}"
                    alt="{{book_title}}"
                    class="w-40 rounded shadow-md object-cover aspect-[2/3]" style="box-shadow: 0 8px 32px rgba(192,57,43,0.18), 0 2px 8px rgba(0,0,0,0.10);">
            </div>

            <!-- Desktop: full card left-to-right gradient -->
            <style>.book-card-desktop{background:linear-gradient(to right,#fff5f5 0%,#fff5f5 25%,white 65%)}.dark .book-card-desktop{background:linear-gradient(to right,#2d1a0e 0%,#2d1a0e 25%,#2d2d2d 65%)}</style>
            <div class="hidden md:flex flex-row gap-7 book-card-desktop" style="border-radius:inherit;">
                <!-- Cover -->
                <div class="flex justify-start shrink-0 p-6">
                    <img src="{{book_cover}}"
                        alt="{{book_title}}"
                        class="w-36 rounded shadow-md object-cover aspect-[2/3]" style="box-shadow: 0 8px 32px rgba(192,57,43,0.18), 0 2px 8px rgba(0,0,0,0.10);">
                </div>

                <!-- Info -->
                <div class="flex flex-col justify-between flex-1 min-w-0 py-6 pr-6">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100 leading-snug text-left">
                            {{book_title}}
                        </h1>
                        <a href="/author/{{book_author_slug}}.html"
                            class="inline-block mt-1.5 text-sm text-red-600 dark:text-red-400 hover:underline w-full text-left">
                            {{book_author}}
                        </a>
                        <div class="flex flex-wrap gap-2 mt-3 justify-start">
                            <a href="/category/{{book_category_slug}}/1/"
                                class="text-xs bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 px-2.5 py-1 rounded-full hover:bg-red-100 transition-colors">
                                {{book_category}}
                            </a>
                            <span class="text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2.5 py-1 rounded-full">
                                {{book_language}}
                            </span>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="flex gap-3 mt-5 justify-start">
                        <a href="/read/{{book_slug}}.html"
                            class="flex items-center gap-2 bg-[#c0392b] hover:bg-[#a93226] text-white text-sm font-medium px-5 py-2 rounded transition-colors">
                            <i class="fas fa-book-open text-xs"></i> পড়ুন
                        </a>
                        <a href="/download/{{book_slug}}.html"
                            class="flex items-center gap-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-sm font-medium px-5 py-2 rounded transition-colors">
                            <i class="fas fa-download text-xs"></i> ডাউনলোড
                        </a>
                    </div>
                </div>
            </div>

            <!-- Mobile: info below cover -->
            <div class="flex flex-col md:hidden p-5 bg-gradient-to-b from-red-50 to-white dark:from-[#2d1a0e] dark:to-[#2d2d2d]">
                <div>
                    <h1 class="text-xl font-bold text-gray-900 dark:text-gray-100 leading-snug text-center">
                        {{book_title}}
                    </h1>
                    <a href="/author/{{book_author_slug}}.html"
                        class="inline-block mt-1.5 text-sm text-red-600 dark:text-red-400 hover:underline w-full text-center">
                        {{book_author}}
                    </a>
                    <div class="flex flex-wrap gap-2 mt-3 justify-center">
                        <a href="/category/{{book_category_slug}}/1/"
                            class="text-xs bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 px-2.5 py-1 rounded-full hover:bg-red-100 transition-colors">
                            {{book_category}}
                        </a>
                        <span class="text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2.5 py-1 rounded-full">
                            {{book_language}}
                        </span>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex gap-3 mt-5 justify-center">
                    <a href="/read/{{book_slug}}.html"
                        class="flex items-center gap-2 bg-[#c0392b] hover:bg-[#a93226] text-white text-sm font-medium px-5 py-2 rounded transition-colors">
                        <i class="fas fa-book-open text-xs"></i> পড়ুন
                    </a>
                    <a href="/download/{{book_slug}}.html"
                        class="flex items-center gap-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-sm font-medium px-5 py-2 rounded transition-colors">
                        <i class="fas fa-download text-xs"></i> ডাউনলোড
                    </a>
                </div>
            </div>
        </div>

        <!-- Description -->
        <div class="mt-4 bg-white dark:bg-[#2d2d2d] rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-5 md:p-6">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-3">বইয়ের বিবরণ</h2>
            <p class="text-sm leading-relaxed text-gray-700 dark:text-gray-300">
                {{book_description}}
            </p>
        </div>

    </div>
</main>
