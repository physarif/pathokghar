<!-- templates/book.html — শুধু content, layout.html এ inject হবে -->
<main class="flex-1 p-4 md:p-6 min-h-[calc(100vh-3.5rem)]">
    <div class="max-w-3xl mx-auto">

        <!-- Book Info Card -->
        <div class="bg-white dark:bg-[#2d2d2d] rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
            <!-- Mobile: cover full-width gradient top -->
            <div class="flex justify-center py-8 bg-gradient-to-b from-blue-50 to-white dark:from-[#1e2d42] dark:to-[#2d2d2d] md:hidden">
                <img src="{{book_cover}}"
                    alt="{{book_title}}"
                    class="w-40 rounded shadow-md object-cover aspect-[2/3]" style="box-shadow: 0 8px 32px rgba(0,86,179,0.18), 0 2px 8px rgba(0,0,0,0.10);">
            </div>

            <div class="flex flex-col md:flex-row gap-0 md:gap-7">

                <!-- Cover Image (desktop only) -->
                <div class="hidden md:flex justify-start shrink-0 p-6 pr-8 bg-gradient-to-r from-blue-50 via-blue-50/60 to-white dark:from-[#1e2d42] dark:via-[#1e2d42]/60 dark:to-[#2d2d2d] rounded-l-lg" style="min-width:200px">
                    <img src="{{book_cover}}"
                        alt="{{book_title}}"
                        class="w-36 rounded shadow-md object-cover aspect-[2/3]" style="box-shadow: 0 8px 32px rgba(0,86,179,0.18), 0 2px 8px rgba(0,0,0,0.10);">
                </div>

                <!-- Info -->
                <div class="flex flex-col justify-between flex-1 min-w-0 p-5 md:py-6 md:pr-6">
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold text-gray-900 dark:text-gray-100 leading-snug text-center md:text-left">
                            {{book_title}}
                        </h1>
                        <a href="/author/{{book_author_slug}}.html"
                            class="inline-block mt-1.5 text-sm text-blue-600 dark:text-blue-400 hover:underline w-full text-center md:text-left">
                            {{book_author}}
                        </a>
                        <div class="flex flex-wrap gap-2 mt-3 justify-center md:justify-start">
                            <a href="/category/{{book_category_slug}}/1/"
                                class="text-xs bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-2.5 py-1 rounded-full hover:bg-blue-100 transition-colors">
                                {{book_category}}
                            </a>
                            <span class="text-xs bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-2.5 py-1 rounded-full">
                                {{book_language}}
                            </span>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="flex gap-3 mt-5 justify-center md:justify-start">
                        <a href="/read/{{book_slug}}.html"
                            class="flex items-center gap-2 bg-[#0056b3] hover:bg-[#004494] text-white text-sm font-medium px-5 py-2 rounded transition-colors">
                            <i class="fas fa-book-open text-xs"></i> পড়ুন
                        </a>
                        <a href="/download/{{book_slug}}.html"
                            class="flex items-center gap-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-sm font-medium px-5 py-2 rounded transition-colors">
                            <i class="fas fa-download text-xs"></i> ডাউনলোড
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Description -->
        <div class="mt-4 bg-white dark:bg-[#2d2d2d] rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-5 md:p-6">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-3">বইয়ের বিবরণ</h2>
            <p class="text-sm leading-relaxed text-gray-700 dark:text-gray-300">
                {{book_description}}
            </p>
        </div>

    </div>
</main>
