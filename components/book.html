<!-- templates/book.html — শুধু content, layout.html এ inject হবে --> 
<main class="flex-1 pt-4 md:pt-6 p-3 md:p-6 min-h-[calc(100vh-3.5rem)]">
    <div class="max-w-3xl mx-auto">

        <!-- Book Hero Card: cover, title, author, category, read ও download
             সবকিছু একত্রে একটা কার্ডে সুন্দরভাবে সাজানো। H1 সিমান্টিকভাবে
             বইয়ের নাম-ই থাকছে (SEO-এর জন্য জরুরি — এটাই পেজের মূল বিষয়)। -->
        <div class="book-hero-card">
            <img src="{{book_cover}}"
                alt="{{book_title}} বই এর কভার - লেখক {{book_author}}"
                fetchpriority="high"
                width="200" height="300"
                class="book-hero-cover">

            <div class="book-hero-body">
                <a href="/category/{{book_category_slug}}/1/" class="book-hero-category">{{book_category}}</a>

                <h1 class="book-hero-title">{{book_title}}</h1>

                <a href="/author/{{book_author_slug}}.html" class="book-hero-author">{{book_author}}</a>

                <hr class="book-hero-rule">

                <div class="book-hero-actions">
                    <a href="{{book_read_href}}"
                        class="book-hero-link book-hero-link-solid {{book_read_disabled}}"
                        aria-disabled="{{book_read_aria_disabled}}">
                        পড়ুন
                    </a>
                    <a href="{{book_download_href}}"
                        class="book-hero-link book-hero-link-outline {{book_download_disabled}}"
                        aria-disabled="{{book_download_aria_disabled}}">
                        ডাউনলোড
                    </a>
                </div>
            </div>
        </div>

        <!-- Description: hero কার্ড থেকে আলাদা, নিজস্ব কার্ডে নিচে -->
        <div class="book-desc-card">
            <h2 class="book-desc-heading">বইয়ের বিবরণ</h2>
            <div id="book-description-mobile" class="prose-book text-base leading-relaxed text-gray-700 dark:text-gray-300 text-justify"></div>
        </div>

        <!-- Structured data: Google-কে বইয়ের নাম, লেখক, কভার স্পষ্টভাবে বুঝিয়ে
             দেয়, rich snippet পাওয়ার সম্ভাবনা বাড়ায় -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Book",
            "name": {{book_title_json}},
            "author": {
                "@type": "Person",
                "name": {{book_author_json}}
            },
            "image": {{book_cover_json}},
            "url": {{book_url_json}},
            "genre": {{book_category_json}},
            "description": {{book_schema_description_json}},
            "inLanguage": "bn"
        }
        </script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
        <script>
            const raw = {{book_description_json}};

            marked.setOptions({
                breaks: true,
                gfm: true,
            });

            // বইয়ের বর্ণনায় কেউ "# হেডিং" লিখলে সেটা যেন আসল <h1>/<h2> না
            // হয় — পেজের একমাত্র H1 তো বইয়ের নাম (উপরে)। heading level ২
            // ধাপ নামিয়ে দেওয়া হচ্ছে। renderer.heading override marked 9.x-এ
            // সঠিকভাবে কাজ করছিল না (ভুল সাইজ/লেভেল দেখাচ্ছিল), তাই এখন
            // walkTokens দিয়ে সরাসরি token.depth পরিবর্তন করা হচ্ছে — এটা
            // marked-এর ভার্সন-নির্বিশেষে নির্ভরযোগ্য।
            marked.use({
                walkTokens(token) {
                    if (token.type === 'heading') {
                        token.depth = Math.min(token.depth + 2, 6);
                    }
                }
            });

            const parsed = marked.parse(raw);
            const mobileEl = document.getElementById('book-description-mobile');
            if (mobileEl) mobileEl.innerHTML = parsed;
        </script>

        <style>
            /* ── Book Hero Card (Editorial Horizontal) ── */
            .book-hero-card {
                display: flex;
                align-items: flex-start;
                gap: 1.1rem;
                text-align: left;
                background: #fff;
                border: 1px solid #e5e7eb;
                border-radius: 10px;
                padding: 1.25rem;
                box-shadow: 0 2px 14px rgba(0,0,0,0.06);
                margin-bottom: 1.25rem;
            }
            .dark .book-hero-card {
                background: #2a2a2b;
                border-color: #3a3a3b;
            }
            .book-hero-cover {
                width: 100px;
                height: 148px;
                border-radius: 8px;
                object-fit: cover;
                background: #e5e7eb;
                flex-shrink: 0;
                box-shadow: 0 10px 22px rgba(0,0,0,0.18);
            }
            .book-hero-body {
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
                min-width: 0;
            }
            .book-hero-category {
                display: inline-block;
                width: fit-content;
                font-family: 'Noto Serif Bengali', serif;
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.02em;
                color: #c0392b;
                background: #fde8e6;
                padding: 0.28rem 0.85rem;
                border-radius: 6px;
                text-decoration: none;
                transition: background 0.15s, color 0.15s;
            }
            .book-hero-category:hover { background: #c0392b; color: #fff; }
            .dark .book-hero-category { background: rgba(192,57,43,0.18); color: #f2938a; }
            .dark .book-hero-category:hover { background: #c0392b; color: #fff; }
            .book-hero-title {
                font-family: 'Noto Serif Bengali', serif;
                font-size: 1.15rem;
                font-weight: 800;
                color: #1a1a1b;
                line-height: 1.4;
                margin: 0;
            }
            .dark .book-hero-title { color: #f3f4f6; }
            .book-hero-author {
                font-family: 'Noto Serif Bengali', serif;
                font-size: 0.85rem;
                font-weight: 600;
                color: #6b7280;
                text-decoration: none;
                transition: color 0.15s;
            }
            .book-hero-author:hover { color: #c0392b; text-decoration: underline; text-underline-offset: 3px; }
            .dark .book-hero-author { color: #9ca3af; }
            .dark .book-hero-author:hover { color: #f2938a; }
            .book-hero-rule {
                border: none;
                border-top: 1px dashed #f0d3d0;
                margin: 0.25rem 0;
            }
            .dark .book-hero-rule { border-top-color: #4a3232; }
            .book-hero-actions {
                display: flex;
                gap: 0.6rem;
                margin-top: 0.15rem;
            }
            .book-hero-link {
                display: inline-flex;
                align-items: center;
                font-size: 0.8rem;
                font-weight: 700;
                text-decoration: none;
                padding: 0.45rem 1rem;
                border-radius: 8px;
                transition: background 0.15s, color 0.15s, transform 0.1s;
            }
            .book-hero-link:active { transform: scale(0.96); }
            .book-hero-link-solid { background: #c0392b; color: #fff; }
            .book-hero-link-solid:hover { background: #a93226; }
            .dark .book-hero-link-solid { background: #c0392b; color: #fff; }
            .dark .book-hero-link-solid:hover { background: #a93226; }
            .book-hero-link-outline { background: #fff; color: #c0392b; border: 1.5px solid #c0392b; padding: 0.375rem 0.95rem; }
            .book-hero-link-outline:hover { background: #fde8e6; }
            .dark .book-hero-link-outline { background: transparent; color: #f2938a; border-color: #a93226; }
            .dark .book-hero-link-outline:hover { background: rgba(192,57,43,0.15); }

            /* ── Description Card ── */
            .book-desc-card {
                background: #fff;
                border: 1px solid #e5e7eb;
                border-radius: 10px;
                padding: 1.1rem 1.25rem 1.3rem;
                box-shadow: 0 2px 14px rgba(0,0,0,0.06);
            }
            .dark .book-desc-card {
                background: #2a2a2b;
                border-color: #3a3a3b;
            }
            .book-desc-heading {
                font-family: 'Noto Serif Bengali', serif;
                font-size: 1rem;
                font-weight: 800;
                color: #1a1a1b;
                margin: 0 0 0.75rem;
                padding-bottom: 0.6rem;
                border-bottom: 1px solid #f0f0f0;
            }
            .dark .book-desc-heading {
                color: #f3f4f6;
                border-bottom-color: #3a3a3b;
            }
        </style>

        <style>
            .btn-unclick {
                pointer-events: none;
                cursor: not-allowed;
                color: #9ca3af !important;
                background: repeating-linear-gradient(
                    -45deg,
                    #e5e7eb,
                    #e5e7eb 6px,
                    #f3f4f6 6px,
                    #f3f4f6 12px
                ) !important;
            }
            .dark .btn-unclick {
                color: #6b7280 !important;
                background: repeating-linear-gradient(
                    -45deg,
                    #374151,
                    #374151 6px,
                    #4b5563 6px,
                    #4b5563 12px
                ) !important;
            }
        </style>

        <style>
            .prose-book h1, .prose-book h2, .prose-book h3,
            .prose-book h4, .prose-book h5, .prose-book h6 {
                font-weight: 700;
                line-height: 1.3;
                margin-top: 1.25em;
                margin-bottom: 0.4em;
                color: #111827;
            }
            .dark .prose-book h1, .dark .prose-book h2, .dark .prose-book h3,
            .dark .prose-book h4, .dark .prose-book h5, .dark .prose-book h6 {
                color: #f3f4f6;
            }
            .prose-book h1 { font-size: 1.4em; }
            .prose-book h2 { font-size: 1.2em; }
            .prose-book h3 { font-size: 1.05em; }
            .prose-book h4, .prose-book h5, .prose-book h6 { font-size: 0.95em; }

            .prose-book p { margin-bottom: 0.75em; }

            .prose-book a {
                color: #c0392b;
                text-decoration: underline;
            }
            .dark .prose-book a { color: #f87171; }

            .prose-book strong { font-weight: 700; color: #111827; }
            .dark .prose-book strong { color: #f9fafb; }

            .prose-book em { font-style: italic; }

            .prose-book ul, .prose-book ol {
                padding-left: 1.5em;
                margin-bottom: 0.75em;
            }
            .prose-book ul { list-style-type: disc; }
            .prose-book ol { list-style-type: decimal; }
            .prose-book li { margin-bottom: 0.25em; }

            .prose-book blockquote {
                border-left: 3px solid #c0392b;
                padding: 0.4em 0.9em;
                margin: 0.75em 0;
                color: #6b7280;
                font-style: italic;
                background: #fef2f2;
                border-radius: 0 4px 4px 0;
            }
            .dark .prose-book blockquote {
                background: #3b1f1f;
                color: #d1d5db;
                border-left-color: #f87171;
            }

            .prose-book code {
                background: #f3f4f6;
                color: #c0392b;
                padding: 0.1em 0.35em;
                border-radius: 3px;
                font-size: 0.88em;
                font-family: monospace;
            }
            .dark .prose-book code {
                background: #374151;
                color: #fca5a5;
            }

            .prose-book pre {
                background: #1f2937;
                color: #e5e7eb;
                padding: 1em;
                border-radius: 6px;
                overflow-x: auto;
                margin-bottom: 0.75em;
                font-size: 0.85em;
                font-family: monospace;
            }
            .prose-book pre code {
                background: none;
                color: inherit;
                padding: 0;
                font-size: inherit;
            }

            .prose-book table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 0.75em;
                font-size: 0.9em;
            }
            .prose-book th {
                background: #f9fafb;
                font-weight: 600;
                text-align: left;
                padding: 0.5em 0.75em;
                border: 1px solid #e5e7eb;
                color: #374151;
            }
            .dark .prose-book th {
                background: #374151;
                border-color: #4b5563;
                color: #f3f4f6;
            }
            .prose-book td {
                padding: 0.45em 0.75em;
                border: 1px solid #e5e7eb;
            }
            .dark .prose-book td { border-color: #4b5563; }
            .prose-book tr:nth-child(even) { background: #f9fafb; }
            .dark .prose-book tr:nth-child(even) { background: #2d3748; }

            .prose-book hr {
                border: none;
                border-top: 1px solid #e5e7eb;
                margin: 1.25em 0;
            }
            .dark .prose-book hr { border-top-color: #4b5563; }

            .prose-book img {
                max-width: 100%;
                border-radius: 6px;
                margin: 0.5em 0;
            }

            .prose-book del { text-decoration: line-through; color: #9ca3af; }

            .prose-book input[type="checkbox"] {
                margin-right: 0.4em;
                accent-color: #c0392b;
            }
        </style>

    </div>
</main>
