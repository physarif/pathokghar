<!-- templates/book.html — শুধু content, layout.html এ inject হবে -->
<main class="book-page">
    <div class="book-page-inner">

        <!-- Book Hero Card: cover, title, author, category, read ও download
             সবকিছু একত্রে একটা কার্ডে সুন্দরভাবে সাজানো। H1 সিমান্টিকভাবে
             বইয়ের নাম-ই থাকছে (SEO-এর জন্য জরুরি — এটাই পেজের মূল বিষয়)। -->
        <div class="book-hero-card">
            <img src="{{book_cover}}"
                alt="{{book_title}} বই এর কভার - লেখক {{book_author}}"
                fetchpriority="high"
                width="100" height="148"
                class="book-hero-cover">

            <div class="book-hero-body">
                <a href="/category/{{book_category_slug}}/" class="book-hero-category">{{book_category}}</a>

                <h1 class="book-hero-title">{{book_title}}</h1>

                <a href="/author/{{book_author_slug}}.html" class="book-hero-author">{{book_author}}</a>

                <hr class="book-hero-rule">

                <div class="book-hero-actions">
                    <a href="{{book_read_href}}"
                        class="book-hero-link book-hero-link-solid {{book_read_disabled}}"
                        aria-disabled="{{book_read_aria_disabled}}">
                        পড়ুন
                    </a>
                    <a href="{{book_download_href}}"
                        class="book-hero-link book-hero-link-outline {{book_download_disabled}}"
                        aria-disabled="{{book_download_aria_disabled}}">
                        ডাউনলোড
                    </a>
                </div>
            </div>
        </div>

        <!-- Description: hero কার্ড থেকে আলাদা, নিজস্ব কার্ডে নিচে -->
        <div class="book-desc-card">
            <h2 class="book-desc-heading">বইয়ের বিবরণ</h2>
            <div id="book-description-mobile" class="prose-book"></div>
        </div>

        <!-- Structured data: Google-কে বইয়ের নাম, লেখক, কভার স্পষ্টভাবে বুঝিয়ে
             দেয়, rich snippet পাওয়ার সম্ভাবনা বাড়ায় -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Book",
            "name": {{book_title_json}},
            "author": {
                "@type": "Person",
                "name": {{book_author_json}}
            },
            "image": {{book_cover_json}},
            "url": {{book_url_json}},
            "genre": {{book_category_json}},
            "description": {{book_schema_description_json}},
            "inLanguage": "bn"
        }
        </script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
        <script>
            const raw = {{book_description_json}};

            marked.setOptions({
                breaks: true,
                gfm: true,
            });

            // বইয়ের বর্ণনায় কেউ "# হেডিং" লিখলে সেটা যেন আসল <h1>/<h2> না
            // হয় — পেজের একমাত্র H1 তো বইয়ের নাম (উপরে)। heading level ২
            // ধাপ নামিয়ে দেওয়া হচ্ছে। renderer.heading override marked 9.x-এ
            // সঠিকভাবে কাজ করছিল না (ভুল সাইজ/লেভেল দেখাচ্ছিল), তাই এখন
            // walkTokens দিয়ে সরাসরি token.depth পরিবর্তন করা হচ্ছে — এটা
            // marked-এর ভার্সন-নির্বিশেষে নির্ভরযোগ্য।
            marked.use({
                walkTokens(token) {
                    if (token.type === 'heading') {
                        token.depth = Math.min(token.depth + 2, 6);
                    }
                }
            });

            const parsed = marked.parse(raw);
            const mobileEl = document.getElementById('book-description-mobile');
            if (mobileEl) mobileEl.innerHTML = parsed;
        </script>

        <style>
            /* ── Page layout ── */
            .book-page {
                flex: 1 1 auto;
                padding: 1rem 0.75rem;
                min-height: calc(100vh - 3.5rem);
            }
            @media (min-width: 768px) { .book-page { padding: 1.5rem; } }
            .book-page-inner { max-width: 48rem; margin: 0 auto; }
            #book-description-mobile {
                font-size: 1rem;
                line-height: 1.625;
                color: #6b7280;
                text-align: justify;
            }

            /* ── Book Hero Card (Editorial Horizontal) ── */
            .book-hero-card {
                display: flex;
                align-items: flex-start;
                gap: 1.1rem;
                text-align: left;
                background: #ffffff;
                border-radius: 5px;
                padding: 1.25rem;
                margin-bottom: 0.65rem;
            }
            .book-hero-cover {
                width: 100px;
                height: 148px;
                border-radius: 4px;
                object-fit: cover;
                background: #e5e7eb;
                flex-shrink: 0;
                box-shadow: 0 10px 22px rgba(17,24,39,0.12);
            }
            .book-hero-body {
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
                min-width: 0;
            }
            .book-hero-category {
                display: inline-block;
                width: fit-content;
                font-family: 'Noto Serif Bengali', serif;
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.02em;
                background: #F0F3F8;
                color: #0B57CF;
                padding: 0.28rem 0.85rem;
                border-radius: 4px;
                text-decoration: none;
                transition: background 0.15s, color 0.15s;
            }
            .book-hero-category:hover { background: #C2D7FC; color: #0B57CF; }
            .book-hero-title {
                font-family: 'Noto Serif Bengali', serif;
                font-size: 1.15rem;
                font-weight: 600;
                color: #1f2937;
                line-height: 1.4;
                margin: 0;
            }
            .book-hero-author {
                font-family: 'Noto Serif Bengali', serif;
                font-size: 0.85rem;
                font-weight: 600;
                color: #6b7280;
                text-decoration: none;
                transition: color 0.15s;
            }
            .book-hero-author:hover { color: #0B57CF; text-decoration: underline; text-underline-offset: 3px; }
            .book-hero-rule {
                border: none;
                border-top: 1px dashed #e5e7eb;
                margin: 0.25rem 0;
            }
            .book-hero-actions {
                display: flex;
                gap: 0.6rem;
                margin-top: 0.15rem;
            }
            .book-hero-link {
                display: inline-flex;
                align-items: center;
                font-size: 0.8rem;
                font-weight: 700;
                text-decoration: none;
                padding: 0.45rem 1rem;
                border-radius: 5px;
                transition: background 0.15s, color 0.15s;
            }
            .book-hero-link-solid { background: #0B57CF; color: #fff; }
            .book-hero-link-solid:hover { background: #094aad; }
            .book-hero-link-outline { background: transparent; color: #1f2937; border: 1.5px solid #e5e7eb; padding: 0.375rem 0.95rem; }
            .book-hero-link-outline:hover { background: #F0F3F8; }

            /* ── Description Card ── */
            .book-desc-card {
                background: #ffffff;
                border-radius: 5px;
                padding: 1.1rem 1.25rem 1.3rem;
            }
            .book-desc-heading {
                font-family: 'Noto Serif Bengali', serif;
                font-size: 1rem;
                font-weight: 800;
                color: #1f2937;
                margin: 0 0 0.75rem;
                padding-bottom: 0.6rem;
                border-bottom: 1px solid #e5e7eb;
            }
        </style>

        <style>
            .btn-unclick {
                pointer-events: none;
                cursor: not-allowed;
                color: #9ca3af !important;
                background: repeating-linear-gradient(
                    -45deg,
                    #e5e7eb,
                    #e5e7eb 6px,
                    #d1d5db 6px,
                    #d1d5db 12px
                ) !important;
            }
        </style>

        <style>
            .prose-book h1, .prose-book h2, .prose-book h3,
            .prose-book h4, .prose-book h5, .prose-book h6 {
                font-weight: 700;
                line-height: 1.3;
                margin-top: 1.25em;
                margin-bottom: 0.4em;
                color: #1f2937;
            }
            .prose-book h1 { font-size: 1.4em; }
            .prose-book h2 { font-size: 1.2em; }
            .prose-book h3 { font-size: 1.05em; }
            .prose-book h4, .prose-book h5, .prose-book h6 { font-size: 0.95em; }

            .prose-book p { margin-bottom: 0.75em; }

            .prose-book a {
                color: #0B57CF;
                text-decoration: underline;
            }

            .prose-book strong { font-weight: 500; color: #1f2937; }

            .prose-book em { font-style: italic; }

            .prose-book ul, .prose-book ol {
                padding-left: 1.5em;
                margin-bottom: 0.75em;
            }
            .prose-book ul { list-style-type: disc; }
            .prose-book ol { list-style-type: decimal; }
            .prose-book li { margin-bottom: 0.25em; }

            .prose-book blockquote {
                border-left: 3px solid #6b7280;
                padding: 0.4em 0.9em;
                margin: 0.75em 0;
                color: #4b5563;
                font-style: italic;
                background: #F0F3F8;
                border-radius: 0 4px 4px 0;
            }

            .prose-book code {
                background: #e5e7eb;
                color: #1f2937;
                padding: 0.1em 0.35em;
                border-radius: 3px;
                font-size: 0.88em;
                font-family: monospace;
            }

            .prose-book pre {
                background: #F0F3F8;
                color: #1f2937;
                padding: 1em;
                border-radius: 6px;
                overflow-x: auto;
                margin-bottom: 0.75em;
                font-size: 0.85em;
                font-family: monospace;
            }
            .prose-book pre code {
                background: none;
                color: inherit;
                padding: 0;
                font-size: inherit;
            }

            .prose-book table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 0.75em;
                font-size: 0.9em;
            }
            .prose-book th {
                background: #e5e7eb;
                font-weight: 600;
                text-align: left;
                padding: 0.5em 0.75em;
                border: 1px solid #e5e7eb;
                color: #1f2937;
            }
            .prose-book td {
                padding: 0.45em 0.75em;
                border: 1px solid #e5e7eb;
            }
            .prose-book tr:nth-child(even) { background: #F0F3F8; }

            .prose-book hr {
                border: none;
                border-top: 1px solid #e5e7eb;
                margin: 1.25em 0;
            }

            .prose-book img {
                max-width: 100%;
                border-radius: 6px;
                margin: 0.5em 0;
            }

            .prose-book del { text-decoration: line-through; color: #9ca3af; }

            .prose-book input[type="checkbox"] {
                margin-right: 0.4em;
                accent-color: #0B57CF;
            }
        </style>

    </div>

    <script>
    (function() {
      // সম্প্রতি দেখা বই — হোমপেজে "সম্প্রতি দেখেছেন" স্ট্রিপে দেখানোর জন্য
      try {
        var entry = {
          slug: "{{book_slug}}",
          title: {{book_title_json}},
          cover: {{book_cover_json}}
        };
        var recent = JSON.parse(localStorage.getItem('pg-recent-books') || '[]');
        recent = recent.filter(function(b) { return b.slug !== entry.slug; });
        recent.unshift(entry);
        recent = recent.slice(0, 12);
        localStorage.setItem('pg-recent-books', JSON.stringify(recent));
      } catch (e) {}
    })();
    </script>
</main>
