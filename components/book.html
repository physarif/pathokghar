<!-- templates/book.html — শুধু content, layout.html এ inject হবে --> 
<main class="flex-1 p-0 md:p-6 min-h-[calc(100vh-3.5rem)]">
    <div class="max-w-3xl mx-auto">

        <!-- Book Header Bar -->
        <div style="padding:0.6rem 1rem;border-bottom:1px solid #e5e7eb;background:#fff;font-family:'Noto Serif Bengali',serif;font-size:1.1rem;font-weight:800;line-height:1.4;" class="dark:bg-[#2d2d2d] dark:border-gray-700">
            <a href="/category/{{book_category_slug}}/1/" style="color:#9ca3af;font-weight:600;text-decoration:none;" onmouseover="this.style.color='#c0392b'" onmouseout="this.style.color='#9ca3af'">{{book_category}}</a><span style="color:#9ca3af;font-weight:400;"> › </span><span style="color:#1a1a1b;" class="dark:text-gray-100">{{book_title}}</span><span style="color:#9ca3af;font-weight:400;"> – </span><a href="/author/{{book_author_slug}}.html" style="color:#c0392b;text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">{{book_author}}</a>
        </div>


        <!-- Book Card -->
        <div class="bg-white dark:bg-[#2d2d2d] p-4">
            <img src="{{book_cover}}"
                alt="{{book_title}}"
                class="float-left w-28 rounded object-cover aspect-[2/3] mr-4">
            <div class="flex gap-2 mb-3">
                <a href="{{book_read_href}}"
                    class="flex-1 flex items-center justify-center bg-[#c0392b] hover:bg-[#a93226] text-white text-sm font-medium py-2 rounded transition-colors relative overflow-hidden {{book_read_disabled}}"
                    aria-disabled="{{book_read_aria_disabled}}">
                    পড়ুন
                </a>
                <a href="{{book_download_href}}"
                    class="flex-1 flex items-center justify-center bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-sm font-medium py-2 rounded transition-colors relative overflow-hidden {{book_download_disabled}}"
                    aria-disabled="{{book_download_aria_disabled}}">
                    ডাউনলোড
                </a>
            </div>
            <div id="book-description-mobile" class="prose-book text-lg leading-normal text-gray-700 dark:text-gray-300 text-justify"></div>
            <div class="clear-both"></div>


        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
        <script>
            const raw = {{book_description_json}};

            marked.setOptions({
                breaks: true,
                gfm: true,
            });

            const parsed = marked.parse(raw);
            const mobileEl = document.getElementById('book-description-mobile');
            if (mobileEl) mobileEl.innerHTML = parsed;
        </script>

        <style>
            .btn-unclick {
                pointer-events: none;
                cursor: not-allowed;
                opacity: 0.6;
            }
            .btn-unclick::after {
                content: '';
                position: absolute;
                top: 50%;
                left: -10%;
                width: 120%;
                height: 2px;
                background: rgba(0, 0, 0, 0.55);
                transform: translateY(-50%) rotate(-18deg);
            }
        </style>

        <style>
            .prose-book h1, .prose-book h2, .prose-book h3,
            .prose-book h4, .prose-book h5, .prose-book h6 {
                font-weight: 700;
                line-height: 1.3;
                margin-top: 1.25em;
                margin-bottom: 0.4em;
                color: #111827;
            }
            .dark .prose-book h1, .dark .prose-book h2, .dark .prose-book h3,
            .dark .prose-book h4, .dark .prose-book h5, .dark .prose-book h6 {
                color: #f3f4f6;
            }
            .prose-book h1 { font-size: 1.4em; }
            .prose-book h2 { font-size: 1.2em; }
            .prose-book h3 { font-size: 1.05em; }
            .prose-book h4, .prose-book h5, .prose-book h6 { font-size: 0.95em; }

            .prose-book p { margin-bottom: 0.75em; }

            .prose-book a {
                color: #c0392b;
                text-decoration: underline;
            }
            .dark .prose-book a { color: #f87171; }

            .prose-book strong { font-weight: 700; color: #111827; }
            .dark .prose-book strong { color: #f9fafb; }

            .prose-book em { font-style: italic; }

            .prose-book ul, .prose-book ol {
                padding-left: 1.5em;
                margin-bottom: 0.75em;
            }
            .prose-book ul { list-style-type: disc; }
            .prose-book ol { list-style-type: decimal; }
            .prose-book li { margin-bottom: 0.25em; }

            .prose-book blockquote {
                border-left: 3px solid #c0392b;
                padding: 0.4em 0.9em;
                margin: 0.75em 0;
                color: #6b7280;
                font-style: italic;
                background: #fef2f2;
                border-radius: 0 4px 4px 0;
            }
            .dark .prose-book blockquote {
                background: #3b1f1f;
                color: #d1d5db;
                border-left-color: #f87171;
            }

            .prose-book code {
                background: #f3f4f6;
                color: #c0392b;
                padding: 0.1em 0.35em;
                border-radius: 3px;
                font-size: 0.88em;
                font-family: monospace;
            }
            .dark .prose-book code {
                background: #374151;
                color: #fca5a5;
            }

            .prose-book pre {
                background: #1f2937;
                color: #e5e7eb;
                padding: 1em;
                border-radius: 6px;
                overflow-x: auto;
                margin-bottom: 0.75em;
                font-size: 0.85em;
                font-family: monospace;
            }
            .prose-book pre code {
                background: none;
                color: inherit;
                padding: 0;
                font-size: inherit;
            }

            .prose-book table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 0.75em;
                font-size: 0.9em;
            }
            .prose-book th {
                background: #f9fafb;
                font-weight: 600;
                text-align: left;
                padding: 0.5em 0.75em;
                border: 1px solid #e5e7eb;
                color: #374151;
            }
            .dark .prose-book th {
                background: #374151;
                border-color: #4b5563;
                color: #f3f4f6;
            }
            .prose-book td {
                padding: 0.45em 0.75em;
                border: 1px solid #e5e7eb;
            }
            .dark .prose-book td { border-color: #4b5563; }
            .prose-book tr:nth-child(even) { background: #f9fafb; }
            .dark .prose-book tr:nth-child(even) { background: #2d3748; }

            .prose-book hr {
                border: none;
                border-top: 1px solid #e5e7eb;
                margin: 1.25em 0;
            }
            .dark .prose-book hr { border-top-color: #4b5563; }

            .prose-book img {
                max-width: 100%;
                border-radius: 6px;
                margin: 0.5em 0;
            }

            .prose-book del { text-decoration: line-through; color: #9ca3af; }

            .prose-book input[type="checkbox"] {
                margin-right: 0.4em;
                accent-color: #c0392b;
            }
        </style>

    </div>
</main>
