<!-- templates/book.html — শুধু content, layout.html এ inject হবে -->
<main class="flex-1 p-0 md:p-6 min-h-[calc(100vh-3.5rem)]">
    <div class="max-w-3xl mx-auto">

        <!-- Book Header Bar -->
        <div style="display:flex;align-items:baseline;flex-wrap:wrap;gap:0.4rem 0.6rem;padding:0.75rem 1rem;border-bottom:1px solid #e5e7eb;background:#fff;" class="dark:bg-[#2d2d2d] dark:border-gray-700">
            <span style="font-family:'Noto Serif Bengali',serif;font-weight:800;font-size:1.25rem;color:#1a1a1b;line-height:1.3;" class="dark:text-gray-100">{{book_title}}</span>
            <span style="font-size:1.25rem;color:#9ca3af;font-weight:400;line-height:1.3;">—</span>
            <a href="/author/{{book_author_slug}}.html" style="font-family:'Noto Serif Bengali',serif;font-weight:800;font-size:1.25rem;color:#c0392b;text-decoration:none;line-height:1.3;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">{{book_author}}</a>
        </div>


        <!-- Book Card -->
        <div class="bg-white dark:bg-[#2d2d2d] p-4">
            <img src="{{book_cover}}"
                alt="{{book_title}}"
                class="float-left w-28 rounded object-cover aspect-[2/3] mr-4">
            <div class="flex gap-2 mb-3">
                <a href="/read/{{book_slug}}.html"
                    class="flex-1 flex items-center justify-center bg-[#c0392b] hover:bg-[#a93226] text-white text-sm font-medium py-2 rounded transition-colors">
                    পড়ুন
                </a>
                <a href="/download/{{book_slug}}.html"
                    class="flex-1 flex items-center justify-center bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-sm font-medium py-2 rounded transition-colors">
                    ডাউনলোড
                </a>
            </div>
            <div id="book-description-mobile" class="prose-book text-lg leading-normal text-gray-700 dark:text-gray-300 text-justify"></div>
            <div class="clear-both"></div>

            <!-- Share Section -->
            <div class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                <div class="flex gap-2 flex-wrap items-center">
                    <!-- General Share -->
                    <button onclick="if(navigator.share){navigator.share({title:'{{book_title}} – {{book_author}}',url:'https://pathokghar.pages.dev/book/{{book_slug}}.html'})}else{navigator.clipboard.writeText('https://pathokghar.pages.dev/book/{{book_slug}}.html');alert('লিংক কপি হয়েছে!')}"
                        class="w-10 h-10 flex items-center justify-center border-2 border-gray-300 dark:border-gray-600 hover:border-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 dark:text-gray-400 transition-all"
                        style="border-radius:28%" title="শেয়ার">
                        <i class="fas fa-share-alt text-sm"></i>
                    </button>

                    <!-- Facebook -->
                    <a href="https://www.facebook.com/sharer/sharer.php?u=https://pathokghar.pages.dev/book/{{book_slug}}.html&quote={{book_title}}%20–%20{{book_author}}%0Ahttps://pathokghar.pages.dev/book/{{book_slug}}.html"
                        target="_blank" rel="noopener"
                        class="w-10 h-10 flex items-center justify-center border-2 border-[#1877f2] hover:bg-[#1877f2] text-[#1877f2] hover:text-white transition-all"
                        style="border-radius:28%" title="Facebook এ শেয়ার করুন">
                        <i class="fab fa-facebook-f text-sm"></i>
                    </a>

                    <!-- Twitter -->
                    <a href="https://twitter.com/intent/tweet?text={{book_title}}%20–%20{{book_author}}%0Ahttps://pathokghar.pages.dev/book/{{book_slug}}.html"
                        target="_blank" rel="noopener"
                        class="w-10 h-10 flex items-center justify-center border-2 border-[#1da1f2] hover:bg-[#1da1f2] text-[#1da1f2] hover:text-white transition-all"
                        style="border-radius:28%" title="Twitter এ শেয়ার করুন">
                        <i class="fab fa-twitter text-sm"></i>
                    </a>

                    <!-- WhatsApp -->
                    <a href="https://wa.me/?text={{book_title}}%20–%20{{book_author}}%0Ahttps://pathokghar.pages.dev/book/{{book_slug}}.html"
                        target="_blank" rel="noopener"
                        class="w-10 h-10 flex items-center justify-center border-2 border-[#25d366] hover:bg-[#25d366] text-[#25d366] hover:text-white transition-all"
                        style="border-radius:28%" title="WhatsApp এ শেয়ার করুন">
                        <i class="fab fa-whatsapp text-sm"></i>
                    </a>

                    <!-- Telegram -->
                    <a href="https://t.me/share/url?url=https://pathokghar.pages.dev/book/{{book_slug}}.html&text={{book_title}}%20–%20{{book_author}}"
                        target="_blank" rel="noopener"
                        class="w-10 h-10 flex items-center justify-center border-2 border-[#229ed9] hover:bg-[#229ed9] text-[#229ed9] hover:text-white transition-all"
                        style="border-radius:28%" title="Telegram এ শেয়ার করুন">
                        <i class="fab fa-telegram-plane text-sm"></i>
                    </a>

                    <!-- Copy Link -->
                    <button onclick="navigator.clipboard.writeText('https://pathokghar.pages.dev/book/{{book_slug}}.html').then(()=>{this.innerHTML='<i class=\'fas fa-check text-sm\'></i>';setTimeout(()=>{this.innerHTML='<i class=\'fas fa-link text-sm\'></i>'},2000)})"
                        class="w-10 h-10 flex items-center justify-center border-2 border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 dark:text-gray-400 transition-all"
                        style="border-radius:28%" title="লিংক কপি করুন">
                        <i class="fas fa-link text-sm"></i>
                    </button>
                </div>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
        <script>
            const raw = `{{book_description}}`;

            marked.setOptions({
                breaks: true,
                gfm: true,
            });

            const parsed = marked.parse(raw);
            const mobileEl = document.getElementById('book-description-mobile');
            if (mobileEl) mobileEl.innerHTML = parsed;
        </script>

        <style>
            .prose-book h1, .prose-book h2, .prose-book h3,
            .prose-book h4, .prose-book h5, .prose-book h6 {
                font-weight: 700;
                line-height: 1.3;
                margin-top: 1.25em;
                margin-bottom: 0.4em;
                color: #111827;
            }
            .dark .prose-book h1, .dark .prose-book h2, .dark .prose-book h3,
            .dark .prose-book h4, .dark .prose-book h5, .dark .prose-book h6 {
                color: #f3f4f6;
            }
            .prose-book h1 { font-size: 1.4em; }
            .prose-book h2 { font-size: 1.2em; }
            .prose-book h3 { font-size: 1.05em; }
            .prose-book h4, .prose-book h5, .prose-book h6 { font-size: 0.95em; }

            .prose-book p { margin-bottom: 0.75em; }

            .prose-book a {
                color: #c0392b;
                text-decoration: underline;
            }
            .dark .prose-book a { color: #f87171; }

            .prose-book strong { font-weight: 700; color: #111827; }
            .dark .prose-book strong { color: #f9fafb; }

            .prose-book em { font-style: italic; }

            .prose-book ul, .prose-book ol {
                padding-left: 1.5em;
                margin-bottom: 0.75em;
            }
            .prose-book ul { list-style-type: disc; }
            .prose-book ol { list-style-type: decimal; }
            .prose-book li { margin-bottom: 0.25em; }

            .prose-book blockquote {
                border-left: 3px solid #c0392b;
                padding: 0.4em 0.9em;
                margin: 0.75em 0;
                color: #6b7280;
                font-style: italic;
                background: #fef2f2;
                border-radius: 0 4px 4px 0;
            }
            .dark .prose-book blockquote {
                background: #3b1f1f;
                color: #d1d5db;
                border-left-color: #f87171;
            }

            .prose-book code {
                background: #f3f4f6;
                color: #c0392b;
                padding: 0.1em 0.35em;
                border-radius: 3px;
                font-size: 0.88em;
                font-family: monospace;
            }
            .dark .prose-book code {
                background: #374151;
                color: #fca5a5;
            }

            .prose-book pre {
                background: #1f2937;
                color: #e5e7eb;
                padding: 1em;
                border-radius: 6px;
                overflow-x: auto;
                margin-bottom: 0.75em;
                font-size: 0.85em;
                font-family: monospace;
            }
            .prose-book pre code {
                background: none;
                color: inherit;
                padding: 0;
                font-size: inherit;
            }

            .prose-book table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 0.75em;
                font-size: 0.9em;
            }
            .prose-book th {
                background: #f9fafb;
                font-weight: 600;
                text-align: left;
                padding: 0.5em 0.75em;
                border: 1px solid #e5e7eb;
                color: #374151;
            }
            .dark .prose-book th {
                background: #374151;
                border-color: #4b5563;
                color: #f3f4f6;
            }
            .prose-book td {
                padding: 0.45em 0.75em;
                border: 1px solid #e5e7eb;
            }
            .dark .prose-book td { border-color: #4b5563; }
            .prose-book tr:nth-child(even) { background: #f9fafb; }
            .dark .prose-book tr:nth-child(even) { background: #2d3748; }

            .prose-book hr {
                border: none;
                border-top: 1px solid #e5e7eb;
                margin: 1.25em 0;
            }
            .dark .prose-book hr { border-top-color: #4b5563; }

            .prose-book img {
                max-width: 100%;
                border-radius: 6px;
                margin: 0.5em 0;
            }

            .prose-book del { text-decoration: line-through; color: #9ca3af; }

            .prose-book input[type="checkbox"] {
                margin-right: 0.4em;
                accent-color: #c0392b;
            }
        </style>

    </div>
</main>
