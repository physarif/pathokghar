<!-- templates/book.html — শুধু content, layout.html এ inject হবে -->
<main class="flex-1 p-0 md:p-6 min-h-[calc(100vh-3.5rem)]">
    <div class="max-w-3xl mx-auto">

        <!-- Ad -->
        <div class="flex justify-center py-3">
            <script>
              atOptions = {
                'key' : 'bdb924698aea49a4aceb9cbc92d09488',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
              };
            </script>
            <script src="https://www.highperformanceformat.com/bdb924698aea49a4aceb9cbc92d09488/invoke.js"></script>
        </div>

        <!-- Breadcrumb -->
        <hr class="border-t border-gray-200 dark:border-gray-700">
        <nav class="flex items-center flex-wrap gap-1 text-sm text-gray-500 dark:text-gray-400 py-2 px-4">
            <a href="/" class="hover:text-red-600 dark:hover:text-red-400 transition-colors">পাঠক ঘর</a>
            <i class="fas fa-chevron-right text-[9px] text-gray-400"></i>
            <a href="/category/{{book_category_slug}}/1/" class="hover:text-red-600 dark:hover:text-red-400 transition-colors">{{book_category}}</a>
            <i class="fas fa-chevron-right text-[9px] text-gray-400"></i>
            <span class="text-gray-700 dark:text-gray-300 font-medium truncate max-w-[140px]">{{book_title}}</span>
            <span class="text-gray-400">–</span>
            <a href="/author/{{book_author_slug}}.html" class="text-red-600 dark:text-red-400 hover:underline truncate max-w-[100px]">{{book_author}}</a>
        </nav>
        <hr class="border-t border-gray-200 dark:border-gray-700">


        <!-- Book Card -->
        <div class="bg-white dark:bg-[#2d2d2d] p-4">
            <img src="{{book_cover}}"
                alt="{{book_title}}"
                class="float-left w-28 rounded object-cover aspect-[2/3] mr-4">
            <div class="flex gap-2 mb-3">
                <a href="/read/{{book_slug}}.html"
                    class="flex-1 flex items-center justify-center bg-[#c0392b] hover:bg-[#a93226] text-white text-sm font-medium py-2 rounded transition-colors">
                    পড়ুন
                </a>
                <a href="/download/{{book_slug}}.html"
                    class="flex-1 flex items-center justify-center bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-sm font-medium py-2 rounded transition-colors">
                    ডাউনলোড
                </a>
            </div>
            <div id="book-description-mobile" class="prose-book text-lg leading-normal text-gray-700 dark:text-gray-300 text-justify"></div>
            <div class="clear-both"></div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
        <script>
            const raw = `{{book_description}}`;

            marked.setOptions({
                breaks: true,
                gfm: true,
            });

            const parsed = marked.parse(raw);
            const mobileEl = document.getElementById('book-description-mobile');
            if (mobileEl) mobileEl.innerHTML = parsed;
        </script>

        <style>
            .prose-book h1, .prose-book h2, .prose-book h3,
            .prose-book h4, .prose-book h5, .prose-book h6 {
                font-weight: 700;
                line-height: 1.3;
                margin-top: 1.25em;
                margin-bottom: 0.4em;
                color: #111827;
            }
            .dark .prose-book h1, .dark .prose-book h2, .dark .prose-book h3,
            .dark .prose-book h4, .dark .prose-book h5, .dark .prose-book h6 {
                color: #f3f4f6;
            }
            .prose-book h1 { font-size: 1.4em; }
            .prose-book h2 { font-size: 1.2em; }
            .prose-book h3 { font-size: 1.05em; }
            .prose-book h4, .prose-book h5, .prose-book h6 { font-size: 0.95em; }

            .prose-book p { margin-bottom: 0.75em; }

            .prose-book a {
                color: #c0392b;
                text-decoration: underline;
            }
            .dark .prose-book a { color: #f87171; }

            .prose-book strong { font-weight: 700; color: #111827; }
            .dark .prose-book strong { color: #f9fafb; }

            .prose-book em { font-style: italic; }

            .prose-book ul, .prose-book ol {
                padding-left: 1.5em;
                margin-bottom: 0.75em;
            }
            .prose-book ul { list-style-type: disc; }
            .prose-book ol { list-style-type: decimal; }
            .prose-book li { margin-bottom: 0.25em; }

            .prose-book blockquote {
                border-left: 3px solid #c0392b;
                padding: 0.4em 0.9em;
                margin: 0.75em 0;
                color: #6b7280;
                font-style: italic;
                background: #fef2f2;
                border-radius: 0 4px 4px 0;
            }
            .dark .prose-book blockquote {
                background: #3b1f1f;
                color: #d1d5db;
                border-left-color: #f87171;
            }

            .prose-book code {
                background: #f3f4f6;
                color: #c0392b;
                padding: 0.1em 0.35em;
                border-radius: 3px;
                font-size: 0.88em;
                font-family: monospace;
            }
            .dark .prose-book code {
                background: #374151;
                color: #fca5a5;
            }

            .prose-book pre {
                background: #1f2937;
                color: #e5e7eb;
                padding: 1em;
                border-radius: 6px;
                overflow-x: auto;
                margin-bottom: 0.75em;
                font-size: 0.85em;
                font-family: monospace;
            }
            .prose-book pre code {
                background: none;
                color: inherit;
                padding: 0;
                font-size: inherit;
            }

            .prose-book table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 0.75em;
                font-size: 0.9em;
            }
            .prose-book th {
                background: #f9fafb;
                font-weight: 600;
                text-align: left;
                padding: 0.5em 0.75em;
                border: 1px solid #e5e7eb;
                color: #374151;
            }
            .dark .prose-book th {
                background: #374151;
                border-color: #4b5563;
                color: #f3f4f6;
            }
            .prose-book td {
                padding: 0.45em 0.75em;
                border: 1px solid #e5e7eb;
            }
            .dark .prose-book td { border-color: #4b5563; }
            .prose-book tr:nth-child(even) { background: #f9fafb; }
            .dark .prose-book tr:nth-child(even) { background: #2d3748; }

            .prose-book hr {
                border: none;
                border-top: 1px solid #e5e7eb;
                margin: 1.25em 0;
            }
            .dark .prose-book hr { border-top-color: #4b5563; }

            .prose-book img {
                max-width: 100%;
                border-radius: 6px;
                margin: 0.5em 0;
            }

            .prose-book del { text-decoration: line-through; color: #9ca3af; }

            .prose-book input[type="checkbox"] {
                margin-right: 0.4em;
                accent-color: #c0392b;
            }
        </style>

    </div>
</main>
