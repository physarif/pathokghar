<div class="categories-page">

  <!-- Body: letter sidebar + groups -->
  <div class="cg-body">
    <nav class="cg-letter-nav" id="cg-letter-nav"></nav>
    <div class="cg-groups" id="cg-groups"></div>
  </div>

</div>

<script type="application/json" id="categories-json">{{categories_json}}</script>

<style>
.categories-page { max-width: 64rem; margin: 0 auto; padding: 1.5rem 0.75rem 1.5rem 0; }
.cg-body {
  display: flex;
  align-items: flex-start;
}
.cg-letter-nav {
  position: sticky;
  top: 1rem;
  flex-shrink: 0;
  width: 2.4rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 0.25rem 0;
}
.cg-letter-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  font-size: 1.05rem;
  font-weight: 700;
  color: #9ca3af;
  text-decoration: none;
  border-radius: 4px;
  transition: background 0.12s, color 0.12s;
  line-height: 1;
}
.cg-letter-link:hover, .cg-letter-link.active {
  background: #E5E5E5;
  color: #fff;
}

.cg-groups { flex: 1; min-width: 0; padding-left: 0.5rem; }

.cg-group { margin-bottom: 1.5rem; }

.cg-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 0.5rem;
}

.cat-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
  text-decoration: none;
  padding: 0.85rem 1rem;
  background: #FFFFFF;
  border-radius: 5px;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.cat-card:hover { background: #F7F7F7; }
.cat-card:active { background: #E5E5E5; }
.cat-card.cat-card-wide { grid-column: span 2; }

.cat-card-name {
  font-size: 0.95rem;
  font-weight: 700;
  color: #F1F1F1;
  line-height: 1.3;
}

.cat-card-right { display: flex; align-items: center; gap: 0.6rem; }

.cat-card-count {
  font-size: 0.78rem;
  font-weight: 600;
  color: #9A9A9A;
  background: #E5E5E5;
  padding: 0.15rem 0.55rem;
  border-radius: 999px;
}
</style>

<script>
(function() {
  var data = JSON.parse(document.getElementById('categories-json').textContent);

  function toBn(n) {
    return String(n).replace(/[0-9]/g, function(d) { return '০১২৩৪৫৬৭৮৯'[d]; });
  }

  var countEl = document.getElementById('cat-count');
  if (countEl) countEl.textContent = toBn(data.length) + ' টি বিভাগ';

  // বর্ণানুসারে sort
  data.sort(function(a, b) { return a.name.localeCompare(b.name, 'bn'); });

  // Group by first letter
  var groups = {};
  var letters = [];
  data.forEach(function(cat) {
    var letter = cat.name ? cat.name[0] : '?';
    if (!groups[letter]) { groups[letter] = []; letters.push(letter); }
    groups[letter].push(cat);
  });

  // Build letter nav
  var nav = document.getElementById('cg-letter-nav');
  nav.innerHTML = letters.map(function(l) {
    return '<a href="#cg-' + encodeURIComponent(l) + '" class="cg-letter-link" data-letter="' + l + '">' + l + '</a>';
  }).join('');

  // Build groups
  var groupsEl = document.getElementById('cg-groups');
  groupsEl.innerHTML = letters.map(function(letter) {
    var cards = groups[letter].map(function(cat) {
      return '<a href="/category/' + cat.slug + '/" class="cat-card">'
        + '<span class="cat-card-name">' + cat.name + '</span>'
        + '<span class="cat-card-right">'
        + '<span class="cat-card-count">' + toBn(cat.count) + '</span>'
        + '</span>'
        + '</a>';
    }).join('');

    return '<div class="cg-group" id="cg-' + encodeURIComponent(letter) + '" data-letter="' + letter + '">'
      + '<div class="cg-grid">' + cards + '</div>'
      + '</div>';
  }).join('');

  // যে card-এর title ২ কলামের সংকীর্ণ জায়গায় ১ লাইনে আঁটে না, সেটাকে
  // পুরো width (২ কলাম) span করিয়ে দেওয়া হচ্ছে — টেক্সট ভেঙে সংকীর্ণ
  // দেখানোর বদলে পুরো জায়গা নিয়ে এক লাইনেই দেখাবে।
  function fixWideCards() {
    groupsEl.querySelectorAll('.cat-card-name').forEach(function(nameEl) {
      var card = nameEl.closest('.cat-card');
      card.classList.remove('cat-card-wide');
      var lineHeight = parseFloat(getComputedStyle(nameEl).lineHeight) || 20;
      if (nameEl.scrollHeight > lineHeight * 1.4) {
        card.classList.add('cat-card-wide');
      }
    });
  }
  fixWideCards();
  window.addEventListener('resize', function() {
    clearTimeout(window._catWideTimer);
    window._catWideTimer = setTimeout(fixWideCards, 150);
  });

  // Active letter on scroll
  var links = nav.querySelectorAll('.cg-letter-link');
  var groupEls = groupsEl.querySelectorAll('.cg-group');
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var letter = entry.target.dataset.letter;
        links.forEach(function(l) {
          l.classList.toggle('active', l.dataset.letter === letter);
        });
      }
    });
  }, { rootMargin: '-10% 0px -80% 0px' });
  groupEls.forEach(function(g) { observer.observe(g); });
})();
</script>
