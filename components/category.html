{{book_card_styles}}

<div id="bc-pagination"></div>
<script>
  (function() {
    const current = parseInt('{{current_page}}', 10);
    const total = parseInt('{{total_pages}}', 10);
    if (!current || !total || total <= 1) return;
    const slug = '{{category_slug}}';
    const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
    const el = document.getElementById('bc-pagination');

    function getDelta() {
      const w = window.innerWidth;
      if (w < 360) return 0;
      if (w < 420) return 1;
      if (w < 640) return 2;
      return 3;
    }

    function buildList(delta) {
      const keep = [];
      for (let i = 1; i <= total; i++) {
        if (i === 1 || i === total || (i >= current - delta && i <= current + delta)) keep.push(i);
      }
      const result = [];
      let prev = 0;
      for (const p of keep) {
        if (prev) {
          if (p - prev === 2) result.push(prev + 1);
          else if (p - prev > 2) result.push('...');
        }
        result.push(p);
        prev = p;
      }
      return result;
    }

    function render() {
      const list = buildList(getDelta());
      let html = '<div class="bc-pagination">';
      if (current > 1) {
        html += '<a href="/category/' + slug + '/' + (current - 1) + '/" class="bc-page-nav" aria-label="পূর্ববর্তী"><i class="fas fa-chevron-left"></i></a>';
      } else {
        html += '<span class="bc-page-nav disabled" aria-label="পূর্ববর্তী"><i class="fas fa-chevron-left"></i></span>';
      }
      list.forEach(function(i) {
        if (i === '...') { html += '<span class="bc-page-dots">···</span>'; return; }
        if (i === current) html += '<span class="bc-page-btn active">' + toBn(i) + '</span>';
        else html += '<a href="/category/' + slug + '/' + i + '/" class="bc-page-btn">' + toBn(i) + '</a>';
      });
      if (current < total) {
        html += '<a href="/category/' + slug + '/' + (current + 1) + '/" class="bc-page-nav" aria-label="পরবর্তী"><i class="fas fa-chevron-right"></i></a>';
      } else {
        html += '<span class="bc-page-nav disabled" aria-label="পরবর্তী"><i class="fas fa-chevron-right"></i></span>';
      }
      html += '</div>';
      el.innerHTML = html;
    }

    render();
    let resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(render, 150);
    });
  })();
</script>

<style>
