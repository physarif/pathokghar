<div class="md:px-8 lg:px-16">

<div>
  <div style="padding:0.45rem 1rem;background:#c0392b;font-size:1rem;font-family:'Noto Serif Bengali',serif;display:flex;align-items:center;justify-content:space-between;margin-bottom:0.5rem;">
    <span style="color:#fff;font-weight:700;letter-spacing:0.01em;">{{category_name}}</span>
    <span style="background:rgba(255,255,255,0.18);color:#fff;font-weight:600;font-size:0.78rem;padding:0.15rem 0.6rem;">{{category_book_count_bn}} টি বই</span>
  </div>
</div>

<div style="padding:0 0 0.5rem;">
  <div class="bc-list">{{category_books_grid}}</div>
</div>

</div><!-- /md:px-8 lg:px-16 -->

{{category_pagination}}

<style>
/* ── Book list (bc-card) — index.html এর মতো ── */
.bc-list {
  display: flex;
  flex-direction: column;
  padding: 0;
  gap: 0.4rem;
}
@media (min-width: 768px) {
  .bc-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.4rem;
  }
}
.bc-card {
  display: flex;
  flex-direction: row;
  gap: 0.85rem;
  align-items: flex-start;
  text-decoration: none;
  padding: 0.75rem;
  transition: background 0.1s;
  background: #fff;
}
.dark .bc-card { background: #23232a; }
.bc-card:hover { background: #fef2f2; }
.dark .bc-card:hover { background: #2a2020; }
.bc-img-wrap {
  flex-shrink: 0;
  width: 5.5rem;
  aspect-ratio: 2/3;
  overflow: hidden;
  background: #e5e7eb;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
@media (min-width: 768px) { .bc-img-wrap { width: 6.5rem; } }
.dark .bc-img-wrap { background: #374151; }
.bc-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bc-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}
.bc-headline {
  font-size: 1.1rem;
  line-height: 1.4;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.bc-title { font-weight: 700; color: #c0392b; }
.dark .bc-title { color: #f87171; }
.bc-card:hover .bc-title { text-decoration: none; }
.bc-sep { color: #9ca3af; font-weight: 400; }
.bc-author { font-weight: 500; color: #6b7280; }
.dark .bc-author { color: #9ca3af; }
.bc-desc {
  margin-top: 0.3rem;
  font-size: 1.02rem;
  color: #4b5563;
  line-height: 1.6;
  text-align: justify;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.bc-desc.bc-desc-3 {
  -webkit-line-clamp: 3;
}
.dark .bc-desc { color: #9ca3af; }

/* ── Pagination ── */
.cat-pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-wrap: wrap;
    padding: 0 1rem 2rem;
}
.cat-page-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 36px;
    padding: 0 10px;
    border-radius: 8px;
    font-size: 0.875rem;
    text-decoration: none;
    color: #4b5563;
    transition: background 0.15s;
}
.dark .cat-page-btn { color: #d1d5db; }
.cat-page-btn:hover { background: #f3f4f6; }
.dark .cat-page-btn:hover { background: #374151; }
.cat-page-btn.active {
    background: #c0392b;
    color: #fff;
    font-weight: 600;
    pointer-events: none;
}
.cat-page-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    height: 36px;
    border-radius: 8px;
    font-size: 0.875rem;
    text-decoration: none;
    color: #6b7280;
    transition: background 0.15s;
}
.dark .cat-page-nav { color: #9ca3af; }
.cat-page-nav:hover { background: #f3f4f6; }
.dark .cat-page-nav:hover { background: #374151; }
</style>

<script>
  (function() {
    function adjustDescClamp() {
      document.querySelectorAll('.bc-card').forEach(function(card) {
        const headline = card.querySelector('.bc-headline');
        const desc = card.querySelector('.bc-desc');
        if (!headline || !desc) return;
        const lineHeight = parseFloat(getComputedStyle(headline).lineHeight);
        const headlineLines = Math.round(headline.scrollHeight / lineHeight);
        if (headlineLines >= 2) {
          desc.classList.add('bc-desc-3');
        } else {
          desc.classList.remove('bc-desc-3');
        }
      });
    }
    adjustDescClamp();
    window.addEventListener('resize', adjustDescClamp);
  })();
</script>
