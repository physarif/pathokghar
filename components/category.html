<div class="category-wrap">

<div style="padding:0 0.5rem;">
  <div class="bc-latest-title">
    <i class="fa-solid fa-clock-rotate-left"></i> {{category_name}}
  </div>
</div>

<div style="padding:0 0.5rem 0.5rem;">
  <div class="bc-list">{{category_books_grid}}</div>
</div>

</div><!-- /md:px-8 lg:px-16 -->

{{book_card_styles}}

<div id="bc-pagination"></div>
<script>
  (function() {
    const current = parseInt('{{current_page}}', 10);
    const total = parseInt('{{total_pages}}', 10);
    if (!current || !total || total <= 1) return;
    const slug = '{{category_slug}}';
    const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
    const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
    const el = document.getElementById('bc-pagination');
    let html = '<div class="bc-pagination">';
    if (current > 1) {
      html += '<a href="/category/' + slug + '/' + (current - 1) + '/" class="bc-page-nav" aria-label="পূর্ববর্তী"><i class="fas fa-chevron-left"></i></a>';
    } else {
      html += '<span class="bc-page-nav disabled" aria-label="পূর্ববর্তী"><i class="fas fa-chevron-left"></i></span>';
    }
    for (let i = 1; i <= total; i++) {
      if (i === current) html += '<span class="bc-page-btn active">' + toBn(i) + '</span>';
      else html += '<a href="/category/' + slug + '/' + i + '/" class="bc-page-btn">' + toBn(i) + '</a>';
    }
    if (current < total) {
      html += '<a href="/category/' + slug + '/' + (current + 1) + '/" class="bc-page-nav" aria-label="পরবর্তী"><i class="fas fa-chevron-right"></i></a>';
    } else {
      html += '<span class="bc-page-nav disabled" aria-label="পরবর্তী"><i class="fas fa-chevron-right"></i></span>';
    }
    html += '</div>';
    el.innerHTML = html;
  })();
</script>

<style>
/* ── Pagination (books.html এর bc-pagination style অনুসরণ করা হচ্ছে) ── */
.bc-pagination {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 0.35rem;
  padding: 0.6rem 1rem 0.2rem;
  flex-wrap: nowrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.bc-pagination::-webkit-scrollbar { display: none; }
.bc-page-btn, .bc-page-nav { flex-shrink: 0; }
.bc-page-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 2.4rem;
  height: 2.4rem;
  padding: 0 0.5rem;
  border-radius: 0.3rem;
  font-size: 0.95rem;
  font-weight: 500;
  text-decoration: none;
  color: #374151;
  background: #ffffff;
  border: 1px solid #dee2e6;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.bc-page-btn:hover { background: #f1f3f5; border-color: #ced4da; color: #111827; }
.bc-page-btn.active { background: #e9ecef; border-color: #dee2e6; color: #212529; pointer-events: none; }
.bc-page-nav {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 2.4rem;
  height: 2.4rem;
  padding: 0 0.5rem;
  border-radius: 0.3rem;
  font-size: 0.95rem;
  font-weight: 600;
  text-decoration: none;
  color: #fff;
  background: #4a85bd;
  border: 1px solid #4a85bd;
  transition: background 0.15s;
}
.bc-page-nav:hover { background: #3d719f; border-color: #3d719f; }
.bc-page-nav.disabled { background: #a9c4de; border-color: #a9c4de; pointer-events: none; cursor: default; }
.dark .bc-page-btn { background: #1f2937; border-color: #374151; color: #d1d5db; }
.dark .bc-page-btn:hover { background: #374151; color: #f9fafb; }
.dark .bc-page-btn.active { background: #374151; border-color: #4b5563; color: #f9fafb; }
.dark .bc-page-nav { background: #4a85bd; border-color: #4a85bd; color: #fff; }
.dark .bc-page-nav:hover { background: #3d719f; border-color: #3d719f; }

/* Category title — index.html এর "সর্বশেষ বই" title-এর মতো accented progress-underline */
.bc-latest-title {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 1.1rem;
  font-weight: 700;
  color: #1f2937;
  margin-bottom: 1rem;
  letter-spacing: 0.01em;
}
.bc-latest-title i { color: #c0392b; font-size: 1rem; }
.bc-latest-title::after {
  content: '';
  flex: 1;
  height: 6px;
  border-radius: 1px;
  background: linear-gradient(to right, #e5e7eb 0%, #c0392b 100%);
}
.dark .bc-latest-title { color: #f3f4f6; }
.dark .bc-latest-title::after {
  background: linear-gradient(to right, #374151 0%, #f87171 100%);
}
.category-wrap { padding-top: 1rem; }
@media (min-width: 768px) { .category-wrap { padding-top: 1.5rem; padding-left: 2rem; padding-right: 2rem; } }
@media (min-width: 1024px) { .category-wrap { padding-left: 4rem; padding-right: 4rem; } }
</style>
