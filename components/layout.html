<!DOCTYPE html>
<html lang="bn">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}} - পাঠক ঘর</title>
    <meta name="description" content="{{page_description}}">
    <meta property="og:title" content="{{page_title}} - পাঠক ঘর">
    <meta property="og:description" content="{{page_description}}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#fff5f5',
                            100: '#fde8e6',
                            500: '#c0392b',
                            600: '#a93226'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        header { border-top: 5px solid #fff5f5; }
        /* Sidebar */
        #sidebar {
            position: fixed;
            top: 0; left: 0;
            height: 100%;
            width: 280px;
            transform: translateX(-100%);
            transition: transform 0.28s cubic-bezier(.4,0,.2,1);
            z-index: 200;
            overflow-y: auto;
            scrollbar-width: none;
            border-top: 5px solid #fff5f5;
        }
        #sidebar.open { transform: translateX(0); }
        #sidebar::-webkit-scrollbar { display: none; }
        #sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 199;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s;
        }
        #sidebar-overlay.open { opacity: 1; pointer-events: auto; }
        #sb-google-login:active i { color: #c0392b; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#1a1a1b] dark:text-gray-200 flex flex-col min-h-screen">

    <!-- SIDEBAR OVERLAY -->
    <div id="sidebar-overlay"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="bg-white dark:bg-[#1a1a1b] shadow-2xl border-r border-gray-200 dark:border-gray-700">

        <!-- Login section -->
        <div class="px-4 pt-5 pb-4 border-b border-gray-100 dark:border-gray-700">

            <!-- Logged OUT state -->
            <div id="sb-logged-out">
                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <!-- Google logo -->
                        <div class="w-11 h-11 rounded-full bg-white dark:bg-[#2a2a2a] border border-gray-200 dark:border-gray-700 flex items-center justify-center shrink-0 shadow-sm">
                            <svg width="22" height="22" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
                        </div>
                        <div>
                            <p class="font-semibold text-sm text-gray-800 dark:text-gray-100">লগইন</p>
                            <p class="text-[11px] text-gray-400 dark:text-gray-500">data sync করুন</p>
                        </div>
                    </div>
                    <button id="sb-google-login" class="flex items-center justify-center w-9 h-9 rounded-xl border border-[#c0392b] bg-[#c0392b] active:bg-white active:border-white transition shadow-sm shrink-0">
                        <i class="fas fa-sign-in-alt text-white active:text-[#c0392b]"></i>
                    </button>
                </div>
            </div>

            <!-- Logged IN state (hidden by default) -->
            <div id="sb-logged-in" class="hidden">
                <div class="flex items-center gap-3">
                    <img id="sb-user-photo" src="" alt="User" class="w-11 h-11 rounded-full object-cover shrink-0 border-2 border-[#c0392b]/30">
                    <div class="flex-1 min-w-0">
                        <p id="sb-user-name" class="font-semibold text-sm text-gray-800 dark:text-gray-100 truncate"></p>
                        <p id="sb-user-email" class="text-[11px] text-gray-400 dark:text-gray-500 truncate"></p>
                    </div>
                    <button id="sb-logout" title="লগআউট" class="p-1.5 text-gray-400 hover:text-[#c0392b] hover:bg-red-50 dark:hover:bg-[#2d1a0e] rounded-lg transition shrink-0">
                        <i class="fas fa-sign-out-alt text-sm"></i>
                    </button>
                </div>
            </div>

        </div>

        <!-- Categories -->
        <div class="px-4 pt-5 pb-3">
            <p class="text-[11px] uppercase font-bold tracking-widest text-gray-400 dark:text-gray-500 mb-3 pl-1">ক্যাটাগরি</p>
            <ul class="space-y-0.5">
                {{sidebar_categories}}
            </ul>
        </div>

        <div class="mx-4 border-t border-gray-100 dark:border-gray-700"></div>

        <!-- Authors -->
        <div class="px-4 pt-4 pb-6">
            <p class="text-[11px] uppercase font-bold tracking-widest text-gray-400 dark:text-gray-500 mb-3 pl-1">লেখক</p>
            <ul class="space-y-0.5">
                {{sidebar_authors}}
            </ul>
        </div>

    </aside>

    <!-- HEADER -->
    <header class="bg-white dark:bg-[#1a1a1b] fixed top-0 w-full h-16 z-[100] border-b border-gray-200 dark:border-gray-700 shadow-sm transition-transform duration-300 flex">
        <div class="w-full px-4 h-full flex items-center justify-between gap-3">

            <!-- Hamburger -->
            <button id="sidebar-btn" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded transition shrink-0" title="মেনু">
                <i class="fas fa-bars text-xl"></i>
            </button>

            <!-- Logo -->
            <a href="https://pathokghar.pages.dev" class="text-2xl font-extrabold tracking-tighter hover:bg-gray-100 dark:hover:bg-gray-800 px-2 py-1 rounded transition-colors duration-200 shrink-0 mr-auto md:mr-0">
                পাঠক <span class="font-light text-gray-400">ঘর</span>
            </a>

            <!-- Search (desktop) -->
            <div class="hidden md:flex flex-1">
                <div class="relative flex-1 flex items-center">
                    <i class="fas fa-search absolute left-4 text-gray-400 dark:text-gray-500 text-sm pointer-events-none"></i>
                    <input id="desktop-search-input" type="text" placeholder="বই, লেখক বা বিষয় খুঁজুন..."
                        class="w-full bg-gray-100 dark:bg-[#2d2d2d] border-0 rounded-full py-2 pl-10 pr-16 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white dark:focus:bg-[#3a3a3a] transition-all">
                    <button id="desktop-search-btn" class="absolute right-1 bg-brand-500 hover:bg-brand-600 text-white px-4 py-1.5 rounded-full text-sm transition-colors shrink-0">
                        খুঁজুন
                    </button>
                </div>
            </div>

            <!-- Right side actions -->
            <div class="flex items-center space-x-2 shrink-0">

                <!-- Mobile search button -->
                <button id="mobile-search-btn" class="md:hidden p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded transition" title="খুঁজুন">
                    <i class="fas fa-search text-xl"></i>
                </button>

                <!-- Day/Night toggle -->
                <button id="theme-btn" class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition text-gray-600 dark:text-gray-300" title="ডার্ক মোড">
                    <i id="theme-icon" class="fas fa-moon text-lg"></i>
                </button>

            </div>

        </div>

        <!-- Mobile search bar (dropdown) -->
        <div id="mobile-search-bar" class="absolute top-16 left-0 w-full bg-white dark:bg-[#1a1a1b] border-b dark:border-gray-700 px-4 py-3 hidden shadow-lg">
            <div class="relative flex items-center">
                <i class="fas fa-search absolute left-4 text-gray-400 dark:text-gray-500 text-sm pointer-events-none"></i>
                <input id="mobile-search-input" type="text" placeholder="বই, লেখক বা বিষয় খুঁজুন..."
                    class="w-full bg-gray-100 dark:bg-[#2d2d2d] border-0 rounded-full py-2 pl-10 pr-16 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                <button id="mobile-search-submit" class="absolute right-1 bg-brand-500 hover:bg-brand-600 text-white px-4 py-1.5 rounded-full text-sm transition-colors shrink-0">
                    খুঁজুন
                </button>
            </div>
        </div>

    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0 pt-16">
        {{content}}
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#fdf5f5] dark:bg-[#1f1210] border-t border-gray-200 dark:border-gray-700">
        <div class="max-w-6xl mx-auto px-6 py-3">

            <!-- Bottom bar -->
            <div class="text-[12px] pt-3">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                    <!-- Links: center on mobile, left on desktop -->
                    <div class="flex justify-center md:justify-start items-center gap-5 text-gray-400 dark:text-gray-500">
                        <a href="#" class="hover:text-[#c0392b] transition-colors">সম্পর্কে</a>
                        <span class="text-gray-300 dark:text-gray-700">|</span>
                        <a href="#" class="hover:text-[#c0392b] transition-colors">যোগাযোগ</a>
                        <span class="text-gray-300 dark:text-gray-700">|</span>
                        <a href="#" class="hover:text-[#c0392b] transition-colors">গোপনীয়তা নীতি</a>
                    </div>
                    <!-- Credit -->
                    <p class="hidden md:block text-right text-gray-400 dark:text-gray-500">
                        © Crafted by <a href="https://github.com/physarif" target="_blank" rel="noopener" class="text-[#c0392b] dark:text-[#e57373] hover:text-[#a93226] dark:hover:text-white transition-colors font-medium">Arif</a>
                        <span class="text-gray-300 dark:text-gray-700 mx-1">·</span>
                        github.com/physarif
                    </p>
                </div>
            </div>

        </div>
    </footer>

    <script>
        // Dark mode
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        const header = document.querySelector('header');
        const sidebar = document.getElementById('sidebar');
        function applyTheme(dark) {
            if (dark) {
                html.classList.add('dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                localStorage.theme = 'dark';
                header.style.borderTopColor = '#7a3b1e';
                sidebar.style.borderTopColor = '#7a3b1e';
            } else {
                html.classList.remove('dark');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                localStorage.theme = 'light';
                header.style.borderTopColor = '#fff5f5';
                sidebar.style.borderTopColor = '#fff5f5';
            }
        }

        applyTheme(localStorage.theme === 'dark');

        themeBtn.addEventListener('click', () => {
            applyTheme(!html.classList.contains('dark'));
        });

        // Mobile search
        const mobileSearchBtn = document.getElementById('mobile-search-btn');
        const mobileSearchBar = document.getElementById('mobile-search-bar');

        mobileSearchBtn.addEventListener('click', () => {
            mobileSearchBar.classList.toggle('hidden');
            if (!mobileSearchBar.classList.contains('hidden')) {
                mobileSearchBar.querySelector('input').focus();
            }
        });

        // Search functionality
        function doSearch(query) {
            if (query.trim()) {
                window.location.href = '/search.html?q=' + encodeURIComponent(query.trim());
            }
        }

        const desktopInput = document.getElementById('desktop-search-input');
        const desktopBtn = document.getElementById('desktop-search-btn');
        const mobileInput = document.getElementById('mobile-search-input');
        const mobileSubmit = document.getElementById('mobile-search-submit');

        desktopBtn.addEventListener('click', () => doSearch(desktopInput.value));
        desktopInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(desktopInput.value); });

        mobileSubmit.addEventListener('click', () => doSearch(mobileInput.value));
        mobileInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(mobileInput.value); });

        // Hide header on scroll down, show on scroll up (mobile only)
        let lastScrollY = window.scrollY;
        let ticking = false;

        window.addEventListener('scroll', () => {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
                const currentScrollY = window.scrollY;
                    if (currentScrollY > lastScrollY && currentScrollY > 56) {
                        header.style.transform = 'translateY(-100%)';
                    } else {
                        header.style.transform = 'translateY(0)';
                    }
                    lastScrollY = currentScrollY;
                ticking = false;
            });
        });


        // Sidebar
        const sidebarBtn = document.getElementById('sidebar-btn');
        const overlay = document.getElementById('sidebar-overlay');

        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        sidebarBtn.addEventListener('click', openSidebar);
        overlay.addEventListener('click', closeSidebar);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSidebar(); });

    </script>



    <script type="module" src="/firebase.js"></script>
</body>
</html>
