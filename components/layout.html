<!DOCTYPE html>
<html lang="bn">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}} - পাঠক ঘর</title>
    <meta name="description" content="{{page_description}}">
    <meta property="og:title" content="{{page_title}} - পাঠক ঘর">
    <meta property="og:description" content="{{page_description}}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#fff5f5',
                            100: '#fde8e6',
                            500: '#c0392b',
                            600: '#a93226'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        header { }

    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#1a1a1b] dark:text-gray-200 flex flex-col min-h-screen">

    <!-- HEADER -->
    <header class="bg-white dark:bg-[#1a1a1b] fixed top-0 w-full h-16 z-[100] border-b border-gray-200 dark:border-gray-700 shadow-sm transition-transform duration-300 flex">
        <div class="w-full px-4 h-full flex items-center justify-between gap-3">

            <!-- Logo -->
            <a href="https://pathokghar.pages.dev" class="text-2xl font-extrabold tracking-tighter hover:bg-gray-100 dark:hover:bg-gray-800 px-2 py-1 rounded transition-colors duration-200 shrink-0 mr-auto md:mr-0">
                পাঠক <span class="font-light text-gray-400">ঘর</span>
            </a>

            <!-- Search (desktop) -->
            <div class="hidden md:flex flex-1">
                <div class="relative flex-1 flex items-center">
                    <i class="fas fa-search absolute left-4 text-gray-400 dark:text-gray-500 text-sm pointer-events-none"></i>
                    <input id="desktop-search-input" type="text" placeholder="বই, লেখক বা বিষয় খুঁজুন..."
                        class="w-full bg-gray-100 dark:bg-[#2d2d2d] border-0 rounded-full py-2 pl-10 pr-16 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white dark:focus:bg-[#3a3a3a] transition-all">
                    <button id="desktop-search-btn" class="absolute right-1 bg-brand-500 hover:bg-brand-600 text-white px-4 py-1.5 rounded-full text-sm transition-colors shrink-0">
                        খুঁজুন
                    </button>
                </div>
            </div>

            <!-- Right side actions -->
            <div class="flex items-center space-x-2 shrink-0">

                <!-- Mobile search button -->
                <button id="mobile-search-btn" class="md:hidden p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded transition" title="খুঁজুন">
                    <i class="fas fa-search text-xl"></i>
                </button>

                <!-- Day/Night toggle -->
                <button id="theme-btn" class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition text-gray-600 dark:text-gray-300" title="ডার্ক মোড">
                    <i id="theme-icon" class="fas fa-moon text-lg"></i>
                </button>

            </div><!-- end right actions -->
        </div><!-- end header inner -->

        <!-- Mobile search bar (dropdown) -->
        <div id="mobile-search-bar" class="absolute top-16 left-0 w-full bg-white dark:bg-[#1a1a1b] border-b dark:border-gray-700 px-4 py-3 hidden shadow-lg">
            <div class="relative flex items-center">
                <i class="fas fa-search absolute left-4 text-gray-400 dark:text-gray-500 text-sm pointer-events-none"></i>
                <input id="mobile-search-input" type="text" placeholder="বই, লেখক বা বিষয় খুঁজুন..."
                    class="w-full bg-gray-100 dark:bg-[#2d2d2d] border-0 rounded-full py-2 pl-10 pr-16 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                <button id="mobile-search-submit" class="absolute right-1 bg-brand-500 hover:bg-brand-600 text-white px-4 py-1.5 rounded-full text-sm transition-colors shrink-0">
                    খুঁজুন
                </button>
            </div>
        </div>

    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0 pt-16">
        {{content}}
    </main>

    <!-- FOOTER -->
    <footer class="bg-white dark:bg-[#1a1a1b] border-t border-gray-200 dark:border-gray-700">

        <!-- Categories & Authors -->
        <div class="max-w-6xl mx-auto px-6 py-8">
            <div class="flex flex-col md:flex-row gap-8">

                <!-- Categories -->
                <div class="flex-1">
                    <p class="text-[11px] uppercase font-bold tracking-widest text-gray-400 dark:text-gray-500 mb-4">ক্যাটাগরি</p>
                    <ul class="flex flex-wrap gap-2">
                        {{sidebar_categories}}
                    </ul>
                </div>

                <div class="hidden md:block w-px bg-gray-100 dark:bg-gray-700"></div>

                <!-- Authors -->
                <div class="flex-1">
                    <p class="text-[11px] uppercase font-bold tracking-widest text-gray-400 dark:text-gray-500 mb-4">লেখক</p>
                    <ul class="flex flex-wrap gap-2">
                        {{sidebar_authors}}
                    </ul>
                </div>

            </div>
        </div>

        <!-- Bottom bar -->
        <div class="border-t border-gray-200 dark:border-gray-700">
            <div class="max-w-6xl mx-auto px-6 py-3 pb-6 md:pb-3 flex flex-col md:flex-row items-center justify-between gap-2 text-[12px] text-gray-500 dark:text-gray-400">
                <div class="flex items-center gap-4">
                    <a href="#" class="hover:text-[#c0392b] transition-colors">সম্পর্কে</a>
                    <span class="text-gray-300 dark:text-gray-600">|</span>
                    <a href="#" class="hover:text-[#c0392b] transition-colors">যোগাযোগ</a>
                    <span class="text-gray-300 dark:text-gray-600">|</span>
                    <a href="#" class="hover:text-[#c0392b] transition-colors">গোপনীয়তা নীতি</a>
                </div>
                <p class="hidden md:block">
                    © Crafted by <a href="https://github.com/physarif" target="_blank" rel="noopener" class="text-[#c0392b] hover:text-[#a93226] transition-colors font-medium">Arif</a>
                    <span class="mx-1">·</span>
                    github.com/physarif
                </p>
            </div>
        </div>
    </footer>

    <script>
        // Dark mode
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        const header = document.querySelector('header');
        function applyTheme(dark) {
            if (dark) {
                html.classList.add('dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                localStorage.theme = 'dark';
            } else {
                html.classList.remove('dark');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                localStorage.theme = 'light';
            }
        }

        applyTheme(localStorage.theme === 'dark');

        themeBtn.addEventListener('click', () => {
            applyTheme(!html.classList.contains('dark'));
        });

        // Mobile search
        const mobileSearchBtn = document.getElementById('mobile-search-btn');
        const mobileSearchBar = document.getElementById('mobile-search-bar');

        mobileSearchBtn.addEventListener('click', () => {
            mobileSearchBar.classList.toggle('hidden');
            if (!mobileSearchBar.classList.contains('hidden')) {
                mobileSearchBar.querySelector('input').focus();
            }
        });

        // Search functionality
        function doSearch(query) {
            if (query.trim()) {
                window.location.href = '/search.html?q=' + encodeURIComponent(query.trim());
            }
        }

        const desktopInput = document.getElementById('desktop-search-input');
        const desktopBtn = document.getElementById('desktop-search-btn');
        const mobileInput = document.getElementById('mobile-search-input');
        const mobileSubmit = document.getElementById('mobile-search-submit');

        desktopBtn.addEventListener('click', () => doSearch(desktopInput.value));
        desktopInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(desktopInput.value); });

        mobileSubmit.addEventListener('click', () => doSearch(mobileInput.value));
        mobileInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(mobileInput.value); });

        // Hide header on scroll down, show on scroll up (mobile only)
        let lastScrollY = window.scrollY;
        let ticking = false;

        window.addEventListener('scroll', () => {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
                const currentScrollY = window.scrollY;
                    if (currentScrollY > lastScrollY && currentScrollY > 56) {
                        header.style.transform = 'translateY(-100%)';
                    } else {
                        header.style.transform = 'translateY(0)';
                    }
                    lastScrollY = currentScrollY;
                ticking = false;
            });
        });




    </script>

</body>
</html>
