        <script>
        (function() {
            var ul = document.getElementById('hero-cat-list');
            if (!ul) return;
            // প্রথম ৩টি fixed, বাকিগুলো shuffle
            var allLis = Array.from(ul.querySelectorAll('li'));
            var fixed = allLis.slice(0, 3);
            var dynamic = allLis.slice(3);
            for (var i = dynamic.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = dynamic[i]; dynamic[i] = dynamic[j]; dynamic[j] = tmp;
            }
            dynamic.forEach(function(li) { ul.appendChild(li); });
            // প্রতিটা নতুন লাইনের প্রথম li থেকে ডট সরাও
            function markLineStarts() {
                var lis = ul.querySelectorAll('li');
                var lastTop = -1;
                lis.forEach(function(li) {
                    li.classList.remove('line-start');
                    var top = li.getBoundingClientRect().top;
                    if (top > lastTop + 2) { li.classList.add('line-start'); lastTop = top; }
                });
            }
            markLineStarts();
            window.addEventListener('resize', markLineStarts);
        })();
        </script>

    <script>
    (function() {
        var bar = document.getElementById('ad-bar');
        var content = document.getElementById('ad-bar-content');
        var icon = document.getElementById('ad-bar-icon');
        var collapsed = true;
        var dtInterval = null;

        // Start collapsed — state already set in HTML/CSS
        // Show datetime immediately since bar starts collapsed
        if (document.getElementById('ad-bar-datetime')) {
            document.getElementById('ad-bar-datetime').style.display = 'inline';
            setTimeout(function() { updateDatetime(); dtInterval = setInterval(updateDatetime, 1000); }, 0);
        }

        var adOpenTime = null;
        var autoCloseTimer = null;
        var autoOpened = false;
        var AD_REDIRECT_URL = 'https://www.effectivecpmnetwork.com/xy4y06gcc0?key=0a786fa6fae9cb37d984706635ad88c3';

        // Auto-open after 1.5s, then auto-close after 30s
        setTimeout(function() {
            if (collapsed) {
                autoOpened = true;
                toggleAdBar();
                autoCloseTimer = setTimeout(function() {
                    if (!collapsed) { autoOpened = false; toggleAdBar(); }
                }, 30000);
            }
        }, 1500);



        var label = document.getElementById('ad-bar-label');
        var notice = document.getElementById('ad-bar-notice');
        var datetime = document.getElementById('ad-bar-datetime');

        // ── Bengali helpers ──
        function toBnDigits(n) {
            return String(n).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
        }
        var bnDays   = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
        var bnBoshontoMonths = ['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];

        // Bangabda conversion (Bangladesh calendar)
        function toBangabda(now) {
            var gYear  = now.getFullYear();
            var gMonth = now.getMonth() + 1;
            var gDay   = now.getDate();
            var bnMonth, bnDay, bnYear;
            var monthMap = [
                [1,  14, 9,  14],[2,  13, 10, 13],[3,  14, 11, 14],[4,  14, 0,  14],
                [5,  15, 1,  15],[6,  15, 2,  15],[7,  16, 3,  16],[8,  16, 4,  16],
                [9,  16, 5,  16],[10, 16, 6,  16],[11, 15, 7,  15],[12, 15, 8,  15],
            ];
            var idx = gMonth - 1;
            var startDay = monthMap[idx][3];
            if (gDay >= startDay) {
                bnMonth = monthMap[idx][2];
                bnDay   = gDay - startDay + 1;
            } else {
                bnMonth = (monthMap[idx][2] - 1 + 12) % 12;
                var prevGMonth = gMonth === 1 ? 12 : gMonth - 1;
                var prevStart  = monthMap[prevGMonth - 1][3];
                var daysInPrevGMonth = new Date(gYear, gMonth - 1, 0).getDate();
                bnDay = daysInPrevGMonth - prevStart + gDay + 1;
            }
            bnYear = (bnMonth <= 4) ? gYear - 593 : gYear - 594;
            return { day: bnDay, month: bnMonth, year: bnYear };
        }

        function updateDatetime() {
            if (!datetime) return;
            var now  = new Date();
            var day  = bnDays[now.getDay()];
            var h    = now.getHours();
            var m    = now.getMinutes();
            var s    = now.getSeconds();
            var h12  = h % 12 || 12;
            var bn   = toBangabda(now);
            datetime.innerHTML =
                '<span style="color:#9ca3af;font-weight:400;">' + day + ', </span>' +
                '<strong style="color:inherit;font-weight:700;">' + toBnDigits(bn.day) + '</strong>' +
                '<span style="color:#9ca3af;font-weight:400;"> ' + bnBoshontoMonths[bn.month] + ' </span>' +
                '<strong style="color:inherit;font-weight:700;">' + toBnDigits(bn.year) + '</strong>' +
                '<span style="color:#9ca3af;font-weight:400;">  |  </span>' +
                '<strong style="color:inherit;font-weight:700;">' +
                    toBnDigits(h12) + ':' + toBnDigits(String(m).padStart(2,'0')) + ':' + toBnDigits(String(s).padStart(2,'0')) +
                '</strong>';
        }

        var twTimer = null;
        var twPhase = 0;

        function showAdMsg(phase) {
            var m1 = document.getElementById('ad-msg-1');
            var m2 = document.getElementById('ad-msg-2');
            if (!m1 || !m2) return;
            var current = phase % 2 === 0 ? m1 : m2;
            var other   = phase % 2 === 0 ? m2 : m1;
            // hide other
            other.style.opacity = '0';
            other.style.transform = 'translateY(6px)';
            // show current
            setTimeout(function() {
                current.style.opacity = '1';
                current.style.transform = 'translateY(0)';
            }, 50);
            // cycle after 3s
            twTimer = setTimeout(function() {
                current.style.opacity = '0';
                current.style.transform = 'translateY(-6px)';
                twPhase++;
                twTimer = setTimeout(function() { showAdMsg(twPhase); }, 700);
            }, twPhase % 2 === 0 ? 3000 : 7000);
        }

        window.toggleAdBar = function() {
            collapsed = !collapsed;
            if (collapsed) {
                // শুধু auto-open এর সময় ৩০s এর আগে close করলে redirect
                var elapsed = adOpenTime ? (Date.now() - adOpenTime) : 30000;
                if (autoOpened && elapsed < 30000) {
                    window.open(AD_REDIRECT_URL, '_blank');
                }
                autoOpened = false;
                adOpenTime = null;
                clearTimeout(autoCloseTimer);
                content.style.maxHeight = '0';
                content.style.padding = '0';
                if (notice) notice.style.display = 'none';
                clearTimeout(twTimer);
                var m1 = document.getElementById('ad-msg-1');
                var m2 = document.getElementById('ad-msg-2');
                if (m1) { m1.style.opacity='0'; m1.style.transform='translateY(6px)'; }
                if (m2) { m2.style.opacity='0'; m2.style.transform='translateY(6px)'; }
                if (datetime) { datetime.style.display = 'inline'; updateDatetime(); dtInterval = setInterval(updateDatetime, 1000); }
                icon.innerHTML = '<polyline points="18 15 12 9 6 15"></polyline>';
                label.textContent = 'Show Ad';
            } else {
                if (!autoOpened) adOpenTime = null; // manual open — redirect নেই
                adOpenTime = Date.now();
                autoCloseTimer = setTimeout(function() {
                    if (!collapsed) { autoOpened = false; toggleAdBar(); }
                }, 30000);
                content.style.maxHeight = '500px';
                content.style.padding = '6px 10px';
                if (notice) notice.style.display = 'flex';
                if (datetime) { datetime.style.display = 'none'; clearInterval(dtInterval); }
                icon.innerHTML = '<polyline points="6 9 12 15 18 9"></polyline>';
                label.textContent = 'Hide Ad';
                twPhase = 0;
                twTimer = setTimeout(function() { showAdMsg(twPhase); }, 500);
            }
        };
    })();
    </script>

    <script>
        // Search
        function doSearch(query) {
            if (query.trim()) {

        const mainInput = document.getElementById('main-search-input');
