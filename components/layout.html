<!DOCTYPE html>
<html lang="bn">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}} - পাঠক ঘর</title>
    <meta name="description" content="{{page_description}}">
    <meta property="og:title" content="{{page_title}} - পাঠক ঘর">
    <meta property="og:description" content="{{page_description}}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#fff5f5',
                            100: '#fde8e6',
                            500: '#c0392b',
                            600: '#a93226'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Category underline links — Style D */
        .category-underline-list li { display: inline-flex; align-items: center; }
        .category-underline-list li + li::before {
            content: '·';
            color: #d1d5db;
            font-size: 14px;
            margin: 0 6px;
            line-height: 1;
        }
        .dark .category-underline-list li + li::before { color: #4b5563; }
        .category-underline-list a {
            font-size: 15px;
            font-weight: 700;
            color: #6b7280;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            padding-bottom: 1px;
            transition: color 0.18s, border-color 0.18s;
        }
        .category-underline-list a:hover {
            color: #c0392b;
            border-bottom-color: #c0392b;
        }
        .dark .category-underline-list a { color: #9ca3af; }
        .dark .category-underline-list a:hover { color: #f87171; border-bottom-color: #c0392b; }

        /* Footer dot-separated links */
        .footer-dot-link {
            font-size: 14px;
            color: #c0392b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-dot-link:hover { color: #a93226; text-decoration: underline; }
        .footer-dot-link:active,
        .footer-dot-link:focus { text-decoration: underline; outline: none; }
        .dark .footer-dot-link { color: #e57373; }
        .dark .footer-dot-link:hover,
        .dark .footer-dot-link:active { color: #f87171; text-decoration: underline; }
        .footer-dot {
            color: #999;
            font-size: 16px;
            margin: 0 6px;
            line-height: 1;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#1a1a1b] dark:text-gray-200 flex flex-col min-h-screen">

    <!-- HERO SECTION (Wikipedia-style) -->
    <div class="flex flex-col items-center justify-center pt-12 pb-6 px-4 text-center">

        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tighter mb-2 leading-tight">
            <a href="https://pathokghar.pages.dev" class="hover:text-brand-500 active:text-brand-500 transition-colors">পাঠক <span class="font-light text-gray-400 dark:text-gray-500">ঘর</span></a>
        </h1>

        <!-- Date & Time -->
        <p id="datetime-display" class="text-sm text-gray-400 dark:text-gray-500 mb-4 tracking-wide"></p>

        <!-- Search box -->
        <div class="w-full max-w-xl relative flex items-center bg-white dark:bg-[#2d2d2d] border border-gray-200 dark:border-gray-600 rounded-full shadow-md focus-within:ring-2 focus-within:ring-brand-500 focus-within:border-transparent transition-all">
            <input id="main-search-input" type="text" placeholder="বই, লেখক বা বিষয় খুঁজুন..."
                class="flex-1 bg-transparent py-3 pl-5 pr-2 text-sm focus:outline-none text-gray-800 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 min-w-0">
            <button id="main-search-btn" class="bg-brand-500 hover:bg-brand-600 active:bg-brand-600 text-white px-5 py-2 rounded-full text-sm font-medium transition-colors shrink-0 mr-1">
                খুঁজুন
            </button>
        </div>

        <!-- Category Quick Links -->
        <div class="w-full max-w-2xl mt-4">
            <ul class="category-underline-list flex flex-wrap justify-center items-center gap-y-2">
                {{hero_categories}}
            </ul>
        </div>

    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0">
        {{content}}
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-100 dark:bg-[#1f1f1f] border-t border-gray-300 dark:border-gray-700 mt-8">

        <!-- Brand row: always visible on mobile, hidden on desktop (icons move to bottom row) -->
        <div class="max-w-3xl mx-auto px-5 pt-6 pb-4 flex items-center justify-between">
            <span class="text-3xl font-extrabold tracking-tight text-gray-800 dark:text-gray-100">
                পাঠক <span class="font-light text-gray-400 dark:text-gray-500">ঘর</span>
            </span>
            <!-- Mobile only icons -->
            <div class="flex md:hidden items-center gap-2">
                <a href="#" aria-label="Facebook"
                   class="w-12 h-12 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-[#2a2a2a] flex items-center justify-center text-[#1877f2] hover:border-[#1877f2] transition-all">
                    <i class="fab fa-facebook-f text-lg"></i>
                </a>
                <a href="#" aria-label="Telegram"
                   class="w-12 h-12 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-[#2a2a2a] flex items-center justify-center text-[#229ed9] hover:border-[#229ed9] transition-all">
                    <i class="fab fa-telegram-plane text-lg"></i>
                </a>
            </div>
        </div>

        <!-- Divider -->
        <div class="max-w-3xl mx-auto px-5">
            <div class="border-t border-gray-300 dark:border-gray-700"></div>
        </div>

        <!-- Dot-separated links — mobile: wrap, desktop: single row -->
        <div class="max-w-3xl mx-auto px-5 py-3 flex flex-wrap md:flex-nowrap items-center justify-between gap-y-2">
            <!-- Links -->
            <div class="flex flex-wrap md:flex-nowrap items-center gap-y-1">
                <a href="/category/" class="footer-dot-link">বিভাগ</a>
                <span class="footer-dot">·</span>
                <a href="/author/" class="footer-dot-link">লেখক</a>
                <span class="footer-dot">·</span>
                <a href="#" class="footer-dot-link">ব্লগ</a>
                <span class="footer-dot">·</span>
                <a href="#" class="footer-dot-link">সংবাদ</a>
                <span class="footer-dot">·</span>
                <a href="#" class="footer-dot-link">App</a>
            </div>
            <!-- Social icons — desktop: inline right, mobile: hidden (shown in brand row) -->
            <div class="hidden md:flex items-center gap-2 shrink-0 ml-4">
                <a href="#" aria-label="Facebook"
                   class="w-12 h-10 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#2a2a2a] flex items-center justify-center gap-1.5 text-[#1877f2] hover:border-[#1877f2] transition-all text-xs font-semibold px-2">
                    <i class="fab fa-facebook-f text-sm"></i>
                    <span class="text-[10px] text-gray-500 dark:text-gray-400 leading-tight hidden lg:block">WIKIMEDIA<br>project</span>
                </a>
                <a href="#" aria-label="Telegram"
                   class="w-12 h-10 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#2a2a2a] flex items-center justify-center gap-1.5 text-[#229ed9] hover:border-[#229ed9] transition-all text-xs font-semibold px-2">
                    <i class="fab fa-telegram-plane text-sm"></i>
                    <span class="text-[10px] text-gray-500 dark:text-gray-400 leading-tight hidden lg:block">Powered by<br>MediaWiki</span>
                </a>
            </div>
        </div>

    </footer>

    <script>
        // Date & Time (বঙ্গাব্দ)
        const bnDays = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
        const bnMonths = ['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];
        // Bangla month start dates (approximate, Gregorian)
        const bnMonthStarts = [
            [4,14],[5,15],[6,15],[7,16],[8,16],[9,16],
            [10,16],[11,15],[12,15],[1,14],[2,13],[3,14]
        ];
        function toBnNum(n) {
            return String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
        }
        function getBanglaDate(now) {
            const gMonth = now.getMonth() + 1;
            const gDay = now.getDate();
            const gYear = now.getFullYear();
            let bnMonth, bnDay, bnYear;
            // find current bangla month
            for (let i = 0; i < 12; i++) {
                const [m, d] = bnMonthStarts[i];
                const [nm, nd] = bnMonthStarts[(i + 1) % 12];
                const start = new Date(gYear, m - 1, d);
                let endYear = gYear;
                if (nm < m || (nm === m && nd < d)) endYear = gYear + 1;
                const end = new Date(endYear, nm - 1, nd);
                const cur = new Date(gYear, gMonth - 1, gDay);
                if (cur >= start && cur < end) {
                    bnMonth = i;
                    bnDay = Math.floor((cur - start) / 86400000) + 1;
                    // Bangla year = Gregorian year - 593 or 594
                    bnYear = (m >= 4) ? gYear - 593 : gYear - 594;
                    break;
                }
            }
            return { bnDay, bnMonth, bnYear };
        }
        function updateDateTime() {
            const now = new Date();
            const day = bnDays[now.getDay()];
            const { bnDay, bnMonth, bnYear } = getBanglaDate(now);
            const month = bnMonths[bnMonth];
            const h = toBnNum(String(now.getHours()).padStart(2,'0'));
            const m = toBnNum(String(now.getMinutes()).padStart(2,'0'));
            const s = toBnNum(String(now.getSeconds()).padStart(2,'0'));
            const el = document.getElementById('datetime-display');
            if (el) el.innerHTML =
                `<span class="text-gray-400 dark:text-gray-500">${day}, </span>` +
                `<span class="font-bold text-gray-600 dark:text-gray-300">${toBnNum(bnDay)}</span>` +
                `<span class="text-gray-400 dark:text-gray-500"> ${month} </span>` +
                `<span class="font-bold text-gray-600 dark:text-gray-300">${toBnNum(bnYear)}</span>` +
                `<span class="text-gray-400 dark:text-gray-500"> | </span>` +
                `<span class="font-bold text-gray-600 dark:text-gray-300">${h}:${m}:${s}</span>`;
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // Search
        function doSearch(query) {
            if (query.trim()) {
                window.location.href = '/search.html?q=' + encodeURIComponent(query.trim());
            }
        }
        const mainInput = document.getElementById('main-search-input');
        document.getElementById('main-search-btn').addEventListener('click', () => doSearch(mainInput.value));
        mainInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(mainInput.value); });
    </script>

</body>
</html>
