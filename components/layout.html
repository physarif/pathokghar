    <!-- আগে cdn.tailwindcss.com (runtime JIT) ব্যবহার হতো, যেটা FOUC/layout-shift
         করত। এখন GitHub Actions বিল্ড টাইমে precompile হওয়া static CSS। -->
    <link rel="stylesheet" href="/assets/css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Category links — footer style, larger */
        .category-underline-list li { display: inline-flex; align-items: center; white-space: nowrap; }
        .category-underline-list li + li::before {
            content: '·';
            color: #9ca3af;
            font-size: 16px;
            margin: 0 5px;
            line-height: 1;
        }
        .dark .category-underline-list li + li::before { color: #4b5563; }
        .category-underline-list li.line-start::before { display: none !important; }
        .category-underline-list a {
            font-size: 17px;
            font-weight: 400;
            color: #c0392b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .category-underline-list a:hover { color: #a93226; text-decoration: underline; }
        .category-underline-list a:active,
        .category-underline-list a:focus { text-decoration: underline; outline: none; }
        .dark .category-underline-list a { color: #e57373; }
        .dark .category-underline-list a:hover,
        .dark .category-underline-list a:active { color: #f87171; text-decoration: underline; }

        /* Footer dot-separated links */
        .footer-dot-link {
            font-size: 14px;
            color: #c0392b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-dot-link:hover { color: #a93226; text-decoration: underline; }
        .footer-dot-link:active,
        .footer-dot-link:focus { text-decoration: underline; outline: none; }
        .dark .footer-dot-link { color: #e57373; }
        .dark .footer-dot-link:hover,
        .dark .footer-dot-link:active { color: #f87171; text-decoration: underline; }
        .footer-dot {
            color: #999;
            font-size: 16px;
            margin: 0 6px;
            line-height: 1;
        }
        /* Visit counter — retro LCD display */
        .pg-visit-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #1a0e0e;
            border-radius: 5px;
            padding: 0.15rem 0.7rem;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
            font-family: 'Courier New', Consolas, monospace;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            color: #ff3b30;
            text-shadow: 0 0 8px rgba(255,59,48,0.75);
            white-space: nowrap;
        }
        .pg-visit-pill i { font-size: 0.7rem; color: #ff3b30; opacity: 0.85; }
        .pg-visit-pill .pg-sep { color: #ff3b30; margin: 0 0.05rem; }

        /* Bottom tab bar — ported from adp4tvd5n.html admin dashboard design */
        .bottom-tab-bar {
            position: fixed;
            bottom: 12px;
            left: 28px;
            right: 28px;
            z-index: 200;
            background: rgba(255,255,255,0.95);
            border: 1px solid #ebebeb;
            border-radius: 24px;
            display: flex;
            align-items: stretch;
            height: 58px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: env(safe-area-inset-bottom, 0px);
        }
        .dark .bottom-tab-bar {
            background: rgba(22,27,34,0.95);
            border-color: #30363d;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .bottom-tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            color: #c4c4c4;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            transition: color 0.18s ease, transform 0.18s ease;
        }
        .dark .bottom-tab-item { color: #3d444d; }
        .bottom-tab-item i {
            font-size: 1.2rem;
            line-height: 1;
            position: relative;
            z-index: 1;
            transition: transform 0.18s ease;
        }
        .bottom-tab-item.active { color: #c0392b; }
        .dark .bottom-tab-item.active { color: #e57373; }
        .bottom-tab-item.active i { transform: scale(1.3); }
        .bottom-tab-item:active i { transform: scale(0.88); }
        .bottom-tab-item.active::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 52px; height: 32px;
            background: rgba(192, 57, 43, 0.12);
            border-radius: 16px;
        }
        .dark .bottom-tab-item.active::before { background: rgba(229, 115, 115, 0.14); }

        /* বটম বার-এর জন্য পেজের নিচে জায়গা রাখা, যাতে কনটেন্ট ঢাকা না পড়ে */
        body { padding-bottom: 90px; }
        @media (min-width: 768px) {
            .bottom-tab-bar { display: none; }
            body { padding-bottom: 0; }
        }

        /* Sidebar (plain CSS — precompiled tailwind.css এ এই ক্লাসগুলো নাও থাকতে পারে) */
        #sidebar-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 240;
            opacity: 0; visibility: hidden;
            transition: opacity 0.25s;
        }
        #sidebar-overlay.open { opacity: 1; visibility: visible; }
        #sidebar {
            position: fixed; top: 0; left: 0;
            height: 100%; width: 240px; max-width: 80%;
            background: rgba(255,255,255,0.95);
            z-index: 250;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            box-shadow: 2px 0 12px rgba(0,0,0,0.15);
            overflow-y: auto;
        }
        .dark #sidebar {
            background: rgba(31,31,31,0.95);
        }
        #sidebar.open { transform: translateX(0); }

        /* Sidebar layout — নিচের সেকশন একেবারে বটমে বসানোর জন্য plain CSS
           (Tailwind-এর mt-auto/flex-col precompiled CSS-এ নাও থাকতে পারে) */
        #sidebar { display: flex; flex-direction: column; }
        #sidebar-bottom { margin-top: auto; }
        #sidebar-links { display: flex; align-items: center; gap: 14px; }
        #sidebar-social a { color: inherit; }

        /* Floating (sticky) header — নিচে স্ক্রল করলে hide, উপরে স্ক্রল করলে show */
        #site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 220;
            transform: translateY(0);
            transition: transform 0.28s ease;
            will-change: transform;
            background: rgba(255,255,255,0.95) !important;
        }
        .dark #site-header { background: rgba(31,31,31,0.95) !important; }
        #site-header.header-hidden { transform: translateY(-100%); }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-[#1a1a1b] dark:text-gray-200 flex flex-col min-h-screen">

    <!-- TOP BAR -->
    <header id="site-header" class="border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1f1f1f]">
        <div id="header-default" class="flex items-center justify-between px-5 py-3">
            <button id="menu-btn" type="button" aria-label="মেনু" class="text-gray-500 dark:text-gray-400">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <a href="https://pathokghar.com" aria-label="পাঠক ঘর" style="color:#c0392b;">
                <i class="fa-solid fa-swatchbook text-2xl"></i>
            </a>
            <button id="header-search-btn" type="button" aria-label="খুঁজুন" class="text-gray-500 dark:text-gray-400">
                <i class="fa-solid fa-magnifying-glass text-xl"></i>
            </button>
        </div>
        <div id="header-search-box" class="hidden items-center gap-3 px-5 py-3">
            <i class="fa-solid fa-magnifying-glass text-gray-400 dark:text-gray-500"></i>
            <input id="header-search-input" type="text" placeholder="বই, লেখক বা বিভাগ দিয়ে খুঁজুন..." autocomplete="off"
                   class="flex-1 min-w-0 bg-transparent outline-none border-none text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500">
            <button id="header-search-close-btn" type="button" aria-label="বন্ধ করুন" class="text-gray-500 dark:text-gray-400 shrink-0">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
    </header>
    <!-- header fixed হওয়ায় নিচের কনটেন্টের জন্য একই উচ্চতার একটি spacer -->
    <div id="header-spacer"></div>

    <!-- SIDEBAR -->
    <div id="sidebar-overlay"></div>
    <aside id="sidebar">
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-[#1f1f1f]">
            <div class="flex items-center gap-2">
                <span style="color:#c0392b;"><i class="fa-solid fa-swatchbook text-2xl"></i></span>
                <span class="text-2xl font-bold text-gray-800 dark:text-gray-100" style="line-height:1;">পাঠক <span class="font-light text-gray-400 dark:text-gray-500">ঘর</span></span>
            </div>
            <button id="sidebar-close-btn" type="button" aria-label="বন্ধ করুন" class="text-gray-500 dark:text-gray-400">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <!-- একেবারে নিচে বসবে -->
        <div id="sidebar-bottom">
            <div class="mx-4 border-t border-gray-200 dark:border-gray-700"></div>

            <!-- Links (পাশাপাশি) -->
            <div id="sidebar-links" class="px-4 py-3">
                <a href="/about" class="text-sm text-gray-700 dark:text-gray-200 active:text-brand-500">সম্পর্কে</a>
                <a href="/contact" class="text-sm text-gray-700 dark:text-gray-200 active:text-brand-500">যোগাযোগ</a>
                <a href="/policy" class="text-sm text-gray-700 dark:text-gray-200 active:text-brand-500">শর্তাবলী</a>
            </div>

            <!-- Visit counter + Social icons (ডানে) -->
            <div class="flex items-center justify-between px-4 pb-4">
                <span id="pg-visit-counter" class="pg-visit-pill"><i class="fa-solid fa-arrow-trend-up"></i> <b>**</b> <span class="pg-sep">|</span> <b>**</b></span>
                <div id="sidebar-social" class="flex items-center gap-3">
                    <a href="https://facebook.com/pathokghar" target="_blank" rel="noopener" aria-label="Facebook"
                       class="flex items-center justify-center" style="width:36px;height:36px;color:#1877f2;font-size:1.25rem;">
                        <i class="fa-brands fa-facebook"></i>
                    </a>
                    <a href="https://t.me/pathokghar" target="_blank" rel="noopener" aria-label="Telegram"
                       class="flex items-center justify-center" style="width:36px;height:36px;color:#229ed9;font-size:1.25rem;">
                        <i class="fa-brands fa-telegram"></i>
                    </a>
                </div>
            </div>
        </div>
    </aside>

    <script>
    (function() {
        var menuBtn = document.getElementById('menu-btn');
        var closeBtn = document.getElementById('sidebar-close-btn');
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('sidebar-overlay');

        // Sidebar UI শুধু show/hide করে, history নিয়ে কিছু করে না
        function showSidebarUI() {
            sidebar.classList.add('open');
            overlay.classList.add('open');
            document.body.classList.add('sidebar-locked');
        }
        function hideSidebarUI() {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
            document.body.classList.remove('sidebar-locked');
        }

        // মেনু খোলার সময় history-তে #sidebar hash push করা হয়, যাতে
        // Android back key চাপলে (browser popstate ট্রিগার করে) sidebar বন্ধ হয়ে যায়।
        function openSidebar() {
            var siteHeader = document.getElementById('site-header');
            if (siteHeader) siteHeader.classList.remove('header-hidden');
            showSidebarUI();
            if (location.hash !== '#sidebar') {
                history.pushState({ sidebarOpen: true }, '', '#sidebar');
            }
        }
        // X বা overlay ট্যাপ করলে history.back() কল হয় (যদি #sidebar hash থাকে),
        // যাতে পরে ব্যবহারকারীকে সাইট থেকে বেরোতে extra একটা back press না লাগে।
        function closeSidebar() {
            if (location.hash === '#sidebar') {
                history.back();
            } else {
                hideSidebarUI();
            }
        }

        // Back key / browser back বাটনে popstate ফায়ার হয় — তখন sidebar বন্ধ করে দাও
        window.addEventListener('popstate', function() {
            hideSidebarUI();
        });

        menuBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);
    })();
    </script>

    <script>
    // Header-এর ভেতরে inline search box টগল করা
    (function() {
        var defaultRow = document.getElementById('header-default');
        var searchBox = document.getElementById('header-search-box');
        var searchBtn = document.getElementById('header-search-btn');
        var closeBtn = document.getElementById('header-search-close-btn');
        var searchInput = document.getElementById('header-search-input');

        function openHeaderSearch() {
            defaultRow.classList.add('hidden');
            searchBox.classList.remove('hidden');
            searchBox.classList.add('flex');
            searchInput.value = '';
            searchInput.focus();
        }
        function closeHeaderSearch() {
            searchBox.classList.add('hidden');
            searchBox.classList.remove('flex');
            defaultRow.classList.remove('hidden');
        }
        function submitHeaderSearch() {
            var q = searchInput.value.trim();
            if (q) {
                window.location.href = '/search.html?q=' + encodeURIComponent(q);
            }
        }

        searchBtn.addEventListener('click', openHeaderSearch);
        closeBtn.addEventListener('click', closeHeaderSearch);
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitHeaderSearch();
            if (e.key === 'Escape') closeHeaderSearch();
        });
    })();
    </script>

    <script>
    (function() {
        var header = document.getElementById('site-header');
        var spacer = document.getElementById('header-spacer');

        function setSpacerHeight() {
            spacer.style.height = header.offsetHeight + 'px';
        }
        setSpacerHeight();
        window.addEventListener('resize', setSpacerHeight);

        var lastScrollY = window.pageYOffset;
        var ticking = false;
        var threshold = 8; // ছোটখাটো scroll jitter এড়াতে

        function onScroll() {
            var currentScrollY = window.pageYOffset;
            var diff = currentScrollY - lastScrollY;

            // একদম উপরে থাকলে সবসময় header দেখাও
            if (currentScrollY <= header.offsetHeight) {
                header.classList.remove('header-hidden');
            } else if (Math.abs(diff) > threshold) {
                if (diff > 0) {
                    // নিচের দিকে স্ক্রল — hide
                    header.classList.add('header-hidden');
                } else {
                    // উপরের দিকে স্ক্রল — show
                    header.classList.remove('header-hidden');
                }
                lastScrollY = currentScrollY;
            }
            ticking = false;
        }

        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(onScroll);
                ticking = true;
            }
        }, { passive: true });

        // sidebar খোলা থাকলে header hide না করা (menu icon দরকার হতে পারে)
        window.addEventListener('popstate', function() {
            header.classList.remove('header-hidden');
        });
    })();
    </script>

    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0">
        {{content}}
    </main>

    <!-- BOTTOM TAB BAR (floating pill, mobile app style) -->
    <nav class="bottom-tab-bar">
        <a href="/" data-tab-path="/" class="bottom-tab-item bottom-tab-btn" aria-label="বই">
            <i class="fa-solid fa-house"></i>
        </a>
        <a href="/authors/" data-tab-path="/authors/" class="bottom-tab-item bottom-tab-btn" aria-label="লেখক">
            <i class="fa-solid fa-user-pen"></i>
        </a>
        <a href="/categories/" data-tab-path="/categories/" class="bottom-tab-item bottom-tab-btn" aria-label="বিভাগ">
            <i class="fa-solid fa-layer-group"></i>
        </a>
        <a href="/blogs/" data-tab-path="/blogs/" class="bottom-tab-item bottom-tab-btn" aria-label="ব্লগ">
            <i class="fa-brands fa-hashnode"></i>
        </a>
    </nav>
    <script>
        (function() {
            var path = window.location.pathname;
            var rules = {
                '/': /^\/((book|books)(\/.*)?)?$/,
                '/authors/': /^\/(author|authors)(\/.*)?$/,
                '/categories/': /^\/(category|categories)(\/.*)?$/,
                '/blogs/': /^\/(blog|blogs)(\/.*)?$/
            };
            document.querySelectorAll('.bottom-tab-btn').forEach(function(btn) {
                var tabPath = btn.getAttribute('data-tab-path');
                var re = rules[tabPath];
                if (re && re.test(path)) btn.classList.add('active');
            });
        })();
    </script>

    <script>
        // Visit counter — প্রতি পেজ লোড/রিফ্রেশে count বাড়বে
        (function () {
            const el = document.getElementById('pg-visit-counter');
            if (!el) return;
            const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
            const nums = el.querySelectorAll('b');
            fetch('/api/visits')
                .then(r => r.json())
                .then(data => {
                    nums[0].textContent = toBn(data.today);
                    nums[1].textContent = toBn(data.total);
                })
                .catch(() => { el.style.display = 'none'; });
        })();
    </script>

    <script>
        // Search
        function doSearch(query) {
            if (query.trim()) {
                window.location.href = '/search.html?q=' + encodeURIComponent(query.trim());
            }
        }
        const mainInput = document.getElementById('main-search-input');
        document.getElementById('main-search-btn').addEventListener('click', () => doSearch(mainInput.value));
        mainInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(mainInput.value); });
    </script>


</body>
