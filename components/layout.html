<!DOCTYPE html>
<html lang="bn">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}} - পাঠক ঘর</title>
    <meta name="description" content="{{page_description}}">
    <meta property="og:title" content="{{page_title}} - পাঠক ঘর">
    <meta property="og:description" content="{{page_description}}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#fff5f5',
                            100: '#fde8e6',
                            500: '#c0392b',
                            600: '#a93226'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#1a1a1b] dark:text-gray-200 flex flex-col min-h-screen">

    <!-- HERO SECTION (Wikipedia-style) -->
    <div class="flex flex-col items-center justify-center pt-12 pb-6 px-4 text-center">

        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tighter mb-2 leading-tight">
            <a href="https://pathokghar.pages.dev" class="hover:text-brand-500 active:text-brand-500 transition-colors">পাঠক <span class="font-light text-gray-400 dark:text-gray-500">ঘর</span></a>
        </h1>

        <!-- Date & Time -->
        <p id="datetime-display" class="text-sm text-gray-400 dark:text-gray-500 mb-4 tracking-wide"></p>

        <!-- Search box -->
        <div class="w-full max-w-xl relative flex items-center bg-white dark:bg-[#2d2d2d] border border-gray-200 dark:border-gray-600 rounded-full shadow-md focus-within:ring-2 focus-within:ring-brand-500 focus-within:border-transparent transition-all">
            <input id="main-search-input" type="text" placeholder="বই, লেখক বা বিষয় খুঁজুন..."
                class="flex-1 bg-transparent py-3 pl-5 pr-2 text-sm focus:outline-none text-gray-800 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 min-w-0">
            <button id="main-search-btn" class="bg-brand-500 hover:bg-brand-600 active:bg-brand-600 text-white px-5 py-2 rounded-full text-sm font-medium transition-colors shrink-0 mr-1">
                খুঁজুন
            </button>
        </div>

    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0">
        {{content}}
    </main>

    <!-- FOOTER -->
    <footer class="bg-white dark:bg-[#1a1a1b] border-t border-gray-200 dark:border-gray-700 mt-8">

        <!-- Categories + Authors -->
        <div class="max-w-6xl mx-auto px-6 pt-8 pb-4 grid grid-cols-2 md:grid-cols-4 gap-6">

            <div class="col-span-1 md:col-span-2">
                <p class="text-[11px] uppercase font-bold tracking-widest text-gray-400 dark:text-gray-500 mb-3">ক্যাটাগরি</p>
                <ul class="flex flex-wrap gap-2">
                    {{sidebar_categories}}
                </ul>
            </div>

            <div class="col-span-1 md:col-span-2">
                <p class="text-[11px] uppercase font-bold tracking-widest text-gray-400 dark:text-gray-500 mb-3">লেখক</p>
                <ul class="flex flex-wrap gap-2">
                    {{sidebar_authors}}
                </ul>
            </div>

        </div>

        <div class="border-t border-gray-100 dark:border-gray-800"></div>

        <!-- Logo + description + socials -->
        <div class="max-w-6xl mx-auto px-6 py-6">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-5">

                <span class="text-2xl md:text-3xl font-extrabold tracking-tight text-gray-800 dark:text-gray-100 text-center md:text-left shrink-0">
                    পাঠক <span class="font-light text-gray-400 dark:text-gray-500">ঘর</span>
                </span>

                <p class="text-sm text-gray-500 dark:text-gray-400 leading-relaxed text-center md:flex-1 md:px-8">
                    বাংলা সাহিত্যের এক ডিজিটাল পাঠাগার। বিনামূল্যে পড়ুন, ডাউনলোড করুন — যেকোনো সময়, যেকোনো জায়গা থেকে।
                </p>

                <div class="flex items-center justify-center md:justify-end gap-2 shrink-0">
                    <a href="#" aria-label="Twitter" class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-[#c0392b] hover:text-white transition-all">
                        <i class="fab fa-twitter text-sm"></i>
                    </a>
                    <a href="#" aria-label="Facebook" class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-[#c0392b] hover:text-white transition-all">
                        <i class="fab fa-facebook-f text-sm"></i>
                    </a>
                    <a href="#" aria-label="YouTube" class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-[#c0392b] hover:text-white transition-all">
                        <i class="fab fa-youtube text-sm"></i>
                    </a>
                    <a href="mailto:pathokghar@gmail.com" aria-label="Email" class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-[#c0392b] hover:text-white transition-all">
                        <i class="fas fa-envelope text-sm"></i>
                    </a>
                    <a href="#" aria-label="RSS" class="w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-gray-300 hover:bg-[#c0392b] hover:text-white transition-all">
                        <i class="fas fa-rss text-sm"></i>
                    </a>
                </div>

            </div>
        </div>

        <!-- Bottom bar -->
        <div class="border-t border-gray-200 dark:border-gray-700">
            <div class="max-w-6xl mx-auto px-6 py-3 pb-6 md:pb-3 flex flex-col md:flex-row items-center justify-between gap-2 text-[12px] text-gray-500 dark:text-gray-400">
                <div class="flex items-center gap-4">
                    <a href="#" class="hover:text-[#c0392b] transition-colors">সম্পর্কে</a>
                    <span class="text-gray-300 dark:text-gray-600">|</span>
                    <a href="#" class="hover:text-[#c0392b] transition-colors">যোগাযোগ</a>
                    <span class="text-gray-300 dark:text-gray-600">|</span>
                    <a href="#" class="hover:text-[#c0392b] transition-colors">গোপনীয়তা নীতি</a>
                </div>
                <p class="hidden md:block">
                    © Crafted by <a href="https://github.com/physarif" target="_blank" rel="noopener" class="text-[#c0392b] hover:text-[#a93226] transition-colors font-medium">Arif</a>
                    <span class="mx-1">·</span>
                    github.com/physarif
                </p>
            </div>
        </div>
    </footer>

    <script>
        // Date & Time (বঙ্গাব্দ)
        const bnDays = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
        const bnMonths = ['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];
        // Bangla month start dates (approximate, Gregorian)
        const bnMonthStarts = [
            [4,14],[5,15],[6,15],[7,16],[8,16],[9,16],
            [10,16],[11,15],[12,15],[1,14],[2,13],[3,14]
        ];
        function toBnNum(n) {
            return String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
        }
        function getBanglaDate(now) {
            const gMonth = now.getMonth() + 1;
            const gDay = now.getDate();
            const gYear = now.getFullYear();
            let bnMonth, bnDay, bnYear;
            // find current bangla month
            for (let i = 0; i < 12; i++) {
                const [m, d] = bnMonthStarts[i];
                const [nm, nd] = bnMonthStarts[(i + 1) % 12];
                const start = new Date(gYear, m - 1, d);
                let endYear = gYear;
                if (nm < m || (nm === m && nd < d)) endYear = gYear + 1;
                const end = new Date(endYear, nm - 1, nd);
                const cur = new Date(gYear, gMonth - 1, gDay);
                if (cur >= start && cur < end) {
                    bnMonth = i;
                    bnDay = Math.floor((cur - start) / 86400000) + 1;
                    // Bangla year = Gregorian year - 593 or 594
                    bnYear = (m >= 4) ? gYear - 593 : gYear - 594;
                    break;
                }
            }
            return { bnDay, bnMonth, bnYear };
        }
        function updateDateTime() {
            const now = new Date();
            const day = bnDays[now.getDay()];
            const { bnDay, bnMonth, bnYear } = getBanglaDate(now);
            const month = bnMonths[bnMonth];
            const h = toBnNum(String(now.getHours()).padStart(2,'0'));
            const m = toBnNum(String(now.getMinutes()).padStart(2,'0'));
            const s = toBnNum(String(now.getSeconds()).padStart(2,'0'));
            const el = document.getElementById('datetime-display');
            if (el) el.innerHTML =
                `<span class="text-gray-400 dark:text-gray-500">${day}, </span>` +
                `<span class="font-bold text-gray-600 dark:text-gray-300">${toBnNum(bnDay)}</span>` +
                `<span class="text-gray-400 dark:text-gray-500"> ${month} </span>` +
                `<span class="font-bold text-gray-600 dark:text-gray-300">${toBnNum(bnYear)}</span>` +
                `<span class="text-gray-400 dark:text-gray-500"> | </span>` +
                `<span class="font-bold text-gray-600 dark:text-gray-300">${h}:${m}:${s}</span>`;
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // Search
        function doSearch(query) {
            if (query.trim()) {
                window.location.href = '/search.html?q=' + encodeURIComponent(query.trim());
            }
        }
        const mainInput = document.getElementById('main-search-input');
        document.getElementById('main-search-btn').addEventListener('click', () => doSearch(mainInput.value));
        mainInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(mainInput.value); });
    </script>

</body>
</html>
