<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WFBP0HJMJV"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-WFBP0HJMJV');
    </script>
    <link rel="icon" type="image/webp" href="https://pathokghar.pages.dev/assets/photos/pathokghar-logo.webp">
    <link rel="apple-touch-icon" href="https://pathokghar.pages.dev/assets/photos/pathokghar-logo.webp">
    <title>{{full_title}}</title>
    <meta name="description" content="{{page_description}}">
    <meta name="robots" content="{{robots_meta}}">
    <link rel="canonical" href="{{page_url}}">
    <meta property="og:title" content="{{full_title}}">
    <meta property="og:description" content="{{page_description}}">
    <meta property="og:image" content="{{page_image}}">
    <meta property="og:url" content="{{page_url}}">
    <meta property="og:type" content="{{page_type}}">
    <meta property="og:site_name" content="পাঠক ঘর">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{full_title}}">
    <meta name="twitter:description" content="{{page_description}}">
    <meta name="twitter:image" content="{{page_image}}">
    <!-- আগে cdn.tailwindcss.com (runtime JIT) ব্যবহার হতো, যেটা FOUC/layout-shift
         করত। এখন GitHub Actions বিল্ড টাইমে precompile হওয়া static CSS। -->
    <link rel="stylesheet" href="/assets/css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Hero tab bar — solid pill buttons */
        .segment-track {
            display: flex;
            width: 100%;
            gap: 8px;
        }
        .segment-item {
            flex: 1;
            text-align: center;
            padding: 0.35rem 0.5rem;
            border-radius: 0;
            font-size: 0.9rem;
            font-weight: 400;
            color: #6b7280;
            text-decoration: none;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .dark .segment-item {
            color: #9ca3af;
            background: #2d2d2d;
            border-color: #4b5563;
        }
        .segment-item:active {
            background: #a93226;
            color: #ffffff;
            border-color: #a93226;
        }
        .dark .segment-item:active {
            background: #a93226;
            color: #ffffff;
            border-color: #a93226;
        }
        .segment-item.active {
            color: #ffffff;
            font-weight: 700;
            background: #c0392b;
            border-color: #c0392b;
        }
        .segment-item.active:hover { color: #ffffff; }
        .dark .segment-item.active {
            color: #ffffff;
            background: #c0392b;
            border-color: #c0392b;
        }
        .dark .segment-item.active:hover { color: #ffffff; }

        /* Category links — footer style, larger */
        .category-underline-list li { display: inline-flex; align-items: center; white-space: nowrap; }
        .category-underline-list li + li::before {
            content: '·';
            color: #9ca3af;
            font-size: 16px;
            margin: 0 5px;
            line-height: 1;
        }
        .dark .category-underline-list li + li::before { color: #4b5563; }
        .category-underline-list li.line-start::before { display: none !important; }
        .category-underline-list a {
            font-size: 17px;
            font-weight: 400;
            color: #c0392b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .category-underline-list a:hover { color: #a93226; text-decoration: underline; }
        .category-underline-list a:active,
        .category-underline-list a:focus { text-decoration: underline; outline: none; }
        .dark .category-underline-list a { color: #e57373; }
        .dark .category-underline-list a:hover,
        .dark .category-underline-list a:active { color: #f87171; text-decoration: underline; }

        /* Footer dot-separated links */
        .footer-dot-link {
            font-size: 14px;
            color: #c0392b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-dot-link:hover { color: #a93226; text-decoration: underline; }
        .footer-dot-link:active,
        .footer-dot-link:focus { text-decoration: underline; outline: none; }
        .dark .footer-dot-link { color: #e57373; }
        .dark .footer-dot-link:hover,
        .dark .footer-dot-link:active { color: #f87171; text-decoration: underline; }
        .footer-dot {
            color: #999;
            font-size: 16px;
            margin: 0 6px;
            line-height: 1;
        }
        /* Visit counter — retro LCD display */
        .pg-visit-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #1a0e0e;
            border-radius: 0;
            padding: 0.15rem 0.7rem;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
            font-family: 'Courier New', Consolas, monospace;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            color: #ff3b30;
            text-shadow: 0 0 8px rgba(255,59,48,0.75);
            white-space: nowrap;
        }
        .pg-visit-pill i { font-size: 0.7rem; color: #ff3b30; opacity: 0.85; }
        .pg-visit-pill .pg-sep { color: #ff3b30; margin: 0 0.05rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#1a1a1b] dark:text-gray-200 flex flex-col min-h-screen">

    <!-- HERO SECTION (Wikipedia-style) -->
    <div class="flex flex-col items-center justify-center pt-12 pb-2 px-4 text-center">

        <{{hero_tag}} class="text-4xl md:text-6xl font-extrabold tracking-tighter mb-2 leading-tight">
            <a href="https://pathokghar.pages.dev" class="hover:text-brand-500 active:text-brand-500 transition-colors">পাঠক <span class="font-light text-gray-400 dark:text-gray-500">ঘর</span></a>
        </{{hero_tag}}>

        <!-- Search box -->
        <div class="w-full max-w-xl relative flex items-center bg-white dark:bg-[#2d2d2d] border border-gray-200 dark:border-gray-600 rounded-full focus-within:ring-2 focus-within:ring-brand-500 focus-within:border-transparent transition-all">
            <input id="main-search-input" type="text" placeholder="বই, লেখক বা বিভাগ খুঁজুন..."
                class="flex-1 bg-transparent py-3 pl-5 pr-2 text-sm focus:outline-none text-gray-800 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 min-w-0">
            <button id="main-search-btn" class="bg-brand-500 hover:bg-brand-600 active:bg-brand-600 text-white px-5 py-2 rounded-full text-sm font-medium transition-colors shrink-0 mr-1">
                খুঁজুন
            </button>
        </div>

        <!-- Tab Bar (segmented control) -->
        <div class="segment-track mt-4 w-full max-w-xl">
            <a href="/" data-tab-path="/" class="hero-tab-btn segment-item">বই</a>
            <a href="/authors/" data-tab-path="/authors/" class="hero-tab-btn segment-item">লেখক</a>
            <a href="/categories/" data-tab-path="/categories/" class="hero-tab-btn segment-item">বিভাগ</a>
            <a href="/blogs/" data-tab-path="/blogs/" class="hero-tab-btn segment-item">ব্লগ</a>
        </div>
        <script>
        (function() {
            var path = window.location.pathname;
            var rules = {
                '/': /^\/((book|books)(\/.*)?)?$/,
                '/authors/': /^\/(author|authors)(\/.*)?$/,
                '/categories/': /^\/(category|categories)(\/.*)?$/,
                '/blogs/': /^\/(blog|blogs)(\/.*)?$/
            };
            document.querySelectorAll('.hero-tab-btn').forEach(function(btn) {
                var tabPath = btn.getAttribute('data-tab-path');
                var re = rules[tabPath];
                if (re && re.test(path)) btn.classList.add('active');
            });
        })();
        </script>

    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0">
        {{content}}
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-100 dark:bg-[#1f1f1f] border-t border-gray-300 dark:border-gray-700 mt-8">

        <!-- Brand row: always visible on mobile, hidden on desktop (icons move to bottom row) -->
        <div class="max-w-3xl mx-auto px-5 pt-6 pb-4 flex items-center justify-between">
            <div>
                <a href="https://pathokghar.pages.dev"
                   class="text-3xl font-extrabold tracking-tight text-gray-800 dark:text-gray-100 active:text-brand-500 transition-colors group">
                    <span class="group-active:text-brand-500 transition-colors">পাঠক</span> <span class="font-light text-gray-400 dark:text-gray-500">ঘর</span>
                </a>
                <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">বাংলা বইয়ের ডিজিটাল পাঠাগার।</p>
            </div>
            <!-- Social icons -->
            <div class="flex items-center gap-2">
                <a href="https://facebook.com/pathokghar" target="_blank" rel="noopener" aria-label="Facebook"
                   class="w-12 h-12 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-[#2a2a2a] flex items-center justify-center text-[#1877f2] hover:border-[#1877f2] transition-all">
                    <i class="fab fa-facebook-f text-lg"></i>
                </a>
                <a href="https://t.me/pathokghar" target="_blank" rel="noopener" aria-label="Telegram"
                   class="w-12 h-12 rounded-lg border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-[#2a2a2a] flex items-center justify-center text-[#229ed9] hover:border-[#229ed9] transition-all">
                    <i class="fab fa-telegram-plane text-lg"></i>
                </a>
            </div>
        </div>

        <!-- Divider -->
        <div class="max-w-3xl mx-auto px-5">
            <div class="border-t border-gray-300 dark:border-gray-700"></div>
        </div>

        <!-- Dot-separated links — mobile: wrap, desktop: single row -->
        <div class="max-w-3xl mx-auto px-5 py-3 flex flex-wrap md:flex-nowrap items-center justify-between gap-y-2">
            <!-- Links -->
            <div class="flex flex-wrap md:flex-nowrap items-center gap-y-1">
                <a href="/about" class="footer-dot-link">সম্পর্কে</a>
                <span class="footer-dot">·</span>
                <a href="/contact" class="footer-dot-link">যোগাযোগ</a>
                <span class="footer-dot">·</span>
                <a href="/policy" class="footer-dot-link">শর্তাবলী</a>
            </div>

            <!-- Visit counter -->
            <span id="pg-visit-counter" class="pg-visit-pill"><i class="fa-solid fa-arrow-trend-up"></i> <b>**</b> <span class="pg-sep">|</span> <b>**</b></span>

        </div>

    </footer>

    <script>
        // Visit counter — প্রতি পেজ লোড/রিফ্রেশে count বাড়বে
        (function () {
            const el = document.getElementById('pg-visit-counter');
            if (!el) return;
            const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
            const nums = el.querySelectorAll('b');
            fetch('/api/visits')
                .then(r => r.json())
                .then(data => {
                    nums[0].textContent = toBn(data.today);
                    nums[1].textContent = toBn(data.total);
                })
                .catch(() => { el.style.display = 'none'; });
        })();
    </script>

    <script>
        // Search
        function doSearch(query) {
            if (query.trim()) {
                window.location.href = '/search.html?q=' + encodeURIComponent(query.trim());
            }
        }
        const mainInput = document.getElementById('main-search-input');
        document.getElementById('main-search-btn').addEventListener('click', () => doSearch(mainInput.value));
        mainInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(mainInput.value); });
    </script>


</body>
</html>
