    <!-- Pure static CSS — কোনো build step লাগে না। আগে Tailwind CDN (runtime JIT,
         FOUC), তারপর CI-তে precompile হওয়া tailwind.css ব্যবহার হতো — এখন সেটা
         এক-বারের জন্য generate করে plain CSS হিসেবে commit করা হয়েছে। -->
    <link rel="stylesheet" href="/components/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <style>
        /* ── Base / reset ── */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #F0F3F8;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        * { -webkit-tap-highlight-color: transparent; }
        a { color: inherit; }
        ul { padding: 0; margin: 0; }

        /* ── JS-controlled state utilities (নাম বদলানো যাবে না — script এই
           ক্লাসগুলো classList দিয়ে টগল করে) ── */
        .hidden { display: none !important; }
        .flex { display: flex !important; }

        /* সাধারণ বড় আইকন সাইজ */
        .icon-lg { font-size: 1.25rem; }

        main { flex: 1 1 auto; min-width: 0; }

        /* ── Header (Telegram X স্টাইল — full-width icon row, day/light surface) ── */
        #site-header {
            border-bottom: 1px solid rgba(17,24,39,0.08);
            background: rgba(255,255,255,0.98);
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 3rem;
            box-sizing: border-box;
            padding: 0 0.5rem 0 0;
        }
        .header-right { display: flex; align-items: stretch; gap: 0; flex: 1 1 auto; height: 100%; }
        #header-search-btn, #header-search-close-btn {
            background: none; border: none; padding: 0; cursor: pointer;
            color: #1f2937;
        }
        .brand-name-light { font-weight: 300; color: #6b7280; }

        /* ── Header inline search box (header-এর ভেতরে টগল হয়) ── */
        .header-search-box {
            align-items: center;
            gap: 0.75rem;
            height: 3rem;
            box-sizing: border-box;
            padding: 0 1rem;
            position: relative;
        }
        .header-search-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            outline: none;
            border: none;
            color: #1f2937;
            font-size: 1rem;
        }
        .header-search-input::placeholder { color: rgba(17,24,39,0.45); }
        .header-search-suggest {
            display: none;
            position: absolute;
            left: 0; right: 0; top: 100%;
            background: #ffffff;
            border: 1px solid rgba(17,24,39,0.08);
            border-top: none;
            box-shadow: 0 8px 20px rgba(17,24,39,0.08);
            border-radius: 0 0 5px 5px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 60;
        }

        /* ── Footer (day/light surface — #ffffff surface, #F0F3F8 page bg reference) — মিনিমাল একলাইন ── */
        .site-footer {
            background: #ffffff;
            border-top: 1px solid rgba(17,24,39,0.08);
            margin-top: 1.5rem;
        }
        .footer-container { max-width: 48rem; margin: 0 auto; padding: 0 1.25rem; }
        .footer-row {
            padding: 0.85rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .footer-brand { font-size: 0.88rem; color: #6b7280; }
        .footer-brand strong { color: #1f2937; font-weight: 600; }
        .footer-links { display: flex; gap: 1rem; }
        .footer-links a { font-size: 0.78rem; color: #6b7280; text-decoration: none; transition: color 0.15s; }
        .footer-links a:hover, .footer-links a:active { color: #0B57CF; }

        /* হেডার ন্যাভ — Telegram X স্টাইল: full-width, সমান-দূরত্বের icon-only ট্যাব, active-এ underline */
        .header-nav-group {
            display: flex;
            align-items: stretch;
            justify-content: flex-start;
            flex: 1 1 auto;
            height: 100%;
            border: none;
            border-radius: 0;
            overflow: visible;
            position: relative;
        }
        /* pill ট্যাবগুলোর scrollable wrapper — জায়গা না হলে horizontal scroll হবে,
           এবং search আইকনের নিচ দিয়ে (পেছনে) ঢুকে যাবে */
        .header-nav-links {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            gap: 1rem;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            white-space: nowrap;
            padding-right: 3rem;
        }
        .header-nav-links::-webkit-scrollbar { display: none; }
        .header-nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            width: auto;
            height: 100%;
            border-right: none;
            color: rgba(17,24,39,0.6);
            text-decoration: none;
            position: relative;
        }
        .header-nav-btn:last-child { border-right: none; }
        /* text tab (হোম/লেখক/বিভাগ/ব্লগ) — pill background, vertically centered */
        .header-nav-links a.header-nav-btn {
            align-items: center;
            flex: 0 0 auto;
        }
        .header-nav-links a.header-nav-btn:first-child {
            margin-left: 0.5rem;
        }
/* সার্চ আইকন সবসময় ডান কোণায় ফিক্সড থাকবে, pill scroll করলে এর নিচ দিয়ে ঢুকে যাবে */
        #header-search-btn.header-nav-btn {
            position: absolute;
            right: 0;
            top: 0;
            flex: 0 0 auto;
            width: auto;
            height: 100%;
            padding: 0 0.5rem 0 1rem;
            z-index: 2;
            background: linear-gradient(to right, rgba(255,255,255,0) 0, rgba(255,255,255,0.98) 40%, rgba(255,255,255,0.98) 100%);
        }
        .header-nav-btn.active { background: transparent; }
        /* icon সরিয়ে শুধু নাম — home/লেখক/বিভাগ text-only ট্যাব, pill background সহ */
        .header-nav-label {
            display: inline-block;
            margin-left: 0;
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            padding: 0.2rem 0.8rem;
            border-radius: 5px;
            background: #C2D7FC;
            color: #1f2937;
            transition: background 0.15s, color 0.15s;
        }
        .header-nav-btn.active .header-nav-label {
            background: #0B57CF;
            color: #ffffff;
        }
        .header-nav-btn:active .header-nav-label {
            background: #0B57CF;
            color: #ffffff;
        }


        /* Floating (sticky) header — নিচে স্ক্রল করলে hide, উপরে স্ক্রল করলে show */
        #site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 220;
            transform: translateY(0);
            transition: transform 0.28s ease;
            will-change: transform;
            background: rgba(255,255,255,0.98) !important;
        }
        #site-header.header-hidden { transform: translateY(-100%); }

        /* Header search — Google-স্টাইল autosuggest dropdown */
        .hs-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.6rem 1rem;
            text-decoration: none;
            color: inherit;
        }
        .hs-item:hover, .hs-item.hs-active { background: #f3f4f6; }
        .hs-thumb {
            flex-shrink: 0;
            width: 2.1rem;
            height: 2.8rem;
            border-radius: 3px;
            object-fit: cover;
            background: #e5e7eb;
        }
        .hs-body { min-width: 0; flex: 1; }
        .hs-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: #1f2937;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hs-title b { color: #0B57CF; font-weight: 700; }
        .hs-meta {
            font-size: 0.76rem;
            color: #6b7280;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hs-more {
            display: block;
            text-align: center;
            padding: 0.6rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0B57CF;
            text-decoration: none;
            border-top: 1px solid rgba(17,24,39,0.08);
        }
    </style>
    <!-- থিম সবসময় day/light mode — dark mode বাদ দেওয়া হয়েছে, accent: #0B57CF -->
</head>
<body>

    <!-- TOP BAR -->
    <header id="site-header">
        <div id="header-default" class="header-row">
            <div class="header-right">
                <nav class="header-nav-group">
                    <div class="header-nav-links">
                        <a href="/" data-nav-path="/" class="header-nav-btn" aria-label="প্রধান পাতা">
                            <span class="header-nav-label">প্রধান পাতা</span>
                        </a>
                        <a href="/authors/" data-nav-path="/authors/" class="header-nav-btn" aria-label="লেখকগণ">
                            <span class="header-nav-label">লেখকগণ</span>
                        </a>
                        <a href="/categories/" data-nav-path="/categories/" class="header-nav-btn" aria-label="বিভাগসমূহ">
                            <span class="header-nav-label">বিভাগসমূহ</span>
                        </a>
                        <a href="/blogs/" data-nav-path="/blogs/" class="header-nav-btn" aria-label="ব্লগ পোস্ট">
                            <span class="header-nav-label">ব্লগ পোস্ট</span>
                        </a>
                    </div>
                    <button id="header-search-btn" type="button" class="header-nav-btn" aria-label="খুঁজুন">
                        <i class="fa-solid fa-magnifying-glass icon-lg"></i>
                    </button>
                </nav>
            </div>
        </div>
        <div id="header-search-box" class="hidden header-search-box">
            <input id="header-search-input" type="text" placeholder="বই, লেখক বা বিভাগ দিয়ে খুঁজুন..." autocomplete="off" class="header-search-input">
            <button id="header-search-close-btn" type="button" aria-label="বন্ধ করুন">
                <i class="fa-solid fa-xmark icon-lg"></i>
            </button>
            <div id="header-search-suggest" class="header-search-suggest"></div>
        </div>
    </header>
    <!-- header fixed হওয়ায় নিচের কনটেন্টের জন্য একই উচ্চতার একটি spacer -->
    <div id="header-spacer"></div>

    <script>
    // Inline search box টগল করা + live autosuggest — header-এ ব্যবহৃত হয়
    (function() {
        // ── Autosuggest ──
        // search-index.json (lightweight, cover/title/author/category) একবার
        // lazy-fetch হয় — প্রতিটা keystroke এ নয়, প্রথম টাইপ শুরু হলে।
        var indexData = null;
        var indexPromise = null;

        function esc(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function highlight(text, q) {
            var s = esc(text);
            var idx = s.toLowerCase().indexOf(q.toLowerCase());
            if (idx === -1) return s;
            return s.slice(0, idx) + '<b>' + s.slice(idx, idx + q.length) + '</b>' + s.slice(idx + q.length);
        }
        function loadIndex() {
            if (indexPromise) return indexPromise;
            indexPromise = fetch('/search-index.json')
                .then(function(r) { return r.ok ? r.json() : []; })
                .then(function(data) { indexData = data; return data; })
                .catch(function() { indexData = []; return []; });
            return indexPromise;
        }

        function initSearchBox(opts) {
            var defaultRow = opts.defaultRow;
            var searchBox = opts.searchBox;
            var searchBtn = opts.searchBtn;
            var closeBtn = opts.closeBtn;
            var searchInput = opts.searchInput;
            var suggestBox = opts.suggestBox;

            var debounceTimer = null;
            var activeIndex = -1;
            var currentItems = [];

            function openSearch() {
                defaultRow.classList.add('hidden');
                searchBox.classList.remove('hidden');
                searchBox.classList.add('flex');
                searchInput.value = '';
                searchInput.focus();
            }
            function closeSearch() {
                searchBox.classList.add('hidden');
                searchBox.classList.remove('flex');
                defaultRow.classList.remove('hidden');
                hideSuggestions();
            }
            function submitSearch() {
                var q = searchInput.value.trim();
                if (q) {
                    window.location.href = '/search.html?q=' + encodeURIComponent(q);
                }
            }

            searchBtn.addEventListener('click', openSearch);
            closeBtn.addEventListener('click', closeSearch);

            function hideSuggestions() {
                suggestBox.style.display = 'none';
                suggestBox.innerHTML = '';
                activeIndex = -1;
                currentItems = [];
            }

            function renderSuggestions(items, q) {
                currentItems = items;
                activeIndex = -1;
                if (!items.length) { hideSuggestions(); return; }
                var html = items.map(function(book) {
                    var meta = [book.author, book.category].filter(Boolean).join(' · ');
                    return '<a href="/book/' + book.slug + '.html" class="hs-item">'
                        + '<img src="' + esc(book.cover) + '" alt="" class="hs-thumb" loading="lazy">'
                        + '<div class="hs-body">'
                        + '<div class="hs-title">' + highlight(book.title, q) + '</div>'
                        + (meta ? '<div class="hs-meta">' + esc(meta) + '</div>' : '')
                        + '</div></a>';
                }).join('');
                html += '<a href="/search.html?q=' + encodeURIComponent(q) + '" class="hs-more">"' + esc(q) + '" এর সব ফলাফল দেখুন</a>';
                suggestBox.innerHTML = html;
                suggestBox.style.display = 'block';
            }

            function runSearch(q) {
                loadIndex().then(function(data) {
                    // input ততক্ষণে বদলে যায়নি কিনা চেক — race condition এড়াতে
                    if (searchInput.value.trim().toLowerCase() !== q.toLowerCase()) return;
                    var ql = q.toLowerCase();
                    var scored = [];
                    for (var i = 0; i < data.length; i++) {
                        var b = data[i];
                        var title = (b.title || '').toLowerCase();
                        var author = (b.author || '').toLowerCase();
                        var category = (b.category || '').toLowerCase();
                        var score = -1;
                        if (title.indexOf(ql) === 0) score = 3;
                        else if (title.indexOf(ql) !== -1) score = 2;
                        else if (author.indexOf(ql) !== -1 || category.indexOf(ql) !== -1) score = 1;
                        if (score > 0) scored.push({ book: b, score: score });
                    }
                    scored.sort(function(a, b) { return b.score - a.score; });
                    renderSuggestions(scored.slice(0, 6).map(function(s) { return s.book; }), q);
                });
            }

            searchInput.addEventListener('input', function() {
                var q = searchInput.value.trim();
                clearTimeout(debounceTimer);
                if (q.length < 2) { hideSuggestions(); return; }
                debounceTimer = setTimeout(function() { runSearch(q); }, 150);
            });

            searchInput.addEventListener('keydown', function(e) {
                var visible = suggestBox.style.display === 'block';
                if (e.key === 'ArrowDown' && visible) {
                    e.preventDefault();
                    activeIndex = Math.min(activeIndex + 1, currentItems.length - 1);
                    updateActive();
                } else if (e.key === 'ArrowUp' && visible) {
                    e.preventDefault();
                    activeIndex = Math.max(activeIndex - 1, -1);
                    updateActive();
                } else if (e.key === 'Enter') {
                    if (visible && activeIndex >= 0) {
                        e.preventDefault();
                        window.location.href = '/book/' + currentItems[activeIndex].slug + '.html';
                    } else {
                        submitSearch();
                    }
                } else if (e.key === 'Escape') {
                    if (visible) hideSuggestions();
                    else closeSearch();
                }
            });

            function updateActive() {
                var links = suggestBox.querySelectorAll('.hs-item');
                links.forEach(function(el, i) {
                    el.classList.toggle('hs-active', i === activeIndex);
                });
                if (activeIndex >= 0 && links[activeIndex]) {
                    links[activeIndex].scrollIntoView({ block: 'nearest' });
                }
            }

            document.addEventListener('click', function(e) {
                if (!searchBox.contains(e.target)) hideSuggestions();
            });
        }

        // Header-এর ভেতরের search box
        initSearchBox({
            defaultRow: document.getElementById('header-default'),
            searchBox: document.getElementById('header-search-box'),
            searchBtn: document.getElementById('header-search-btn'),
            closeBtn: document.getElementById('header-search-close-btn'),
            searchInput: document.getElementById('header-search-input'),
            suggestBox: document.getElementById('header-search-suggest')
        });
    })();
    </script>

    <script>
    (function() {
        var header = document.getElementById('site-header');
        var spacer = document.getElementById('header-spacer');

        function setSpacerHeight() {
            spacer.style.height = header.offsetHeight + 'px';
        }
        setSpacerHeight();
        window.addEventListener('resize', setSpacerHeight);

        var lastScrollY = window.pageYOffset;
        var ticking = false;
        var threshold = 8; // ছোটখাটো scroll jitter এড়াতে

        function onScroll() {
            var currentScrollY = window.pageYOffset;
            var diff = currentScrollY - lastScrollY;

            // একদম উপরে থাকলে সবসময় header দেখাও
            if (currentScrollY <= header.offsetHeight) {
                header.classList.remove('header-hidden');
            } else if (Math.abs(diff) > threshold) {
                if (diff > 0) {
                    // নিচের দিকে স্ক্রল — hide
                    header.classList.add('header-hidden');
                } else {
                    // উপরের দিকে স্ক্রল — show
                    header.classList.remove('header-hidden');
                }
                lastScrollY = currentScrollY;
            }
            ticking = false;
        }

        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(onScroll);
                ticking = true;
            }
        }, { passive: true });

    })();
    </script>

    <!-- MAIN CONTENT -->
    <main>
        {{content}}
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-container footer-row">
            <div class="footer-links">
                <a href="/about">সম্পর্কে</a>
                <a href="/contact">যোগাযোগ</a>
                <a href="/policy">শর্তাবলী</a>
            </div>
            <span class="footer-brand"><strong>পাঠক <span class="brand-name-light">ঘর</span></strong></span>
        </div>
    </footer>

    <script>
        // Footer copyright — বছর automatic (current year, বাংলা সংখ্যায়)
        (function () {
            const el = document.getElementById('footer-copyright-year');
            if (!el) return;
            const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
            el.textContent = toBn(new Date().getFullYear());
        })();
    </script>

    <script>
        (function() {
            var path = window.location.pathname;
            var rules = {
                '/': /^\/$/,
                '/authors/': /^\/authors\/?$/,
                '/categories/': /^\/categories\/?$/,
                '/blogs/': /^\/blogs\/?$/
            };
            document.querySelectorAll('.header-nav-btn').forEach(function(btn) {
                var navPath = btn.getAttribute('data-nav-path');
                var re = rules[navPath];
                if (re && re.test(path)) btn.classList.add('active');
            });
        })();
    </script>

    <script>
        // Visit counter — প্রতি পেজ লোড/রিফ্রেশে count বাড়বে
        (function () {
            const el = document.getElementById('pg-visit-counter');
            if (!el) return;
            const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
            const nums = el.querySelectorAll('b');
            fetch('/api/visits')
                .then(r => r.json())
                .then(data => {
                    nums[0].textContent = toBn(data.today);
                    nums[1].textContent = toBn(data.total);
                })
                .catch(() => { el.style.display = 'none'; });
        })();
    </script>




</body>
