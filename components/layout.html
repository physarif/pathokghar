<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WFBP0HJMJV"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-WFBP0HJMJV');
    </script>
    <link rel="icon" type="image/webp" href="https://pathokghar.com/assets/photos/pathokghar-logo.webp">
    <link rel="apple-touch-icon" href="https://pathokghar.com/assets/photos/pathokghar-logo.webp">
    <title>{{full_title}}</title>
    <meta name="description" content="{{page_description}}">
    <meta name="robots" content="{{robots_meta}}">
    <link rel="canonical" href="{{page_url}}">
    <meta property="og:title" content="{{full_title}}">
    <meta property="og:description" content="{{page_description}}">
    <meta property="og:image" content="{{page_image}}">
    <meta property="og:url" content="{{page_url}}">
    <meta property="og:type" content="{{page_type}}">
    <meta property="og:site_name" content="পাঠক ঘর">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{full_title}}">
    <meta name="twitter:description" content="{{page_description}}">
    <meta name="twitter:image" content="{{page_image}}">
    <!-- Pure static CSS — কোনো build step লাগে না। আগে Tailwind CDN (runtime JIT,
         FOUC), তারপর CI-তে precompile হওয়া tailwind.css ব্যবহার হতো — এখন সেটা
         এক-বারের জন্য generate করে plain CSS হিসেবে commit করা হয়েছে। -->
    <link rel="stylesheet" href="/components/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <style>
        /* ── Base / reset ── */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .dark body { background: #1a1a1b; color: #e5e7eb; }
        a { color: inherit; }
        ul { padding: 0; margin: 0; }

        /* ── JS-controlled state utilities (নাম বদলানো যাবে না — script এই
           ক্লাসগুলো classList দিয়ে টগল করে) ── */
        .hidden { display: none !important; }
        .flex { display: flex !important; }

        /* সাধারণ বড় আইকন সাইজ */
        .icon-lg { font-size: 1.5rem; }

        main { flex: 1 1 auto; min-width: 0; }

        /* ── Header ── */
        #site-header {
            border-bottom: 1px solid #e5e7eb;
            background: #ffffff;
        }
        .dark #site-header { border-bottom-color: #374151; }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
        }
        .header-left { display: flex; align-items: center; gap: 0.75rem; }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        #menu-btn, #sidebar-search-btn, #sidebar-search-close-btn {
            background: none; border: none; padding: 0; cursor: pointer;
            color: #6b7280;
        }
        .dark #menu-btn, .dark #sidebar-search-btn, .dark #sidebar-search-close-btn { color: #9ca3af; }
        .brand-link { display: flex; align-items: center; gap: 0.5rem; color: #c0392b; text-decoration: none; }
        .brand-name { font-size: 1.5rem; font-weight: 700; color: #1f2937; line-height: 1; }
        .dark .brand-name { color: #f3f4f6; }
        .brand-name-light { font-weight: 300; color: #9ca3af; }
        .dark .brand-name-light { color: #6b7280; }

        /* ── Sidebar header / search ── */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            border-bottom: 1px solid #e5e7eb;
            background: #ffffff;
        }
        .dark .sidebar-header { border-bottom-color: #374151; background: #1f1f1f; }
        .sidebar-brand { display: flex; align-items: center; gap: 0.5rem; }
        .sidebar-brand-icon { color: #c0392b; }
        .sidebar-search-box {
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            border-bottom: 1px solid #e5e7eb;
            background: #ffffff;
            position: relative;
        }
        .dark .sidebar-search-box { border-bottom-color: #374151; background: #1f1f1f; }
        .sidebar-search-icon { font-size: 1.25rem; color: #9ca3af; }
        .dark .sidebar-search-icon { color: #6b7280; }
        .sidebar-search-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            outline: none;
            border: none;
            color: #1f2937;
        }
        .dark .sidebar-search-input { color: #f3f4f6; }
        .sidebar-search-input::placeholder { color: #9ca3af; }
        .dark .sidebar-search-input::placeholder { color: #6b7280; }
        .sidebar-search-suggest {
            display: none;
            position: absolute;
            left: 0; right: 0; top: 100%;
            background: #fff;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-height: 70vh;
            overflow-y: auto;
            z-index: 60;
        }

        /* ── Sidebar collapsible sections ── */
        .sidebar-toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid #e5e7eb;
        }
        .dark .sidebar-toggle-row { border-bottom-color: #374151; }
        .sidebar-toggle-label { font-size: 1rem; font-weight: 700; color: #1f2937; }
        .dark .sidebar-toggle-label { color: #f3f4f6; }
        .sidebar-toggle-chevron { color: #6b7280; font-size: 0.875rem; }
        .dark .sidebar-toggle-chevron { color: #9ca3af; }
        .sidebar-collapsible-list {
            padding: 0 0.5rem 0.25rem;
            list-style: none;
            margin: 0;
            max-height: 45vh;
            overflow-y: auto;
        }
        .sidebar-divider { margin: 0 1rem; border-top: 1px solid #e5e7eb; }
        .dark .sidebar-divider { border-top-color: #374151; }
        .sidebar-links-row { padding: 0.75rem 1rem; }
        .sidebar-links-row a {
            font-size: 0.875rem;
            color: #374151;
            text-decoration: none;
            margin-right: 0.75rem;
        }
        .dark .sidebar-links-row a { color: #e5e7eb; }
        .sidebar-links-row a:active { color: #c0392b; }
        .sidebar-bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem 1rem;
        }
        #sidebar-social { display: flex; align-items: center; gap: 0.75rem; }
        .sidebar-social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            font-size: 1.25rem;
        }
        .sidebar-social-icon.fb { color: #1877f2; }
        .sidebar-social-icon.tg { color: #229ed9; }

        /* ── Footer ── */
        .site-footer {
            background: #f3f4f6;
            border-top: 1px solid #d1d5db;
            margin-top: 1.5rem;
        }
        .dark .site-footer { background: #1f1f1f; border-top-color: #374151; }
        .footer-container { max-width: 48rem; margin: 0 auto; padding: 0 1.25rem; }
        .footer-brand-row {
            padding-top: 1.25rem;
            padding-bottom: 0.9375rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .footer-brand-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .footer-brand-link { display: flex; align-items: center; text-decoration: none; }
        .footer-tagline {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.375rem;
            letter-spacing: 0.02em;
        }
        .dark .footer-tagline { color: #9ca3af; }
        .footer-social-row {
            display: flex;
            align-items: center;
            align-self: center;
            gap: 0.5rem;
        }
        .footer-divider { border-top: 1px solid #d1d5db; }
        .dark .footer-divider { border-top-color: #374151; }
        .footer-links-row {
            padding-top: 0.375rem;
            padding-bottom: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            row-gap: 0.5rem;
        }
        .footer-dot-links { display: flex; flex-wrap: wrap; align-items: center; row-gap: 0.25rem; }
        .footer-copyright {
            font-size: 14px;
            color: #9ca3af;
            white-space: nowrap;
        }
        .dark .footer-copyright { color: #6b7280; }
        @media (min-width: 768px) {
            .footer-links-row { flex-wrap: nowrap; }
            .footer-dot-links { flex-wrap: nowrap; }
        }

        /* Category links — footer style, larger */
        .category-underline-list li { display: inline-flex; align-items: center; white-space: nowrap; }
        .category-underline-list li + li::before {
            content: '·';
            color: #9ca3af;
            font-size: 16px;
            margin: 0 5px;
            line-height: 1;
        }
        .dark .category-underline-list li + li::before { color: #4b5563; }
        .category-underline-list li.line-start::before { display: none !important; }
        .category-underline-list a {
            font-size: 17px;
            font-weight: 400;
            color: #c0392b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .category-underline-list a:hover { color: #a93226; text-decoration: underline; }
        .category-underline-list a:active,
        .category-underline-list a:focus { text-decoration: underline; outline: none; }
        .dark .category-underline-list a { color: #e57373; }
        .dark .category-underline-list a:hover,
        .dark .category-underline-list a:active { color: #f87171; text-decoration: underline; }

        /* Footer dot-separated links */
        .footer-dot-link {
            font-size: 14px;
            color: #c0392b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-dot-link:hover { color: #a93226; text-decoration: underline; }
        .footer-dot-link:active,
        .footer-dot-link:focus { text-decoration: underline; outline: none; }
        .dark .footer-dot-link { color: #e57373; }
        .dark .footer-dot-link:hover,
        .dark .footer-dot-link:active { color: #f87171; text-decoration: underline; }
        .footer-dot {
            color: #999;
            font-size: 16px;
            margin: 0 6px;
            line-height: 1;
        }
        /* Footer social icons — সাদা বক্স + হালকা বর্ডার (arbitrary Tailwind
           ক্লাসের বদলে plain CSS, যাতে precompiled build-এ নিশ্চিতভাবে রেন্ডার হয়) */
        .footer-social-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: 2px solid #d1d5db;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: border-color 0.15s;
        }
        .dark .footer-social-icon { background: #2a2a2a; border-color: #4b5563; }
        .footer-social-icon.fb { color: #1877f2; }
        .footer-social-icon.fb:hover { border-color: #1877f2; }
        .footer-social-icon.tg { color: #229ed9; }
        .footer-social-icon.tg:hover { border-color: #229ed9; }
        /* Visit counter — retro LCD display */
        .pg-visit-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #1a0e0e;
            border-radius: 5px;
            padding: 0.15rem 0.7rem;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
            font-family: 'Courier New', Consolas, monospace;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            color: #ff3b30;
            text-shadow: 0 0 8px rgba(255,59,48,0.75);
            white-space: nowrap;
        }
        .pg-visit-pill i { font-size: 0.7rem; color: #ff3b30; opacity: 0.85; }
        .pg-visit-pill .pg-sep { color: #ff3b30; margin: 0 0.05rem; }

        /* হেডার ন্যাভ — গ্রুপড আউটলাইন বক্স (ডিজাইন ২) */
        .header-nav-group {
            display: flex;
            align-items: center;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }
        .dark .header-nav-group { border-color: #374151; }
        .header-nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 36px;
            border-right: 1px solid #e5e7eb;
            color: #6b7280;
            text-decoration: none;
        }
        .dark .header-nav-btn { border-right-color: #374151; color: #9ca3af; }
        .header-nav-btn:last-child { border-right: none; }
        .header-nav-btn.active { color: #c0392b !important; background: #fdecea; }
        .dark .header-nav-btn.active { color: #e57373 !important; background: #3a2323; }


        /* Sidebar (plain CSS — precompiled tailwind.css এ এই ক্লাসগুলো নাও থাকতে পারে) */
        #sidebar-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 240;
            opacity: 0; visibility: hidden;
            transition: opacity 0.25s;
        }
        #sidebar-overlay.open { opacity: 1; visibility: visible; }
        #sidebar {
            position: fixed; top: 0; left: 0;
            height: 100%; width: 260px; max-width: 80%;
            background: rgba(255,255,255,0.95);
            z-index: 250;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            box-shadow: 2px 0 12px rgba(0,0,0,0.15);
            overflow-y: auto;
        }
        .dark #sidebar {
            background: rgba(31,31,31,0.95);
        }
        #sidebar.open { transform: translateX(0); }

        /* Sidebar layout — নিচের সেকশন একেবারে বটমে বসানোর জন্য plain CSS
           (Tailwind-এর mt-auto/flex-col precompiled CSS-এ নাও থাকতে পারে) */
        #sidebar { display: flex; flex-direction: column; }
        #sidebar-bottom { margin-top: auto; }

        /* বিভাগসমূহ ও লেখকগণ accordion */
        #sidebar-categories-chevron, #sidebar-authors-chevron { transition: transform 0.2s ease; }
        #sidebar-categories-list li a, #sidebar-authors-list li a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
            color: #4b5563;
            text-decoration: none;
            border-radius: 6px;
        }
        #sidebar-categories-list li a:hover, #sidebar-authors-list li a:hover { background: #fff5f5; color: #c0392b; }
        .dark #sidebar-categories-list li a, .dark #sidebar-authors-list li a { color: #d1d5db; }
        .dark #sidebar-categories-list li a:hover, .dark #sidebar-authors-list li a:hover { background: #2a1f1f; color: #e57373; }
        /* সংখ্যা — bracket-সহ, ডান পাশে (বিভাগে বই সংখ্যা, লেখকে বই সংখ্যা) */
        #sidebar-categories-list li a .cat-count, #sidebar-authors-list li a .cat-count {
            font-size: 13px;
            color: #9ca3af;
            flex-shrink: 0;
        }
        #sidebar-categories-list li a .cat-count::before, #sidebar-authors-list li a .cat-count::before { content: '('; }
        #sidebar-categories-list li a .cat-count::after, #sidebar-authors-list li a .cat-count::after { content: ')'; }
        .dark #sidebar-categories-list li a .cat-count, .dark #sidebar-authors-list li a .cat-count { color: #6b7280; }
        /* বর্ণমালা group header (অ, আ, ই...) — scroll করার সময় sticky থাকবে */
        .sidebar-group-header {
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 0.3rem 0.75rem 0.15rem;
            font-size: 0.75rem;
            font-weight: 800;
            color: #c0392b;
            letter-spacing: 0.02em;
            background: rgba(255,255,255,0.95);
        }
        .dark .sidebar-group-header { color: #f87171; background: rgba(31,31,31,0.95); }

        /* Floating (sticky) header — নিচে স্ক্রল করলে hide, উপরে স্ক্রল করলে show */
        #site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 220;
            transform: translateY(0);
            transition: transform 0.28s ease;
            will-change: transform;
            background: rgba(255,255,255,0.95) !important;
        }
        .dark #site-header { background: rgba(31,31,31,0.95) !important; }
        #site-header.header-hidden { transform: translateY(-100%); }

        /* Header search — Google-স্টাইল autosuggest dropdown */
        #sidebar-search-suggest { background: rgba(255,255,255,0.95); }
        .dark #sidebar-search-suggest { background: rgba(35,35,42,0.95); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .hs-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.6rem 1rem;
            text-decoration: none;
            color: inherit;
        }
        .hs-item:hover, .hs-item.hs-active { background: #f3f4f6; }
        .dark .hs-item:hover, .dark .hs-item.hs-active { background: #2f2f38; }
        .hs-thumb {
            flex-shrink: 0;
            width: 2.1rem;
            height: 2.8rem;
            border-radius: 3px;
            object-fit: cover;
            background: #e5e7eb;
        }
        .dark .hs-thumb { background: #374151; }
        .hs-body { min-width: 0; flex: 1; }
        .hs-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: #1f2937;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dark .hs-title { color: #f3f4f6; }
        .hs-title b { color: #c0392b; font-weight: 700; }
        .dark .hs-title b { color: #f87171; }
        .hs-meta {
            font-size: 0.76rem;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hs-more {
            display: block;
            text-align: center;
            padding: 0.6rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #c0392b;
            text-decoration: none;
            border-top: 1px solid #f3f4f6;
        }
        .dark .hs-more { color: #f87171; border-top-color: #2f2f38; }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header id="site-header">
        <div id="header-default" class="header-row">
            <div class="header-left">
                <button id="menu-btn" type="button" aria-label="মেনু">
                    <i class="fa-solid fa-bars icon-lg"></i>
                </button>
                <a href="https://pathokghar.com" aria-label="পাঠক ঘর" class="brand-link">
                    <span class="brand-name">পাঠক <span class="brand-name-light">ঘর</span></span>
                </a>
            </div>
            <div class="header-right">
                <nav class="header-nav-group">
                    <a href="/" data-nav-path="/" class="header-nav-btn" aria-label="হোম">
                        <i class="fa-solid fa-house icon-lg"></i>
                    </a>
                    <a href="/authors/" data-nav-path="/authors/" class="header-nav-btn" aria-label="লেখক">
                        <i class="fa-solid fa-user-graduate icon-lg"></i>
                    </a>
                    <a href="/categories/" data-nav-path="/categories/" class="header-nav-btn" aria-label="বিভাগ">
                        <i class="fa-brands fa-hashnode icon-lg"></i>
                    </a>
                </nav>
            </div>
        </div>
    </header>
    <!-- header fixed হওয়ায় নিচের কনটেন্টের জন্য একই উচ্চতার একটি spacer -->
    <div id="header-spacer"></div>

    <!-- SIDEBAR -->
    <div id="sidebar-overlay"></div>
    <aside id="sidebar">
        <div id="sidebar-header-default" class="sidebar-header">
            <div class="sidebar-brand">
                <span class="sidebar-brand-icon"><i class="fa-solid fa-swatchbook icon-lg"></i></span>
                <span class="brand-name">পাঠক <span class="brand-name-light">ঘর</span></span>
            </div>
            <button id="sidebar-search-btn" type="button" aria-label="খুঁজুন">
                <i class="fa-solid fa-magnifying-glass icon-lg"></i>
            </button>
        </div>
        <div id="sidebar-search-box" class="hidden sidebar-search-box">
            <i class="fa-solid fa-magnifying-glass sidebar-search-icon"></i>
            <input id="sidebar-search-input" type="text" placeholder="বই, লেখক বা বিভাগ দিয়ে খুঁজুন..." autocomplete="off" class="sidebar-search-input">
            <button id="sidebar-search-close-btn" type="button" aria-label="বন্ধ করুন">
                <i class="fa-solid fa-xmark icon-lg"></i>
            </button>
            <div id="sidebar-search-suggest" class="sidebar-search-suggest"></div>
        </div>

        <!-- বিভাগসমূহ — collapsible, সব category বর্ণমালা অনুসারে -->
        <div id="sidebar-categories-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="sidebar-categories-list" class="sidebar-toggle-row">
            <span class="sidebar-toggle-label">বিভাগসমূহ</span>
            <i id="sidebar-categories-chevron" class="fa-solid fa-chevron-down sidebar-toggle-chevron"></i>

    <script>
    (function() {
        var menuBtn = document.getElementById('menu-btn');
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('sidebar-overlay');

        // Sidebar UI শুধু show/hide করে, history নিয়ে কিছু করে না
        function showSidebarUI() {
            sidebar.classList.add('open');
            overlay.classList.add('open');
            document.body.classList.add('sidebar-locked');
        }
        function hideSidebarUI() {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
            document.body.classList.remove('sidebar-locked');
        }

        // মেনু খোলার সময় history-তে #sidebar hash push করা হয়, যাতে
        // Android back key চাপলে (browser popstate ট্রিগার করে) sidebar বন্ধ হয়ে যায়।
        function openSidebar() {
            var siteHeader = document.getElementById('site-header');
            if (siteHeader) siteHeader.classList.remove('header-hidden');
            showSidebarUI();
            if (location.hash !== '#sidebar') {
                history.pushState({ sidebarOpen: true }, '', '#sidebar');
            }
        }
        // X বা overlay ট্যাপ করলে history.back() কল হয় (যদি #sidebar hash থাকে),
        // যাতে পরে ব্যবহারকারীকে সাইট থেকে বেরোতে extra একটা back press না লাগে।
        function closeSidebar() {
            if (location.hash === '#sidebar') {
                history.back();
            } else {
                hideSidebarUI();
            }
        }

        // Back key / browser back বাটনে popstate ফায়ার হয় — তখন sidebar বন্ধ করে দাও
        window.addEventListener('popstate', function() {
            hideSidebarUI();
        });

        if (menuBtn) menuBtn.addEventListener('click', openSidebar);
        overlay.addEventListener('click', closeSidebar);

        // বিভাগসমূহ accordion টগল
        var catToggle = document.getElementById('sidebar-categories-toggle');
        var catList = document.getElementById('sidebar-categories-list');
        var catChevron = document.getElementById('sidebar-categories-chevron');
        if (catToggle && catList) {
            catToggle.addEventListener('click', function() {
                var isOpen = catList.style.display !== 'none';
                catList.style.display = isOpen ? 'none' : 'block';
                catToggle.setAttribute('aria-expanded', String(!isOpen));
                if (catChevron) catChevron.style.transform = isOpen ? '' : 'rotate(180deg)';
            });
        }

        // লেখকগণ accordion টগল
        var authorToggle = document.getElementById('sidebar-authors-toggle');
        var authorList = document.getElementById('sidebar-authors-list');
        var authorChevron = document.getElementById('sidebar-authors-chevron');
        if (authorToggle && authorList) {
            authorToggle.addEventListener('click', function() {
                var isOpen = authorList.style.display !== 'none';
                authorList.style.display = isOpen ? 'none' : 'block';
                authorToggle.setAttribute('aria-expanded', String(!isOpen));
                if (authorChevron) authorChevron.style.transform = isOpen ? '' : 'rotate(180deg)';
            });
        }
    })();
    </script>

    <script>
    // Sidebar-এর ভেতরে inline search box টগল করা + live autosuggest
    (function() {
        var defaultRow = document.getElementById('sidebar-header-default');
        var searchBox = document.getElementById('sidebar-search-box');
        var searchBtn = document.getElementById('sidebar-search-btn');
        var closeBtn = document.getElementById('sidebar-search-close-btn');
        var searchInput = document.getElementById('sidebar-search-input');
        var suggestBox = document.getElementById('sidebar-search-suggest');

        function openHeaderSearch() {
            defaultRow.classList.add('hidden');
            searchBox.classList.remove('hidden');
            searchBox.classList.add('flex');
            searchInput.value = '';
            searchInput.focus();
        }
        function closeHeaderSearch() {
            searchBox.classList.add('hidden');
            searchBox.classList.remove('flex');
            defaultRow.classList.remove('hidden');
            hideSuggestions();
        }
        function submitHeaderSearch() {
            var q = searchInput.value.trim();
            if (q) {
                window.location.href = '/search.html?q=' + encodeURIComponent(q);
            }
        }

        searchBtn.addEventListener('click', openHeaderSearch);
        closeBtn.addEventListener('click', closeHeaderSearch);

        // ── Autosuggest ──
        // search-index.json (lightweight, cover/title/author/category) একবার
        // lazy-fetch হয় — প্রতিটা keystroke এ নয়, প্রথম টাইপ শুরু হলে।
        var indexData = null;
        var indexPromise = null;
        var debounceTimer = null;
        var activeIndex = -1;
        var currentItems = [];

        function esc(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function highlight(text, q) {
            var s = esc(text);
            var idx = s.toLowerCase().indexOf(q.toLowerCase());
            if (idx === -1) return s;
            return s.slice(0, idx) + '<b>' + s.slice(idx, idx + q.length) + '</b>' + s.slice(idx + q.length);
        }
        function loadIndex() {
            if (indexPromise) return indexPromise;
            indexPromise = fetch('/search-index.json')
                .then(function(r) { return r.ok ? r.json() : []; })
                .then(function(data) { indexData = data; return data; })
                .catch(function() { indexData = []; return []; });
            return indexPromise;
        }

        function hideSuggestions() {
            suggestBox.style.display = 'none';
            suggestBox.innerHTML = '';
            activeIndex = -1;
            currentItems = [];
        }

        function renderSuggestions(items, q) {
            currentItems = items;
            activeIndex = -1;
            if (!items.length) { hideSuggestions(); return; }
            var html = items.map(function(book) {
                var meta = [book.author, book.category].filter(Boolean).join(' · ');
                return '<a href="/book/' + book.slug + '.html" class="hs-item">'
                    + '<img src="' + esc(book.cover) + '" alt="" class="hs-thumb" loading="lazy">'
                    + '<div class="hs-body">'
                    + '<div class="hs-title">' + highlight(book.title, q) + '</div>'
                    + (meta ? '<div class="hs-meta">' + esc(meta) + '</div>' : '')
                    + '</div></a>';
            }).join('');
            html += '<a href="/search.html?q=' + encodeURIComponent(q) + '" class="hs-more">"' + esc(q) + '" এর সব ফলাফল দেখুন</a>';
            suggestBox.innerHTML = html;
            suggestBox.style.display = 'block';
        }

        function runSearch(q) {
            loadIndex().then(function(data) {
                // input ততক্ষণে বদলে যায়নি কিনা চেক — race condition এড়াতে
                if (searchInput.value.trim().toLowerCase() !== q.toLowerCase()) return;
                var ql = q.toLowerCase();
                var scored = [];
                for (var i = 0; i < data.length; i++) {
                    var b = data[i];
                    var title = (b.title || '').toLowerCase();
                    var author = (b.author || '').toLowerCase();
                    var category = (b.category || '').toLowerCase();
                    var score = -1;
                    if (title.indexOf(ql) === 0) score = 3;
                    else if (title.indexOf(ql) !== -1) score = 2;
                    else if (author.indexOf(ql) !== -1 || category.indexOf(ql) !== -1) score = 1;
                    if (score > 0) scored.push({ book: b, score: score });
                }
                scored.sort(function(a, b) { return b.score - a.score; });
                renderSuggestions(scored.slice(0, 6).map(function(s) { return s.book; }), q);
            });
        }

        searchInput.addEventListener('input', function() {
            var q = searchInput.value.trim();
            clearTimeout(debounceTimer);
            if (q.length < 2) { hideSuggestions(); return; }
            debounceTimer = setTimeout(function() { runSearch(q); }, 150);
        });

        searchInput.addEventListener('keydown', function(e) {
            var visible = suggestBox.style.display === 'block';
            if (e.key === 'ArrowDown' && visible) {
                e.preventDefault();
                activeIndex = Math.min(activeIndex + 1, currentItems.length - 1);
                updateActive();
            } else if (e.key === 'ArrowUp' && visible) {
                e.preventDefault();
                activeIndex = Math.max(activeIndex - 1, -1);
                updateActive();
            } else if (e.key === 'Enter') {
                if (visible && activeIndex >= 0) {
                    e.preventDefault();
                    window.location.href = '/book/' + currentItems[activeIndex].slug + '.html';
                } else {
                    submitHeaderSearch();
                }
            } else if (e.key === 'Escape') {
                if (visible) hideSuggestions();
                else closeHeaderSearch();
            }
        });

        function updateActive() {
            var links = suggestBox.querySelectorAll('.hs-item');
            links.forEach(function(el, i) {
                el.classList.toggle('hs-active', i === activeIndex);
            });
            if (activeIndex >= 0 && links[activeIndex]) {
                links[activeIndex].scrollIntoView({ block: 'nearest' });
            }
        }

        document.addEventListener('click', function(e) {
            if (!searchBox.contains(e.target)) hideSuggestions();
        });
    })();
    </script>

    <script>
    (function() {
        var header = document.getElementById('site-header');
        var spacer = document.getElementById('header-spacer');

        function setSpacerHeight() {
            spacer.style.height = header.offsetHeight + 'px';
        }
        setSpacerHeight();
        window.addEventListener('resize', setSpacerHeight);

        var lastScrollY = window.pageYOffset;
        var ticking = false;
        var threshold = 8; // ছোটখাটো scroll jitter এড়াতে

        function onScroll() {
            var currentScrollY = window.pageYOffset;
            var diff = currentScrollY - lastScrollY;

            // একদম উপরে থাকলে সবসময় header দেখাও
            if (currentScrollY <= header.offsetHeight) {
                header.classList.remove('header-hidden');
            } else if (Math.abs(diff) > threshold) {
                if (diff > 0) {
                    // নিচের দিকে স্ক্রল — hide
                    header.classList.add('header-hidden');
                } else {
                    // উপরের দিকে স্ক্রল — show
                    header.classList.remove('header-hidden');
                }
                lastScrollY = currentScrollY;
            }
            ticking = false;
        }

        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(onScroll);
                ticking = true;
            }
        }, { passive: true });

        // sidebar খোলা থাকলে header hide না করা (menu icon দরকার হতে পারে)
        window.addEventListener('popstate', function() {
            header.classList.remove('header-hidden');
        });
    })();
    </script>

    <script>
        (function() {
            var path = window.location.pathname;
            var rules = {
                '/': /^\/((book|books)(\/.*)?)?$/,
                '/authors/': /^\/(author|authors)(\/.*)?$/,
                '/categories/': /^\/(category|categories)(\/.*)?$/
            };
            document.querySelectorAll('.header-nav-btn').forEach(function(btn) {
                var navPath = btn.getAttribute('data-nav-path');
                var re = rules[navPath];
                if (re && re.test(path)) btn.classList.add('active');
            });
        })();
    </script>

    <script>
        // Visit counter — প্রতি পেজ লোড/রিফ্রেশে count বাড়বে
        (function () {
            const el = document.getElementById('pg-visit-counter');
            if (!el) return;
            const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
            const nums = el.querySelectorAll('b');
            fetch('/api/visits')
                .then(r => r.json())
                .then(data => {
                    nums[0].textContent = toBn(data.today);
                    nums[1].textContent = toBn(data.total);
                })
                .catch(() => { el.style.display = 'none'; });
        })();
