    <!-- আগে cdn.tailwindcss.com (runtime JIT) ব্যবহার হতো, যেটা FOUC/layout-shift
         করত। এখন GitHub Actions বিল্ড টাইমে precompile হওয়া static CSS। -->
    <link rel="stylesheet" href="/assets/css/tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Category links — footer style, larger */
        .category-underline-list li { display: inline-flex; align-items: center; white-space: nowrap; }
        .category-underline-list li + li::before {
            content: '·';
            color: #9ca3af;
            font-size: 16px;
            margin: 0 5px;
            line-height: 1;
        }
        .dark .category-underline-list li + li::before { color: #4b5563; }
        .category-underline-list li.line-start::before { display: none !important; }
        .category-underline-list a {
            font-size: 17px;
            font-weight: 400;
            color: #c0392b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .category-underline-list a:hover { color: #a93226; text-decoration: underline; }
        .category-underline-list a:active,
        .category-underline-list a:focus { text-decoration: underline; outline: none; }
        .dark .category-underline-list a { color: #e57373; }
        .dark .category-underline-list a:hover,
        .dark .category-underline-list a:active { color: #f87171; text-decoration: underline; }

        /* Footer dot-separated links */
        .footer-dot-link {
            font-size: 14px;
            color: #c0392b;
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-dot-link:hover { color: #a93226; text-decoration: underline; }
        .footer-dot-link:active,
        .footer-dot-link:focus { text-decoration: underline; outline: none; }
        .dark .footer-dot-link { color: #e57373; }
        .dark .footer-dot-link:hover,
        .dark .footer-dot-link:active { color: #f87171; text-decoration: underline; }
        .footer-dot {
            color: #999;
            font-size: 16px;
            margin: 0 6px;
            line-height: 1;
        }
        /* Visit counter — retro LCD display */
        .pg-visit-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #1a0e0e;
            border-radius: 5px;
            padding: 0.15rem 0.7rem;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
            font-family: 'Courier New', Consolas, monospace;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            color: #ff3b30;
            text-shadow: 0 0 8px rgba(255,59,48,0.75);
            white-space: nowrap;
        }
        .pg-visit-pill i { font-size: 0.7rem; color: #ff3b30; opacity: 0.85; }
        .pg-visit-pill .pg-sep { color: #ff3b30; margin: 0 0.05rem; }

        /* বটম বার সরানো হয়েছে; হেডারে আইকন যুক্ত */
        .header-nav-btn {
            position: relative;
            padding-bottom: 6px;
        }
        .header-nav-btn.active { color: #c0392b !important; }
        .dark .header-nav-btn.active { color: #e57373 !important; }
        .header-nav-btn.active::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -4px;
            transform: translateX(-50%);
            width: 26px;
            height: 3px;
            border-radius: 3px;
            background: #c0392b;
        }
        .dark .header-nav-btn.active::after { background: #e57373; }


        /* Sidebar (plain CSS — precompiled tailwind.css এ এই ক্লাসগুলো নাও থাকতে পারে) */
        #sidebar-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 240;
            opacity: 0; visibility: hidden;
            transition: opacity 0.25s;
        }
        #sidebar-overlay.open { opacity: 1; visibility: visible; }
        #sidebar {
            position: fixed; top: 0; left: 0;
            height: 100%; width: 260px; max-width: 80%;
            background: rgba(255,255,255,0.95);
            z-index: 250;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            box-shadow: 2px 0 12px rgba(0,0,0,0.15);
            overflow-y: auto;
        }
        .dark #sidebar {
            background: rgba(31,31,31,0.95);
        }
        #sidebar.open { transform: translateX(0); }

        /* Sidebar layout — নিচের সেকশন একেবারে বটমে বসানোর জন্য plain CSS
           (Tailwind-এর mt-auto/flex-col precompiled CSS-এ নাও থাকতে পারে) */
        #sidebar { display: flex; flex-direction: column; }
        #sidebar-bottom { margin-top: auto; }
        #sidebar-links { display: flex; align-items: center; gap: 14px; }
        #sidebar-social a { color: inherit; }

        /* বিভাগসমূহ ও লেখকগণ accordion */
        #sidebar-categories-chevron, #sidebar-authors-chevron { transition: transform 0.2s ease; }
        #sidebar-categories-list li a, #sidebar-authors-list li a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            font-size: 0.9rem;
            color: #4b5563;
            text-decoration: none;
            border-radius: 6px;
        }
        #sidebar-categories-list li a:hover, #sidebar-authors-list li a:hover { background: #fff5f5; color: #c0392b; }
        .dark #sidebar-categories-list li a, .dark #sidebar-authors-list li a { color: #d1d5db; }
        .dark #sidebar-categories-list li a:hover, .dark #sidebar-authors-list li a:hover { background: #2a1f1f; color: #e57373; }
        /* সংখ্যা — bracket-সহ, ডান পাশে (বিভাগে বই সংখ্যা, লেখকে বই সংখ্যা) */
        #sidebar-categories-list li a .cat-count, #sidebar-authors-list li a .cat-count {
            font-size: 13px;
            color: #9ca3af;
            flex-shrink: 0;
        }
        #sidebar-categories-list li a .cat-count::before, #sidebar-authors-list li a .cat-count::before { content: '('; }
        #sidebar-categories-list li a .cat-count::after, #sidebar-authors-list li a .cat-count::after { content: ')'; }
        .dark #sidebar-categories-list li a .cat-count, .dark #sidebar-authors-list li a .cat-count { color: #6b7280; }
        /* বর্ণমালা group header (অ, আ, ই...) — scroll করার সময় sticky থাকবে */
        .sidebar-group-header {
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 0.3rem 0.75rem 0.15rem;
            font-size: 0.75rem;
            font-weight: 800;
            color: #c0392b;
            letter-spacing: 0.02em;
            background: rgba(255,255,255,0.95);
        }
        .dark .sidebar-group-header { color: #f87171; background: rgba(31,31,31,0.95); }

        /* Floating (sticky) header — নিচে স্ক্রল করলে hide, উপরে স্ক্রল করলে show */
        #site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 220;
            transform: translateY(0);
            transition: transform 0.28s ease;
            will-change: transform;
            background: rgba(255,255,255,0.95) !important;
        }
        .dark #site-header { background: rgba(31,31,31,0.95) !important; }
        #site-header.header-hidden { transform: translateY(-100%); }

        /* Header search — Google-স্টাইল autosuggest dropdown */
        #sidebar-search-suggest { background: rgba(255,255,255,0.95); }
        .dark #sidebar-search-suggest { background: rgba(35,35,42,0.95); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .hs-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.6rem 1rem;
            text-decoration: none;
            color: inherit;
        }
        .hs-item:hover, .hs-item.hs-active { background: #f3f4f6; }
        .dark .hs-item:hover, .dark .hs-item.hs-active { background: #2f2f38; }
        .hs-thumb {
            flex-shrink: 0;
            width: 2.1rem;
            height: 2.8rem;
            border-radius: 3px;
            object-fit: cover;
            background: #e5e7eb;
        }
        .dark .hs-thumb { background: #374151; }
        .hs-body { min-width: 0; flex: 1; }
        .hs-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: #1f2937;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dark .hs-title { color: #f3f4f6; }
        .hs-title b { color: #c0392b; font-weight: 700; }
        .dark .hs-title b { color: #f87171; }
        .hs-meta {
            font-size: 0.76rem;
            color: #9ca3af;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hs-more {
            display: block;
            text-align: center;
            padding: 0.6rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #c0392b;
            text-decoration: none;
            border-top: 1px solid #f3f4f6;
        }
        .dark .hs-more { color: #f87171; border-top-color: #2f2f38; }
    </style>
</head>

    <script>
    (function() {
        var menuBtn = document.getElementById('menu-btn');
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('sidebar-overlay');

        // Sidebar UI শুধু show/hide করে, history নিয়ে কিছু করে না
        function showSidebarUI() {
            sidebar.classList.add('open');
            overlay.classList.add('open');
            document.body.classList.add('sidebar-locked');
        }
        function hideSidebarUI() {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
            document.body.classList.remove('sidebar-locked');
        }

        // মেনু খোলার সময় history-তে #sidebar hash push করা হয়, যাতে
        // Android back key চাপলে (browser popstate ট্রিগার করে) sidebar বন্ধ হয়ে যায়।
        function openSidebar() {
            var siteHeader = document.getElementById('site-header');
            if (siteHeader) siteHeader.classList.remove('header-hidden');
            showSidebarUI();
            if (location.hash !== '#sidebar') {
                history.pushState({ sidebarOpen: true }, '', '#sidebar');
            }
        }
        // X বা overlay ট্যাপ করলে history.back() কল হয় (যদি #sidebar hash থাকে),
        // যাতে পরে ব্যবহারকারীকে সাইট থেকে বেরোতে extra একটা back press না লাগে।
        function closeSidebar() {
            if (location.hash === '#sidebar') {
                history.back();
            } else {
                hideSidebarUI();
            }
        }

        // Back key / browser back বাটনে popstate ফায়ার হয় — তখন sidebar বন্ধ করে দাও
        window.addEventListener('popstate', function() {
            hideSidebarUI();
        });

        if (menuBtn) menuBtn.addEventListener('click', openSidebar);
        overlay.addEventListener('click', closeSidebar);

        // বিভাগসমূহ accordion টগল
        var catToggle = document.getElementById('sidebar-categories-toggle');
        var catList = document.getElementById('sidebar-categories-list');
        var catChevron = document.getElementById('sidebar-categories-chevron');
        if (catToggle && catList) {
            catToggle.addEventListener('click', function() {
                var isOpen = catList.style.display !== 'none';
                catList.style.display = isOpen ? 'none' : 'block';
                catToggle.setAttribute('aria-expanded', String(!isOpen));
                if (catChevron) catChevron.style.transform = isOpen ? '' : 'rotate(180deg)';
            });
        }

        // লেখকগণ accordion টগল
        var authorToggle = document.getElementById('sidebar-authors-toggle');
        var authorList = document.getElementById('sidebar-authors-list');
        var authorChevron = document.getElementById('sidebar-authors-chevron');
        if (authorToggle && authorList) {
            authorToggle.addEventListener('click', function() {
                var isOpen = authorList.style.display !== 'none';
                authorList.style.display = isOpen ? 'none' : 'block';
                authorToggle.setAttribute('aria-expanded', String(!isOpen));
                if (authorChevron) authorChevron.style.transform = isOpen ? '' : 'rotate(180deg)';
            });
        }
    })();
    </script>

    <script>
    // Sidebar-এর ভেতরে inline search box টগল করা + live autosuggest
    (function() {
        var defaultRow = document.getElementById('sidebar-header-default');
        var searchBox = document.getElementById('sidebar-search-box');
        var searchBtn = document.getElementById('sidebar-search-btn');
        var closeBtn = document.getElementById('sidebar-search-close-btn');
        var searchInput = document.getElementById('sidebar-search-input');
        var suggestBox = document.getElementById('sidebar-search-suggest');

        function openHeaderSearch() {
            defaultRow.classList.add('hidden');
            searchBox.classList.remove('hidden');
            searchBox.classList.add('flex');
            searchInput.value = '';
            searchInput.focus();
        }
        function closeHeaderSearch() {
            searchBox.classList.add('hidden');
            searchBox.classList.remove('flex');
            defaultRow.classList.remove('hidden');
            hideSuggestions();
        }
        function submitHeaderSearch() {
            var q = searchInput.value.trim();
            if (q) {
                window.location.href = '/search.html?q=' + encodeURIComponent(q);
            }
        }

        searchBtn.addEventListener('click', openHeaderSearch);
        closeBtn.addEventListener('click', closeHeaderSearch);

        // ── Autosuggest ──
        // search-index.json (lightweight, cover/title/author/category) একবার
        // lazy-fetch হয় — প্রতিটা keystroke এ নয়, প্রথম টাইপ শুরু হলে।
        var indexData = null;
        var indexPromise = null;
        var debounceTimer = null;
        var activeIndex = -1;
        var currentItems = [];

        function esc(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function highlight(text, q) {
            var s = esc(text);
            var idx = s.toLowerCase().indexOf(q.toLowerCase());
            if (idx === -1) return s;
            return s.slice(0, idx) + '<b>' + s.slice(idx, idx + q.length) + '</b>' + s.slice(idx + q.length);
        }
        function loadIndex() {
            if (indexPromise) return indexPromise;
            indexPromise = fetch('/search-index.json')
                .then(function(r) { return r.ok ? r.json() : []; })
                .then(function(data) { indexData = data; return data; })
                .catch(function() { indexData = []; return []; });
            return indexPromise;
        }

        function hideSuggestions() {
            suggestBox.style.display = 'none';
            suggestBox.innerHTML = '';
            activeIndex = -1;
            currentItems = [];
        }

        function renderSuggestions(items, q) {
            currentItems = items;
            activeIndex = -1;
            if (!items.length) { hideSuggestions(); return; }
            var html = items.map(function(book) {
                var meta = [book.author, book.category].filter(Boolean).join(' · ');
                return '<a href="/book/' + book.slug + '.html" class="hs-item">'
                    + '<img src="' + esc(book.cover) + '" alt="" class="hs-thumb" loading="lazy">'
                    + '<div class="hs-body">'
                    + '<div class="hs-title">' + highlight(book.title, q) + '</div>'
                    + (meta ? '<div class="hs-meta">' + esc(meta) + '</div>' : '')
                    + '</div></a>';
            }).join('');
            html += '<a href="/search.html?q=' + encodeURIComponent(q) + '" class="hs-more">"' + esc(q) + '" এর সব ফলাফল দেখুন</a>';
            suggestBox.innerHTML = html;
            suggestBox.style.display = 'block';
        }

        function runSearch(q) {
            loadIndex().then(function(data) {
                // input ততক্ষণে বদলে যায়নি কিনা চেক — race condition এড়াতে
                if (searchInput.value.trim().toLowerCase() !== q.toLowerCase()) return;
                var ql = q.toLowerCase();
                var scored = [];
                for (var i = 0; i < data.length; i++) {
                    var b = data[i];
                    var title = (b.title || '').toLowerCase();
                    var author = (b.author || '').toLowerCase();
                    var category = (b.category || '').toLowerCase();
                    var score = -1;
                    if (title.indexOf(ql) === 0) score = 3;
                    else if (title.indexOf(ql) !== -1) score = 2;
                    else if (author.indexOf(ql) !== -1 || category.indexOf(ql) !== -1) score = 1;
                    if (score > 0) scored.push({ book: b, score: score });
                }
                scored.sort(function(a, b) { return b.score - a.score; });
                renderSuggestions(scored.slice(0, 6).map(function(s) { return s.book; }), q);
            });
        }

        searchInput.addEventListener('input', function() {
            var q = searchInput.value.trim();
            clearTimeout(debounceTimer);
            if (q.length < 2) { hideSuggestions(); return; }
            debounceTimer = setTimeout(function() { runSearch(q); }, 150);
        });

        searchInput.addEventListener('keydown', function(e) {
            var visible = suggestBox.style.display === 'block';
            if (e.key === 'ArrowDown' && visible) {
                e.preventDefault();
                activeIndex = Math.min(activeIndex + 1, currentItems.length - 1);
                updateActive();
            } else if (e.key === 'ArrowUp' && visible) {
                e.preventDefault();
                activeIndex = Math.max(activeIndex - 1, -1);
                updateActive();
            } else if (e.key === 'Enter') {
                if (visible && activeIndex >= 0) {
                    e.preventDefault();
                    window.location.href = '/book/' + currentItems[activeIndex].slug + '.html';
                } else {
                    submitHeaderSearch();
                }
            } else if (e.key === 'Escape') {
                if (visible) hideSuggestions();
                else closeHeaderSearch();
            }
        });

        function updateActive() {
            var links = suggestBox.querySelectorAll('.hs-item');
            links.forEach(function(el, i) {
                el.classList.toggle('hs-active', i === activeIndex);
            });
            if (activeIndex >= 0 && links[activeIndex]) {
                links[activeIndex].scrollIntoView({ block: 'nearest' });
            }
        }

        document.addEventListener('click', function(e) {
            if (!searchBox.contains(e.target)) hideSuggestions();
        });
    })();
    </script>

    <script>
    (function() {
        var header = document.getElementById('site-header');
        var spacer = document.getElementById('header-spacer');

        function setSpacerHeight() {
            spacer.style.height = header.offsetHeight + 'px';
        }
        setSpacerHeight();
        window.addEventListener('resize', setSpacerHeight);

        var lastScrollY = window.pageYOffset;
        var ticking = false;
        var threshold = 8; // ছোটখাটো scroll jitter এড়াতে

        function onScroll() {
            var currentScrollY = window.pageYOffset;
            var diff = currentScrollY - lastScrollY;

            // একদম উপরে থাকলে সবসময় header দেখাও
            if (currentScrollY <= header.offsetHeight) {
                header.classList.remove('header-hidden');
            } else if (Math.abs(diff) > threshold) {
                if (diff > 0) {
                    // নিচের দিকে স্ক্রল — hide
                    header.classList.add('header-hidden');
                } else {
                    // উপরের দিকে স্ক্রল — show
                    header.classList.remove('header-hidden');
                }
                lastScrollY = currentScrollY;
            }
            ticking = false;
        }

        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(onScroll);
                ticking = true;
            }
        }, { passive: true });

        // sidebar খোলা থাকলে header hide না করা (menu icon দরকার হতে পারে)
        window.addEventListener('popstate', function() {
            header.classList.remove('header-hidden');
        });
    })();
    </script>

    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0">
        {{content}}
    </main>

    <script>
        (function() {
            var path = window.location.pathname;
            var rules = {
                '/': /^\/((book|books)(\/.*)?)?$/,
                '/authors/': /^\/(author|authors)(\/.*)?$/,
                '/categories/': /^\/(category|categories)(\/.*)?$/
            };
            document.querySelectorAll('.header-nav-btn').forEach(function(btn) {
                var navPath = btn.getAttribute('data-nav-path');
                var re = rules[navPath];
                if (re && re.test(path)) btn.classList.add('active');
            });
        })();
    </script>

    <script>
        // Visit counter — প্রতি পেজ লোড/রিফ্রেশে count বাড়বে
        (function () {
            const el = document.getElementById('pg-visit-counter');
            if (!el) return;
            const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
            const nums = el.querySelectorAll('b');
            fetch('/api/visits')
                .then(r => r.json())
                .then(data => {
                    nums[0].textContent = toBn(data.today);
                    nums[1].textContent = toBn(data.total);
                })
                .catch(() => { el.style.display = 'none'; });
        })();
    </script>
