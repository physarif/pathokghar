<!DOCTYPE html>
<html lang="bn">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}} - পাঠক ঘর</title>
    <meta name="description" content="{{page_description}}">
    <meta property="og:title" content="{{page_title}} - পাঠক ঘর">
    <meta property="og:description" content="{{page_description}}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#f0f7ff',
                            100: '#e1f0ff',
                            500: '#0056b3',
                            600: '#004494'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#1a1a1b] dark:text-gray-200 flex flex-col min-h-screen">

    <!-- HEADER -->
    <header class="bg-white dark:bg-[#1a1a1b] fixed top-0 w-full h-14 z-[100] border-b border-gray-200 dark:border-gray-700 shadow-sm transition-transform duration-300">
        <div class="max-w-5xl mx-auto px-4 h-full flex items-center gap-3">

            <!-- Logo -->
            <a href="https://pathokghar.pages.dev" class="text-2xl font-extrabold tracking-tighter hover:bg-gray-100 dark:hover:bg-gray-800 px-2 py-1 rounded transition-colors duration-200 shrink-0">
                পাঠক <span class="font-light text-gray-400">ঘর</span>
            </a>

            <!-- Search (desktop) -->
            <div class="hidden md:flex flex-1 max-w-xl gap-1">
                <div class="relative flex-1">
                    <input id="desktop-search-input" type="text" placeholder="বই, লেখক বা বিষয় খুঁজুন..."
                        class="w-full bg-gray-50 dark:bg-[#2d2d2d] border border-gray-300 dark:border-gray-600 rounded py-1.5 px-4 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all">
                </div>
                <button id="desktop-search-btn" class="bg-brand-500 hover:bg-brand-600 text-white px-4 rounded transition-colors shrink-0">
                    <i class="fas fa-search text-sm"></i>
                </button>
            </div>

            <!-- Right side actions -->
            <div class="flex items-center space-x-2 ml-auto shrink-0">

                <!-- Mobile search button -->
                <button id="mobile-search-btn" class="md:hidden p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded transition">
                    <i class="fas fa-search text-lg"></i>
                </button>

                <!-- Day/Night toggle -->
                <button id="theme-btn" class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition text-gray-600 dark:text-gray-300">
                    <i id="theme-icon" class="fas fa-moon text-lg"></i>
                </button>

            </div>

        </div>

        <!-- Mobile search bar (dropdown) -->
        <div id="mobile-search-bar" class="absolute top-14 left-0 w-full bg-white dark:bg-[#1a1a1b] border-b dark:border-gray-700 p-2 hidden shadow-lg">
            <div class="flex gap-2">
                <input id="mobile-search-input" type="text" placeholder="বই, লেখক বা বিষয় খুঁজুন..."
                    class="flex-1 bg-gray-50 dark:bg-[#2d2d2d] border border-gray-300 dark:border-gray-600 rounded-lg py-2 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                <button id="mobile-search-submit" class="bg-brand-500 hover:bg-brand-600 text-white text-sm px-4 rounded-lg transition-colors shrink-0">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0 pt-14">
        <div class="max-w-5xl mx-auto px-4 py-6">
            {{content}}
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white dark:bg-[#1a1a1b] border-t border-gray-200 dark:border-gray-700 mt-auto">
        <div class="max-w-5xl mx-auto px-4 py-8">

            <!-- Footer grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-8">

                <!-- Logo + tagline -->
                <div class="col-span-2 md:col-span-1">
                    <a href="https://pathokghar.pages.dev" class="text-xl font-extrabold tracking-tighter">
                        পাঠক <span class="font-light text-gray-400">ঘর</span>
                    </a>
                    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400 leading-relaxed">বাংলা বইয়ের সেরা অনলাইন পাঠাগার।</p>
                </div>

                <!-- নেভিগেশন -->
                <div>
                    <h4 class="text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-3">নেভিগেশন</h4>
                    <ul class="space-y-2 text-sm">
                        <li><a href="https://pathokghar.pages.dev" class="text-gray-600 dark:text-gray-300 hover:text-brand-500 transition-colors flex items-center gap-2"><i class="fas fa-home text-xs w-3"></i> প্রধান পাতা</a></li>
                        <li><a href="new.html" class="text-gray-600 dark:text-gray-300 hover:text-brand-500 transition-colors flex items-center gap-2"><i class="fas fa-clock text-xs w-3"></i> নতুন বই</a></li>
                        <li><a href="popular.html" class="text-gray-600 dark:text-gray-300 hover:text-brand-500 transition-colors flex items-center gap-2"><i class="fas fa-fire text-xs w-3"></i> জনপ্রিয়</a></li>
                    </ul>
                </div>

                <!-- ক্যাটাগরি -->
                <div>
                    <h4 class="text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-3">ক্যাটাগরি</h4>
                    <ul class="space-y-2 text-sm">
                        <li><a href="category.html?c=uponyas" class="text-gray-600 dark:text-gray-300 hover:text-brand-500 transition-colors">উপন্যাস</a></li>
                        <li><a href="category.html?c=golpo" class="text-gray-600 dark:text-gray-300 hover:text-brand-500 transition-colors">গল্প</a></li>
                        <li><a href="category.html?c=kobita" class="text-gray-600 dark:text-gray-300 hover:text-brand-500 transition-colors">কবিতা</a></li>
                        <li><a href="category.html?c=probondho" class="text-gray-600 dark:text-gray-300 hover:text-brand-500 transition-colors">প্রবন্ধ</a></li>
                        <li><a href="category.html?c=science" class="text-gray-600 dark:text-gray-300 hover:text-brand-500 transition-colors">বিজ্ঞান</a></li>
                    </ul>
                </div>

                <!-- লেখক -->
                <div>
                    <h4 class="text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-3">লেখক</h4>
                    <ul class="space-y-2 text-sm">
                        <li><a href="author.html?a=humayun" class="text-gray-600 dark:text-gray-300 hover:text-brand-500 transition-colors">হুমায়ূন আহমেদ</a></li>
                        <li><a href="author.html?a=rabindra" class="text-gray-600 dark:text-gray-300 hover:text-brand-500 transition-colors">রবীন্দ্রনাথ ঠাকুর</a></li>
                    </ul>
                </div>

            </div>

            <!-- Bottom bar -->
            <div class="pt-4 border-t border-gray-100 dark:border-gray-800 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-gray-400 dark:text-gray-500">
                <span>© ২০২৬ পাঠক ঘর। সর্বস্বত্ব সংরক্ষিত।</span>
                <div class="flex gap-4">
                    <a href="#" class="hover:text-brand-500 transition-colors">সম্পর্কে</a>
                    <a href="#" class="hover:text-brand-500 transition-colors">যোগাযোগ</a>
                    <a href="#" class="hover:text-brand-500 transition-colors">গোপনীয়তা</a>
                </div>
            </div>

        </div>
    </footer>

    <script>
        // Dark mode
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        function applyTheme(dark) {
            if (dark) {
                html.classList.add('dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                localStorage.theme = 'dark';
            } else {
                html.classList.remove('dark');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                localStorage.theme = 'light';
            }
        }

        applyTheme(localStorage.theme === 'dark');
        themeBtn.addEventListener('click', () => applyTheme(!html.classList.contains('dark')));

        // Mobile search
        const mobileSearchBtn = document.getElementById('mobile-search-btn');
        const mobileSearchBar = document.getElementById('mobile-search-bar');
        mobileSearchBtn.addEventListener('click', () => {
            mobileSearchBar.classList.toggle('hidden');
            if (!mobileSearchBar.classList.contains('hidden')) {
                mobileSearchBar.querySelector('input').focus();
            }
        });

        // Search
        function doSearch(query) {
            if (query.trim()) window.location.href = '/search.html?q=' + encodeURIComponent(query.trim());
        }

        document.getElementById('desktop-search-btn').addEventListener('click', () => doSearch(document.getElementById('desktop-search-input').value));
        document.getElementById('desktop-search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(e.target.value); });
        document.getElementById('mobile-search-submit').addEventListener('click', () => doSearch(document.getElementById('mobile-search-input').value));
        document.getElementById('mobile-search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(e.target.value); });

        // Hide header on scroll down (mobile)
        const header = document.querySelector('header');
        let lastScrollY = window.scrollY;
        let ticking = false;
        window.addEventListener('scroll', () => {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(() => {
                if (window.innerWidth < 768) {
                    const y = window.scrollY;
                    header.style.transform = (y > lastScrollY && y > 56) ? 'translateY(-100%)' : 'translateY(0)';
                    lastScrollY = y;
                }
                ticking = false;
            });
        });
    </script>

</body>
</html>
