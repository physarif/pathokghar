<!-- components/search.html — static search page, Firebase data build-time embed, Fuse.js client-side filter -->
<div class="max-w-5xl mx-auto py-6">

  <!-- Section label -->
  <div style="padding:0.45rem 1rem;background:#c0392b;font-size:1rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
    <span id="search-title" style="color:#fff;font-weight:700;letter-spacing:0.01em;">অনুসন্ধান</span>
    <span id="search-count" style="background:rgba(255,255,255,0.18);color:#fff;font-weight:600;font-size:0.78rem;padding:0.15rem 0.6rem;"></span>
  </div>

  <div id="search-results" class="bc-list"></div>

  <!-- Empty state -->
  <div id="search-empty" style="display:none;text-align:center;padding:3rem 1rem;">
    <i class="fas fa-book-open" style="font-size:2.2rem;color:#d1d5db;margin-bottom:0.75rem;display:block;"></i>
    <p style="color:#6b7280;font-size:0.95rem;margin:0;" class="dark:text-gray-400">কোনো বই খুঁজে পাওয়া যায়নি। অন্য শব্দ দিয়ে চেষ্টা করুন।</p>
  </div>

  <!-- No query state -->
  <div id="search-noquery" style="display:none;text-align:center;padding:3rem 1rem;">
    <i class="fas fa-magnifying-glass" style="font-size:2.2rem;color:#d1d5db;margin-bottom:0.75rem;display:block;"></i>
    <p style="color:#6b7280;font-size:0.95rem;margin:0;" class="dark:text-gray-400">উপরের বক্সে বই, লেখক বা বিভাগের নাম লিখে খুঁজুন।</p>
  </div>

</div>

<script type="application/json" id="search-index-json">{{search_index_json}}</script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>

<style>
  .bc-list {
    display: flex;
    flex-direction: column;
    padding: 0;
    gap: 0.4rem;
  }
  @media (min-width: 768px) {
    .bc-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.4rem;
      padding: 0;
    }
  }

  .bc-card {
    display: flex;
    flex-direction: row;
    gap: 0.85rem;
    align-items: flex-start;
    text-decoration: none;
    padding: 0.75rem;
    transition: background 0.1s;
    background: #fff;
  }
  .dark .bc-card { background: #23232a; }
  .bc-card:hover { background: #fef2f2; }
  .dark .bc-card:hover { background: #2a2020; }

  .bc-img-wrap {
    flex-shrink: 0;
    width: 5.5rem;
    aspect-ratio: 2/3;
    overflow: hidden;
    background: #e5e7eb;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  @media (min-width: 768px) { .bc-img-wrap { width: 6.5rem; } }
  .dark .bc-img-wrap { background: #374151; }

  .bc-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .bc-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  .bc-headline {
    font-size: 1.1rem;
    line-height: 1.4;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .bc-title {
    font-weight: 700;
    color: #c0392b;
  }
  .dark .bc-title { color: #f87171; }

  .bc-meta {
    font-size: 0.82rem;
    color: #9ca3af;
    margin: 0;
  }
  .dark .bc-meta { color: #6b7280; }

  .bc-desc {
    margin-top: 0.3rem;
    font-size: 1.02rem;
    color: #4b5563;
    line-height: 1.6;
    text-align: justify;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .dark .bc-desc { color: #9ca3af; }
</style>

<script>
(function() {
  function toBn(n) {
    return String(n).replace(/[0-9]/g, function(d) { return '০১২৩৪৫৬৭৮৯'[d]; });
  }

  function esc(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var params = new URLSearchParams(window.location.search);
  var query = (params.get('q') || '').trim();

  var titleEl = document.getElementById('search-title');
  var countEl = document.getElementById('search-count');
  var resultsEl = document.getElementById('search-results');
  var emptyEl = document.getElementById('search-empty');
  var noQueryEl = document.getElementById('search-noquery');

  // Header search box-এ query prefill
  var mainInput = document.getElementById('main-search-input');
  if (mainInput && query) mainInput.value = query;

  if (!query) {
    titleEl.textContent = 'অনুসন্ধান';
    noQueryEl.style.display = 'block';
    return;
  }

  titleEl.textContent = '"' + query + '" এর ফলাফল';

  if (typeof Fuse === 'undefined') {
    countEl.textContent = '';
    emptyEl.querySelector('p').textContent = 'সার্চ লোড করতে সমস্যা হয়েছে, একটু পর আবার চেষ্টা করুন।';
    emptyEl.style.display = 'block';
    return;
  }

  var data = JSON.parse(document.getElementById('search-index-json').textContent);

  var fuse = new Fuse(data, {
    keys: [
      { name: 'title', weight: 2 },
      { name: 'author', weight: 1 },
      { name: 'category', weight: 0.5 },
      { name: 'desc', weight: 0.3 },
    ],
    threshold: 0.35,
    ignoreLocation: true,
  });

  var matches = fuse.search(query, { limit: 60 }).map(function(r) { return r.item; });

  countEl.textContent = toBn(matches.length) + ' টি ফলাফল';

  if (matches.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }

  resultsEl.innerHTML = matches.map(function(book) {
    var meta = [book.author, book.category].filter(Boolean).join(' · ');
    return '<a href="/book/' + book.slug + '.html" class="bc-card">'
      + '<div class="bc-img-wrap"><img src="' + esc(book.cover) + '" alt="' + esc(book.title) + '" class="bc-img" loading="lazy"></div>'
      + '<div class="bc-body">'
      + '<p class="bc-headline"><span class="bc-title">' + esc(book.title) + '</span></p>'
      + (meta ? '<p class="bc-meta">' + esc(meta) + '</p>' : '')
      + '<p class="bc-desc">' + esc(book.desc || '') + '</p>'
      + '</div>'
      + '</a>';
  }).join('');
})();
</script>
