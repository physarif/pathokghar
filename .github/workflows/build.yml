name: Build & Deploy Pathok Ghar

on:
  schedule:
    - cron: '*/3 * * * *'  # প্রতি ৩ মিনিটে auto deploy
  repository_dispatch:
    types: [firebase-update]
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'scripts/**'
      - 'github-actions'
  workflow_dispatch:


# একসাথে একাধিক trigger আসলে চলমান build বাতিল করে নতুনটা চালাবে
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. Repo checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 2

      # ২. Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ৩. Python setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ৪. Dependencies install
      - name: Install dependencies
        run: |
          npm install firebase-admin wrangler
          pip install ebooklib beautifulsoup4 --break-system-packages

      # ৫. কোন files বদলেছে সেটা detect করো
      - name: Detect changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "layout_only=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files: $CHANGED"

          LAYOUT_CHANGED=$(echo "$CHANGED" | grep '^components/' | grep -v 'read\.html\|download\.html' || true)
          OTHER_CHANGED=$(echo "$CHANGED" | grep -v '^components/' || true)

          if [ -n "$LAYOUT_CHANGED" ] && [ -z "$OTHER_CHANGED" ]; then
            echo "layout_only=true" >> $GITHUB_OUTPUT
          else
            echo "layout_only=false" >> $GITHUB_OUTPUT
          fi

      # ৬. Firebase থেকে data fetch + সব pages generate
      - name: Generate static pages
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: node scripts/generate_pages.js

      # ৭. ZIP → HTML convert + read page generate
      - name: Convert books
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: python scripts/convert_zip.py

      # ৮. sitemap.xml generate
      - name: Generate sitemap
        run: node scripts/generate_sitemap.js

      # ৯. Cloudflare Pages এ deploy
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=pathokghar --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

