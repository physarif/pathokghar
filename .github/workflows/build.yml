name: Build & Deploy Pathok Ghar

on:
  repository_dispatch:
    types: [firebase-update]
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'scripts/**'
      - 'github-actions'
  workflow_dispatch:

# GITHUB_TOKEN-কে repo-তে push করার permission দেয়া (assets branch
# এবং sitemap-lastmod.json commit করার জন্য দরকার)
permissions:
  contents: write

# একসাথে একাধিক trigger আসলে চলমান build বাতিল করে নতুনটা চালাবে
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ১. Repo checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 2

      # ২. Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ৩. Python setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ৩.৫. আগের build-এর পুরো output "assets" branch থেকে
      #       ফিরিয়ে আনো (base হিসেবে বসাও), যাতে কোনো step skip হলেও
      #       আগের generate করা যেকোনো ফাইল হারিয়ে না যায়
      - name: Restore previous build output from assets branch
        run: |
          git fetch origin assets || echo "branch not found yet"
          if git show-ref --verify --quiet refs/remotes/origin/assets; then
            git worktree add /tmp/assets origin/assets
            rsync -a --exclude='.git' /tmp/assets/ ./
            git worktree remove /tmp/assets --force
          fi

      # ৪. Dependencies install
      - name: Install dependencies
        run: |
          npm install firebase-admin wrangler marked @firebase/app
          pip install ebooklib beautifulsoup4 --break-system-packages

      # ৫. কোন files বদলেছে সেটা detect করো
      - name: Detect changed files
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "layout_only=false" >> $GITHUB_OUTPUT
            echo "convert_needed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files: $CHANGED"

          LAYOUT_CHANGED=$(echo "$CHANGED" | grep '^components/' | grep -v 'read\.html\|download\.html' || true)
          OTHER_CHANGED=$(echo "$CHANGED" | grep -v '^components/' || true)

          if [ -n "$LAYOUT_CHANGED" ] && [ -z "$OTHER_CHANGED" ]; then
            echo "layout_only=true" >> $GITHUB_OUTPUT
          else
            echo "layout_only=false" >> $GITHUB_OUTPUT
          fi

          # Convert books step শুধু তখনই দরকার যখন components/read.html বা
          # root-level "github-actions" state ফাইল বদলায়; নাহলে skip করবে।
          CONVERT_CHANGED=$(echo "$CHANGED" | grep -E '^components/read\.html$|^github-actions$' || true)
          if [ -n "$CONVERT_CHANGED" ]; then
            echo "convert_needed=true" >> $GITHUB_OUTPUT
          else
            echo "convert_needed=false" >> $GITHUB_OUTPUT
          fi

      # ৬. Firebase থেকে data fetch + সব pages generate
      - name: Generate static pages
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: node scripts/generate_pages.js

      # ৭. ZIP → HTML convert + read page generate
      #    শুধু read.html বা github-actions state ফাইল বদলালেই চলবে, নাহলে skip
      - name: Convert books
        if: steps.changes.outputs.convert_needed == 'true'
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: python scripts/convert_zip.py

      # ৮. sitemap.xml generate
      - name: Generate sitemap
        run: node scripts/generate_sitemap.js

      # ৮.৫. sitemap lastmod state file commit করো, যাতে পরের build-এ
      #       content অপরিবর্তিত URL গুলোর lastmod ঠিক থাকে (আজকের তারিখ না বসে)
      - name: Commit sitemap lastmod state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap-lastmod.json
          git diff --staged --quiet || git commit -m "chore: update sitemap lastmod state"
          git push || true

      # ৯. পুরো build output (সব generated content: content, read, assets,
      #     generated pages, sitemap ইত্যাদি — শুধু source code/config বাদে)
      #     "assets" branch-এ push করে রাখো — যেকোনো ধাপ পরের
      #     build-এ skip হলেও এখান থেকে পুরনো output restore হবে
      - name: Save full build output to assets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet refs/remotes/origin/assets; then
            git worktree add /tmp/assets-push origin/assets
          else
            git worktree add --orphan /tmp/assets-push
          fi

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='components' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='github-actions' \
            --exclude='sitemap-lastmod.json' \
            ./ /tmp/assets-push/

          cd /tmp/assets-push
          git add -A
          git diff --staged --quiet || git commit -m "chore: update build output snapshot"
          git push origin HEAD:assets
          cd -
          git worktree remove /tmp/assets-push --force

      # ১০. Cloudflare Pages এ deploy
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=pathokghar --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}