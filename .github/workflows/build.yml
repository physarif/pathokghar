name: Build & Deploy Pathok Ghar

on:
  # Firebase data change হলে trigger (webhook দিয়ে)
  repository_dispatch:
    types: [firebase-update]
  
  # Component বা script change হলে trigger
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'scripts/**'
  
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # ১. Repo checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      # ২. Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ৩. Python setup (epub convert এর জন্য)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ৪. Dependencies install
      - name: Install dependencies
        run: |
          npm install firebase-admin wrangler
          pip install ebooklib beautifulsoup4 --break-system-packages

      # ৫. Firebase থেকে data fetch + firebase_data.json তৈরি করো
      - name: Generate static pages
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: node scripts/generate_pages.js

      # ৬. epub → html convert (generate এর পরে, firebase_data.json তৈরি হয়েছে)
      - name: Convert epub to html
        run: python scripts/convert_epub.py

      # ৭. sitemap.xml generate
      - name: Generate sitemap
        run: node scripts/generate_sitemap.js

      # ৮. Cloudflare Pages এ deploy
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=pathokghar --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ৯. Generated files commit & push
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add books/ index.html sitemap.xml || true
          git add read/ || true
          git add author/ download/ category/ || true
          git diff --staged --quiet || git commit -m "build: auto-generate pages [skip ci]" && git push
