name: Build & Deploy Pathok Ghar

on:
  # Firebase data change হলে trigger (webhook দিয়ে)
  repository_dispatch:
    types: [firebase-update]
  
  # Template বা layout change হলে trigger
  push:
    branches: [main]
    paths:
      - 'components/layout.html'
      - 'templates/**'
  
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # ১. Repo checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      # ২. Node.js setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ৪. Dependencies install
      - name: Install dependencies
        run: npm install firebase-admin

      # ৫. Firebase থেকে data fetch + pages generate
      - name: Generate static pages
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: node scripts/generate.js

      # ৬. read pages generate
      - name: Generate read pages
        run: node scripts/generate_read.js

      # ৮. sitemap.xml generate
      - name: Generate sitemap
        run: node scripts/generate_sitemap.js

      # ৯. Changes commit & push → Cloudflare auto deploy হবে
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add books/ index.html sitemap.xml || true
          git add read/ content/ || true
          git add author/ download/ category/ || true
          git diff --staged --quiet || git commit -m "build: auto-generate pages [skip ci]"
          git push
