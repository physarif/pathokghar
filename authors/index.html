        /* ── Base / reset ── */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        a { color: inherit; }
        ul { padding: 0; margin: 0; }

        /* ── JS-controlled state utilities (নাম বদলানো যাবে না — script এই
           ক্লাসগুলো classList দিয়ে টগল করে) ── */
        .hidden { display: none !important; }
        .flex { display: flex !important; }

        /* সাধারণ বড় আইকন সাইজ */
        .icon-lg { font-size: 1.25rem; }

        main { flex: 1 1 auto; min-width: 0; }

        /* ── Header (Telegram X স্টাইল — steel-blue bar, brand ছাড়া, full-width icon row) ── */
        #site-header {
            border-bottom: none;
            background: #2a2b2f;
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 3rem;
            box-sizing: border-box;
            padding: 0 0.5rem;
        }
        .header-right { display: flex; align-items: stretch; gap: 0; flex: 1 1 auto; height: 100%; }
        #header-search-btn, #header-search-close-btn {
            background: none; border: none; padding: 0; cursor: pointer;

        .brand-link { display: none; }

        /* ── Header inline search box (header-এর ভেতরে টগল হয়) ── */
        .header-search-box {
            align-items: center;
            gap: 0.75rem;
            height: 3rem;
            box-sizing: border-box;
            padding: 0 1rem;
            position: relative;

        .header-search-suggest {

        .site-footer {

        .footer-row {

        .footer-links { display: flex; gap: 1rem; }

        /* Category links — footer style, larger */
        .category-underline-list li { display: inline-flex; align-items: center; white-space: nowrap; }
        .category-underline-list li + li::before {

        /* Visit counter — retro LCD display */

        /* হেডার ন্যাভ — Telegram X স্টাইল: full-width, সমান-দূরত্বের icon-only ট্যাব, active-এ underline */

        .header-nav-group a.header-nav-btn {

        .header-nav-group a.header-nav-btn:first-child {

        /* সার্চ আইকন হ্যামবার্গারের মতোই নিজের সাইজ অনুসারে জায়গা নেবে, ডান কোণায় থাকবে */
        #header-search-btn.header-nav-btn {
            flex: 0 0 auto;
            width: auto;
            padding: 0;
        }
        .header-nav-btn.active { color: #ffffff !important; background: transparent; }
        /* icon সরিয়ে শুধু নাম — home/লেখক/বিভাগ text-only ট্যাব; active হলে underline text-এর
           সমান width-এর হবে, তাই এটা fixed ::after না দিয়ে label-এর নিজের border-bottom দিয়ে করা */
        .header-nav-label {
            display: inline-block;
            margin-left: 0;
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            padding: 0.25rem 0;
            border-bottom: 3px solid transparent;
        }
        .header-nav-btn.active .header-nav-label { border-bottom-color: #ffffff; }

        /* Floating (sticky) header — নিচে স্ক্রল করলে hide, উপরে স্ক্রল করলে show */
        #site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 220;
            transform: translateY(0);
            transition: transform 0.28s ease;

            background: #2a2b2f !important;
        }
        #site-header.header-hidden { transform: translateY(-100%); }

        /* Header search — Google-স্টাইল autosuggest dropdown */
        .hs-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.6rem 1rem;

        }

    </style>

    <!-- header fixed হওয়ায় নিচের কনটেন্টের জন্য একই উচ্চতার একটি spacer -->

    <script>
    // Inline search box টগল করা + live autosuggest — header-এ ব্যবহৃত হয়
    (function() {
        // ── Autosuggest ──
        // search-index.json (lightweight, cover/title/author/category) একবার
        // lazy-fetch হয় — প্রতিটা keystroke এ নয়, প্রথম টাইপ শুরু হলে।
        var indexData = null;
        var indexPromise = null;

        function esc(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function highlight(text, q) {
            var s = esc(text);
            var idx = s.toLowerCase().indexOf(q.toLowerCase());
            if (idx === -1) return s;
            return s.slice(0, idx) + '<b>' + s.slice(idx, idx + q.length) + '</b>' + s.slice(idx + q.length);
        }
        function loadIndex() {
            if (indexPromise) return indexPromise;
            indexPromise = fetch('/search-index.json')
                .then(function(r) { return r.ok ? r.json() : []; })
                .then(function(data) { indexData = data; return data; })
                .catch(function() { indexData = []; return []; });
            return indexPromise;
        }

        function initSearchBox(opts) {
            var defaultRow = opts.defaultRow;
            var searchBox = opts.searchBox;
            var searchBtn = opts.searchBtn;
            var closeBtn = opts.closeBtn;
            var searchInput = opts.searchInput;
            var suggestBox = opts.suggestBox;

            var debounceTimer = null;
            var activeIndex = -1;
            var currentItems = [];

            function openSearch() {
                defaultRow.classList.add('hidden');
                searchBox.classList.remove('hidden');
                searchBox.classList.add('flex');
                searchInput.value = '';
                searchInput.focus();
            }
            function closeSearch() {
                searchBox.classList.add('hidden');
                searchBox.classList.remove('flex');
                defaultRow.classList.remove('hidden');
                hideSuggestions();
            }
            function submitSearch() {
                var q = searchInput.value.trim();
                if (q) {
                    window.location.href = '/search.html?q=' + encodeURIComponent(q);
                }
            }

            searchBtn.addEventListener('click', openSearch);
            closeBtn.addEventListener('click', closeSearch);

            function hideSuggestions() {
                suggestBox.style.display = 'none';
                suggestBox.innerHTML = '';
                activeIndex = -1;
                currentItems = [];
            }

            function renderSuggestions(items, q) {
                currentItems = items;
                activeIndex = -1;
                if (!items.length) { hideSuggestions(); return; }
                var html = items.map(function(book) {
                    var meta = [book.author, book.category].filter(Boolean).join(' · ');
                    return '<a href="/book/' + book.slug + '.html" class="hs-item">'
                        + '<img src="' + esc(book.cover) + '" alt="" class="hs-thumb" loading="lazy">'
                        + '<div class="hs-body">'
                        + '<div class="hs-title">' + highlight(book.title, q) + '</div>'
                        + (meta ? '<div class="hs-meta">' + esc(meta) + '</div>' : '')
                        + '</div></a>';
                }).join('');
                html += '<a href="/search.html?q=' + encodeURIComponent(q) + '" class="hs-more">"' + esc(q) + '" এর সব ফলাফল দেখুন</a>';
                suggestBox.innerHTML = html;
                suggestBox.style.display = 'block';
            }

            function runSearch(q) {
                loadIndex().then(function(data) {
                    // input ততক্ষণে বদলে যায়নি কিনা চেক — race condition এড়াতে
                    if (searchInput.value.trim().toLowerCase() !== q.toLowerCase()) return;
                    var ql = q.toLowerCase();
                    var scored = [];
                    for (var i = 0; i < data.length; i++) {
                        var b = data[i];
                        var title = (b.title || '').toLowerCase();
                        var author = (b.author || '').toLowerCase();
                        var category = (b.category || '').toLowerCase();
                        var score = -1;
                        if (title.indexOf(ql) === 0) score = 3;
                        else if (title.indexOf(ql) !== -1) score = 2;
                        else if (author.indexOf(ql) !== -1 || category.indexOf(ql) !== -1) score = 1;
                        if (score > 0) scored.push({ book: b, score: score });
                    }
                    scored.sort(function(a, b) { return b.score - a.score; });
                    renderSuggestions(scored.slice(0, 6).map(function(s) { return s.book; }), q);
                });
            }

            searchInput.addEventListener('input', function() {
                var q = searchInput.value.trim();
                clearTimeout(debounceTimer);
                if (q.length < 2) { hideSuggestions(); return; }
                debounceTimer = setTimeout(function() { runSearch(q); }, 150);
            });

            searchInput.addEventListener('keydown', function(e) {
                var visible = suggestBox.style.display === 'block';
                if (e.key === 'ArrowDown' && visible) {
                    e.preventDefault();
                    activeIndex = Math.min(activeIndex + 1, currentItems.length - 1);
                    updateActive();
                } else if (e.key === 'ArrowUp' && visible) {
                    e.preventDefault();
                    activeIndex = Math.max(activeIndex - 1, -1);
                    updateActive();
                } else if (e.key === 'Enter') {
                    if (visible && activeIndex >= 0) {
                        e.preventDefault();
                        window.location.href = '/book/' + currentItems[activeIndex].slug + '.html';
                    } else {
                        submitSearch();
                    }
                } else if (e.key === 'Escape') {
                    if (visible) hideSuggestions();
                    else closeSearch();
                }
            });

            function updateActive() {
                var links = suggestBox.querySelectorAll('.hs-item');
                links.forEach(function(el, i) {
                    el.classList.toggle('hs-active', i === activeIndex);
                });
                if (activeIndex >= 0 && links[activeIndex]) {
                    links[activeIndex].scrollIntoView({ block: 'nearest' });
                }
            }

            document.addEventListener('click', function(e) {
                if (!searchBox.contains(e.target)) hideSuggestions();
            });
        }

        // Header-এর ভেতরের search box
        initSearchBox({
            defaultRow: document.getElementById('header-default'),
            searchBox: document.getElementById('header-search-box'),
            searchBtn: document.getElementById('header-search-btn'),
            closeBtn: document.getElementById('header-search-close-btn'),
            searchInput: document.getElementById('header-search-input'),
            suggestBox: document.getElementById('header-search-suggest')
        });
    })();
    </script>

    <script>
    (function() {
        var header = document.getElementById('site-header');
        var spacer = document.getElementById('header-spacer');

        function setSpacerHeight() {
            spacer.style.height = header.offsetHeight + 'px';
        }
        setSpacerHeight();
        window.addEventListener('resize', setSpacerHeight);

        var lastScrollY = window.pageYOffset;
        var ticking = false;
        var threshold = 8; // ছোটখাটো scroll jitter এড়াতে

        function onScroll() {
            var currentScrollY = window.pageYOffset;
            var diff = currentScrollY - lastScrollY;

            // একদম উপরে থাকলে সবসময় header দেখাও
            if (currentScrollY <= header.offsetHeight) {
                header.classList.remove('header-hidden');
            } else if (Math.abs(diff) > threshold) {
                if (diff > 0) {
                    // নিচের দিকে স্ক্রল — hide
                    header.classList.add('header-hidden');
                } else {
                    // উপরের দিকে স্ক্রল — show
                    header.classList.remove('header-hidden');
                }
                lastScrollY = currentScrollY;
            }
            ticking = false;
        }

        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(onScroll);
                ticking = true;
            }
        }, { passive: true });

    })();
    </script>

<style>
.authors-page { max-width: 64rem; margin: 0 auto; padding: 1.5rem 0.75rem 1.5rem 0; }
.ag-body {
  display: flex;
  align-items: flex-start;
}
.ag-letter-nav {
  position: sticky;
  top: 1rem;
  flex-shrink: 0;
  width: 2.4rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 0.25rem 0;
}
.ag-letter-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2rem;
  height: 2rem;
  font-size: 1.05rem;
  font-weight: 700;
  color: #9ca3af;
  text-decoration: none;
  border-radius: 4px;
  transition: background 0.12s, color 0.12s;
  line-height: 1;
}
.ag-letter-link:hover, .ag-letter-link.active {
  background: #45464c;
  color: #fff;
}

.ag-groups { flex: 1; min-width: 0; padding-left: 0.5rem; }

.ag-group { margin-bottom: 1.5rem; }

.ag-grid {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

/* Author row (minimal list) */
.author-card {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  text-decoration: none;
  padding: 0.7rem 0.9rem;
  background: #333439;
  border-radius: 5px;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.author-card:hover { background: #3d3e44; }
.author-card:active { background: #45464c; }

.author-photo-wrap {
  position: relative;
  width: 46px; height: 46px;
  border-radius: 50%;
  overflow: hidden;
  background: #45464c;
  flex-shrink: 0;
}
.author-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
.author-photo-fallback {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; font-weight: 700;
  color: #e5e7eb; background: #45464c; z-index: 0;
}
.author-photo-wrap img.img-error { display: none; }

.author-card-body { min-width: 0; flex: 1; }
.author-card-name {
  font-size: 0.92rem; font-weight: 700;
  color: #F1F1F1; line-height: 1.3; margin-bottom: 0.1rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.author-book-count { font-size: 0.75rem; color: #9A9A9A; }
.author-book-count strong { color: #d1d5db; font-weight: 600; }
.author-card-chevron { color: #6b7280; font-size: 1.1rem; flex-shrink: 0; }
</style>

<script>
(function() {
  var data = JSON.parse(document.getElementById('authors-json').textContent);

  // বাংলা সংখ্যা
  function toBn(n) {
    return String(n).replace(/[0-9]/g, function(d) { return '০১২৩৪৫৬৭৮৯'[d]; });
  }

  // Count label — লেখকগণ(count) ফরম্যাট
  var countEl = document.getElementById('ag-count');
  if (countEl) countEl.textContent = '(' + toBn(data.length) + ')';

  // Sort বাংলা নাম অনুসারে
  data.sort(function(a, b) { return a.name.localeCompare(b.name, 'bn'); });

  // Group by first letter
  var groups = {};
  var letters = [];
  data.forEach(function(author) {
    var letter = author.name ? author.name[0] : '?';
    if (!groups[letter]) { groups[letter] = []; letters.push(letter); }
    groups[letter].push(author);
  });

  // Build letter nav
  var nav = document.getElementById('ag-letter-nav');
  nav.innerHTML = letters.map(function(l) {
    return '<a href="#ag-' + encodeURIComponent(l) + '" class="ag-letter-link" data-letter="' + l + '">' + l + '</a>';
  }).join('');

  // Build groups
  var groupsEl = document.getElementById('ag-groups');
  groupsEl.innerHTML = letters.map(function(letter) {
    var cards = groups[letter].map(function(author) {
      var initial = author.name ? author.name[0] : '?';
      var photoInner = author.img
        ? '<div class="author-photo-fallback">' + initial + '</div><img src="' + author.img + '" alt="' + author.name + '" loading="lazy">'
        : '<div class="author-photo-fallback">' + initial + '</div>';
      return '<a href="/author/' + author.slug + '.html" class="author-card">'
        + '<div class="author-photo-wrap">' + photoInner + '</div>'
        + '<div class="author-card-body">'
        + '<div class="author-card-name">' + author.name + '</div>'
        + '<div class="author-book-count"><strong>' + toBn(author.count) + '</strong> টি বই</div>'
        + '</div>'
        + '<span class="author-card-chevron">›</span>'
        + '</a>';
    }).join('');

    return '<div class="ag-group" id="ag-' + encodeURIComponent(letter) + '" data-letter="' + letter + '">'
      + '<div class="ag-grid">' + cards + '</div>'
      + '</div>';
  }).join('');

  // img error fallback
  groupsEl.querySelectorAll('.author-photo-wrap img').forEach(function(img) {
    img.addEventListener('error', function() { this.classList.add('img-error'); });
  });

  // Active letter on scroll
  var links = nav.querySelectorAll('.ag-letter-link');
  var groupEls = groupsEl.querySelectorAll('.ag-group');
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var letter = entry.target.dataset.letter;
        links.forEach(function(l) {
          l.classList.toggle('active', l.dataset.letter === letter);
        });
      }
    });
  }, { rootMargin: '-10% 0px -80% 0px' });
  groupEls.forEach(function(g) { observer.observe(g); });
})();
</script>

        (function () {
            const el = document.getElementById('footer-copyright-year');
            if (!el) return;
            const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
            el.textContent = toBn(new Date().getFullYear());
        })();

    <script>
        (function() {
            var path = window.location.pathname;
            var rules = {
                '/': /^\/$/,
                '/authors/': /^\/authors\/?$/,
                '/categories/': /^\/categories\/?$/,
                '/blogs/': /^\/blogs\/?$/
            };
            document.querySelectorAll('.header-nav-btn').forEach(function(btn) {
                var navPath = btn.getAttribute('data-nav-path');
                var re = rules[navPath];
                if (re && re.test(path)) btn.classList.add('active');
            });
        })();
    </script>

    <script>
        // Visit counter — প্রতি পেজ লোড/রিফ্রেশে count বাড়বে
        (function () {
            const el = document.getElementById('pg-visit-counter');
            if (!el) return;
            const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
            const nums = el.querySelectorAll('b');
            fetch('/api/visits')
                .then(r => r.json())
                .then(data => {
                    nums[0].textContent = toBn(data.today);
                    nums[1].textContent = toBn(data.total);
                })
                .catch(() => { el.style.display = 'none'; });
        })();
    </script>
