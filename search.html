    <script>
    // Inline search box টগল করা + live autosuggest — header-এ ব্যবহৃত হয়
    (function() {
        // ── Autosuggest ──
        // search-index.json (lightweight, cover/title/author/category) একবার
        // lazy-fetch হয় — প্রতিটা keystroke এ নয়, প্রথম টাইপ শুরু হলে।
        var indexData = null;
        var indexPromise = null;

        function esc(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function highlight(text, q) {
            var s = esc(text);
            var idx = s.toLowerCase().indexOf(q.toLowerCase());
            if (idx === -1) return s;
            return s.slice(0, idx) + '<b>' + s.slice(idx, idx + q.length) + '</b>' + s.slice(idx + q.length);
        }
        function loadIndex() {
            if (indexPromise) return indexPromise;
            indexPromise = fetch('/search-index.json')
                .then(function(r) { return r.ok ? r.json() : []; })
                .then(function(data) { indexData = data; return data; })
                .catch(function() { indexData = []; return []; });
            return indexPromise;
        }

        function initSearchBox(opts) {
            var defaultRow = opts.defaultRow;
            var searchBox = opts.searchBox;
            var searchBtn = opts.searchBtn;
            var closeBtn = opts.closeBtn;
            var searchInput = opts.searchInput;
            var suggestBox = opts.suggestBox;

            var debounceTimer = null;
            var activeIndex = -1;
            var currentItems = [];

            function openSearch() {
                defaultRow.classList.add('hidden');
                searchBox.classList.remove('hidden');
                searchBox.classList.add('flex');
                searchInput.value = '';
                searchInput.focus();
            }
            function closeSearch() {
                searchBox.classList.add('hidden');
                searchBox.classList.remove('flex');
                defaultRow.classList.remove('hidden');
                hideSuggestions();
            }
            function submitSearch() {
                var q = searchInput.value.trim();
                if (q) {
                    window.location.href = '/search.html?q=' + encodeURIComponent(q);
                }
            }

            searchBtn.addEventListener('click', openSearch);
            closeBtn.addEventListener('click', closeSearch);

            function hideSuggestions() {
                suggestBox.style.display = 'none';
                suggestBox.innerHTML = '';
                activeIndex = -1;
                currentItems = [];
            }

            function renderSuggestions(items, q) {
                currentItems = items;
                activeIndex = -1;
                if (!items.length) { hideSuggestions(); return; }
                var html = items.map(function(book) {
                    var meta = [book.author, book.category].filter(Boolean).join(' · ');
                    return '<a href="/book/' + book.slug + '.html" class="hs-item">'
                        + '<img src="' + esc(book.cover) + '" alt="" class="hs-thumb" loading="lazy">'
                        + '<div class="hs-body">'
                        + '<div class="hs-title">' + highlight(book.title, q) + '</div>'
                        + (meta ? '<div class="hs-meta">' + esc(meta) + '</div>' : '')
                        + '</div></a>';
                }).join('');
                html += '<a href="/search.html?q=' + encodeURIComponent(q) + '" class="hs-more">"' + esc(q) + '" এর সব ফলাফল দেখুন</a>';
                suggestBox.innerHTML = html;
                suggestBox.style.display = 'block';
            }

            function runSearch(q) {
                loadIndex().then(function(data) {
                    // input ততক্ষণে বদলে যায়নি কিনা চেক — race condition এড়াতে
                    if (searchInput.value.trim().toLowerCase() !== q.toLowerCase()) return;
                    var ql = q.toLowerCase();
                    var scored = [];
                    for (var i = 0; i < data.length; i++) {
                        var b = data[i];
                        var title = (b.title || '').toLowerCase();
                        var author = (b.author || '').toLowerCase();
                        var category = (b.category || '').toLowerCase();
                        var score = -1;
                        if (title.indexOf(ql) === 0) score = 3;
                        else if (title.indexOf(ql) !== -1) score = 2;
                        else if (author.indexOf(ql) !== -1 || category.indexOf(ql) !== -1) score = 1;
                        if (score > 0) scored.push({ book: b, score: score });
                    }
                    scored.sort(function(a, b) { return b.score - a.score; });
                    renderSuggestions(scored.slice(0, 6).map(function(s) { return s.book; }), q);
                });
            }

            searchInput.addEventListener('input', function() {
                var q = searchInput.value.trim();
                clearTimeout(debounceTimer);
                if (q.length < 2) { hideSuggestions(); return; }
                debounceTimer = setTimeout(function() { runSearch(q); }, 150);
            });

            searchInput.addEventListener('keydown', function(e) {
                var visible = suggestBox.style.display === 'block';
                if (e.key === 'ArrowDown' && visible) {
                    e.preventDefault();
                    activeIndex = Math.min(activeIndex + 1, currentItems.length - 1);
                    updateActive();
                } else if (e.key === 'ArrowUp' && visible) {
                    e.preventDefault();
                    activeIndex = Math.max(activeIndex - 1, -1);
                    updateActive();
                } else if (e.key === 'Enter') {
                    if (visible && activeIndex >= 0) {
                        e.preventDefault();
                        window.location.href = '/book/' + currentItems[activeIndex].slug + '.html';
                    } else {
                        submitSearch();
                    }
                } else if (e.key === 'Escape') {
                    if (visible) hideSuggestions();
                    else closeSearch();
                }
            });

            function updateActive() {
                var links = suggestBox.querySelectorAll('.hs-item');
                links.forEach(function(el, i) {
                    el.classList.toggle('hs-active', i === activeIndex);
                });
                if (activeIndex >= 0 && links[activeIndex]) {
                    links[activeIndex].scrollIntoView({ block: 'nearest' });
                }
            }

            document.addEventListener('click', function(e) {
                if (!searchBox.contains(e.target)) hideSuggestions();
            });
        }

        // Header-এর ভেতরের search box
        initSearchBox({
            defaultRow: document.getElementById('header-default'),
            searchBox: document.getElementById('header-search-box'),
            searchBtn: document.getElementById('header-search-btn'),
            closeBtn: document.getElementById('header-search-close-btn'),
            searchInput: document.getElementById('header-search-input'),
            suggestBox: document.getElementById('header-search-suggest')
        });
    })();
    </script>

    <script>
    (function() {
        var header = document.getElementById('site-header');
        var spacer = document.getElementById('header-spacer');

        function setSpacerHeight() {
            spacer.style.height = header.offsetHeight + 'px';
        }
        setSpacerHeight();
        window.addEventListener('resize', setSpacerHeight);

        var lastScrollY = window.pageYOffset;
        var ticking = false;
        var threshold = 8; // ছোটখাটো scroll jitter এড়াতে

        function onScroll() {
            var currentScrollY = window.pageYOffset;
            var diff = currentScrollY - lastScrollY;

            // একদম উপরে থাকলে সবসময় header দেখাও
            if (currentScrollY <= header.offsetHeight) {
                header.classList.remove('header-hidden');
            } else if (Math.abs(diff) > threshold) {
                if (diff > 0) {
                    // নিচের দিকে স্ক্রল — hide
                    header.classList.add('header-hidden');
                } else {
                    // উপরের দিকে স্ক্রল — show
                    header.classList.remove('header-hidden');
                }
                lastScrollY = currentScrollY;
            }
            ticking = false;
        }

        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(onScroll);
                ticking = true;
            }
        }, { passive: true });

    })();
    </script>

/* components/book-card-list.css — সব পেজে (index, books, author, category, search)
   ব্যবহৃত common book-card LIST design। generate_pages.js এই ফাইলটা একবার লোড করে
   <style> ট্যাগে মুড়ে প্রতিটা টেমপ্লেটের  placeholder-এ বসিয়ে দেয়।
   ডিজাইন পরিবর্তন করতে চাইলে শুধু এই ফাইলটা এডিট করলেই সব জায়গায় reflect হবে।
   ডিজাইন: Editorial variant — layout.html-এর সাথে মিল রেখে day/light পাঠক ঘর
   palette (#F0F3F8 page bg, #ffffff card surface, #1f2937 টেক্সট, #0B57CF accent)। */

/* List container */
.bc-list {
  display: flex;
  flex-direction: column;
  padding: 0;
  gap: 0.7rem;
}
@media (min-width: 768px) {
  .bc-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.7rem;
    padding: 0;
  }
}

/* Book card */
.bc-card {
  display: flex;
  flex-direction: row;
  gap: 1rem;
  align-items: flex-start;
  text-decoration: none;
  padding: 1rem 1.1rem;
  transition: background 0.15s, border-color 0.15s;
  background: #ffffff;
  border-radius: 5px;
}
.bc-card:hover { background: #C2D7FC; }

/* Cover — left side, fixed size 2:3 ratio */
.bc-img-wrap {
  flex-shrink: 0;
  width: 4.5rem;
  aspect-ratio: 2/3;
  overflow: hidden;
  background: #e5e7eb;
  border-radius: 5px;
}
@media (min-width: 768px) { .bc-img-wrap { width: 5.5rem; } }

.bc-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Right side text */
.bc-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}

/* Headline: title – author একসাথে */
.bc-headline {
  font-size: 1.05rem;
  line-height: 1.4;
  margin: 0 0 0.35rem;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.bc-title {
  font-weight: 600;
  color: #1f2937;
}
.bc-card:hover .bc-title { text-decoration: none; }

/* Description */
.bc-desc {
  margin-top: 0.1rem;
  font-size: 0.88rem;
  color: #6b7280;
  line-height: 1.5;
  text-align: justify;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/*
  Book card HTML template (reference — generate_pages.js এ ব্যবহার হয়):
  <a href="/book/.html" class="bc-card">
    <div class="bc-img-wrap">
      <img src="" alt="" class="bc-img" loading="lazy">
    </div>
    <div class="bc-body">
      <p class="bc-headline"><span class="bc-title"></span></p>
      <p class="bc-desc"></p>
    </div>
  </a>
*/
</style>

<script>
(function() {
  function toBn(n) {
    return String(n).replace(/[0-9]/g, function(d) { return '০১২৩৪৫৬৭৮৯'[d]; });
  }

  function esc(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var params = new URLSearchParams(window.location.search);
  var query = (params.get('q') || '').trim();

  var titleEl = document.getElementById('search-title');
  var countEl = document.getElementById('search-count');
  var resultsEl = document.getElementById('search-results');
  var emptyEl = document.getElementById('search-empty');
  var noQueryEl = document.getElementById('search-noquery');

  // Header search box-এ query prefill
  var mainInput = document.getElementById('main-search-input');
  if (mainInput && query) mainInput.value = query;

  if (!query) {
    titleEl.textContent = 'অনুসন্ধান';
    noQueryEl.style.display = 'block';
    return;
  }

  titleEl.textContent = '"' + query + '" এর ফলাফল';

  if (typeof Fuse === 'undefined') {
    countEl.textContent = '';
    emptyEl.querySelector('p').textContent = 'সার্চ লোড করতে সমস্যা হয়েছে, একটু পর আবার চেষ্টা করুন।';
    emptyEl.style.display = 'block';
    return;
  }

  var data = JSON.parse(document.getElementById('search-index-json').textContent);

  var fuse = new Fuse(data, {
    keys: [
      { name: 'title', weight: 2 },
      { name: 'author', weight: 1 },
      { name: 'category', weight: 0.5 },
      { name: 'slug', weight: 0.5 },
    ],
    threshold: 0.35,
    ignoreLocation: true,
  });

  var matches = fuse.search(query, { limit: 60 }).map(function(r) { return r.item; });

  countEl.textContent = toBn(matches.length) + ' টি ফলাফল';

  if (matches.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }

  resultsEl.innerHTML = matches.map(function(book) {
    return '<a href="/book/' + book.slug + '.html" class="bc-card">'
      + '<div class="bc-img-wrap"><img src="' + esc(book.cover) + '" alt="' + esc(book.title) + '" class="bc-img" loading="lazy"></div>'
      + '<div class="bc-body">'
      + '<p class="bc-headline"><span class="bc-title">' + esc(book.title) + '</span></p>'
      + '<p class="bc-desc">' + esc(book.desc || '') + '</p>'
      + '</div>'
      + '</a>';
  }).join('');
})();
</script>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-container footer-row">
            <div class="footer-links">
                <a href="/about">সম্পর্কে</a>
                <a href="/contact">যোগাযোগ</a>
                <a href="/policy">শর্তাবলী</a>
            </div>
            <span class="footer-brand"><strong>পাঠক <span class="brand-name-light">ঘর</span></strong></span>
        </div>
    </footer>

    <script>
        // Footer copyright — বছর automatic (current year, বাংলা সংখ্যায়)
        (function () {
            const el = document.getElementById('footer-copyright-year');
            if (!el) return;
            const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
            el.textContent = toBn(new Date().getFullYear());
        })();
    </script>

    <script>
        (function() {
            var path = window.location.pathname;
            var rules = {
                '/': /^\/$/,
                '/authors/': /^\/authors\/?$/,
                '/categories/': /^\/categories\/?$/,
                '/blogs/': /^\/blogs\/?$/
            };
            document.querySelectorAll('.header-nav-btn').forEach(function(btn) {
                var navPath = btn.getAttribute('data-nav-path');
                var re = rules[navPath];
                if (re && re.test(path)) btn.classList.add('active');
            });
        })();
    </script>

    <script>
        // Visit counter — প্রতি পেজ লোড/রিফ্রেশে count বাড়বে
        (function () {
            const el = document.getElementById('pg-visit-counter');
            if (!el) return;
            const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            const toBn = n => String(n).split('').map(d => bnDigits[d] !== undefined ? bnDigits[d] : d).join('');
            const nums = el.querySelectorAll('b');
            fetch('/api/visits')
                .then(r => r.json())
                .then(data => {
                    nums[0].textContent = toBn(data.today);
                    nums[1].textContent = toBn(data.total);
                })
                .catch(() => { el.style.display = 'none'; });
        })();
    </script>




</body>
</html>
