<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{book_title}} - পাঠক ঘর</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#0056b3', 600: '#004494' } } } }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Progress bar */
        #progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: #0056b3;
            z-index: 300;
            transition: width 0.1s linear;
        }

        /* Desktop: no top header, progress bar at very top */

        /* Book content */
        #book-content h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }
        #book-content h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            padding-top: 1rem;
            border-top: 1px solid #e5e7eb;
        }
        .dark #book-content h2 { border-top-color: #374151; }
        #book-content p { margin-bottom: 1rem; line-height: 1.9; }

        /* Font sizes */
        #book-content.fs-sm p { font-size: 0.875rem; }
        #book-content.fs-md p { font-size: 1rem; }
        #book-content.fs-lg p { font-size: 1.125rem; }
        #book-content.fs-xl p { font-size: 1.25rem; }

        /* TOC active */
        .toc-item.active {
            color: #0056b3;
            font-weight: 600;
            background: #e1f0ff;
            border-radius: 0.375rem;
        }
        .dark .toc-item.active {
            background: #1e3a5f;
            color: #60a5fa;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#1a1a1b] dark:text-gray-200 min-h-screen">

    <!-- Reading progress bar (always top) -->
    <div id="progress-bar"></div>

    <!-- MOBILE HEADER (md এ hidden) -->
    <header class="md:hidden bg-white dark:bg-[#1a1a1b] fixed top-0 w-full h-14 z-[100] border-b border-gray-200 dark:border-gray-700 shadow-sm">
        <div class="px-3 h-full flex items-center gap-2">
            <a href="javascript:history.back()" class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition shrink-0">
                <i class="fas fa-arrow-left text-sm"></i>
            </a>
            <span class="flex-1 text-sm font-semibold truncate">{{book_title}}</span>
            <button id="mobile-sidebar-btn" class="p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition shrink-0">
                <i class="fas fa-sliders-h"></i>
            </button>
        </div>
    </header>

    <!-- Mobile sidebar overlay -->
    <div id="mobile-overlay" class="md:hidden fixed inset-0 bg-black/50 z-[140] hidden"></div>

    <!-- ═══════════════════════════════════════
         LAYOUT WRAPPER
    ════════════════════════════════════════ -->
    <div class="flex min-h-screen">

        <aside id="sidebar"
            class="
                fixed top-0 right-0 h-full w-64 z-[150]
                translate-x-full
                md:translate-x-0 md:static md:w-56 md:h-screen md:sticky md:top-0
                bg-white dark:bg-[#1a1a1b]
                border-l md:border-l-0 md:border-r border-gray-200 dark:border-gray-700
                flex flex-col
                transition-transform duration-300
                overflow-hidden
            ">

            <!-- Sidebar top: back + book title (desktop) / close (mobile) -->
            <div class="flex items-center gap-2 px-4 py-3 border-b dark:border-gray-700 shrink-0">
                <a href="javascript:history.back()" class="hidden md:flex items-center gap-2 text-gray-600 dark:text-gray-300 hover:text-brand-500 transition min-w-0">
                    <i class="fas fa-arrow-left text-sm shrink-0"></i>
                    <span class="text-sm font-semibold truncate">{{book_title}}</span>
                </a>
                <span class="md:hidden text-sm font-semibold text-gray-700 dark:text-gray-200 flex-1">কাস্টমাইজ</span>
                <button id="close-sidebar-btn" class="md:hidden p-1 rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition ml-auto">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>

            <!-- Customization options -->
            <div class="px-4 py-3 border-b dark:border-gray-700 shrink-0">
                <p class="text-[11px] uppercase font-semibold text-gray-400 dark:text-gray-500 tracking-wider mb-2">কাস্টমাইজ</p>
                <div class="flex items-center gap-2">
                    <!-- Font size -->
                    <button id="font-decrease" class="flex-1 py-1.5 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-sm font-bold transition">A−</button>
                    <button id="font-increase" class="flex-1 py-1.5 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-sm font-bold transition">A+</button>
                    <!-- Theme -->
                    <button id="theme-btn" class="flex-1 py-1.5 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition flex items-center justify-center">
                        <i id="theme-icon" class="fas fa-moon text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- TOC -->
            <div class="flex-1 overflow-y-auto">
                <div class="px-4 pt-3 pb-1">
                    <p class="text-[11px] uppercase font-semibold text-gray-400 dark:text-gray-500 tracking-wider">সূচিপত্র</p>
                </div>
                <nav id="toc-nav" class="flex flex-col px-2 pb-4 gap-0.5 text-[13px]">
                    <!-- JS generate -->
                </nav>
            </div>
        </aside>

        <!-- ═══════════════════════════════════
             MAIN CONTENT
        ════════════════════════════════════ -->
        <main class="flex-1 pt-14 md:pt-0 px-4 md:px-12 lg:px-20 py-6 md:py-8 max-w-2xl w-full">

            <div id="book-content" class="fs-md">
                {{book_content}}
                        </div>
        </main>

    </div>

    <script>
        // Dark mode
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');
        const html = document.documentElement;

        function applyTheme(dark) {
            if (dark) {
                html.classList.add('dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                localStorage.theme = 'dark';
            } else {
                html.classList.remove('dark');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                localStorage.theme = 'light';
            }
        }
        applyTheme(localStorage.theme === 'dark');
        themeBtn.addEventListener('click', () => applyTheme(!html.classList.contains('dark')));

        // Progress bar
        const progressBar = document.getElementById('progress-bar');
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            progressBar.style.width = (docHeight > 0 ? (scrollTop / docHeight) * 100 : 0) + '%';
        });

        // Auto TOC
        const bookContent = document.getElementById('book-content');
        const tocNav = document.getElementById('toc-nav');
        const headings = bookContent.querySelectorAll('h1, h2');

        headings.forEach((h, i) => {
            h.id = 'sec-' + i;
            const a = document.createElement('a');
            a.href = '#sec-' + i;
            a.textContent = h.textContent;
            a.className = 'toc-item block px-3 py-1.5 rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors ' +
                (h.tagName === 'H1' ? 'font-semibold text-gray-800 dark:text-gray-100' : 'pl-5 text-[12px]');
            tocNav.appendChild(a);
        });

        // TOC active highlight on scroll
        const tocItems = tocNav.querySelectorAll('.toc-item');
        window.addEventListener('scroll', () => {
            let current = 0;
            headings.forEach((h, i) => {
                if (window.scrollY >= h.offsetTop - 100) current = i;
            });
            tocItems.forEach((item, i) => item.classList.toggle('active', i === current));
        });

        // Font size
        const fontSizes = ['fs-sm', 'fs-md', 'fs-lg', 'fs-xl'];
        let currentSize = 1;

        document.getElementById('font-increase').addEventListener('click', () => {
            if (currentSize < fontSizes.length - 1) {
                bookContent.classList.remove(fontSizes[currentSize++]);
                bookContent.classList.add(fontSizes[currentSize]);
            }
        });
        document.getElementById('font-decrease').addEventListener('click', () => {
            if (currentSize > 0) {
                bookContent.classList.remove(fontSizes[currentSize--]);
                bookContent.classList.add(fontSizes[currentSize]);
            }
        });

        // Mobile sidebar toggle
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');

        document.getElementById('mobile-sidebar-btn').addEventListener('click', () => {
            sidebar.classList.remove('translate-x-full');
            overlay.classList.remove('hidden');
        });

        function closeSidebar() {
            sidebar.classList.add('translate-x-full');
            overlay.classList.add('hidden');
        }

        document.getElementById('close-sidebar-btn').addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);

        // Close sidebar on TOC link click (mobile)
        tocNav.querySelectorAll('a').forEach(a => {
            a.addEventListener('click', () => {
                if (window.innerWidth < 768) closeSidebar();
            });
        });
    </script>

</body>
</html>
