    <script>
    (function() {
        var bar = document.getElementById('ad-bar');
        var content = document.getElementById('ad-bar-content');
        var icon = document.getElementById('ad-bar-icon');
        var collapsed = true;

        // Start collapsed — apply collapsed state immediately
        content.style.maxHeight = '0';
        content.style.padding = '0';
        if (document.getElementById('ad-bar-notice')) document.getElementById('ad-bar-notice').style.display = 'none';
        if (document.getElementById('ad-bar-datetime')) { document.getElementById('ad-bar-datetime').style.display = 'inline'; setTimeout(function(){ updateDatetime(); dtInterval = setInterval(updateDatetime, 1000); }, 0); }
        document.getElementById('ad-bar-icon').innerHTML = '<polyline points="18 15 12 9 6 15"></polyline>';
        document.getElementById('ad-bar-label').textContent = 'Show Ad';
        bar.style.transform = 'translateY(0)';

        // Auto-open after 10 seconds
        setTimeout(function() {
            if (collapsed) toggleAdBar();
        }, 10000);

        var label = document.getElementById('ad-bar-label');
        var notice = document.getElementById('ad-bar-notice');
        var datetime = document.getElementById('ad-bar-datetime');

        // ── Bengali helpers ──
        function toBnDigits(n) {
            return String(n).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
        }
        var bnDays   = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
        var bnBoshontoMonths = ['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];

        // Bangabda conversion (Bangladesh calendar)
        function toBangabda(now) {
            var gYear  = now.getFullYear();
            var gMonth = now.getMonth() + 1;
            var gDay   = now.getDate();
            var bnMonth, bnDay, bnYear;
            var monthMap = [
                [1,  14, 9,  14],[2,  13, 10, 13],[3,  14, 11, 14],[4,  14, 0,  14],
                [5,  15, 1,  15],[6,  15, 2,  15],[7,  16, 3,  16],[8,  16, 4,  16],
                [9,  16, 5,  16],[10, 16, 6,  16],[11, 15, 7,  15],[12, 15, 8,  15],
            ];
            var idx = gMonth - 1;
            var startDay = monthMap[idx][3];
            if (gDay >= startDay) {
                bnMonth = monthMap[idx][2];
                bnDay   = gDay - startDay + 1;
            } else {
                bnMonth = (monthMap[idx][2] - 1 + 12) % 12;
                var prevGMonth = gMonth === 1 ? 12 : gMonth - 1;
                var prevStart  = monthMap[prevGMonth - 1][3];
                var daysInPrevGMonth = new Date(gYear, gMonth - 1, 0).getDate();
                bnDay = daysInPrevGMonth - prevStart + gDay + 1;
            }
            bnYear = (bnMonth <= 4) ? gYear - 593 : gYear - 594;
            return { day: bnDay, month: bnMonth, year: bnYear };
        }

        function updateDatetime() {
            if (!datetime) return;
            var now  = new Date();
            var day  = bnDays[now.getDay()];
            var h    = now.getHours();
            var m    = now.getMinutes();
            var s    = now.getSeconds();
            var h12  = h % 12 || 12;
            var bn   = toBangabda(now);
            datetime.innerHTML =
                '<span style="color:#9ca3af;font-weight:400;">' + day + ', </span>' +
                '<strong style="color:inherit;font-weight:700;">' + toBnDigits(bn.day) + '</strong>' +
                '<span style="color:#9ca3af;font-weight:400;"> ' + bnBoshontoMonths[bn.month] + ' </span>' +
                '<strong style="color:inherit;font-weight:700;">' + toBnDigits(bn.year) + '</strong>' +
                '<span style="color:#9ca3af;font-weight:400;">  |  </span>' +
                '<strong style="color:inherit;font-weight:700;">' +
                    toBnDigits(h12) + ':' + toBnDigits(String(m).padStart(2,'0')) + ':' + toBnDigits(String(s).padStart(2,'0')) +
                '</strong>';
        }

        var dtInterval = null;

        window.toggleAdBar = function() {
            collapsed = !collapsed;
            if (collapsed) {
                content.style.maxHeight = '0';
                content.style.padding = '0';
                if (notice) notice.style.display = 'none';
                if (datetime) { datetime.style.display = 'inline'; updateDatetime(); dtInterval = setInterval(updateDatetime, 1000); }
                icon.innerHTML = '<polyline points="18 15 12 9 6 15"></polyline>';
                label.textContent = 'Show Ad';
            } else {
                content.style.maxHeight = '500px';
                content.style.padding = '6px 10px';
                if (notice) notice.style.display = 'flex';
                if (datetime) { datetime.style.display = 'none'; clearInterval(dtInterval); }
                icon.innerHTML = '<polyline points="6 9 12 15 18 9"></polyline>';
                label.textContent = 'Hide Ad';
            }
        };
    })();
    </script>

                   class="w-12 h-10 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-[#2a2a2a] flex items-center justify-center gap-1.5 text-[#229ed9] hover:border-[#229ed9] transition-all text-xs font-semibold px-2">

    <script>
        // Date & Time (বঙ্গাব্দ)
        const bnDays = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
        const bnMonths = ['বৈশাখ','জ্যৈষ্ঠ','আষাঢ়','শ্রাবণ','ভাদ্র','আশ্বিন','কার্তিক','অগ্রহায়ণ','পৌষ','মাঘ','ফাল্গুন','চৈত্র'];
        // Bangla month start dates (approximate, Gregorian)
        const bnMonthStarts = [
            [4,14],[5,15],[6,15],[7,16],[8,16],[9,16],
            [10,16],[11,15],[12,15],[1,14],[2,13],[3,14]
        ];
        function toBnNum(n) {
            return String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
        }
        function getBanglaDate(now) {
            const gMonth = now.getMonth() + 1;
            const gDay = now.getDate();
            const gYear = now.getFullYear();
            let bnMonth, bnDay, bnYear;
            // find current bangla month
            for (let i = 0; i < 12; i++) {
                const [m, d] = bnMonthStarts[i];
                const [nm, nd] = bnMonthStarts[(i + 1) % 12];
                const start = new Date(gYear, m - 1, d);
                let endYear = gYear;
                if (nm < m || (nm === m && nd < d)) endYear = gYear + 1;
                const end = new Date(endYear, nm - 1, nd);
                const cur = new Date(gYear, gMonth - 1, gDay);
                if (cur >= start && cur < end) {
                    bnMonth = i;
                    bnDay = Math.floor((cur - start) / 86400000) + 1;
                    // Bangla year = Gregorian year - 593 or 594
                    bnYear = (m >= 4) ? gYear - 593 : gYear - 594;
                    break;
                }
            }
            return { bnDay, bnMonth, bnYear };
        }
        function updateDateTime() {
            const now = new Date();
            const day = bnDays[now.getDay()];
            const { bnDay, bnMonth, bnYear } = getBanglaDate(now);
            const month = bnMonths[bnMonth];
            const h = toBnNum(String(now.getHours()).padStart(2,'0'));
            const m = toBnNum(String(now.getMinutes()).padStart(2,'0'));
            const s = toBnNum(String(now.getSeconds()).padStart(2,'0'));
            const el = document.getElementById('datetime-display');
            if (el) el.innerHTML =
                `<span class="text-gray-400 dark:text-gray-500">${day}, </span>` +
                `<span class="font-bold text-gray-600 dark:text-gray-300">${toBnNum(bnDay)}</span>` +
                `<span class="text-gray-400 dark:text-gray-500"> ${month} </span>` +
                `<span class="font-bold text-gray-600 dark:text-gray-300">${toBnNum(bnYear)}</span>` +
                `<span class="text-gray-400 dark:text-gray-500"> | </span>` +
                `<span class="font-bold text-gray-600 dark:text-gray-300">${h}:${m}:${s}</span>`;
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // Search
        function doSearch(query) {
            if (query.trim()) {
                window.location.href = '/search.html?q=' + encodeURIComponent(query.trim());
            }
        }
        const mainInput = document.getElementById('main-search-input');
        document.getElementById('main-search-btn').addEventListener('click', () => doSearch(mainInput.value));
        mainInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(mainInput.value); });
    </script>
