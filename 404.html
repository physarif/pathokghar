<!DOCTYPE html>
<html lang="bn"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>পাতা খুঁজে পাওয়া যায়নি - পাঠক ঘর</title>
  <meta name="description" content="আপনি যে পাতাটি খুঁজছেন সেটি পাওয়া যাচ্ছে না।">
  <link rel="icon" type="image/webp" href="https://pathokghar.pages.dev/assets/photos/pathokghar-logo.webp">
  <link rel="stylesheet" href="/components/style.css">
  <script>
    // layout.html এর মতো dark mode sync
    (function() {
      if (localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .not-found-page {
      background: #f9fafb;
      color: #1f2937;
      min-height: 100vh;
    }
    .dark .not-found-page { background: #1a1a1b; color: #e5e7eb; }
    .not-found-wrap { max-width: 42rem; margin: 0 auto; padding: 5rem 1rem; }
    .not-found-num {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      color: #c0392b;
      letter-spacing: -0.04em;
      opacity: 0.15;
      user-select: none;
    }
    .dark .not-found-num { opacity: 0.12; }
    .nf-btn-primary {
      display: inline-flex;
      align-items: center;
      padding: 0.6rem 1.4rem;
      background: #c0392b;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .nf-btn-primary:hover { background: #a93226; }
    .nf-btn-primary:active { background: #922b21; }
    .nf-title { font-size: 1.5rem; font-weight: 700; color: #1f2937; margin: 1rem 0 0.5rem; }
    .dark .nf-title { color: #f3f4f6; }
    .nf-desc { color: #6b7280; font-size: 1rem; margin-bottom: 2rem; max-width: 24rem; }
    .dark .nf-desc { color: #9ca3af; }
  </style>
</head>
<body class="not-found-page">

  <div class="not-found-wrap">

    <div class="not-found-num">৪০৪</div>

    <h1 class="nf-title">
      পাতাটি খুঁজে পাওয়া যাচ্ছে না...
    </h1>
    <p class="nf-desc">
      আপনি যে পাতাটি খুঁজছেন সেটি সরানো হয়েছে, নামবদল হয়েছে, অথবা আদৌ ছিল না।
    </p>

    <a href="/" class="nf-btn-primary">হোমপেজে যান</a>

  </div>

</body>
</html>
